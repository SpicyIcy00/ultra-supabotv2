# =============================================================================
# metrics.yaml — the single source of truth for George's business definitions.
#
# Tools READ from this file. A definition may not be hardcoded in a tool; if a
# rule is missing here, add it here rather than inlining it. See CLAUDE.md.
#
# Every entry carries:
#   source:   where the rule came from (file/line, live data, or a decision)
#   resolves: the prior contradiction this entry settles, if any
#
# SQL fragments below are vetted, parameterized building blocks — they are the
# ONLY SQL George composes against these tables. Standard aliases:
#   t  = new_transactions      ti = new_transaction_items
#   p  = products              s  = stores               i = inventory
# =============================================================================

version: 1
currency:
  code: PHP
  symbol: "₱"
  decimal_places: 2
  # source: backend/business_rules.yaml:1382-1386 (formatting block).
  # Store-domain money columns (t.total, ti.item_total, p.cost) are already in
  # pesos and are NEVER divided. That was the one currency fact never written
  # down anywhere; it is written down now.
  store_domain_scaling: none

timezone:
  name: "Asia/Manila"
  # source: backend/business_rules.yaml:272 (date_defaults.timezone), repeated in
  # backend/app/services/sql_generator.py:406 as a hardcoded fallback.
  # The Philippines observes no DST, so converting a local wall-clock timestamp
  # to timestamptz is never ambiguous and never skips an hour. Any rule below
  # that round-trips through AT TIME ZONE is safe for that reason.
  observes_dst: false


# =============================================================================
# SALES DAY BOUNDARY
# =============================================================================
sales_day:
  description: >
    A sales day is midnight-to-midnight Asia/Manila. There is no trading-day
    offset — a transaction at 23:59 Manila belongs to that calendar day, and
    one at 00:01 belongs to the next.
  boundary: midnight_local
  week_start: Monday          # source: business_rules.yaml:273; matches Postgres date_trunc('week')
  fiscal_year_start: January  # source: business_rules.yaml:275

  # ---------------------------------------------------------------------------
  # WHY CURRENT_DATE IS BANNED
  #
  # CURRENT_DATE returns the date in the SERVER's TimeZone setting, not Manila's.
  # The backend runs on Railway, where that setting is UTC. Manila is UTC+8, so
  # for the eight hours from 16:00-23:59 UTC (00:00-07:59 the next day in Manila)
  # CURRENT_DATE is a full day behind the real Manila date.
  #
  # Verified against the production database on 2026-09-01:
  #   instant 2026-09-01 18:30+00  ->  CURRENT_DATE          = 2026-09-01  (WRONG)
  #                                ->  Manila calendar date  = 2026-09-02  (RIGHT)
  #
  # The workaround used throughout the old chatbot —
  #   CURRENT_DATE AT TIME ZONE 'Asia/Manila'
  # — does NOT fix this and is not what it reads as. It casts a date to
  # timestamp, then reinterprets that midnight as Manila local time, yielding a
  # timestamptz. At the instant above it returns 2026-09-01 08:00:00+00, i.e.
  # the START OF THE WRONG DAY. It is a timestamptz, not a date, so comparing it
  # to a date silently coerces.
  #
  # The correct primitive is now() (which is timezone-aware) converted to Manila
  # wall-clock time FIRST, and only then truncated:
  #   now() AT TIME ZONE 'Asia/Manila'   -> timestamp, Manila wall clock
  # Verified to yield manila_today = 2026-09-01 with the server TimeZone set to
  # UTC, America/New_York and Asia/Manila alike, and to produce byte-identical
  # absolute instants for the day bounds in all three.
  #
  # source: this is a decision, made after reproducing the fault above.
  # resolves: business_rules.yaml:279 declared
  #   today: "CURRENT_DATE AT TIME ZONE 'Asia/Manila'"
  #   as the definition of "today", and examples 3, 12 and 18
  #   (business_rules.yaml:388, 576, 685) compared
  #   DATE(t.transaction_time AT TIME ZONE 'Asia/Manila') = CURRENT_DATE.
  #   Both are wrong for 8 hours a day. Same family as commit fda9693,
  #   "fix: scheduled reports were always a day behind".
  # ---------------------------------------------------------------------------
  expressions:
    # The base primitive. Everything else derives from this.
    manila_now:   "(now() AT TIME ZONE 'Asia/Manila')"          # timestamp, Manila wall clock
    manila_today: "(now() AT TIME ZONE 'Asia/Manila')::date"    # date, the real Manila calendar date

    # Half-open [start, end) bounds as timestamptz, for comparison against
    # t.transaction_time (which is timestamptz). Truncate in Manila wall-clock
    # space, then convert back to an absolute instant.
    today_start:      "date_trunc('day',   (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
    today_end:        "(date_trunc('day',  (now() AT TIME ZONE 'Asia/Manila')) + INTERVAL '1 day') AT TIME ZONE 'Asia/Manila'"
    week_start:       "date_trunc('week',  (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
    month_start:      "date_trunc('month', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
    year_start:       "date_trunc('year',  (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"

    # Bounds for an explicit Manila calendar date :d (a DATE parameter).
    #
    # THE ::timestamp CAST IS LOad-BEARING. `date AT TIME ZONE 'Asia/Manila'`
    # is NOT the same expression and is wrong by 8 hours. Postgres has two
    # overloads:
    #     timestamp   AT TIME ZONE tz -> timestamptz   (interpret AS Manila)
    #     timestamptz AT TIME ZONE tz -> timestamp     (convert TO Manila)
    # A bare `date` can implicitly cast to either, and Postgres picks the
    # timestamptz overload — casting the date through the SESSION timezone and
    # then converting, which yields a naive timestamp 8 hours late:
    #     (DATE '2026-09-01') AT TIME ZONE 'Asia/Manila'
    #        -> timestamp 2026-09-01 08:00   (WRONG: 8h past Manila midnight)
    #     (DATE '2026-09-01')::timestamp AT TIME ZONE 'Asia/Manila'
    #        -> timestamptz 2026-08-31 16:00+00   (CORRECT: Manila midnight)
    # Verified with the server timezone set to both UTC and America/New_York.
    #
    # This is the SAME failure family as CURRENT_DATE AT TIME ZONE documented
    # above, and an earlier version of this file reproduced it here. A window
    # built the wrong way silently shifts every day boundary 8 hours forward,
    # so "August" runs 1 Aug 16:00 to 1 Sep 16:00 Manila and a day bucket picks
    # up the following afternoon's trade.
    #
    # The preset expressions above do NOT need this cast: date_trunc() returns
    # `timestamp without time zone`, which selects the correct overload on its
    # own. Only a bare date needs it.
    date_start:       "(:d)::timestamp AT TIME ZONE 'Asia/Manila'"
    date_end:         "((:d)::date + 1)::timestamp AT TIME ZONE 'Asia/Manila'"

    # Grouping key: the Manila calendar date a transaction belongs to.
    day_bucket:       "(t.transaction_time AT TIME ZONE 'Asia/Manila')::date"

  # ---------------------------------------------------------------------------
  # GROUPING BUCKETS. The Manila calendar day/week/month a transaction belongs
  # to. Convert to Manila wall-clock FIRST, then truncate — the same ordering
  # the primitive above depends on. Postgres date_trunc('week') is Monday-based,
  # which matches week_start.
  # ---------------------------------------------------------------------------
  buckets:
    day:   "date_trunc('day',   (t.transaction_time AT TIME ZONE 'Asia/Manila'))::date"
    week:  "date_trunc('week',  (t.transaction_time AT TIME ZONE 'Asia/Manila'))::date"
    month: "date_trunc('month', (t.transaction_time AT TIME ZONE 'Asia/Manila'))::date"

  # ---------------------------------------------------------------------------
  # NAMED DATE RANGES. Half-open [start, end) timestamptz, all derived from the
  # Manila primitive. "What last_month means" is a business definition, so it
  # lives here rather than in a tool.
  #
  # source: business_rules.yaml:278-286 (date_interpretation), re-expressed
  #   without CURRENT_DATE.
  #
  # DECISION — the rolling windows exclude today. last_7_days is the seven
  # COMPLETE days ending yesterday, not six days plus a partial today. A partial
  # day silently drags every average and every period-over-period comparison
  # downward, and the drag changes size depending on the hour the question is
  # asked. Use `today` explicitly to include the day in progress.
  # resolves: business_rules.yaml used `>= CURRENT_DATE - INTERVAL '7 days'`
  #   with no upper bound, which included the partial current day, while
  #   declaring at line 418 that ranges are inclusive. Neither was stated.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # `relative` — THE SAME WINDOW, ANCHORED ON A DAY THAT IS NOT TODAY
  #
  # The SQL above is anchored on now(), which is what a preset means when the
  # caller is asking today. A saved workflow BACKTEST asks what a rule would
  # have said on a past morning, and "last_30_days" evaluated against now()
  # would answer with the last thirty days from this afternoon instead.
  #
  # So each preset also states itself arithmetically, against an anchor date D
  # (the Manila day the run is written on):
  #     unit    day | week | month | year — what D is truncated to
  #     offset  units to shift the truncated anchor
  #     length  units the half-open window spans
  # giving [trunc(D, unit) + offset, trunc(D, unit) + offset + length).
  #
  # This is a SECOND EXPRESSION OF ONE DEFINITION, which is exactly the thing
  # this file exists to prevent — so it lives here, beside the SQL it must agree
  # with, rather than in the backtest code where it would become a private copy.
  # test_workflows_contract checks that every preset has one.
  #
  # Week truncation is Monday-based, matching week_start above and Postgres
  # date_trunc('week'). Weeks and days are exact; months and years are calendar
  # arithmetic, the same as INTERVAL '1 month'.
  # ---------------------------------------------------------------------------
  presets:
    today:
      start: "date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      end:   "(date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) + INTERVAL '1 day') AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: true
      relative: {unit: day, offset: 0, length: 1}
    yesterday:
      start: "(date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) - INTERVAL '1 day') AT TIME ZONE 'Asia/Manila'"
      end:   "date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: false
      relative: {unit: day, offset: -1, length: 1}
    this_week:
      start: "date_trunc('week', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      end:   "(date_trunc('week', (now() AT TIME ZONE 'Asia/Manila')) + INTERVAL '1 week') AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: true
      relative: {unit: week, offset: 0, length: 1}
    last_week:
      start: "(date_trunc('week', (now() AT TIME ZONE 'Asia/Manila')) - INTERVAL '1 week') AT TIME ZONE 'Asia/Manila'"
      end:   "date_trunc('week', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: false
      relative: {unit: week, offset: -1, length: 1}
    this_month:
      start: "date_trunc('month', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      end:   "(date_trunc('month', (now() AT TIME ZONE 'Asia/Manila')) + INTERVAL '1 month') AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: true
      relative: {unit: month, offset: 0, length: 1}
    last_month:
      start: "(date_trunc('month', (now() AT TIME ZONE 'Asia/Manila')) - INTERVAL '1 month') AT TIME ZONE 'Asia/Manila'"
      end:   "date_trunc('month', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: false
      relative: {unit: month, offset: -1, length: 1}
    last_7_days:
      start: "(date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) - INTERVAL '7 days') AT TIME ZONE 'Asia/Manila'"
      end:   "date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: false
      relative: {unit: day, offset: -7, length: 7}
    last_30_days:
      start: "(date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) - INTERVAL '30 days') AT TIME ZONE 'Asia/Manila'"
      end:   "date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: false
      relative: {unit: day, offset: -30, length: 30}
    this_year:
      start: "date_trunc('year', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      end:   "(date_trunc('year', (now() AT TIME ZONE 'Asia/Manila')) + INTERVAL '1 year') AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: true
      relative: {unit: year, offset: 0, length: 1}

  # All ranges are half-open: lower bound inclusive, upper bound exclusive.
  # resolves: business_rules.yaml:418 instructed "Always use inclusive date
  #   ranges", but most of its own examples used an open-ended `>=` with no
  #   upper bound (so they silently included today's partial day) while
  #   examples 1, 20, 29 and 30 used half-open bounds. Both were presented as
  #   correct. Half-open is now the only permitted form.
  range_convention: half_open   # transaction_time >= start AND transaction_time < end


# =============================================================================
# STORES — the 7 active retail stores, keyed on the ACTUAL stores.name value
# =============================================================================
# source: live production `stores` table + distinct store_id in new_transactions,
#   read 2026-09-01. `stores.name` was renamed at some point to the "(N) ..."
#   form and the friendly label moved to `stores.display_name`.
#
# resolves: THREE separate contradictions.
#   1. backend/business_rules.yaml:7-13 listed 6 stores by friendly name
#      ("Rockwell", "Greenhills", ...). Those strings no longer match any
#      stores.name value, so every example doing `s.name = 'Rockwell'`
#      (business_rules.yaml:592, 702, 751, 830, 897) matches ZERO rows.
#   2. The live `store_filters` table omitted Greenhills from the sales scope
#      while including it in inventory — dropping the second-busiest store
#      (65,063 transactions) from sales reporting. Greenhills is included here.
#   3. Shang (12,085 transactions since 2026-04-05) existed in the data but in
#      no config file. It is included here.
#
# Match on `id`, never on a name. The names below are recorded so a rename is
# detectable; `display_name` is what George shows the user.
# NOTE: "(6) Aji Ichiban  OPUS" contains a DOUBLE SPACE. Preserved verbatim.
stores:
  active_retail:
    - id: "6639efd54694700008d7ccc6"
      name: "(1) Aji Ichiban Food Products"
      display_name: "Rockwell"
    - id: "668023c94721460006092609"
      name: "(2) Aji Ichiban food products SM Fairview"
      display_name: "Fairview"
    - id: "668a43f60fa9990007cfa158"
      name: "(3) Ajiichiban Food Products Greenhills"
      display_name: "Greenhills"
    - id: "66cfff31aa7adf0007c9de41"
      name: "(4) Ajiichiban Food Products SM North Edsa"
      display_name: "North Edsa"
    - id: "67612230a740d90007464e26"
      name: "(5) Ajiichiban food products Magnolia"
      display_name: "Magnolia"
    - id: "68c5bb269da1d500073690c2"
      name: "(6) Aji Ichiban  OPUS"
      display_name: "OPUS"
    - id: "69c73fcb277aa600076dfaaa"
      name: "Ajiichiban SHANG"
      display_name: "Shang"

  # The warehouse. NOT a retail store — excluded from every sales metric (see
  # filters.excluded_from_sales) but in scope for inventory, because stock genuinely sits
  # here. Recorded with a display_name so tools can label its rows from this
  # file instead of reading stores.name at query time.
  # source: live stores table, 2026-09-01 (stores.display_name is NULL there).
  warehouse:
    - id: "667bde393126e50006c8058c"
      name: "AJI BARN"
      display_name: "AJI BARN"

  # ---------------------------------------------------------------------------
  # CLOSED LOCATIONS. Real places that no longer operate.
  #
  # They are NOT deleted and NOT merged into anything. Their history is real:
  # AJI MACOPA alone accounts for 1,006 document references across the StoreHub
  # exports. A closed location must resolve for a HISTORICAL question and must
  # disappear from a CURRENT-STATE one, and those are different questions — which
  # is exactly why this is its own group rather than an absence.
  #
  # Deliberately NOT in stores.warehouse: agent/loop.py builds the store enum
  # offered to the model from the live scopes, and a closed warehouse must not be
  # offered as somewhere to ask about today's stock.
  # ---------------------------------------------------------------------------
  closed:
    - id: "local-aji-macopa-wh-0001"
      name: "AJI MACOPA"
      display_name: "AJI MACOPA"
      kind: warehouse
      closed_at: "2026-06-24"
      # THE ID IS NOT A STOREHUB ObjectID AND THAT IS DELIBERATE. Every other
      # stores.id is a 24-character hex ObjectID. MACOPA was never synced from
      # StoreHub, so a plausible-looking hex id would risk a duplicate row if the
      # real one ever arrives, with a thousand documents bound to the wrong one.
      # An obviously-local id cannot collide and makes the reconciliation a
      # search for one known string. See migration i3j4k5l6m7n8.
      id_source: local
      id_is_storehub_objectid: false
      #
      # closed_at IS DERIVED FROM THE DATA, not supplied. It is the last date on
      # which goods actually MOVED to or from MACOPA:
      #   ST2721, MACOPA -> Magnolia, PHP 4,040, status Completed, shipped and
      #   received 2026-06-24 23:27.
      # A later document exists and is deliberately not used:
      #   ST2735, 2026-06-28, MACOPA -> OPUS, status Created, ZERO lines,
      #   total 0.00 — raised and never shipped.
      # That is the same document-versus-movement distinction as
      # storehub.stock_transfers.moved_statuses, applied so the closing date
      # means "when goods last moved" and not "when someone last opened a form".
      closed_at_derivation: "last movement (moved_statuses) touching the location"
      closed_at_source_document: "ST2721"
      closed_at_rejected_candidate: "ST2735 (2026-06-28) — status Created, zero lines, never shipped"
      #
      # Activity while it operated, measured 2026-09-02 across all five exports:
      #   1,006 document references — 666 as transfer source, 340 as target
      #   76 of 227 purchase orders (33.5%) were destined here
      # Note the per-file split: Purchase_Orders_09-02-2026.csv is 140 BARN / 3
      # MACOPA while Purchase_Orders_09-02-2026 (1).csv is 73 MACOPA / 1 BARN.
      # One export is a BARN book and the other a MACOPA book, so a destination
      # figure must state the window it covers.
      transfer_references: 1006
      po_destination_count: 76
      po_total_measured: 227

  # Two more storefronts exist in `stores` with ZERO transactions to date and are
  # presumed to be the 8th and 9th candy stores. They are deliberately NOT in
  # active_retail until they transact. Move them up when they do.
  # source: live stores table, 2026-09-01.
  pending_retail:
    - id: "694785f3c9a90d0007fc9232"
      name: "Ajiichiban ROBINSONS super market lucky Chinatown"
    - id: "6982c9a9aa1210000783594d"
      name: "AJI ROBINSONS supermarket robinsons galleria"

  sql:
    # The canonical sales scope. Tools bind this list; they never inline names.
    # resolves: sql_generator.py:179 resolved names -> ids via stores.name and
    #   silently produced an EMPTY id list, which rendered the literal SQL
    #   `t.store_id IN ()` into the prompt — a syntax error. Keying on ids
    #   removes the resolution step entirely.
    active_retail_filter: "t.store_id IN :active_retail_store_ids"


# =============================================================================
# ROW-LEVEL FILTERS — what counts as a sale at all
# =============================================================================
filters:

  # ---------------------------------------------------------------------------
  cancelled:
    rule: "Cancelled transactions are excluded from every metric, without exception."
    sql: "t.is_cancelled = false"
    # source: business_rules.yaml:260-266 (default_filters, always_apply: true),
    #   restated at sql_generator.py:427 (safety rule 2) and as negative
    #   example 1 (business_rules.yaml:1207).
    # resolves: nothing — this is the one rule both files already stated
    #   identically. Recorded here so tools read it from one place.
    # Live count: 1,753 cancelled rows across the 9 transacting stores.
    always_apply: true

  # ---------------------------------------------------------------------------
  returns:
    rule: >
      A row with transaction_type = 'Return' is NOT a sale and is excluded from
      all sales metrics. Returns are reported separately, never netted silently.
    sale_sql:   "t.transaction_type = 'Sale'"
    return_sql: "t.transaction_type = 'Return'"
    # source: live data, 2026-09-01. Distinct values of transaction_type are
    #   exactly 'Sale' (365,370 rows) and 'Return' (54 rows, ₱35,407.40 total).
    #
    # resolves: TWO problems.
    #   1. NO rule for returns existed anywhere. No training example, negative
    #      example, default filter or prompt line referenced transaction_type.
    #      Because Return rows carry POSITIVE totals (verified: zero rows in
    #      new_transactions have total < 0), every sales figure the old chatbot
    #      produced silently counted ₱35,407.40 of returns as revenue.
    #   2. business_rules.yaml:52 documented the values as "SALE, REFUND".
    #      The actual values are 'Sale' and 'Return' — different words AND
    #      different case. A filter written from that doc matches zero rows and
    #      looks like it worked.
    always_apply: true

    # OPEN QUESTION — do not resolve by guessing.
    # Return rows store a positive `total`. Whether that figure is the refunded
    # amount (so net-of-returns = sales - returns) or something else has not been
    # confirmed with the business. Until it is, George reports returns as their
    # own figure and must NOT publish a "net of returns" number.
    net_of_returns_supported: false

  # ---------------------------------------------------------------------------
  # RENAMED from `aji_barn` on 2026-09-02. The key never held only AJI BARN —
  # AJI PINA has been in it from the start — and it is about to describe two
  # warehouses rather than one. A key whose name misdescribes its contents is
  # how the wrong list gets used.
  excluded_from_sales:
    rule: >
      Locations that are not retail storefronts. Their rows in new_transactions
      are stock movements or dead history, not retail sales, and are excluded
      from every sales metric. Warehouses remain in scope for INVENTORY
      questions — stock genuinely lives there.
    excluded_store_ids:
      - "667bde393126e50006c8058c"   # AJI BARN     — warehouse, 1,703 'Sale' + 2 'Return' rows
      - "6639efd64694700008d7cd17"   # AJI PINA     — 92 rows, 2025-07-18 → 2025-08-08 only
      - "local-aji-macopa-wh-0001"   # AJI MACOPA   — closed warehouse, 2026-06-24

    # Labels for the ids above, in the same order. Tools cite the exclusion in
    # meta.filters_applied and must not carry their own copy of these names — an
    # earlier version of tools/sales.py hardcoded the string
    # "excluded: AJI BARN, AJI PINA", which would have gone stale and quietly
    # lied the moment a third id was added here.
    excluded_labels:
      "667bde393126e50006c8058c": "AJI BARN"
      "6639efd64694700008d7cd17": "AJI PINA"
      "local-aji-macopa-wh-0001": "AJI MACOPA"

    # -------------------------------------------------------------------------
    # THERE ARE TWO WAREHOUSES. ONE IS CLOSED.
    #
    # AJI BARN is the main warehouse and is operating. AJI MACOPA was a second,
    # smaller warehouse and CLOSED on 2026-06-24 (stores.closed carries the id,
    # the date and how the date was derived).
    #
    # MACOPA is NOT a rename of BARN and NOT an alias for it. Transfers between
    # the two are real inter-warehouse movement of real goods and must be counted
    # as movement, not netted away as a bookkeeping artefact — 1,006 documents
    # reference MACOPA, 666 of them with MACOPA as the source.
    #
    # Both are warehouses and both are excluded from retail sales on the same
    # grounds: neither is a storefront. MACOPA is additionally excluded from
    # current-state questions because it is shut — see filters.closed_locations,
    # which is a DIFFERENT exclusion with a different scope. Being closed removes
    # it from "now"; being a warehouse removes it from retail sales; its history
    # stays fully answerable under both.
    #
    # CORRECTION, 2026-09-02. An earlier version of this block said MACOPA was
    # "still in use" and "the destination of most purchase orders", and left it
    # out of the id lists because it had no stores row. All three are now
    # settled: it is closed, it has a row (a deliberately non-StoreHub id, see
    # stores.closed), and the destination share is measured at 76 of 227 POs
    # (33.5%) rather than most.
    #
    # source: the business, 2026-09-02, plus the five StoreHub exports.
    # -------------------------------------------------------------------------
    warehouse_store_ids:
      - "667bde393126e50006c8058c"   # AJI BARN — the main warehouse, operating
      - "local-aji-macopa-wh-0001"   # AJI MACOPA — warehouse, CLOSED 2026-06-24

    inventory_scope_store_ids:
      - "667bde393126e50006c8058c"   # AJI BARN is IN scope for inventory
    # AJI MACOPA is deliberately absent from inventory scope: it is closed, so
    # it holds no current stock and has no inventory rows. Including it would
    # return an empty result that reads as "nothing in stock here" rather than
    # "this place shut in June" — the same trap as the unset low-stock
    # thresholds and the non-existent vending failure status.
    # source: live data, 2026-09-01. AJI BARN carries 1,703 rows typed 'Sale'
    #   spanning 2025-08-15 → 2026-09-01; AJI PINA carries 92 rows in a
    #   three-week window in 2025.
    #
    # resolves: no concept of a transfer existed in either file. Warehouse
    #   movements carry the SAME transaction_type ('Sale') as a customer
    #   purchase, so nothing distinguished them. The only mechanism that would
    #   have excluded them was the store_filters sales list — which was broken
    #   (see stores.sql.active_retail_filter above), so BARN movements were
    #   landing in company-wide totals.
    #
    # ASSUMPTION FLAGGED FOR THE BUSINESS: that a BARN row is an internal
    # transfer rather than a wholesale sale. If some BARN rows are genuine
    # third-party sales, this exclusion understates revenue and this entry must
    # change. Excluding is the safer default — a transfer counted as revenue
    # inflates every store-comparison and company total.
    assumption_confirmed: false

  # ---------------------------------------------------------------------------
  # CLOSED LOCATIONS — EXCLUDED FROM CURRENT STATE, KEPT IN HISTORY.
  #
  # A closed location is excluded from any question about how things stand NOW,
  # on the same footing as AJI BARN and AJI PINA in excluded_from_sales above:
  # a named list, applied by construction, and cited in meta.filters_applied so
  # the exclusion appears on the receipt rather than happening invisibly.
  #
  # THE DISTINCTION THIS ENCODES. "How much stock is at MACOPA" and "how much
  # did MACOPA ship in May" are different questions, and a closed location
  # answers only the second. The first must not come back empty as though the
  # shelves were bare — it must say the place is shut.
  #
  # So the rule is asymmetric, and deliberately so:
  #   CURRENT STATE  (inventory, dead stock, "right now")  -> EXCLUDED
  #   HISTORY        (transfers, purchase orders, a past window) -> INCLUDED
  #
  # Excluding closed locations from history would silently delete real activity:
  # MACOPA alone is 1,006 document references and 76 purchase orders. The point
  # of creating its store row was to make that history resolve.
  #
  # source: the business, 2026-09-02 (MACOPA is closed). Ids and dates from
  #   stores.closed, which is the single place they are written down.
  # ---------------------------------------------------------------------------
  closed_locations:
    rule: >
      A closed location is excluded from current-state questions and included in
      historical ones. A current-state tool asked about one must say it is
      closed and give its closing date, never return an empty result.
    excluded_store_ids:
      - "local-aji-macopa-wh-0001"   # AJI MACOPA — closed 2026-06-24
    excluded_labels:
      "local-aji-macopa-wh-0001": "AJI MACOPA"
    applies_to_current_state: true
    applies_to_history: false
    # A tool must not answer "no stock" for a closed location. It says so.
    empty_result_is_forbidden: true
    notice_kind: location_closed
    notice_template: >
      {label} closed on {closed_at} and is excluded from current-state figures.
      Its history is intact and remains answerable — it appears in
      {transfer_references} transfer and purchase-order documents up to that
      date.

  # ---------------------------------------------------------------------------
  # The full guard every sales metric applies. Tools compose from this, and the
  # meta.filters_applied they return must name each clause included.
  standard_sales_guard:
    - "t.is_cancelled = false"
    - "t.transaction_type = 'Sale'"
    - "t.store_id IN :active_retail_store_ids"


# =============================================================================
# METRICS
# =============================================================================
#
# THERE IS DELIBERATELY NO STORE-SIDE PROFIT METRIC. No cost is captured per
# line, so the documented formula would value historical sales at today's cost.
# Before adding one, read suppliers.store_profit_supported (false) and
# suppliers.store_profit_reason. Vending profit IS computable and lives in
# vending.metrics.profit, with a mandatory overstatement flag.
# =============================================================================
metrics:

  # ---------------------------------------------------------------------------
  net_sales:
    description: >
      Company or store level sales value. The transaction-level measure: the
      final amount of each completed, non-cancelled, non-return transaction at
      an active retail store.
    grain: transaction
    source_table: new_transactions
    sql: "SUM(t.total)"
    unit: PHP
    filters:
      - "t.is_cancelled = false"
      - "t.transaction_type = 'Sale'"
      - "t.store_id IN :active_retail_store_ids"
    date_column: "t.transaction_time"
    # A transaction total cannot be attributed to a line, so this metric may NOT
    # be grouped by product or category. Splitting t.total across the products
    # in a basket would invent a definition nobody agreed. Tools must REFUSE the
    # combination rather than answer it — see metrics.product_revenue for the
    # measure that is valid at that grain.
    valid_group_by: [store, day, week, month]
    # source: t.total is the measure used by every store-level example in
    #   business_rules.yaml (examples 2, 7, 8, 11, 12, 13, 15, 18, 20, 21, 23,
    #   25, 28, 31) and by the MANDATORY year-over-year template at
    #   sql_generator.py:494.
    #
    # resolves: business_rules.yaml:309 DECLARED revenue as SUM(ti.item_total)
    #   while essentially all of its own store-level SQL used SUM(t.total).
    #   Nothing said which was authoritative or when to use which.
    #   DECIDED: t.total is net_sales; ti.item_total is product_revenue, valid
    #   only at line grain. See metrics.product_revenue for the measured
    #   reconciliation — the two currently tie EXACTLY, because t.discount is
    #   zero on every row. The ambiguity was therefore latent rather than
    #   actively wrong, but it is still resolved here so that a future header
    #   discount does not silently split the two numbers.
    #   t.total = t.sub_total + t.tax (verified, August 2026).

  # ---------------------------------------------------------------------------
  product_revenue:
    description: >
      Revenue attributed to a specific product, category or tag. The line-level
      measure — the only one that can be broken down below the transaction.
    grain: transaction_item
    source_table: new_transaction_items
    sql: "SUM(ti.item_total)"
    unit: PHP
    join: "INNER JOIN new_transactions t ON ti.transaction_ref_id = t.ref_id"
    filters:
      - "t.is_cancelled = false"
      - "t.transaction_type = 'Sale'"
      - "t.store_id IN :active_retail_store_ids"
    date_column: "t.transaction_time"
    # Line grain, so every grouping is valid.
    valid_group_by: [store, day, week, month, product, category]
    # source: business_rules.yaml:309 (revenue_calculation) and :197
    #   (column_synonyms.revenue marks item_total "the correct column for
    #   revenue in transaction_items").
    #
    # resolves: the same net_sales/product_revenue split above, by naming both
    #   measures and scoping each to the grain it is valid at. It also enforces
    #   negative example 4 (business_rules.yaml:1228): new_transaction_items
    #   carries no date and no is_cancelled, so it MUST be joined to
    #   new_transactions before any filtering — the join is part of this
    #   definition, not left to the caller.
    #
    # RECONCILIATION — MEASURED ACROSS HISTORY. The two measures agree on recent
    # data and DISAGREE on 2024 data. Verified, 7 active stores, Manila windows:
    #
    #   window     net_sales       product_revenue   gap            discount
    #   Jun 2024   2,483,286.24    2,501,609.05      -18,322.81     29,188.87
    #   Jul 2024   4,256,511.81    4,209,769.48      +46,742.33      7,274.54
    #   Jun 2026   8,467,689.89    8,467,689.89            0.00          0.00
    #   Aug 2026   7,926,172.16    7,926,172.16            0.00          0.00
    #
    # CORRECTION TO AN EARLIER VERSION OF THIS FILE. It previously asserted
    #   ties_to_net_sales: true, ties_only_while: "SUM(t.discount) = 0"
    # on the strength of August 2026 alone. That is WRONG. The gap does not
    # equal the discount, and in June 2024 the gap is NEGATIVE — product_revenue
    # exceeds net_sales, which a header discount cannot cause. The true cause of
    # the 2024 divergence is not yet established (most likely line items whose
    # header is absent, or the reverse).
    #
    # SUM(t.discount) = 0 is therefore NECESSARY BUT NOT SUFFICIENT. A tool that
    # asserted only the discount would pass while the two measures sat ₱46,742
    # apart. Do not use it as the test.
    #
    # THE TEST is to compute both measures over the same window and filters and
    # compare them directly. tools/sales.py does this and reports the outcome in
    # meta.reconciliation. Note that 742 transactions across all history carry a
    # nonzero discount, concentrated in 2024-06..2024-08 plus one row in 2026-04.
    ties_to_net_sales: varies_by_window
    reconciliation_method: "compute both measures over the same window and filters; compare directly"
    discount_is_sufficient_test: false
    # Retained as a DIAGNOSTIC reported alongside the real comparison, never as
    # the test itself.
    discount_diagnostic_sql: "SUM(t.discount)"
    # Windows known to diverge, for regression testing.
    known_divergent_windows:
      - {start: "2024-06-01", end: "2024-07-01", gap: -18322.81}
      - {start: "2024-07-01", end: "2024-08-01", gap: 46742.33}

  # ---------------------------------------------------------------------------
  returns_value:
    description: >
      Value of returned transactions, reported on its own. NEVER subtracted
      from net_sales — see filters.returns.net_of_returns_supported.
    grain: transaction
    source_table: new_transactions
    sql: "SUM(t.total)"
    unit: PHP
    filters:
      - "t.is_cancelled = false"
      - "t.transaction_type = 'Return'"
      - "t.store_id IN :active_retail_store_ids"
    date_column: "t.transaction_time"
    # Transaction grain, same restriction as net_sales.
    valid_group_by: [store, day, week, month]
    # source: live data — 54 Return rows, ₱35,407.40, all with positive totals.
    # resolves: makes returns visible as a figure instead of leaving them
    #   silently folded into revenue, without asserting a netting convention
    #   nobody has confirmed.

  # ---------------------------------------------------------------------------
  units_sold:
    description: "Number of units sold. Line grain."
    grain: transaction_item
    source_table: new_transaction_items
    sql: "SUM(ti.quantity)"
    unit: units
    join: "INNER JOIN new_transactions t ON ti.transaction_ref_id = t.ref_id"
    filters:
      - "t.is_cancelled = false"
      - "t.transaction_type = 'Sale'"
      - "t.store_id IN :active_retail_store_ids"
    date_column: "t.transaction_time"
    valid_group_by: [store, day, week, month, product, category]
    # source: business_rules.yaml:312 (business_logic.units_sold) and :206-212
    #   (column_synonyms.units names `quantity` as the actual column).
    # ti.quantity is NUMERIC, not integer — weighted items sell in fractions
    # (observed range 1.000 to 96,320.000 across 891,714 line items, no NULLs).
    # Do not cast it to int.
    integral: false

  # ---------------------------------------------------------------------------
  transaction_count:
    description: >
      Number of distinct transactions. Transaction grain. When grouped by
      product or category the meaning CHANGES to "transactions containing this
      product/category" — a different question, and baskets spanning several
      groups are counted once in each.
    grain: transaction
    source_table: new_transactions
    sql: "COUNT(DISTINCT t.ref_id)"
    unit: transactions
    filters:
      - "t.is_cancelled = false"
      - "t.transaction_type = 'Sale'"
      - "t.store_id IN :active_retail_store_ids"
    date_column: "t.transaction_time"
    valid_group_by: [store, day, week, month, product, category]
    # Grouping by product/category is permitted but redefines the metric, so a
    # tool MUST attach a notice saying so. Silently answering a different
    # question is the failure mode this entry exists to prevent.
    redefined_when_grouped_by: [product, category]
    redefinition_note: >
      Counting transactions that CONTAIN this product, not transactions OF this
      product. A basket holding three different products contributes 1 to each
      of the three rows, so these counts do not sum to the overall
      transaction_count.
    # source: business_rules.yaml:313 (business_logic.transaction_count).
    #   COUNT(DISTINCT t.ref_id), not COUNT(*): ref_id is the transaction PK and
    #   a line-grain join multiplies header rows.


# =============================================================================
# INVENTORY STATE — one stockout definition
# =============================================================================
inventory:
  source_table: inventory          # current state only; no history
  history_table: inventory_snapshots
  # inventory_snapshots columns are EXACTLY: store_id, product_id, snapshot_date,
  # quantity_on_hand, created_at. There is no prev_quantity or delta column;
  # prior-day values come from LAG(quantity_on_hand) OVER (PARTITION BY
  # store_id, product_id ORDER BY snapshot_date) inside a CTE.
  # source: sql_generator.py:444.

  # ---------------------------------------------------------------------------
  # ONE definition. The three states are mutually exclusive and evaluated in the
  # order listed, so exactly one applies to any row.
  #
  # NEGATIVE ON-HAND IS DECIDED: quantity_on_hand < 0 counts as OUT OF STOCK.
  # A negative balance is a data error, but the shelf is empty either way.
  # Treating it as anything else hides a real outage behind a bookkeeping fault,
  # which is the more expensive mistake.
  #
  # source: sql_generator.py:440-442 (the prompt's `<= 0` / `> 0` / low-stock
  #   rules) — the prompt's boundary is adopted, the yaml example's is not.
  #
  # resolves: THREE contradictions in and around business_rules.yaml example 5.
  #   1. sql_generator.py:441 defined out-of-stock as `quantity_on_hand <= 0`
  #      while business_rules.yaml:436 used `quantity_on_hand = 0`. Negative
  #      stock was a stockout under one rule and invisible under the other.
  #      DECIDED: <= 0.
  #   2. business_rules.yaml:433-437 ordered its CASE with the LOW STOCK branch
  #      FIRST, so any row with quantity_on_hand = 0 and a non-null
  #      warning_stock >= 0 was labelled 'LOW STOCK' and never reached the
  #      'OUT OF STOCK' branch — that branch was unreachable, and every real
  #      stockout was mislabelled. Ordering out_of_stock first fixes it.
  #   3. business_rules.yaml:441 defaulted a missing warning_stock to 10 via
  #      COALESCE; sql_generator.py:442 applied no default. Products with a null
  #      threshold appeared in one result set and not the other. See below.
  states:
    - name: out_of_stock
      sql: "i.quantity_on_hand <= 0"
      order: 1
    - name: low_stock
      sql: "i.quantity_on_hand > 0 AND i.warning_stock IS NOT NULL AND i.quantity_on_hand <= i.warning_stock"
      order: 2
    - name: in_stock
      sql: "i.quantity_on_hand > 0 AND (i.warning_stock IS NULL OR i.quantity_on_hand > i.warning_stock)"
      order: 3

  # DELIBERATELY NULL. A product with no warning_stock has no low-stock
  # threshold and is therefore never "low stock" — it is in_stock, and the
  # missing_threshold flag surfaces it so the gap is visible rather than papered
  # over. The old COALESCE(warning_stock, 10) invented a business rule that
  # nobody set; if the business wants a floor, it is changed HERE, once.
  low_stock_threshold_default: null
  missing_threshold_flag_sql: "i.warning_stock IS NULL"

  # ---------------------------------------------------------------------------
  # MEASURED STATE OF THIS TABLE — 2026-09-01, all 31,617 inventory rows:
  #   warning_stock IS NULL on 31,617 rows (100%). Zero rows have a threshold.
  #   ideal_stock  > 0 on 0 rows.
  #   out_of_stock = 27,648 (87.4%), of which 2,413 are NEGATIVE on-hand.
  #   low_stock    = 0        in_stock = 3,969
  #   States verified mutually exclusive and total (27,648 + 0 + 3,969 = 31,617).
  #
  # CONSEQUENCE, STATED PLAINLY: low_stock currently matches ZERO rows and will
  # keep doing so until warning_stock is populated. This is not a bug in the
  # definition — it is the honest result of the thresholds never being set.
  #
  # It also explains business_rules.yaml:441's COALESCE(warning_stock, 10):
  # that default was the ONLY reason the old low-stock report ever returned
  # anything. Every "low stock" answer the old chatbot gave was driven by an
  # invented constant of 10, not by a threshold anyone configured.
  #
  # A tool answering a low-stock question MUST say the thresholds are unset
  # rather than return an empty list as though nothing were low. Do not restore
  # a default to make the report non-empty — populate warning_stock, or agree a
  # real floor with the business and set it here.
  low_stock_operational: false
  low_stock_blocked_reason: "inventory.warning_stock is NULL on 100% of rows"

  # Inventory questions use their own store scope — the warehouse holds stock.
  # source: the live store_filters table's inventory scope, plus filters.excluded_from_sales.
  #
  # resolves: this was previously the prose string
  #   "active_retail + filters.excluded_from_sales.inventory_scope_store_ids"
  # which no tool could read without parsing an ad-hoc expression — a violation
  # of the rule this file exists to enforce (tools READ definitions, they do not
  # interpret them). It is now a literal list. Keep it literal.
  scope_store_ids:
    - "6639efd54694700008d7ccc6"   # Rockwell
    - "668023c94721460006092609"   # Fairview
    - "668a43f60fa9990007cfa158"   # Greenhills
    - "66cfff31aa7adf0007c9de41"   # North Edsa
    - "67612230a740d90007464e26"   # Magnolia
    - "68c5bb269da1d500073690c2"   # OPUS
    - "69c73fcb277aa600076dfaaa"   # Shang
    - "667bde393126e50006c8058c"   # AJI BARN — warehouse, inventory scope only

  # NOT DEFINED YET. `inventory` is point-in-time state, so a stockout EVENT or
  # DURATION ("how long was X out of stock") cannot be answered from it. That
  # needs a definition built on inventory_snapshots. Do not improvise one in a
  # tool — add it here first.
  stockout_duration_supported: false


# =============================================================================
# PRODUCT CATALOG
# =============================================================================
products:
  source_table: products
  # 3,678 rows as of 2026-09-01. `embedding` is a pgvector column and is
  # entirely NULL — never select it, and never SELECT *.

  # ---------------------------------------------------------------------------
  # CATEGORY NORMALIZATION. Blank and NULL both mean "not categorised" and must
  # collapse to one visible bucket, never be dropped.
  #
  # source: business_rules.yaml:451 and :799 used COALESCE(p.category,
  #   'Uncategorized'); the NULLIF is added because the column holds BOTH NULL
  #   and empty string, and a bare COALESCE leaves '' as its own silent group.
  #   83 of 3,678 products are uncategorised.
  #
  # resolves: this expression was HARDCODED in tools/sales.py
  #   (_group_expressions), which is precisely what this file exists to prevent
  #   — a definition living in a tool drifts from every other tool that needs
  #   it. tools/sales.py and tools/products.py now both read it from here.
  # ---------------------------------------------------------------------------
  category_normalization:
    sql: "COALESCE(NULLIF(p.category, ''), 'Uncategorized')"
    uncategorized_label: "Uncategorized"

  # ---------------------------------------------------------------------------
  # SKU IS NOT UNIQUE. 3,678 products share 3,610 distinct case-insensitive
  # SKUs — 68 collide. The colliding rows are UNRELATED products, not variants:
  #
  #   Tky105  hokka Gudetama biscuits              indi      PHP 133.04
  #   tky105  Pikachu figure limited edition candy  seasonal  PHP 891.96
  #   TKY105  Dars Dark chocolate 42g               choco     PHP  88.39
  #
  # source: live products table, 2026-09-01.
  #
  # POLICY — a SKU that resolves to more than one product MUST NOT be summed
  # into a single figure. A tool either returns the matches separately (one row
  # per product, so the caller can see all three) or REFUSES and names the
  # collision. It must never silently aggregate them.
  #
  # resolves: tools/sales.py and tools/inventory.py both filtered with
  #   `lower(p.sku) = lower(:sku)`. In sales.py, a SKU filter without a product
  #   grouping summed all three of the above into one number that belongs to no
  #   product. Callers disambiguate with the product_id filter.
  # ---------------------------------------------------------------------------
  sku:
    unique: false
    match: case_insensitive
    ambiguity_policy: separate_or_refuse
    disambiguate_with: product_id

    # -------------------------------------------------------------------------
    # TWO MATCHING RULES, ONE FOR EACH DIRECTION. They are not in conflict; they
    # serve different callers.
    #
    #   match (case_insensitive)  — a HUMAN typing a SKU at George. A person who
    #     types "tky105" should not get an empty result because the catalog
    #     stores "TKY105". The ambiguity_policy above is what keeps this safe:
    #     a case-insensitive hit on more than one product is separated or
    #     refused, never summed.
    #
    #   import_match (case_sensitive) — a MACHINE joining an exported SKU string
    #     to products.sku. There is no user to disambiguate for and no prompt to
    #     return to; the join either lands on the right product row or silently
    #     attributes a purchase cost to the wrong one.
    #
    # SKU CASE IS LOAD-BEARING IN THE CATALOG. TKY28 and Tky28 are different
    # products, as are TKY107 and Tky107 — the same pattern metrics.yaml already
    # records at products.sku (Tky105 / tky105 / TKY105 are three unrelated
    # items in three categories at three prices). Case-folding an import join
    # would merge unrelated products' cost histories into one series.
    #
    # source: verified against the live products table (user-confirmed, carried
    #   into this file 2026-09-02).
    # resolves: nothing yet — this is additive. tools/movement.py:206 and the
    #   other user-facing lookups keep using `match`. Only the StoreHub importer
    #   and get_cost_history use import_match.
    #
    # An import_match that hits MORE THAN ONE row is NOT resolved by picking
    # one. The line imports with a null product_id and sku_match='ambiguous',
    # exactly like a miss, and the count is reported on the import.
    # -------------------------------------------------------------------------
    import_match: case_sensitive
    import_match_sql: "p.sku = %(sku)s"
    import_ambiguity_policy: leave_unresolved_and_flag

  # ---------------------------------------------------------------------------
  # BARCODES COME FROM TWO PLACES AND products.barcode IS A LIST.
  #
  #   products.barcode holds a COMMA-SEPARATED list, not one value, e.g.
  #     '4902888269042,4902888269035,4902888269653,4902888270819,...'
  #   An `= ` match misses those rows; a LIKE '%code%' match wrongly hits a
  #   barcode that merely CONTAINS the search string. Split and match an exact
  #   element.
  #
  #   product_barcodes is a second, generated source (89 rows), 22 of which do
  #   NOT appear anywhere in products.barcode. A barcode lookup that reads only
  #   one of the two sources misses real products.
  #
  # source: live data, 2026-09-01. 409 products have no barcode at all; 20
  #   barcode values are shared by more than one product.
  # ---------------------------------------------------------------------------
  barcode:
    products_column_is_list: true
    list_separator: ","
    match_sql: "%(barcode)s = ANY(string_to_array(replace(p.barcode, ' ', ''), ','))"
    secondary_table: product_barcodes
    secondary_match_sql: "pb.barcode = %(barcode)s"
    unique: false

  # Free-text name search also covers `nickname` (115 products carry one).
  # Substring only — never fuzzy. Fuzzy matching invents a relevance ranking,
  # and with genuine near-duplicate names ("golden plum 1kg" appears 3 times) a
  # fuzzy hit looks authoritative while being a guess.
  name:
    search_columns: [name, nickname]
    match: case_insensitive_substring
    fuzzy: false


# =============================================================================
# STOCK MOVEMENT (AJI BARN <-> stores)
#
# THERE IS NO MOVEMENT LEDGER IN THIS DATABASE. Nothing records a transfer as
# an event. Everything below is what a survey on 2026-09-01 actually found, and
# it is the reason tools/movement.py reports BALANCE CHANGES and refuses to
# report transfers.
# =============================================================================
movement:
  # ---------------------------------------------------------------------------
  # THIS CHANGED ON 2026-09-02. A RECORDED LEDGER NOW EXISTS.
  #
  # Everything below this block was written when nothing in the database recorded
  # a transfer as an event. The StoreHub stock-transfer import changed that:
  # 2,034 transfer documents and 40,141 lines, each naming a source, a
  # destination, a product, a quantity, a cost and a status.
  #
  # The old survey is NOT deleted. It still describes the snapshot-differencing
  # path exactly, that path still exists, and its limits still apply to it. What
  # changed is that it is no longer the ONLY path.
  #
  # TWO BASES, AND THEY ARE NEVER BLENDED INTO ONE FIGURE:
  #
  #   transfer_records  RECORDED movement. A document says goods moved from A to
  #                     B. Answers destination questions. Covers only the window
  #                     that has been imported, and only what staff recorded.
  #
  #   balance_delta     INFERRED movement. Differenced daily snapshots. Says a
  #                     number changed, never that goods moved or where. Covers
  #                     every product with snapshots, recorded or not.
  #
  # A number that added a recorded transfer to an inferred balance change would
  # be double-counting the same movement under two names, and would carry no
  # single provenance. Tools return them as separate labelled blocks with no
  # summed field spanning both. Rows carry their own `basis`.
  # ---------------------------------------------------------------------------
  recorded_ledger_exists: true
  recorded_ledger_since: "2026-09-02 (StoreHub stock-transfer import)"
  bases:
    transfer_records:
      source_table: stock_transfers
      lines_table: stock_transfer_lines
      derived: false
      is_recorded_movement: true
      names_destination: true
      # Coverage is the imported window, not all of history. Every record-backed
      # answer must state the window it can see.
      coverage_is_imported_window: true
      coverage_notice_mandatory: true
    balance_delta:
      derived: true
      is_recorded_movement: false
      names_destination: false
  never_blend_bases: true
  default_basis: both

  # ---------------------------------------------------------------------------
  # STATUS DECIDES WHETHER GOODS MOVED, on the record-backed basis.
  # Reuses storehub.stock_transfers.moved_statuses rather than restating it.
  # A quantity or value question defaults to moved documents only; a
  # document-count question legitimately counts all statuses and says so.
  # ---------------------------------------------------------------------------
  moved_statuses_ref: storehub.stock_transfers.moved_statuses
  unmoved_value_notice_mandatory: true

  # Quantities mix units across products (grams vs packs) — see
  # storehub.quantity_unit. A record-backed quantity is only meaningful within
  # one product; value (PHP) is the additive measure across products.
  record_quantity_additive_across_products: false

  # What was surveyed and what it held.
  # source: live database, 2026-09-01, all 38 base tables enumerated.
  sources_surveyed:
    warehouse_inventory:    {rows: 0,      verdict: "empty; schema is a balance snapshot, not a ledger"}
    packing_lists:          {rows: 2,      verdict: "both status=pending, created 2026-08-27/28; never used"}
    packing_items:          {rows: 3,      verdict: "three lines total, actual_packed all NULL"}
    store_pipeline:         {rows: 0,      verdict: "empty"}
    candy_sku_by_store:     {rows: 0,      verdict: "empty"}
    shipment_plans:         {rows: 122207, verdict: "planning only; allocated_ship_qty sums to -17,705,649"}
    candy_inventory_counts: {rows: 1742,   verdict: "physical counts, 9 stores, 13 products, from 2026-06-14; AJI BARN NOT among them"}
    candy_warehouse_dispatches_clean: {rows: 13735, verdict: "inferred view, not a ledger; see destination_attribution"}
    inventory_snapshots:    {rows: 4881566, verdict: "daily BALANCES; movement only inferable by differencing"}

  # ---------------------------------------------------------------------------
  # THE ONLY USABLE SOURCE, AND WHAT IT IS NOT.
  # inventory_snapshots holds a daily balance per (store, product). Differencing
  # consecutive days yields a BALANCE CHANGE. That is not a movement: it says
  # the number moved, never that goods moved, where they went, or why.
  # ---------------------------------------------------------------------------
  balance_delta:
    source_table: inventory_snapshots
    derived: true
    is_recorded_movement: false
    method: "difference consecutive daily balance snapshots per (store, product)"
    # Snapshot coverage is NOT continuous. AJI BARN has 148 distinct snapshot
    # days across a 162-day span (2026-03-23..2026-08-31) — 14 days missing.
    # A delta spanning a gap silently merges several days of movement into one
    # number, so tools MUST NOT difference across a gap; report the gap instead.
    difference_across_gaps: false
    barn_snapshot_days: 148
    barn_snapshot_span_days: 162
    barn_missing_days: 14

  # ---------------------------------------------------------------------------
  # DESTINATION ATTRIBUTION IS NOT SUPPORTED. "How much went from BARN to
  # Rockwell" is unanswerable from this data and tools MUST refuse it.
  #
  # candy_warehouse_dispatches_clean is the only thing naming a destination. It
  # is a VIEW that infers dispatches from transactions at BARN with total = 0,
  # parsing the destination out of a free-text `notes` column with
  # normalize_store_note(). Measured against actual balance movement for
  # August 2026:
  # ---------------------------------------------------------------------------
  destination_attribution:
    # -------------------------------------------------------------------------
    # NOW SCOPED BY BASIS. It was a flat `false`; that answer was right for the
    # only basis that existed then and is wrong as a blanket statement now.
    #
    #   transfer_records  SUPPORTED. Every transfer names Source Store and
    #                     Target Store, both resolved to store ids through the
    #                     alias map. "How much went from BARN to Rockwell" is a
    #                     direct question against recorded documents.
    #
    #   balance_delta     STILL NOT SUPPORTED, for exactly the reasons measured
    #                     below. Differencing snapshots cannot say where goods
    #                     went, and the inference view that tries reconciles for
    #                     24 of 196 products.
    #
    # The refusal message below still applies, but ONLY to the balance_delta
    # basis. A tool must not refuse a destination question it can now answer from
    # records, and must not answer one from snapshots that it cannot.
    # -------------------------------------------------------------------------
    supported_by_basis:
      transfer_records: true
      balance_delta: false
    supported: false            # legacy key: refers to balance_delta only
    supported_key_means: balance_delta
    measured_window: "2026-08-01..2026-09-01"
    dispatch_view_grams: 1422047
    barn_negative_delta_grams: -4338299
    coverage_pct: 32.8                  # view explains a third of outflow
    null_destination_rows: 3601
    total_view_rows: 13735
    null_destination_pct: 26.2
    products_in_view: 450
    products_with_barn_snapshots: 3518
    products_dispatched_in_window: 196
    products_with_no_barn_snapshot: 69   # 35.2% of those dispatched
    products_reconciling_exactly: 24     # 12.2% — residual exactly 0
    # Worked counterexamples: G4 shows 80,982 g dispatched while its balance
    # ROSE 241,518 g; G2 shows 51,600 g dispatched while its balance rose
    # 209,400 g. SH1 "Aji Mix" has ZERO rows in the view across all time despite
    # 4,817,082 g of balance movement in 90 days.
    refusal_message: >
      Destination-scoped movement is not answerable from this data. The only
      source naming a destination is candy_warehouse_dispatches_clean, a view
      that infers dispatches from zero-total BARN transactions and parses the
      destination from a free-text notes field. It accounts for 32.8% of BARN's
      outflow, has no destination on 26.2% of its rows, covers 450 of 3,518
      products, and reconciles exactly for only 24 of the 196 products it shows
      as dispatched. There is no movement ledger to fall back on.

  # Attached to every answer as a corroborating source so each result states how
  # much of the observed balance change any recorded dispatch can explain.
  corroborating_source:
    table: candy_warehouse_dispatches_clean
    quantity_column: weight_grams
    time_column: transaction_time
    authoritative: false

  # BARN quantities are grams. 24,401,719 = 24.4 tonnes.
  unit: grams


# =============================================================================
# VENDING (AJI CMG / Weimi machines, brand "Hello Aji")
#
# A SEPARATE DATA SOURCE from the StoreHub store tables. goods_id has nothing to
# do with products.id and machines are not rows in `stores`. NEVER join, union
# or compare the two domains.
#
# NOTE ON THE NAME: "AJI CMG" exists in BOTH domains — as a `stores` row
# (667bde0cd749a000079f4650) carrying store-side inventory, and as this vending
# business. tools/vending.py covers ONLY the Weimi side. The store row is out of
# scope here and must not be conflated with it.
# =============================================================================
vending:
  domain: weimi
  currency: PHP
  never_join_to_store_domain: true

  # ---------------------------------------------------------------------------
  # READ THE _php VIEWS, NOT THE RAW TABLES.
  # Every money column in the raw vending tables is an INTEGER NUMBER OF CENTS
  # (2000 = PHP 20.00). The _php views are already divided by 100 and must never
  # be divided again. Verified 2026-09-01: raw real_price 2000 -> 20.00 php.
  #
  # Reading the views removes the cents trap at the source instead of relying on
  # every query remembering to divide — the single most repeated warning in
  # business_rules.yaml (schema notes, prompt rules AND negative examples).
  #
  # v_vending_order_lines_php also pre-joins device_name and category_name, so
  # the tool needs no join for either.
  # ---------------------------------------------------------------------------
  source_view: v_vending_order_lines_php
  orders_view: v_vending_orders_php
  catalog_view: v_vending_goods_php
  raw_money_is_cents: true
  views_already_pesos: true

  # ---------------------------------------------------------------------------
  # THE currency COLUMN LIES. vending_orders.currency = 'CNY' on all 9,219 rows.
  # That is a Weimi hardcoding bug; the real currency is PHP. The raw column is
  # NEVER passed through to a caller. The _php views already relabel it 'PHP'.
  # source: business_rules.yaml:89, confirmed against live data 2026-09-01.
  # ---------------------------------------------------------------------------
  currency_column_is_wrong: true
  currency_column_says: CNY

  # ---------------------------------------------------------------------------
  # SHIPMENT STATUS — THE DOCUMENTED VALUE 3 DOES NOT EXIST.
  #
  # business_rules.yaml:167 and app/services/schema_context.py:66 both state
  # "3 = vend FAILED". Measured distribution over all 11,907 lines, 2026-09-01:
  #     status 1  -> 11,900 lines   (success)
  #     status 2  ->      5 lines   (undocumented; shipment_time is NULL)
  #     status 64 ->      2 lines   (undocumented)
  #     status 3  ->      0 lines   <-- the documented failure code
  #
  # A "failed vends" report written to the documented spec returns an empty list
  # FOREVER and reads as "no failures" — the same trap as the unset low-stock
  # thresholds. So non-success is defined as `shipment_status <> 1` and the raw
  # code is reported rather than given a meaning nobody can confirm.
  #
  # The five status-2 lines have NULL shipment_time, so ANY time-bounded query
  # drops them whatever the status filter says.
  # ---------------------------------------------------------------------------
  success_status: 1
  success_sql: "l.shipment_status = 1"
  non_success_sql: "l.shipment_status <> 1"
  documented_failure_status_exists: false
  status_distribution: {1: 11900, 2: 5, 64: 2}
  status_2_has_null_shipment_time: true

  # ---------------------------------------------------------------------------
  # PROFIT IS OVERSTATED ON 72.7% OF LINES.
  # goods_purchase_cost = 0 on 8,659 of 11,907 lines. Zero means the cost was
  # never entered in Weimi, NOT that the item is free — so profit_php equals
  # revenue on those rows. At that prevalence the flag is MANDATORY: a tool must
  # not return a profit figure without also returning how much of it is
  # uncosted. source: live data 2026-09-01; business_rules.yaml:163.
  # ---------------------------------------------------------------------------
  profit_overstated_lines: 8659
  profit_total_lines: 11907
  profit_overstated_pct: 72.7
  missing_cost_flag_column: missing_cost
  profit_flag_mandatory: true

  # ---------------------------------------------------------------------------
  # CATEGORY COVERAGE IS POOR. Two independent gaps:
  #   - 38 goods_ids appear in sales with NO row in vending_goods at all,
  #     covering 3,533 of 11,907 lines (29.7% of volume).
  #   - 98 of 151 catalog products (64.9%) have no category_name.
  # Both surface as NULL category_name in the view, so they are indistinguishable
  # there; the orphan count is measured separately against vending_goods.
  # Group with COALESCE so neither is silently dropped, and report the coverage
  # or a category chart speaks for a minority of sales.
  # ---------------------------------------------------------------------------
  category_normalization:
    sql: "COALESCE(NULLIF(l.category_name, ''), 'Uncategorized')"
    uncategorized_label: "Uncategorized"
  orphan_goods_ids: 38
  orphan_lines: 3533
  orphan_lines_pct: 29.7
  catalog_missing_category: 98
  catalog_total: 151

  # One machine (62162500) has no device_name. "Never show a bare device_code"
  # still holds, so fall back to a labelled code rather than a blank.
  machine_label_sql: "COALESCE(NULLIF(l.device_name, ''), 'Unnamed machine ' || l.device_code)"
  devices_total: 10
  devices_with_sales: 9
  devices_unnamed: 1

  metrics:
    revenue:
      sql: "SUM(l.real_price_php)"
      unit: PHP
      success_only: true
      valid_group_by: [machine, day, week, month, product, category, payment_method]
    units:
      sql: "SUM(l.goods_amount)"
      unit: units
      success_only: true
      valid_group_by: [machine, day, week, month, product, category, payment_method]
    orders:
      sql: "COUNT(DISTINCT l.order_trade_no_in)"
      unit: orders
      success_only: true
      valid_group_by: [machine, day, week, month, product, category, payment_method]
    profit:
      sql: "SUM(l.profit_php)"
      unit: PHP
      success_only: true
      requires_missing_cost_flag: true
      valid_group_by: [machine, day, week, month, product, category, payment_method]
    non_success_vends:
      sql: "COUNT(*)"
      unit: lines
      success_only: false
      non_success_only: true
      valid_group_by: [machine, day, week, month, product, category]

  buckets:
    day:   "date_trunc('day',   (l.shipment_time AT TIME ZONE 'Asia/Manila'))::date"
    week:  "date_trunc('week',  (l.shipment_time AT TIME ZONE 'Asia/Manila'))::date"
    month: "date_trunc('month', (l.shipment_time AT TIME ZONE 'Asia/Manila'))::date"
  time_column: "l.shipment_time"

  # ---------------------------------------------------------------------------
  # PAYMENT METHOD — `ext` IS TEXT, NOT JSON.
  # business_rules.yaml:151 and schema_context.py:58 both describe
  # vending_orders.ext as "JSON" and give `ext->>'payWay'`. The column's actual
  # type is `text` in both the table and the _php view, so `->>` raises
  # "operator does not exist: text ->> unknown". An explicit ::jsonb cast is
  # required. NULLIF guards the empty string, which would fail the cast.
  # Observed values, 9,219 orders: gcashpay 8,123 / NULL 1,084 / alipayaps 12.
  # source: live data 2026-09-01.
  # ---------------------------------------------------------------------------
  payment_method_sql: "COALESCE(NULLIF(o.ext, '')::jsonb ->> 'payWay', 'unknown')"
  payment_method_ext_is_text: true

  # ---------------------------------------------------------------------------
  # LIVE MACHINE STOCK — a different shape, hence its own function.
  # vending_aisles is the current planogram: one row per slot, no history, no
  # sales. It cannot be date-filtered at all.
  #
  # IT IS STALE. Both vending_aisles.updated_at and
  # vending_devices.last_synced_at last moved 2026-08-05, while sales lines run
  # to 2026-08-31 — sales are current, stock is roughly four weeks behind, with
  # no history to fall back on. Any stock answer must carry its age.
  # ---------------------------------------------------------------------------
  stock:
    source_table: vending_aisles
    has_history: false
    date_filterable: false
    price_is_cents: true          # vending_aisles.price is NOT covered by a _php view
    last_synced: "2026-08-05"
    staleness_mandatory: true
    slots_total: 540
    slots_empty: 133


# =============================================================================
# STOREHUB CSV EXPORTS — purchase orders and stock transfers
#
# StoreHub exports these two documents as CSV. They are the FIRST recorded
# procurement and movement data this database has ever held: until they were
# imported, movement.recorded_ledger_exists was false and every supplier subject
# below was unsupported.
#
# Everything in this section is read at runtime by
# backend/app/services/storehub_import.py and by the tools built on the imported
# tables. The importer holds NO definition of its own — not a status meaning,
# not a location mapping, not a date format.
#
# BOTH EXPORTS ARE HEADER-PLUS-LINE. One summary row per document followed by N
# line rows. See line_discriminator: the obvious tests do not work.
#
# source: the two exports dated 2026-09-02, plus the live stores table.
# =============================================================================
storehub:

  # ---------------------------------------------------------------------------
  # THE "(RM)" COLUMN HEADERS ARE WRONG. The values are PHP.
  #
  # Every money column in both exports is labelled "(RM)" — Malaysian ringgit.
  # StoreHub is a Malaysian product and the export template was never localised.
  # Confirmed by joining PO unit costs to products.cost on SKU: 19 of 20 matched
  # to the centavo. Aji Ichiban trades in the Philippines and holds no ringgit.
  #
  # The importer therefore stores these values as PHP and NEVER converts. No
  # column in the imported tables carries "rm" in its name — a column named for
  # a currency it does not hold is how the mistake would be re-made.
  #
  # source: user-verified against products.cost, carried in 2026-09-02.
  # ---------------------------------------------------------------------------
  currency:
    code: PHP
    header_label_says: "RM"
    header_label_is_wrong: true
    convert: false
    # The one PO cost that did NOT match to the centavo is unexplained. A
    # candidate — NOT asserted, and not acted on anywhere — is that products.cost
    # is Numeric(10, 2) (backend/app/models/product.py:23) while the export
    # carries six decimals (PCON03 = 1.018028), so a 6dp source cost cannot
    # round-trip through the catalog column. Recorded so the next person does
    # not re-derive it; see numeric.unit_cost_decimal_places.
    unmatched_cost_hypothesis: "products.cost is Numeric(10,2); export carries 6dp"
    unmatched_cost_confirmed: false

  # ---------------------------------------------------------------------------
  # HEADER VS LINE. `No.` IS THE ONLY SAFE DISCRIMINATOR.
  #
  # The intuitive tests both fail on real rows:
  #   "Total is populated"    -> header PO0709 and PO0708 both carry Total
  #                              "0.00". Populated, and zero.
  #   "SubTotal is populated" -> line 1 of PO0709 carries SubTotal "0.00".
  #
  # Testing either for non-emptiness misclassifies a zero-valued document as a
  # line or a zero-valued line as a header, and a misclassified header row
  # becomes a phantom line with no product.
  #
  # `No.` is blank on every header row and 1..N on every line row, and it has no
  # zero-valued form. It is the discriminator.
  # source: measured on the 2026-09-02 exports.
  # ---------------------------------------------------------------------------
  line_discriminator:
    column: "No."
    header_when: blank
    line_when: integer
    rejected_alternatives:
      total_populated: "PO0709/PO0708 headers carry Total 0.00"
      subtotal_populated: "PO0709 line 1 carries SubTotal 0.00"

  # ---------------------------------------------------------------------------
  # DATES. Manila wall-clock, no zone in the file.
  #
  # The exports carry local wall-clock times with no offset. Asia/Manila
  # observes no DST (see timezone.observes_dst), so interpreting them as Manila
  # is unambiguous and never skips or repeats an hour.
  #
  # "Estimated Date of Arrival" is DATE-ONLY. It is stored as a date, not as a
  # midnight timestamp — a midnight timestamp implies a precision the file does
  # not have and would make a same-day ETA look like it preceded its own PO.
  # ---------------------------------------------------------------------------
  datetime_format: "%m/%d/%Y %H:%M"
  date_format: "%m/%d/%Y"
  timezone: "Asia/Manila"
  empty_is_null: true

  # ---------------------------------------------------------------------------
  # NUMERIC PRECISION.
  #
  # Unit costs carry SIX decimals in the file (PCON03 "Slurp & chew strawberry
  # flavor" = 1.018028). Storing them at 2dp silently rounds the source. Line
  # subtotals are stored to 4dp and header totals to 4dp.
  #
  # Quantities are NUMERIC, not integer. They are integral in the exports seen
  # so far, but per-gram products move in quantities that are counts of grams
  # (SH1 "Aji Mix" at 31,500) and the store domain already sells fractional
  # quantities (metrics.units_sold.integral: false). An integer column would
  # reject a fractional line rather than record it.
  # ---------------------------------------------------------------------------
  numeric:
    unit_cost_decimal_places: 6
    money_decimal_places: 4
    quantity_decimal_places: 4
    quantity_is_integral: false
    # Values are unquoted-decimal in both exports. A comma reaching a numeric
    # field can only be a thousands separator (the CSV is quoted, so a comma
    # inside a field is never a delimiter), so it is stripped before parsing.
    # Anything else still fails loudly rather than silently becoming a number.
    strip_thousands_separator: true

  # ---------------------------------------------------------------------------
  # FIELD TYPES. Applied by column ROLE, not by column header, so both exports
  # share one set of rules. Roles not listed here are text.
  # ---------------------------------------------------------------------------
  field_types:
    datetime: [created_at_source, completion_date, cancelled_date, shipped_date, received_date]
    date:     [estimated_arrival_date]
    decimal:  [ordered_qty, received_qty, unit_cost, subtotal, header_total]
    integer:  [line_no]

  # ---------------------------------------------------------------------------
  # UNITS ARE PER PRODUCT AND ARE NOT RECORDED IN THE FILE.
  #
  # movement.unit says `grams`, which is true of AJI BARN's inventory balances
  # and NOT true of these documents. In one transfer (ST2999) SH1 "Aji Mix"
  # moves 834 at PHP 0.80 — grams — while SH610 "Fuan Haw Flakes" moves 1 at
  # PHP 70.00 — a pack. Both are "Ordered Qty" in the same column of the same
  # document.
  #
  # CONSEQUENCE: a transfer quantity MUST NOT be labelled with a unit, and
  # quantities MUST NOT be summed across products. Summing 834 grams of Aji Mix
  # with 40 packs of Haw Flakes produces 874 of nothing. Tools group by product
  # or report value (PHP), which IS additive.
  # ---------------------------------------------------------------------------
  quantity_unit:
    recorded_in_export: false
    varies_by_product: true
    additive_across_products: false
    additive_measure: "subtotal (PHP)"

  # ---------------------------------------------------------------------------
  # INTEGRITY CHECKS. One raises, one flags.
  #
  # header_total_equals_line_subtotals RAISES. Verified exactly on ST2997: the
  # 32 line subtotals sum to 61,447.74, the header Total, INCLUDING the line
  # where 30 x 1.018028 = 30.54084 was written as 30.54. The header total is
  # built from ROUNDED line subtotals, so this holds to the centavo and a
  # failure means the file is malformed or a line was lost in parsing.
  #
  # subtotal_equals_qty_times_cost only FLAGS, with a tolerance. It fails
  # legitimately on that same rounding, so treating it as an error would reject
  # a correct file. It catches a genuinely inconsistent line without pretending
  # a rounded one is wrong.
  #
  # NEITHER CHECK REPAIRS ANYTHING. Both stored values are imported exactly as
  # exported; a check that rewrote a value would make the import a source of
  # numbers rather than a record of them.
  # ---------------------------------------------------------------------------
  integrity:
    # -------------------------------------------------------------------------
    # HEADER TOTAL vs SUM OF LINE SUBTOTALS.
    #
    # MEASURED 2026-09-02 over every export available:
    #   stock transfers  2,034 documents / 40,141 lines -> ZERO mismatches
    #   purchase orders    151 documents               -> 2 mismatches
    #
    # So it is an invariant of stock transfers and NOT of purchase orders. The
    # two failures are both genuine source inconsistencies, not parse errors:
    #
    #   PO0604  header 90,000.00, lines sum 0.00. Every one of its 13 lines has
    #           cost 0.00 — the costs were never entered — while the header
    #           carries a real total. Same shape as the vending zero-cost trap:
    #           0.00 means "not entered", not "free".
    #   PO0285  header 114,912.00, lines sum 114,890.00. Off by exactly 22.00.
    #
    # AN EARLIER VERSION OF THIS ENTRY SAID on_failure: raise, FULL STOP. That
    # was wrong, and wrong in the expensive direction: it rejected both PO
    # exports outright, so two bad documents out of 151 meant no procurement
    # data at all. A file-level refusal has to be reserved for a file that
    # cannot be TRUSTED, not one that contains a document somebody fat-fingered.
    #
    # THE DISCRIMINATOR IS LINE-NUMBER CONTIGUITY. The original fear was that a
    # mismatch means the parser lost a line. That is checkable: if the document's
    # line numbers run 1..N with no gap, nothing was lost and the disagreement is
    # in the source, so the document imports with header_total_reconciles = false
    # and a notice. If a line number is MISSING, a line really is unaccounted for
    # and the file is refused.
    #
    # Residual limitation, stated rather than hidden: a lost LAST line leaves
    # 1..N-1 contiguous and would be flagged rather than raised. Nothing in the
    # parser can drop a row silently (a real CSV reader either yields a row or
    # fails, and header/line classification is on `No.`), so this is a gap in the
    # guard, not a known failure.
    # -------------------------------------------------------------------------
    header_total_equals_line_subtotals:
      tolerance: 0.01
      on_failure_when_lines_contiguous: flag
      on_failure_when_lines_missing: raise
      flag_column: header_total_reconciles
      verified_on: "ST2997 (32 lines, 61447.74)"
      measured:
        stock_transfers: {documents: 2034, lines: 40141, mismatches: 0}
        purchase_orders: {documents: 151, mismatches: 2}
      known_mismatches:
        PO0604: "header 90000.00 vs lines 0.00 — all 13 line costs are 0.00, never entered"
        PO0285: "header 114912.00 vs lines 114890.00 — out by 22.00"
    subtotal_equals_qty_times_cost:
      on_failure: flag
      tolerance: 0.005
      flag_column: subtotal_consistent
      known_benign_cause: "line subtotals are rounded to 2dp from a 6dp unit cost"

  # ---------------------------------------------------------------------------
  # TEXT. Some product names are UTF-8 mis-decoded at export (mojibake), and
  # Notes fields contain embedded newlines and commas.
  #
  # NAMES ARE NEVER REPAIRED. A cp1252/UTF-8 round-trip would usually restore
  # the intended characters, but "usually" is a guess applied to a name that is
  # then indistinguishable from one that was correct. The raw string is stored
  # verbatim and the row is flagged, so a human can decide. The flag is a
  # detector, not a fixer.
  #
  # Notes must be read with a real CSV parser. A line-splitting reader breaks a
  # document in half at an embedded newline.
  # ---------------------------------------------------------------------------
  text:
    repair_mojibake: false
    mojibake_markers: ["Ã", "â€", "Â", "ï¿½", "�"]
    flag_column: name_mojibake
    decode: "utf-8"
    decode_errors: "surrogateescape"
    requires_real_csv_parser: true
    embedded_newlines_in: ["Notes"]

    # -------------------------------------------------------------------------
    # MEASURED 2026-09-02, all five exports (227 POs + 2,034 transfers,
    # 41,188 lines): NO mojibake is present. Every file decodes as clean UTF-8 —
    # zero bytes needed surrogateescape — and product names contain exactly two
    # non-ASCII characters, both intended:
    #     U+00E9 é  (25 occurrences)
    #     U+2019 '  (14 occurrences, right single quotation mark)
    #
    # The detector is KEPT even though it currently fires zero times. It costs
    # one substring scan per line, a future export may differ, and an unfired
    # detector is the cheapest thing in this file. What is recorded here is the
    # measurement, so that "product names are mis-decoded at export" is not
    # carried forward as a belief about data that does not show it.
    # -------------------------------------------------------------------------
    mojibake_found: 0
    mojibake_measured: "2026-09-02, all five exports, 41,188 lines"
    surrogateescape_bytes_found: 0

  # ---------------------------------------------------------------------------
  # NOTES ARE NOT PARSED INTO DATES. DECIDED 2026-09-02.
  #
  # 4 of the 6 POs in the sample carry a note of the form "Received August 26,
  # 2026" — and three of those four are still status Open. The note is very
  # often the only record of when goods actually arrived (see
  # purchase_orders.statuses and lead_time below).
  #
  # It is still free text written by staff, and turning it into a date is an
  # interpretation. The rule this file applies to store names — never fuzzy
  # match — applies with more force to a date that would then be used to compute
  # a lead time and reported as measured.
  #
  # The note is stored verbatim and surfaced as text. A row whose note LOOKS
  # like a received date is flagged so the volume is visible, but no date is
  # extracted. Flip this only on an explicit decision, and record the decision
  # here.
  # ---------------------------------------------------------------------------
  notes:
    parse_received_date: false
    detect_received_date_shape: true
    detection_regex: "(?i)\\breceived\\b"
    flag_column: notes_mentions_received
    decided: "2026-09-02"

  # ---------------------------------------------------------------------------
  # LOCATION ALIASES — THE CSV STRING IS THE KEY, AND stores.name IS NEVER READ.
  #
  # WHY AN EXPLICIT MAP RATHER THAN A NAME JOIN. The live stores table holds two
  # rows whose names differ ONLY by a "(1) " prefix:
  #
  #   6639efd54694700008d7ccc6   "(1) Aji Ichiban Food Products"   Rockwell, 65k txns
  #   668263b71c04d30007dbd150   "Aji Ichiban Food Products"       no trading history
  #
  # Any prefix-strip, LIKE, trim-and-compare or fuzzy match sends Rockwell's
  # transfers (ST2994 at PHP 45,913; ST2995 at PHP 21,730) to a store that has
  # never traded. An exact-string map is the only form that cannot do this.
  #
  # MATCHING IS EXACT AND LITERAL. No trimming, no case folding, no whitespace
  # normalisation. "(6) Aji Ichiban  OPUS" contains a DOUBLE SPACE and is
  # written here with it. A location string not present below is UNRESOLVED —
  # it never falls back to a looser match.
  #
  # source: ids from the live stores table via stores.json (ids are stable; that
  #   dump's NAMES predate the "(N) " rename and are not used here), plus
  #   stores.active_retail above for Shang, which postdates the dump.
  # resolves: the importer needs a location -> id mapping and the obvious one
  #   (join on stores.name) is the failure documented above.
  # ---------------------------------------------------------------------------
  locations:
    match: exact_string
    strip_whitespace: false
    case_fold: false
    fuzzy: false
    # HARD RULE: an unknown location NEVER creates a stores row and is NEVER
    # guessed at. It imports with a null FK, the raw string retained, and a
    # notice. A missing store is visible; a wrong one is not.
    on_unresolved: keep_raw_null_fk_and_notice
    create_store_row: false

    alias:
      "AJI BARN":                                    "667bde393126e50006c8058c"
      "(1) Aji Ichiban Food Products":               "6639efd54694700008d7ccc6"
      "(2) Aji Ichiban food products SM Fairview":   "668023c94721460006092609"
      "(3) Ajiichiban Food Products Greenhills":     "668a43f60fa9990007cfa158"
      "(4) Ajiichiban Food Products SM North Edsa":  "66cfff31aa7adf0007c9de41"
      "(5) Ajiichiban food products Magnolia":       "67612230a740d90007464e26"
      "(6) Aji Ichiban  OPUS":                       "68c5bb269da1d500073690c2"
      "(7) Ajiichiban SHANG":                        "69c73fcb277aa600076dfaaa"
      "Aji Packing":                                 "68a40bd8b79152000619e7d7"
      "AJI Disposal":                                "6699c88bd38fa400074ba3da"
      "AJI ONLINE":                                  "6680e5a3a8fc2d00071d07a9"
      # The two storefronts in stores.pending_retail. They have zero
      # transactions but they DO receive stock — 27 transfers across the
      # exports — so they resolve here even though they are not yet in
      # active_retail. Names matched exactly against stores.pending_retail.
      "Ajiichiban ROBINSONS super market lucky Chinatown": "694785f3c9a90d0007fc9232"
      "AJI ROBINSONS supermarket robinsons galleria":      "6982c9a9aa1210000783594d"
      # AJI CMG as a LOCATION receiving stock — the `stores` row. Note the
      # warning in the vending section: "AJI CMG" names two different things,
      # this store row and the Weimi vending business. A transfer or PO landing
      # here is stock arriving at the location, and must never be joined to the
      # vending domain.
      "AJI CMG":                                     "667bde0cd749a000079f4650"
      "Hello AJI vending":                           "693646be0abea30007b77334"
      # Read from the live stores table 2026-09-02. It is a real StoreHub
      # ObjectID and a location distinct from the two above — all three names
      # appear in the same export, so none is a rename of another.
      "AJI VENDO":                                   "69b6fb6d185092000783c8a4"
      # A CLOSED warehouse, and the one id here that is not a StoreHub
      # ObjectID — see stores.closed and migration i3j4k5l6m7n8 for why it is
      # deliberately not hex. Aliased so its 1,006 historical references resolve
      # instead of importing as a null FK. If StoreHub's real id for MACOPA ever
      # arrives, this line and the stores row change together.
      "AJI MACOPA":                                  "local-aji-macopa-wh-0001"

    # DELIBERATELY ABSENT FROM THE MAP. "Aji Ichiban Food Products" — the
    # unprefixed twin, 668263b71c04d30007dbd150 — is NOT aliased. It has no
    # trading history and nothing establishes what it is. If that exact string
    # ever appears in an export it must surface as unresolved rather than be
    # mapped to a store nobody can characterise.
    deliberately_unmapped:
      "Aji Ichiban Food Products": "668263b71c04d30007dbd150 — unprefixed twin of Rockwell; identity unestablished"

    # ---------------------------------------------------------------------------
    # PENDING — known locations with no id yet. These import UNRESOLVED, exactly
    # like any unknown string. They are listed so the notice can say what the
    # location is rather than only that it is unknown.
    # ---------------------------------------------------------------------------
    # ---------------------------------------------------------------------------
    # PENDING is now EMPTY, and that is the finished state.
    #
    # Every location appearing in any export resolves to a store id. AJI MACOPA
    # (closed, local id) and AJI VENDO (real ObjectID, read from the live table
    # 2026-09-02) were the last two. The key is kept because the mechanism is
    # still needed: a location StoreHub adds tomorrow lands here with an
    # explanation rather than as a bare unknown string.
    #
    # Verified 2026-09-02 against all five exports: 0 unresolved locations.
    # ---------------------------------------------------------------------------
    pending: {}

  # ---------------------------------------------------------------------------
  # PURCHASE ORDERS
  # ---------------------------------------------------------------------------
  purchase_orders:
    document_key_column: "P.O ID"
    document_key_example: "PO0710"
    source_table: purchase_orders
    lines_table: purchase_order_lines
    column_count: 22
    columns:
      - "P.O ID"
      - "Created Date"
      - "Estimated Date of Arrival"
      - "Completion Date"
      - "Supplier"
      - "Target Store"
      - "No."
      - "Product Name"
      - "SKU"
      - "Serial No."
      - "Category"
      - "Ordered Quantity"
      - "Received Quantity"
      - "Cost (RM)"
      - "SubTotal (RM)"
      - "Total (RM)"
      - "Status"
      - "Notes"
      - "Requested By"
      - "Cancelled By"
      - "Cancelled Date"
      - "Completed By"

    # -------------------------------------------------------------------------
    # ROLE -> COLUMN HEADER. The parser addresses columns by ROLE and never by a
    # literal header string, so a renamed export column is a one-line edit here
    # rather than a code change (and an unrecognised header fails loudly against
    # the `columns` list above rather than silently reading blanks).
    #
    # line_fields are read from LINE rows. Every other role is read from the
    # document's HEADER row. Line rows repeat most header columns; reading them
    # from the header keeps one value per document rather than N identical ones
    # that could disagree.
    # -------------------------------------------------------------------------
    field_map:
      external_id:             "P.O ID"
      created_at_source:       "Created Date"
      estimated_arrival_date:  "Estimated Date of Arrival"
      completion_date:         "Completion Date"
      supplier_name:           "Supplier"
      target_location_raw:     "Target Store"
      status:                  "Status"
      notes:                   "Notes"
      header_total:            "Total (RM)"
      requested_by:            "Requested By"
      cancelled_by:            "Cancelled By"
      cancelled_date:          "Cancelled Date"
      completed_by:            "Completed By"
      line_no:                 "No."
      product_name_raw:        "Product Name"
      sku_raw:                 "SKU"
      serial_no:               "Serial No."
      category_raw:            "Category"
      ordered_qty:             "Ordered Quantity"
      received_qty:            "Received Quantity"
      unit_cost:               "Cost (RM)"
      subtotal:                "SubTotal (RM)"
    line_fields:
      [line_no, product_name_raw, sku_raw, serial_no, category_raw,
       ordered_qty, received_qty, unit_cost, subtotal]

    # SUPPLIER IS FREE TEXT AND THERE IS NO SUPPLIER MASTER. Observed values
    # include "Dried Fruits DF001", "Supplies" and "Do rei me" — a product line,
    # a category and a company. The raw string is stored and never deduplicated,
    # normalised or fuzzy-grouped: merging "Supplies" with "Store supplies"
    # would invent a supplier that placed neither order.
    supplier_is_free_text: true
    supplier_master_exists: false
    deduplicate_suppliers: false

    # -------------------------------------------------------------------------
    # STATUS. "Open" DOES NOT MEAN "NOT RECEIVED".
    #
    # Measured on the sample: PO0706 (PHP 327,320), PO0708 and PO0709 are all
    # status Open with notes reading "Received August 26, 2026" / "Received
    # September 1, 2026". The goods arrived; nobody completed the PO.
    #
    # CONSEQUENCE: an "on order" or "outstanding" figure built on
    # status = 'Open' is wrong by at least PHP 327,320 in a six-document sample.
    # Tools must report Open as "not completed in StoreHub", never as
    # "not yet received", and must surface the note count alongside it.
    # -------------------------------------------------------------------------
    statuses:
      Completed: "marked complete in StoreHub"
      Open:      "not marked complete in StoreHub. NOT a statement about receipt."
      Cancelled: "cancelled"
    cancelled_statuses: ["Cancelled"]
    open_means_not_received: false
    open_but_received_observed: true

    # -------------------------------------------------------------------------
    # RECEIVED QUANTITY IS SPARSE AND IS NEVER RECONCILED TO ORDERED.
    #
    # It is blank on Open POs and 0 on every line of Completed POs PO0707 and
    # PO0705 — both of which carry notes saying the goods were received. It can
    # also EXCEED ordered (12 ordered, 120 received, user-verified).
    #
    # Both numbers import exactly as exported. The importer never adjusts one to
    # the other, never infers received from status, and never treats blank as
    # zero — blank means "not recorded", zero means "recorded as zero", and
    # collapsing them would erase the difference. Lines where the two differ are
    # flagged so the divergence is countable.
    # -------------------------------------------------------------------------
    received_quantity:
      reconcile_to_ordered: false
      blank_is_zero: false
      may_exceed_ordered: true
      flag_column: received_differs_from_ordered

    # -------------------------------------------------------------------------
    # LEAD TIME. WHAT IS AND IS NOT MEASURABLE.
    #
    # Three intervals are computable from the columns; only one is honest, and
    # it does not mean what "lead time" usually means.
    #
    #   created -> estimated_arrival   A PLANNED date, not an observation.
    #   created -> completion_date     SYSTEM COMPLETION LATENCY. When someone
    #                                  clicked Complete. PO0710 was created
    #                                  16:34 and completed 16:36 — two minutes —
    #                                  with the note "Fixing inventory. Late POS
    #                                  for samploc", i.e. a backdated
    #                                  administrative correction, not a delivery.
    #                                  PO0707 shows 2d21h while its own note says
    #                                  the goods arrived on the creation day.
    #   created -> actual receipt      NOT COMPUTABLE. The receipt date exists
    #                                  only in free-text Notes, which are not
    #                                  parsed (see notes.parse_received_date).
    #
    # So DELIVERY lead time is not answerable and tools must refuse it. What is
    # answerable is completion latency, and it must be labelled as such wherever
    # it is reported. Reporting it as "supplier lead time" would put a number on
    # a supplier's performance that actually measures a staff member's data
    # entry.
    # -------------------------------------------------------------------------
    lead_time:
      completion_latency:
        supported: true
        from: created_at
        to: completion_date
        unit: days
        means: "time until the PO was marked complete in StoreHub"
        does_not_mean: "time until goods arrived"
        label_mandatory: true
      delivery_lead_time:
        supported: false
        reason: >
          The actual receipt date is recorded only in a free-text Notes field,
          which is deliberately not parsed. Nothing else in the export observes
          arrival: Completion Date is a system event and Estimated Date of
          Arrival is a plan.

  # ---------------------------------------------------------------------------
  # STOCK TRANSFERS
  # ---------------------------------------------------------------------------
  stock_transfers:
    document_key_column: "S.T ID"
    document_key_example: "ST3001"
    source_table: stock_transfers
    lines_table: stock_transfer_lines
    column_count: 20
    columns:
      - "S.T ID"
      - "Created Date"
      - "Shipped Date"
      - "Received Date"
      - "Source Store"
      - "Target Store"
      - "No."
      - "Product Name"
      - "SKU"
      - "Serial No."
      - "Category"
      - "Ordered Qty"
      - "Cost (RM)"
      - "SubTotal (RM)"
      - "Total (RM)"
      - "Status"
      - "Sent By"
      - "Cancelled By"
      - "Cancelled Date"
      - "Received By"

    # See purchase_orders.field_map for how this is used.
    field_map:
      external_id:           "S.T ID"
      created_at_source:     "Created Date"
      shipped_date:          "Shipped Date"
      received_date:         "Received Date"
      source_location_raw:   "Source Store"
      target_location_raw:   "Target Store"
      status:                "Status"
      header_total:          "Total (RM)"
      sent_by:               "Sent By"
      cancelled_by:          "Cancelled By"
      cancelled_date:        "Cancelled Date"
      received_by:           "Received By"
      line_no:               "No."
      product_name_raw:      "Product Name"
      sku_raw:               "SKU"
      serial_no:             "Serial No."
      category_raw:          "Category"
      ordered_qty:           "Ordered Qty"
      unit_cost:             "Cost (RM)"
      subtotal:              "SubTotal (RM)"
    line_fields:
      [line_no, product_name_raw, sku_raw, serial_no, category_raw,
       ordered_qty, unit_cost, subtotal]

    # -------------------------------------------------------------------------
    # STATUS DECIDES WHETHER GOODS MOVED. MOST OF THEM DID NOT.
    #
    # A transfer with status Created has no Shipped Date and no Received Date:
    # it is a document, not a movement. In the sample window the MAJORITY of
    # transfers are Created, including ST2989 at PHP 159,184.70 — the single
    # largest document in the file, and nothing left the warehouse.
    #
    # CONSEQUENCE: summing transfer quantities without a status filter reports
    # goods that are still sitting where they started. moved_statuses is the
    # default scope for any quantity-grain or value-grain movement question, and
    # a tool answering one MUST report how much value sits in the excluded
    # statuses rather than silently dropping it.
    #
    # Document-grain questions ("how many transfers were raised") legitimately
    # count all statuses — that is a different grain and says so.
    # -------------------------------------------------------------------------
    statuses:
      Created:   "raised, not shipped. Goods have NOT moved."
      Shipped:   "shipped, not yet received. Goods have left the source."
      Completed: "shipped and received."
      Cancelled: "cancelled."
    cancelled_statuses: ["Cancelled"]
    moved_statuses: ["Shipped", "Completed"]
    received_statuses: ["Completed"]
    default_scope_for_quantity_questions: moved_statuses
    unmoved_value_notice_mandatory: true

    # Both ends are named, so destination attribution IS answerable from these
    # records — unlike the snapshot-differencing path, where it is not. See
    # movement.destination_attribution, which is scoped by basis.
    names_source_and_destination: true

  # ---------------------------------------------------------------------------
  # IDEMPOTENCY. A RE-IMPORT CONVERGES TO THE FILE; IT DOES NOT ACCUMULATE.
  #
  # Upsert each document on external_id, upsert its lines on (document, line_no),
  # then delete lines of THOSE documents whose line_no is absent from this file.
  # A document that shrinks from 40 lines to 38 ends up with 38.
  #
  # DOCUMENTS ABSENT FROM THE FILE ARE NEVER TOUCHED. These exports are
  # date-windowed, so a document's absence means "outside this window", not
  # "deleted". Deleting on absence would empty the table on the first narrow
  # export.
  #
  # line_no, not SKU, is the line identity: a document may legitimately list the
  # same SKU twice, and a SKU-keyed upsert would silently merge two real lines.
  #
  # The whole file imports in ONE transaction. A file that fails halfway leaves
  # nothing behind.
  # ---------------------------------------------------------------------------
  idempotency:
    document_key: external_id
    line_key: [document_id, line_no]
    delete_missing_lines: true
    delete_scope: documents_present_in_this_file
    delete_absent_documents: false
    single_transaction: true

  # ---------------------------------------------------------------------------
  # IMPORT LEDGER. Every import records what it read and what it could not
  # resolve, so a number's provenance reaches back to a file and an uploader.
  # ---------------------------------------------------------------------------
  imports:
    source_table: storehub_imports
    records:
      - filename
      - sha256
      - byte_size
      - uploaded_by
      - kind
      - parser_version
      - document/line counts seen, inserted, updated
      - lines deleted
      - unresolved location count
      - unmatched and ambiguous SKU counts
      - notices
    # A byte-identical re-import is ALLOWED and converges. It is recorded as its
    # own row rather than rejected: "someone re-ran this import" is itself a
    # fact worth holding, and a rejection would hide it.
    reject_duplicate_hash: false


# =============================================================================
# SUPPLIERS, PURCHASE ORDERS, LEAD TIMES, COST HISTORY
#
# REWRITTEN 2026-09-02. All three subjects were `supported: false` because none
# of the data existed. The StoreHub CSV import supplied it: 227 purchase orders
# with 1,047 lines, each carrying a supplier, a target location, a product, a
# quantity, a unit cost and three dates.
#
# THE ORIGINAL SURVEY IS PRESERVED BELOW under `survey_2026_09_01`, not deleted.
# It records what the database held before the import and is the reason these
# subjects were refused for so long; deleting it would make those refusals look
# arbitrary in hindsight. Everything above it is the current state.
#
# WHAT DID NOT CHANGE. Two things are still unsupported and are NOT quietly
# upgraded by the arrival of purchase orders:
#   - DELIVERY lead time. Nothing records when goods actually arrived.
#   - STORE-SIDE PROFIT. Still no cost captured per sales line.
# Both are stated below with their reasons.
# =============================================================================
suppliers:
  surveyed: "2026-09-01"
  resurveyed: "2026-09-02, after the StoreHub import"
  any_supplier_data: true

  # ---------------------------------------------------------------------------
  purchase_orders:
    supported: true
    since: "2026-09-02"
    source_table: purchase_orders
    lines_table: purchase_order_lines
    tool: "tools/purchasing.py get_purchasing()"
    definitions: purchasing
    measured:
      documents: 227
      lines: 1047
      exports: 2
      window: "the two 2026-09-02 exports, which are disjoint"

    # There is NO supplier master. `supplier` is a free-text string on the PO.
    # Observed values include "Dried Fruits DF001", "Supplies" and "Do rei me" —
    # a product line, a category and a company. Suppliers are grouped by that raw
    # string and NEVER deduplicated or normalised: merging "Supplies" into
    # "Store supplies" would invent a supplier that placed neither order.
    supplier_master_exists: false
    supplier_is_free_text: true

    caveats:
      - "12 of 227 POs have a header total disagreeing with their own lines; value is summed from lines (purchasing.value_basis)"
      - "'Open' does not mean 'not received' - 8 Open POs carry notes saying the goods arrived"
      - "received quantity is sparse, sometimes exceeds ordered, and is never reconciled to it"

  # ---------------------------------------------------------------------------
  lead_times:
    # PARTIAL, and the distinction is the whole point.
    supported: partial
    completion_latency:
      supported: true
      measure: purchasing.measures.completion_lead_days
      means: "days from PO creation to being marked complete in StoreHub"
      does_not_mean: "days until goods arrived"
      label_mandatory: true
      # Why the label is mandatory rather than advisory: PO0710 was created
      # 16:34 and completed 16:36 - two minutes - under a note reading "Fixing
      # inventory. Late POS for samploc". Reported as "supplier lead time", that
      # is a claim about a supplier which actually measures data entry.
    delivery:
      supported: false
      reason: >
        Nothing observes arrival. Completion Date is a system event, Estimated
        Date of Arrival is a plan, and the real receipt date exists only as
        prose inside a free-text Notes field which is deliberately not parsed
        (storehub.notes.parse_received_date: false).
      would_require: "a receipt timestamp captured against the PO line"
    # The old global config value is still there and still meaningless.
    algorithm_settings_lead_time_days: 0
    algorithm_settings_note: "single global integer, still 0; not per-supplier, per-product or per-store"

  # ---------------------------------------------------------------------------
  last_cost:
    supported: true
    since: "2026-09-02"
    tool: "tools/cost_history.py get_cost_history(sku)"
    definitions: cost_history
    reason: >
      PO lines carry a dated unit cost per SKU, so cost genuinely has a history
      now rather than only a current scalar. It is a SERIES, not a single number,
      and it comes from three sources that mean different things - see
      cost_history.bases. products.cost remains available from
      tools/products.py get_product() as the current catalog value.
    # The old objection - that a second accessor would create a second definition
    # of cost - is answered by labelling the basis on every row rather than by
    # refusing the question.
    supersedes_reason: >
      Previously false on the grounds that "last cost" could only mean "current
      cost". That was true while products.cost was the only source. It no longer
      is.
    caveats:
      - "zero cost means NOT ENTERED, not free; flagged and excluded from statistics"
      - "transfer valuations are not purchase prices and are never blended with them"
      - "products.updated_at dates the ROW, not the cost - 15 distinct dates across the catalog"

  # ---------------------------------------------------------------------------
  # THE ORIGINAL SURVEY, PRESERVED. What the database held on 2026-09-01, before
  # the import. Kept so the earlier refusals stay legible and nobody re-runs the
  # search.
  #
  # Method: all 38 base tables and 8 views searched by NAME for
  #   supplier|vendor|purchase|po|receipt|receiv|procure|inbound|delivery|lead|order
  # and then EVERY column searched by concept for
  #   supplier|vendor|purchase|lead_time|on_order|receiv|procure|reorder|moq|
  #   incoming|cost
  # ---------------------------------------------------------------------------
  survey_2026_09_01:
    any_supplier_data: false
    purchase_orders:
      supported: false
      reason: >
        No suppliers, vendors, purchase_orders, po_lines, receipts or deliveries
        table exists. The only name matches were the vending order tables, which
        are CUSTOMER purchases from machines, not orders placed on a supplier.
      evidence:
        shipment_plans_on_order: "122,207 rows, every one is 0 (min 0, max 0, sum 0) - never populated"
        store_pipeline_on_order_units: "table has 0 rows"
        warehouse_inventory: "0 rows - the only receiving-shaped table, empty"
    lead_times:
      supported: false
      reason: >
        One global integer existed and it was zero. Not per-supplier, not
        per-product, not per-store. Lead time could not be MEASURED either:
        nothing recorded when an order was placed or when goods arrived.
      evidence:
        algorithm_settings_lead_time_days: 0
        algorithm_settings_rows: 1
        algorithm_settings_updated_at: "2026-05-11"
        observable_from_data: false
    last_cost:
      supported: false
      reason: >
        products.cost is a single current scalar per product with NO history, so
        "last cost" could only mean "current cost".
      evidence:
        products_total: 3678
        products_with_cost: 3306
        products_cost_zero: 264
        products_cost_null: 372
        history_tables: "none - no audit/history/log/version table exists (only alembic_version)"
        products_updated_at: "row-level, not cost-level; only 15 distinct dates across the whole catalog"
        new_transaction_items_has_cost_column: false
      vending_cost_is_a_history: false

  # ---------------------------------------------------------------------------
  store_profit_supported: false
  store_profit_reason: >
    No cost is captured per line. The documented formula applies current
    products.cost to historical quantities, valuing past sales at today's cost,
    and treats the 264 zero-cost and 372 null-cost products as pure margin.
    There is no cost history to correct it with. tools/sales.py has no profit
    metric by design.
  store_profit_do_not_reintroduce: true

  # Vending profit IS computable — cost is captured on the line — but it is
  # overstated on 72.7% of lines where the cost was never entered. See
  # vending.profit_overstated_pct; that metric carries a mandatory flag.
  vending_profit_supported: true
  vending_profit_caveat: "overstated on 72.7% of lines; flag is mandatory"

  # ---------------------------------------------------------------------------
  # What a real procurement integration would have to provide before any of the
  # three subjects above becomes answerable. Kept here so the gap is a
  # specification rather than a rediscovery.
  # ---------------------------------------------------------------------------
  required_to_support:
    - "a supplier/vendor master (id, name, terms)"
    - "purchase orders with a placed timestamp, supplier, product, quantity and unit cost"
    - "goods receipts with a received timestamp and quantity, linked to the PO line"
    - "line-level cost captured on new_transaction_items at time of sale, or a dated product cost history"
  # With PO placed-time and receipt-time, lead time becomes measurable rather
  # than configured, and warehouse receipts stop being invisible — which is also
  # the missing half of the movement problem (see movement.recorded_ledger_exists).


# =============================================================================
# PURCHASING — questions about purchase orders
#
# Built on the imported StoreHub PO export (see storehub.purchase_orders).
# Everything here became answerable only when that import existed; before it,
# suppliers.purchase_orders.supported was false.
# =============================================================================
purchasing:
  source_table: purchase_orders
  lines_table: purchase_order_lines
  currency: PHP

  # ---------------------------------------------------------------------------
  # VALUE COMES FROM THE LINES, NEVER FROM THE HEADER TOTAL.
  #
  # 12 of 227 purchase orders carry a header total that disagrees with their own
  # lines, sometimes enormously: PO0604 says 90,000.00 over 13 lines that sum to
  # 0.00, PO0575 says 400,000.00 against 200,000.00 of lines. No stock transfer
  # does this in 2,034 documents.
  #
  # The lines are the safer basis: they are itemised, they carry the quantity and
  # unit cost that produced them, and they are what a product- or category-level
  # answer must use anyway. Using the header for a total and the lines for a
  # breakdown would make the two disagree inside one answer.
  #
  # Documents whose header disagrees are still IMPORTED and still COUNTED. The
  # discrepancy is surfaced via purchase_orders.header_total_reconciles and a
  # mandatory notice, never silently preferred away.
  # ---------------------------------------------------------------------------
  value_basis: lines
  value_basis_column: "pol.subtotal"
  header_total_is_authoritative: false
  header_mismatch_notice_mandatory: true

  measures:
    po_count:
      description: "Number of purchase orders. Document grain."
      sql: "COUNT(DISTINCT po.id)"
      unit: purchase_orders
      grain: document
      valid_group_by: [supplier, store, status, day, week, month]
    ordered_value:
      description: "Value ordered, summed from line subtotals. The default measure."
      sql: "SUM(pol.subtotal)"
      unit: PHP
      grain: line
      valid_group_by: [supplier, store, status, day, week, month, product, category]
    ordered_qty:
      description: "Quantity ordered. NOT additive across products — see additive_across_products."
      sql: "SUM(pol.ordered_qty)"
      unit: mixed
      grain: line
      additive_across_products: false
      valid_group_by: [supplier, store, status, day, week, month, product, category]
    received_qty:
      description: "Quantity recorded as received. Sparse; never reconciled to ordered."
      sql: "SUM(pol.received_qty)"
      unit: mixed
      grain: line
      additive_across_products: false
      coverage_flag_mandatory: true
      valid_group_by: [supplier, store, status, day, week, month, product, category]
    completion_lead_days:
      description: >
        Mean days from creation to the PO being marked complete in StoreHub.
        SYSTEM COMPLETION LATENCY, NOT DELIVERY TIME. See
        storehub.purchase_orders.lead_time — PO0710 was created and completed two
        minutes apart as a backdated correction, and PO0707 shows 2d21h while its
        own note says the goods arrived on the creation day.
      sql: "AVG(EXTRACT(EPOCH FROM (po.completion_date - po.created_at_source)) / 86400.0)"
      unit: days
      grain: document
      label_mandatory: "system completion latency, not delivery time"
      requires: "po.completion_date IS NOT NULL"
      valid_group_by: [supplier, store, day, week, month]

  # Quantities mix units across products (grams for per-gram items, packs for
  # others — see storehub.quantity_unit), so a quantity total is only meaningful
  # within one product. Value is the additive measure.
  quantity_additive_across_products: false

  group_expressions:
    supplier: "COALESCE(NULLIF(po.supplier_name, ''), 'Unknown supplier')"
    store:    "po.target_store_id"
    status:   "po.status"
    product:  "pol.product_id"
    category: "COALESCE(NULLIF(pol.category_raw, ''), 'Uncategorized')"
    day:      "date_trunc('day',   (po.created_at_source AT TIME ZONE 'Asia/Manila'))::date"
    week:     "date_trunc('week',  (po.created_at_source AT TIME ZONE 'Asia/Manila'))::date"
    month:    "date_trunc('month', (po.created_at_source AT TIME ZONE 'Asia/Manila'))::date"

  date_column: "po.created_at_source"

  # ---------------------------------------------------------------------------
  # STATUS. 'Open' IS NOT 'NOT RECEIVED'. Measured: 8 of the 151 POs in the main
  # export are Open with notes saying the goods arrived. A tool reporting Open as
  # outstanding value must attach the caveat.
  # ---------------------------------------------------------------------------
  cancelled_statuses: ["Cancelled"]
  exclude_cancelled_by_default: true
  open_is_not_outstanding: true
  open_notice_mandatory: true

  # Not answerable. The receipt date lives only in free-text notes, which are
  # deliberately not parsed (storehub.notes.parse_received_date: false).
  delivery_lead_time_supported: false
  delivery_lead_time_refusal: >
    Delivery lead time is not answerable from this data. Nothing records when
    goods arrived: Completion Date is when the PO was marked complete in
    StoreHub (PO0710's is two minutes after creation, on a backdated
    correction), Estimated Date of Arrival is a plan, and the actual receipt
    date appears only inside a free-text Notes field that is deliberately not
    parsed. What IS available is completion latency — ask for
    completion_lead_days, which measures the paperwork, not the supplier.


# =============================================================================
# COST HISTORY — its own grain, and three sources that must never be blended
# =============================================================================
cost_history:
  description: >
    Unit cost for one SKU over time. The grain is (sku, source document, date,
    unit cost) — one row per document line, not one row per product.

  # ---------------------------------------------------------------------------
  # THREE BASES, THREE MEANINGS. They are returned as separate labelled series
  # and are NEVER averaged, unioned into one trend, or compared as though they
  # were the same number.
  #
  #   purchase_order      what a SUPPLIER charged, on a dated PO line.
  #   transfer_valuation  what a stock transfer VALUED the goods at internally.
  #                       This is not a purchase price and does not become one by
  #                       sitting in the same column.
  #   current_catalog     products.cost — a single current scalar with no
  #                       history, dated only by products.updated_at, which is
  #                       row-level and moves for unrelated edits.
  #
  # Averaging a supplier price with an internal valuation produces a number that
  # is neither, and it would look like a cost trend.
  # ---------------------------------------------------------------------------
  bases:
    purchase_order:
      source_table: purchase_order_lines
      means: "what a supplier charged"
      date_column: "po.created_at_source"
      authoritative_for_cost: true
    transfer_valuation:
      source_table: stock_transfer_lines
      means: "internal valuation on a stock transfer, NOT a purchase price"
      date_column: "st.created_at_source"
      authoritative_for_cost: false
    current_catalog:
      source_table: products
      means: "the single current cost scalar, no history"
      date_column: "p.updated_at"
      date_is_reliable: false
      date_caveat: >
        products.updated_at is row-level, not cost-level, and moves when any
        column on the product changes. Only 15 distinct dates exist across the
        whole catalog, so it dates the ROW, not the cost.
      authoritative_for_cost: false

  never_blend_bases: true
  never_average_across_bases: true

  # ---------------------------------------------------------------------------
  # ZERO COST MEANS "NOT ENTERED", NOT "FREE". KF27 "aji hellboy plum" moves on
  # transfer after transfer at 0.00, and PO0604 carries 13 lines all at 0.00
  # under a 90,000.00 header. A cost series that silently includes zeros reports
  # a collapsing price for an item whose price was simply never typed in.
  # Zero-cost rows are returned, flagged, and excluded from any min/max/mean.
  # ---------------------------------------------------------------------------
  zero_cost_means: not_entered
  zero_cost_excluded_from_statistics: true
  zero_cost_flag: cost_not_entered

  # SKU matching here is the IMPORT rule, not the human rule: case-sensitive,
  # because TKY28 and Tky28 are different products and blending their cost
  # histories would invent a price series for neither.
  sku_match: case_sensitive
  sku_match_ref: products.sku.import_match


# =============================================================================
# THE MORNING BRIEF — what "changed since yesterday" is allowed to mean
#
# A brief is the shape most likely to lie by omission: it is short, it is read
# in a hurry, and every source it touches has a different age. So the rules for
# what counts as a change, what is worth mentioning, and which sources are too
# stale to speak all live here rather than in the tool.
# =============================================================================
brief:

  # ---------------------------------------------------------------------------
  # SALES: COMPARE LIKE WITH LIKE, WHICH IS NOT YESTERDAY vs THE DAY BEFORE.
  #
  # MEASURED 2026-09-03 over 120 closed days, company-wide net sales:
  #     vs previous DAY            median 21.3%   p75 62.2%   p90 77.0%
  #     vs same WEEKDAY last week  median 12.5%   p75 20.0%   p90 34.3%
  #
  # And the weekday cycle is enormous:
  #     Mon 170,492   Tue 183,048   Wed 200,510   Thu 217,803
  #     Fri 258,812   Sat 430,765   Sun 504,300
  #
  # Sunday averages nearly THREE TIMES Monday. A brief built on the previous day
  # would report a catastrophe every Monday (-66% by construction) and a triumph
  # every Saturday, and that cycle would drown every real signal. Do not
  # "simplify" this back to day-over-day.
  # ---------------------------------------------------------------------------
  sales_vs_same_weekday:
    comparison: same_weekday_last_week
    baseline_offset_days: 7
    comparison_rejected: previous_day
    comparison_rejected_reason: >
      Day-over-day swings a median 21.3% against 12.5% for the same weekday a
      week earlier, and Sunday averages 3x Monday, so the sign of a day-over-day
      change is mostly a function of which day it is.

    # BOTH conditions must hold. They nearly coincide when yesterday is normal;
    # the absolute floor only bites when the BASELINE was unusually low, where a
    # large percentage describes a small amount of money. Fairview moving from a
    # PHP 5,000 baseline to PHP 7,000 is +40% and PHP 2,000 — under its floor,
    # so it stays out of the brief. Without the floor the smallest store would
    # dominate every morning.
    pct_threshold: 30.0
    absolute_floor_fraction: 0.25

    # ---------------------------------------------------------------------
    # WHAT THESE THRESHOLDS ACTUALLY PRODUCE. Measured 2026-09-03 by replaying
    # 143 closed days across the 7 active stores:
    #
    #   pct >= 20%, floor 20% of median -> 3.3 stores/day, quiet mornings   0/143
    #   pct >= 30%, floor 25% of median -> 2.2 stores/day, quiet mornings  13/143   <- CONFIGURED
    #   pct >= 35%, floor 30% of median -> 1.7 stores/day, quiet mornings  24/143
    #
    # WHY NOT 20%. The per-store week-over-week median swing is 18.9%-26.2%, so a
    # 20% threshold is roughly ordinary noise BY CONSTRUCTION: it named about half
    # the estate every single day and produced ZERO quiet mornings in 143 days. A
    # brief that always fires teaches people to stop reading it, and the day
    # something genuinely breaks it looks like every other day.
    #
    # 30% clears the per-store noise band and buys roughly one quiet morning a
    # fortnight. Those quiet mornings are the point: they are what makes a
    # non-quiet one mean something. Raising it further is a judgement about how
    # much silence is acceptable, not a technical fix — the numbers above are
    # here so that judgement is made with evidence rather than by feel.
    #
    # Changed from 20/0.20 to 30/0.25 on 2026-09-03 after measuring the above.
    # ---------------------------------------------------------------------
    signal_rate_measured: "2026-09-03, 143 closed days, 7 stores"
    signal_rate_stores_per_day: 2.2
    signal_rate_quiet_mornings: 13
    signal_rate_days_measured: 143

    # The floor is a FRACTION OF THAT STORE'S OWN MEDIAN DAY, computed at run
    # time from a trailing window — never a frozen number per store. A hardcoded
    # median decays silently as the business changes; a rule does not.
    #
    # Reference values measured 2026-09-03 (for regression, NOT inputs):
    #   Rockwell 55,603  OPUS 42,233  Greenhills 34,601  Shang 28,832
    #   Magnolia 27,050  North Edsa 22,431  Fairview 20,102
    # ...which put the floor between roughly PHP 4,000 and PHP 11,100.
    median_lookback_days: 90
    median_is_computed_at_runtime: true

  # ---------------------------------------------------------------------------
  # STOCK: A TRANSITION, NEVER A LEVEL.
  #
  # 87.4% of inventory rows are already out of stock, so "how many are out" is
  # not news and never will be. What changed is the crossing.
  #
  # Negative on-hand counts as out (inventory.states.out_of_stock is <= 0), so
  # the transition is positive -> non-positive.
  #
  # The two dates compared are the two most recent SNAPSHOT DAYS, not literally
  # yesterday and the day before: coverage has gaps (AJI BARN has 148 snapshot
  # days across a 162-day span). The brief reports which two dates it actually
  # used, and says so when they are not consecutive.
  # ---------------------------------------------------------------------------
  stock_crossed_out:
    transition: positive_to_nonpositive
    compare: two_most_recent_snapshot_days
    gap_notice_mandatory: true
    # low_stock is not available as a brief item and will not become one until
    # warning_stock is populated: it matches zero rows on 100% of inventory.
    low_stock_available: false

  # ---------------------------------------------------------------------------
  # DEAD STOCK: "CROSSED 30 DAYS WITH NO SALE" — an event, not an artefact.
  #
  # A product does not become dead because something happened; it becomes dead
  # because time passed. Comparing yesterday's dead list to today's would report
  # the window sliding. So the item is the CROSSING: still held, no sale in the
  # window, and the last sale fell out of the window overnight.
  #
  # 53.3% of held products are already dead, so the standing list is not news
  # either. Retail scope only — AJI BARN quantities are dispatch counters, not
  # stock (dead_stock.barn_excluded_reason).
  # ---------------------------------------------------------------------------
  newly_dead:
    window_days: 30
    framing: crossed_30_days_without_a_sale
    held_predicate_ref: dead_stock.stock_predicate
    scope_ref: dead_stock.scope

  # A brief nobody finishes reading is a brief that failed.
  max_items_per_section: 8

  # ---------------------------------------------------------------------------
  # FRESHNESS. THE BRIEF NAMES EVERY SOURCE, INCLUDING THE ONES IT CANNOT USE.
  #
  # Measured 2026-09-03, and the spread is the whole problem: the sources a
  # brief would naturally mix are between 0 and 64 days old.
  #
  #   transactions          0 d    current
  #   inventory_snapshots   1 d    current
  #   vending lines         1 d    current
  #   vending_aisles       29 d    stale; cannot be date-filtered at all
  #   stock_transfers      64 d    FROZEN — a static CSV import
  #   purchase_orders      64 d    FROZEN — a static CSV import
  #
  # A brief that silently omits purchasing reads as "nothing happened in
  # purchasing". Omission is the lie a brief tells most easily, so a stale or
  # frozen source is reported AS AN ITEM, with its age and why it is silent.
  # ---------------------------------------------------------------------------
  freshness:
    max_age_days:
      transactions: 2
      inventory_snapshots: 2
      vending_lines: 2
      vending_aisles: 7
      stock_transfers: 2
      purchase_orders: 2
    stale_policy: state_explicitly
    frozen_sources: [stock_transfers, purchase_orders]
    frozen_reason: >
      Loaded once from a StoreHub CSV export. They cannot change until someone
      imports again, so "since yesterday" is not a question they can answer.

  # ---------------------------------------------------------------------------
  # EMPTY IS NOT QUIET. A section with nothing in it must say WHICH it is:
  # nothing crossed the threshold, or the data never arrived. Those look
  # identical on a phone at 6am and mean opposite things.
  # ---------------------------------------------------------------------------
  empty_section_must_distinguish: true

  # At 06:00 Manila yesterday closed six hours ago. Sync lag is 0-1 days
  # (tests/golden.py MAX_SYNC_LAG_DAYS = 2), so yesterday is normally complete
  # but can still be settling. The brief reports the newest transaction it saw
  # so the reader can judge for themselves.
  report_newest_transaction: true


# =============================================================================
# NOTICE FINGERPRINTS
#
# Every tool can attach meta.notice when a result is not what it appears — an
# empty list that means "not configured", a figure that is overstated, a SKU
# that is three products. agent/loop.py refuses to finish an answer while an
# unsurfaced notice is pending.
#
# Verifying "surfaced" needs a check. These fingerprints are that check, and
# they live here rather than in the loop so they can be tuned without touching
# code — the same reason every other definition is in this file.
#
# SEMANTICS: must_convey is a list of GROUPS. Every group must match (AND);
# within a group any one alternative matching is enough (OR). Matching is
# case-insensitive substring over the model's final answer.
#
# THIS IS A HEURISTIC AND IT CAN BE WRONG. It is a gate, not a guarantee: when
# it fails twice the loop appends the notice verbatim under a "Caveats" heading
# and records notice_forced in the log, so the reader always sees the caveat
# even when the fingerprint misjudged the wording.
# =============================================================================
notices:
  low_stock_not_operational:
    must_convey:
      - [threshold, thresholds, warning_stock]
      - [not set, unset, never, "no ", not configured]
  snapshot_coverage_gap:
    must_convey:
      - [snapshot, coverage, no data]
      - [gap, not covered, outside, no snapshot, unavailable]
  snapshot_gaps:
    must_convey:
      - [gap, missing]
      - [day, days]
  sku_not_found:
    must_convey:
      - [sku, product]
      # "no" MUST stay quoted. Unquoted, YAML reads it as the boolean false, and
      # _unsurfaced then calls .lower() on it and takes the whole answer down
      # with an AttributeError — verified 2026-09-03, this exact line. Same for
      # yes/on/off/null/~ anywhere in a fingerprint.
      - ["no", not exist, unknown, not found]
  ambiguous_sku:
    must_convey:
      - [different products, three products, more than one product, several products, multiple products]
  duplicate_skus_in_result:
    must_convey:
      - [sku]
      - [duplicate, more than one, not unique, not a key]
  metric_redefined:
    must_convey:
      - [contain, containing, different question, not transactions of]
  reconciliation_failed:
    must_convey:
      - [disagree, differ, do not tie, does not tie, discrepanc, not comparable]
  orphan_line_items:
    must_convey:
      - [line item, product]
      - [not exist, missing, no matching, orphan, not in]
  profit_overstated:
    must_convey:
      - [profit]
      - [overstated, no cost, missing cost, never entered, uncosted]
  low_category_coverage:
    must_convey:
      - [categor]
      - [coverage, minority, incomplete, only, uncategorized]
  stale_stock:
    must_convey:
      - [stale, days old, last sync, out of date, not current]
  no_recorded_dispatch:
    must_convey:
      - [dispatch, record, movement]
      - ["no", none, not explain, unrecorded, does not exist]

  # A closed location asked about in the present tense. The answer must say the
  # place is shut rather than report nothing and let it read as "no stock".
  location_closed:
    must_convey:
      - [closed, shut, no longer, ceased]
      - [location, warehouse, store, macopa]
  # The other half of the same notice — movement.py picks between the two with
  # `"location_closed" if closed else "no_snapshot_coverage"`, and only the
  # closed case had ever been fingerprinted. A location merely outside the
  # snapshot scope produced a caveat no answer could satisfy.
  no_snapshot_coverage:
    must_convey:
      - [snapshot, balance history, inventory scope]
      - [not in, "no ", outside, cannot, unavailable, does not exist]

  # ---------------------------------------------------------------------------
  # Added 2026-09-03. These twelve kinds were EMITTED BY TOOLS WITH NO FINGERPRINT
  # HERE, and _unsurfaced treats an unknown kind as unsurfaced by design ("safer
  # to over-report"). That default is right for a kind nobody has thought about,
  # but it made these twelve UNSATISFIABLE: no wording could ever clear them, so
  # every answer carrying one spent a corrective turn rewriting itself and then
  # had the notice appended verbatim anyway — beneath prose that had just said
  # the same thing.
  #
  # The morning brief showed it worst, emitting several at once: the answer was
  # written twice and then caveated with what it already said. See the contract
  # test that now fails if a tool adds a notice kind without a fingerprint.
  # ---------------------------------------------------------------------------
  stale_sources:
    must_convey:
      - [too old, stale, out of date, not fresh, frozen, days old]
      - [source, sources, transfer, purchase order, vending, covers nothing]
  empty_section:
    must_convey:
      - [nothing to report, nothing crossed, no items, none, quiet, empty,
         nothing changed, nothing to flag]
  cost_not_entered:
    must_convey:
      - [zero, never entered, not entered, blank]
      - [cost, price]
  dead_stock_share:
    must_convey:
      - [window, longer window, shorter window, no sale, not sold]
  two_bases_not_summed:
    must_convey:
      - [transfer, document, snapshot]
      - [not added, never added, not summed, double-count, separate, must not]
  unmoved_transfer_value:
    must_convey:
      - [not moved, never moved, has not moved, raised, not yet shipped, unmoved]
      - [excluded, exclude, separate, document, not a movement]
  open_is_not_unreceived:
    must_convey:
      - ["open"]
      - [not mean, does not mean, not outstanding, arrived, delivered,
         never marked complete]
  header_total_mismatch:
    must_convey:
      - [line, lines, itemised, itemized]
      - [header, document total, disagree, mismatch, not used]
  quantity_not_additive:
    must_convey:
      - [not additive, differ, gram, pack, unit]
      - [quantity, quantities, total]
  received_quantity_coverage:
    must_convey:
      - [blank, "null", no received, missing, sparse, not recorded]
      - [received, coverage, only the lines]
  completion_not_delivery:
    must_convey:
      - [completion, marked complete, system]
      - [not delivery, not lead time, not the time the goods, not answerable]
  bases_not_comparable:
    must_convey:
      - [transfer valuation, valuation, internal transfer]
      - [different, separate, do not compare, not comparable, not a price]

  # ---- Saved workflows -----------------------------------------------------
  # Emitted by backend/app/services/workflow_runner.py, which builds a run for
  # all three callers — chat, the route and the scheduler — so there is one
  # place these can be written and one place they can be forgotten.

  # The run in front of you is not the one the schedule sends. Divergence is
  # ALLOWED — a manual run uses the newest logic while a schedule keeps the
  # version it was promoted with, which is the gate working. Silent divergence
  # is not: two people comparing a chat answer against Monday's message would
  # be looking at two different rules with no way to tell.
  #
  # The fingerprint demands all three facts the reader needs: which version,
  # that a schedule is involved, and why the two are not the same.
  version_divergence:
    must_convey:
      - [version]
      - [schedule, scheduled]
      - [promot, "approval queue", newer, older, differ, "not the same",
         "pinned to"]

  # The definitions moved under a saved rule's feet. The workflow still runs
  # against the LIVE metrics.yaml, as every tool does; what changed is that the
  # reasoning recorded with the version was written against an older one.
  definitions_drift:
    must_convey:
      - [definition, definitions, "metrics.yaml"]
      - [changed, change, differ, drift, since, "no longer", updated, revised]

  # A backtest containing a step that cannot see the past. The figure is real
  # and is TODAY's; presenting it as the past is the failure.
  backtest_not_reproducible:
    must_convey:
      - [backtest, back-test, past window, "would have"]
      - [current, "today", "now", point-in-time, present, "not reproduc",
         "cannot be reproduced", "as it stands"]

  # A step that refused, rotted or failed. The other steps still ran, and the
  # run must say which one did not rather than showing a shorter list.
  workflow_step_failed:
    must_convey:
      - [step]
      - [fail, refus, "could not", "did not run", unrunnable, error, "no longer"]

  # Slots the scheduler passed over while the process was down. Reported on the
  # run that did happen, because a missing run leaves no row to carry a notice.
  schedule_slots_skipped:
    must_convey:
      - [skipped, missed, "did not run", "not run", passed over]
      - [slot, run, scheduled, schedule]

  # Notices whose kind is "multiple" carry an `items` list; the loop checks each
  # item's own kind against the fingerprints above rather than the container.
  container_kind: multiple

  # How many corrective turns the loop spends asking the model to surface a
  # notice before falling back to appending it verbatim.
  max_corrective_turns: 1

# =============================================================================
# PINS — the vocabulary for one integrity check
#
# A pin is a WRITE, and the only claim George can make that changes something
# outside the conversation. Observed live on 2026-09-03, answering "pin that but
# weekly": George re-ran the weekly query, then wrote "Ran the weekly version
# first, then pinned it. **Pinned:** ... → Replenishment page" — having never
# called pin_answer. No tile existed. Nothing had been written. The answer was
# the only evidence of a pin, and it was wrong.
#
# So the loop checks the claim against what actually happened (see
# _claims_pin in agent/loop.py). These are the words that count as a claim, and
# the words that mean it is being DENIED rather than asserted — "I couldn't pin
# that" must not be mistaken for "pinned".
#
# Kept here rather than in the loop for the same reason notices.must_convey is:
# the phrasing of an answer is not a constant of the code.
# =============================================================================
pins:
  claim_check:
    # A completion claim: the answer asserts a pin exists.
    claims:
      - pinned
      - pin is now
      - tile is now
      - added to the page

    # A stated INTENTION to pin. Observed live 2026-09-03, the same question one
    # run later: "I'll run the weekly version first, then pin that exact call" —
    # followed by the weekly table and no pin_answer call at all. A promise the
    # user will believe is as misleading as a false claim, so it gets the same
    # check, with a gentler correction: George may legitimately be waiting on
    # them ("I'll pin it once you tell me which page"), and is asked to say so
    # rather than to pin regardless.
    intents:
      - i'll pin
      - i will pin
      - then pin
      - let me pin
      - going to pin
      - about to pin
      - i'll add it to
      - will pin it

    # Within this many characters BEFORE a claim, any of these turns it into a
    # denial. 60 covers "I could not pin that to the Replenishment page" without
    # reaching back into an unrelated sentence.
    negation_window: 60
    negations:
      - "not "
      - "n't"
      - cannot
      - "no "
      - nothing
      - none
      - never
      - unable
      - fail
      - refus
      - without
      - "instead of"
      - "rather than"
      - "haven't"
      - "won't"

    # One corrective turn: either call the tool or withdraw the claim.
    max_corrective_turns: 1


# =============================================================================
# SAVED WORKFLOWS
#
# A workflow is logic George and a user agreed on in conversation, saved as a
# versioned rule: named steps over existing READ tools, parameters, and the
# reasoning behind each choice. It runs on demand or on a schedule.
#
# WHAT LIVES HERE AND WHAT DOES NOT. Structural caps (how many steps a workflow
# may hold, how many workflows exist) are operational and live in the service,
# the way MAX_TOOL_CALLS_PER_PIN lives in pin_writer.py. What lives here is what
# is definitional: which tools can answer about the past, which arguments carry
# a window, who may promote a version, and the words that count as a claim.
#
# THE RULE MOST LIKELY TO BE BROKEN QUIETLY: a workflow parameter is SCOPE, never
# a DEFINITION. "Which store", "which window", "how many rows" are parameters.
# "What counts as low stock" is not — it is a business definition, it belongs in
# this file, and a workflow asking to tune it is asking for the wrong thing.
# =============================================================================
workflows:
  # ---- Ownership: org-level, deliberately not the pins model ---------------
  # A pin is one person's tile. A workflow that fires every Monday at 06:00 and
  # sends the result to a group chat is the company's rule, and giving it a
  # single owner means it dies with that person's account. So the three verbs
  # are separated: running is for anyone who can use George at all, editing is
  # for whoever wrote it or an admin, and promoting a version past the backtest
  # gate is for an admin only. Nobody can schedule their own unreviewed logic.
  permissions:
    # Checked against app_users.role. The route gate is require_page("george")
    # first; these narrow it further.
    run: any_george_user
    edit: creator_or_admin
    promote: admin_only
    delete: creator_or_admin
    # decision: 2026-09-03, with the saved-workflows design. resolves: the pins
    # model (created_by owns everything), which does not survive an org rule.

  # ---- The promotion gate -------------------------------------------------
  # A version may not fire on a schedule until it has been run against a PAST
  # window and the output looked at. Backtesting is the only way to see what a
  # rule would have said before it starts saying it unattended.
  promotion:
    requires_backtest: true
    # The backtest must be against a window that has closed, not today. A
    # backtest of "today" reproduces nothing and proves nothing.
    backtest_must_be_past: true
    promoted_by: admin_only
    # An edit produces a new version, which starts ungated. The schedule keeps
    # running the OLD version until someone promotes the new one — a scheduled
    # job that silently changes behaviour when somebody edits the logic is the
    # same lie as a tile that stores a number instead of re-running.
    edit_resets_gate: true

    # The consequence, stated so it is a rule rather than an accident: a manual
    # run uses the NEWEST version while a schedule fires the PROMOTED one, so
    # the same workflow can legitimately show different figures in chat and on
    # Monday morning.
    #
    # That divergence is allowed. Silent divergence is not. Any run whose
    # version differs from one an enabled schedule pins carries a
    # version_divergence notice naming both versions and the reason, and the
    # notice is stored on the run record as well as surfaced in the answer —
    # so a figure quoted from chat can always be traced to the rule that
    # produced it rather than to the one somebody assumed.
    divergence_must_be_stated: true

    # UI rule 5 reserves one colour for "needs you". This is what it means.
    # Nothing else may use that colour — a failed run is not an approval.
    queue_name: "Approval queue"
    queue_item: "a workflow version waiting to be promoted past the backtest gate"

  # ---- What a backtest can and cannot reproduce ---------------------------
  # A backtest is not time travel. It moves each step's time arguments to a past
  # as_of; it cannot rewind a tool that only knows the present.
  #
  # Every tool in agent.loop.TOOL_FUNCTIONS must appear in exactly one of the
  # four groups below, and test_workflows_contract asserts it. A tool added
  # without being classified would silently be treated as fully reproducible,
  # and a backtest would present today's figure as the past — the one failure
  # this whole section exists to prevent.
  backtest:
    # Tools that take the as_of date DIRECTLY. get_stock switches from
    # `inventory` to `inventory_snapshots` for that Manila date and reports a
    # snapshot_coverage_gap notice when the day is not covered, so a backtest of
    # stock is genuinely a backtest.
    # source: tools/inventory.py:127,142 and tools/brief.py:173.
    as_of_arguments:
      get_stock: as_of
      get_brief: as_of

    # Arguments carrying a [start, end) window. A preset there is resolved
    # against now(), so a backtest rewrites it to the explicit Manila dates the
    # preset WOULD have covered on as_of — see sales_day.presets.*.relative.
    # The receipts then show real dates instead of a preset name, which is the
    # honest thing for a window that is not the caller's "today".
    window_arguments:
      get_sales: date_range
      get_movement: date_range
      get_vending: date_range
      get_purchasing: date_range
      get_dead_stock: window

    # The window rebinds, but one side of the answer is still read live. Real
    # and useful, and it must say so — reporting it as fully reproduced would
    # attribute a present-day fact to a past morning.
    partially_reproducible:
      get_dead_stock: >
        The sales window rebinds, but the stock side is read live: a backtest
        shows which products are held TODAY and had no sale during the past
        window, not which products were held then.
      # source: tools/dead_stock.py:102-104, which already states that stock is
      # live and sales are a window and that the two are read at different times.

    # No time axis of any kind. In a backtest these return TODAY's figure,
    # labelled as today's, with a notice. Never silently omitted and never
    # presented as the past — a section quietly left out reads as "nothing
    # happened there" (brief.empty_section_must_distinguish, same reasoning).
    # source: tools/products.py:62, tools/vending.py:412, tools/cost_history.py:163
    # — none takes a date argument.
    point_in_time_tools:
      - get_product
      - get_vending_stock
      - get_cost_history

  # ---- The claim check, exactly as for pins --------------------------------
  # Saving a workflow is a write, and the second thing George can say that
  # changes something outside the conversation. Same failure mode, same remedy:
  # if the answer says a workflow was saved and save_workflow never returned,
  # the user goes looking for a rule that does not exist.
  claim_check:
    claims:
      - saved it as a workflow
      - saved as a workflow
      - workflow is now
      - workflow now exists
      - is now saved
      - now saved as
    intents:
      - i'll save
      - i will save
      - then save
      - let me save
      - going to save
      - about to save
      - will save it
    negation_window: 60
    negations:
      - "not "
      - "n't"
      - cannot
      - "no "
      - nothing
      - none
      - never
      - unable
      - fail
      - refus
      - without
      - "instead of"
      - "rather than"
      - "haven't"
      - "won't"
    max_corrective_turns: 1

  # ---- Scheduling ----------------------------------------------------------
  schedule:
    kinds: [daily, weekly, monthly]
    # Every slot is a Manila wall clock time. The Philippines observes no DST
    # (timezone.observes_dst), so a slot never repeats and never disappears.
    timezone: "Asia/Manila"

    # If the process was down for three days, run the most recent due slot ONLY
    # and report the ones that were missed. Three Monday briefs arriving on
    # Thursday is three numbers wearing the wrong timestamp — precisely what
    # every receipts rule in this file exists to prevent.
    catch_up: latest_slot_only

    # Delivery in v1 is Telegram, rendered on the backend. Rendering in the
    # delivery layer is how "notices always surface" (UI rule 4) stops being a
    # guarantee: the first person to tidy the layout deletes the caveats.
    # Same argument as ops/n8n/README.md.
    delivery: [telegram]


# =============================================================================
# RANKING (top_n)
#
# Ranking happens in SQL, not by shipping rows to the model and letting it sort.
#
# WHY THIS EXISTS: a 40-question coverage run found 6 of 11 refusals were caused
# by the 200-row cap between the tools and the model, not by missing data. On
# "what's out of stock across all stores" George correctly said: "the list is
# 24,180 lines long, and I only have visibility into a small, quantity-sorted
# slice of it. I must not total or characterise the rest." 19 of 40 answers
# mentioned truncation. top_n moves the ranking server-side so the model gets a
# complete, correct answer to "the top N"; full_row_count tells it how big the
# whole set was so it can describe what it did not see.
# =============================================================================
ranking:
  max_top_n: 1000          # the tools' own LIMIT; top_n may not exceed it
  min_top_n: 1

  # full_row_count is the size of the FULL result set before top_n / LIMIT.
  # It is only queried when the result was actually limited — when it was not,
  # it equals the row count and costs nothing.
  full_row_count_note: >
    Size of the complete result set before top_n or the row cap. When it exceeds
    row_count, the rows shown are the top slice by the ordering in
    meta.ordering — never a sample, and never something to total.

  sales:
    # "Top N" means the N largest by the metric. When top_n is set this
    # ORDERING OVERRIDES the chronological order normally used for day/week/
    # month buckets, so "top 5 days" means the five biggest days, not the first
    # five. meta.ordering always states which applied.
    ordering_with_top_n: "value DESC"
    ordering_default_time: "bucket ASC"
    ordering_default_other: "value DESC"

  stock:
    # get_stock's natural order is emptiest-first, which suits out-of-stock
    # questions but is wrong for "largest holdings". direction makes the caller
    # say which end they want rather than inheriting a default that silently
    # answers the opposite question.
    direction_default: lowest
    directions:
      lowest:  "i.quantity_on_hand ASC"    # emptiest first — stockouts
      highest: "i.quantity_on_hand DESC"   # largest holdings first

  # ---------------------------------------------------------------------------
  # GROUPING FOR get_stock
  #
  # A 40-question coverage run showed "which store has the most out-of-stock
  # items" costing 9 tool calls — one per store plus a probe — because get_stock
  # could only return product rows. top_n ranks WITHIN a result; it cannot
  # produce a per-store count. Grouping can.
  #
  # Grouped results are aggregate rows (product_count, total_quantity), not
  # product rows. That is a different shape and meta.grain says which was
  # returned, so a caller can never mistake a count of products for a quantity.
  # ---------------------------------------------------------------------------
  stock_grouping:
    valid_group_by: [store, state, category]
    expressions:
      store:    "i.store_id"
      category: "COALESCE(NULLIF(p.category, ''), 'Uncategorized')"
      # state reuses inventory.states, evaluated in order — the same CASE the
      # ungrouped path labels rows with, so the two can never disagree.
      state:    "__state_case__"
    measures:
      product_count:  "COUNT(*)"
      total_quantity: "SUM(i.quantity_on_hand)"
    ordering: "product_count DESC"

# =============================================================================
# DEAD STOCK — held but not selling
#
# The anti-join the tool surface was missing. The coverage run showed George
# attempting this shape three times and being unable to complete it: "dead
# products at Fairview", "in stock everywhere but selling nowhere", and
# "products never sold anywhere" (which timed out at 32.2s because the only
# route available was a full product GROUP BY over all history).
# =============================================================================
dead_stock:
  description: >
    Products a store is holding that recorded no sale in the window. Stock and
    sales are read at different times — stock is live, sales are a window — and
    that difference is reported rather than hidden.

  # Deliberately NOT inventory.states.in_stock: that predicate also tests
  # warning_stock, which is NULL on every row, so it would silently include
  # nothing useful. Dead stock only asks whether the shelf holds units.
  stock_predicate: "i.quantity_on_hand > 0"

  # The window side reuses the standard sales guard, so "no sales" means the
  # same thing here as everywhere else: not cancelled, type Sale, retail scope.
  sales_guard_ref: filters.standard_sales_guard

  # Scanning the window ONCE into a CTE and hash-anti-joining is what makes this
  # affordable. A correlated NOT EXISTS per inventory row would re-scan 891,714
  # line items 31,617 times.
  strategy: cte_anti_join

  # Default scope is retail. AJI BARN is excluded: its quantities are corrupt
  # (89% of rows non-positive, some at -24 million) so "held but not selling"
  # is meaningless there. See movement.balance_delta and filters.excluded_from_sales.
  scope: stores.active_retail
  barn_excluded_reason: >
    AJI BARN quantities are accumulated dispatch counters, not stock. A dead
    stock list from them would be noise.
