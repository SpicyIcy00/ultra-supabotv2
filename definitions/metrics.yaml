# =============================================================================
# metrics.yaml — the single source of truth for George's business definitions.
#
# Tools READ from this file. A definition may not be hardcoded in a tool; if a
# rule is missing here, add it here rather than inlining it. See CLAUDE.md.
#
# Every entry carries:
#   source:   where the rule came from (file/line, live data, or a decision)
#   resolves: the prior contradiction this entry settles, if any
#
# SQL fragments below are vetted, parameterized building blocks — they are the
# ONLY SQL George composes against these tables. Standard aliases:
#   t  = new_transactions      ti = new_transaction_items
#   p  = products              s  = stores               i = inventory
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
# VERSION POLICY — decided 2026-09-07, with the metric model below.
#
# `version` is stamped on every tool result (meta.definitions_version) and a
# saved workflow records the version it was written against; a run whose live
# version differs carries a definitions_drift notice until somebody re-saves
# the workflow, which resets its promotion gate. So a bump is not free: it
# tells every reader of every saved rule that the ground moved under it.
#
# It BUMPS when the MEANING of something already trusted changes: the SQL, the
# guards, the grain, the grouping semantics or the business definition of an
# existing metric, filter, window or comparison.
#
# It does NOT bump for additive entries — a new metric, a new comparison, new
# descriptive fields on an existing entry — because nothing a saved rule
# already computes means anything different afterwards. Such entries carry
# `introduced` (a date) so their own arrival is still recorded.
# -----------------------------------------------------------------------------
version_policy:
  bump_when:
    - "the SQL, guards, grain or grouping semantics of an existing metric change"
    - "the definition of an existing filter, window preset or comparison changes"
    - "a business definition already relied on by a tool changes meaning"
  do_not_bump_when:
    - "a metric, comparison or metric set is ADDED"
    - "descriptive fields (kind, domain, display_name, introduced, notes) are added"
  additive_entries_carry: introduced

currency:
  code: PHP
  symbol: "₱"
  decimal_places: 2
  # source: backend/business_rules.yaml:1382-1386 (formatting block).
  # Store-domain money columns (t.total, ti.item_total, p.cost) are already in
  # pesos and are NEVER divided. That was the one currency fact never written
  # down anywhere; it is written down now.
  store_domain_scaling: none

timezone:
  name: "Asia/Manila"
  # source: backend/business_rules.yaml:272 (date_defaults.timezone), repeated in
  # backend/app/services/sql_generator.py:406 as a hardcoded fallback.
  # The Philippines observes no DST, so converting a local wall-clock timestamp
  # to timestamptz is never ambiguous and never skips an hour. Any rule below
  # that round-trips through AT TIME ZONE is safe for that reason.
  observes_dst: false


# =============================================================================
# SALES DAY BOUNDARY
# =============================================================================
# Why a sales reading refuses the warehouse. It is not a missing shop: it
# records no transactions at all, so any sales figure for it would be a
# zero that means "wrong question" rather than "a bad week".
sales_scope:
  warehouse_excluded_reason: >-
    AJI BARN records no transactions. It dispatches stock to the shops,
    and the shops record the sales.

sales_day:
  description: >
    A sales day is midnight-to-midnight Asia/Manila. There is no trading-day
    offset — a transaction at 23:59 Manila belongs to that calendar day, and
    one at 00:01 belongs to the next.
  boundary: midnight_local
  week_start: Monday          # source: business_rules.yaml:273; matches Postgres date_trunc('week')
  fiscal_year_start: January  # source: business_rules.yaml:275

  # ---------------------------------------------------------------------------
  # WHY CURRENT_DATE IS BANNED
  #
  # CURRENT_DATE returns the date in the SERVER's TimeZone setting, not Manila's.
  # The backend runs on Railway, where that setting is UTC. Manila is UTC+8, so
  # for the eight hours from 16:00-23:59 UTC (00:00-07:59 the next day in Manila)
  # CURRENT_DATE is a full day behind the real Manila date.
  #
  # Verified against the production database on 2026-09-01:
  #   instant 2026-09-01 18:30+00  ->  CURRENT_DATE          = 2026-09-01  (WRONG)
  #                                ->  Manila calendar date  = 2026-09-02  (RIGHT)
  #
  # The workaround used throughout the old chatbot —
  #   CURRENT_DATE AT TIME ZONE 'Asia/Manila'
  # — does NOT fix this and is not what it reads as. It casts a date to
  # timestamp, then reinterprets that midnight as Manila local time, yielding a
  # timestamptz. At the instant above it returns 2026-09-01 08:00:00+00, i.e.
  # the START OF THE WRONG DAY. It is a timestamptz, not a date, so comparing it
  # to a date silently coerces.
  #
  # The correct primitive is now() (which is timezone-aware) converted to Manila
  # wall-clock time FIRST, and only then truncated:
  #   now() AT TIME ZONE 'Asia/Manila'   -> timestamp, Manila wall clock
  # Verified to yield manila_today = 2026-09-01 with the server TimeZone set to
  # UTC, America/New_York and Asia/Manila alike, and to produce byte-identical
  # absolute instants for the day bounds in all three.
  #
  # source: this is a decision, made after reproducing the fault above.
  # resolves: business_rules.yaml:279 declared
  #   today: "CURRENT_DATE AT TIME ZONE 'Asia/Manila'"
  #   as the definition of "today", and examples 3, 12 and 18
  #   (business_rules.yaml:388, 576, 685) compared
  #   DATE(t.transaction_time AT TIME ZONE 'Asia/Manila') = CURRENT_DATE.
  #   Both are wrong for 8 hours a day. Same family as commit fda9693,
  #   "fix: scheduled reports were always a day behind".
  # ---------------------------------------------------------------------------
  expressions:
    # The base primitive. Everything else derives from this.
    manila_now:   "(now() AT TIME ZONE 'Asia/Manila')"          # timestamp, Manila wall clock
    manila_today: "(now() AT TIME ZONE 'Asia/Manila')::date"    # date, the real Manila calendar date

    # Half-open [start, end) bounds as timestamptz, for comparison against
    # t.transaction_time (which is timestamptz). Truncate in Manila wall-clock
    # space, then convert back to an absolute instant.
    today_start:      "date_trunc('day',   (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
    today_end:        "(date_trunc('day',  (now() AT TIME ZONE 'Asia/Manila')) + INTERVAL '1 day') AT TIME ZONE 'Asia/Manila'"
    week_start:       "date_trunc('week',  (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
    month_start:      "date_trunc('month', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
    year_start:       "date_trunc('year',  (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"

    # Bounds for an explicit Manila calendar date :d (a DATE parameter).
    #
    # THE ::timestamp CAST IS LOad-BEARING. `date AT TIME ZONE 'Asia/Manila'`
    # is NOT the same expression and is wrong by 8 hours. Postgres has two
    # overloads:
    #     timestamp   AT TIME ZONE tz -> timestamptz   (interpret AS Manila)
    #     timestamptz AT TIME ZONE tz -> timestamp     (convert TO Manila)
    # A bare `date` can implicitly cast to either, and Postgres picks the
    # timestamptz overload — casting the date through the SESSION timezone and
    # then converting, which yields a naive timestamp 8 hours late:
    #     (DATE '2026-09-01') AT TIME ZONE 'Asia/Manila'
    #        -> timestamp 2026-09-01 08:00   (WRONG: 8h past Manila midnight)
    #     (DATE '2026-09-01')::timestamp AT TIME ZONE 'Asia/Manila'
    #        -> timestamptz 2026-08-31 16:00+00   (CORRECT: Manila midnight)
    # Verified with the server timezone set to both UTC and America/New_York.
    #
    # This is the SAME failure family as CURRENT_DATE AT TIME ZONE documented
    # above, and an earlier version of this file reproduced it here. A window
    # built the wrong way silently shifts every day boundary 8 hours forward,
    # so "August" runs 1 Aug 16:00 to 1 Sep 16:00 Manila and a day bucket picks
    # up the following afternoon's trade.
    #
    # The preset expressions above do NOT need this cast: date_trunc() returns
    # `timestamp without time zone`, which selects the correct overload on its
    # own. Only a bare date needs it.
    date_start:       "(:d)::timestamp AT TIME ZONE 'Asia/Manila'"
    date_end:         "((:d)::date + 1)::timestamp AT TIME ZONE 'Asia/Manila'"

    # Grouping key: the Manila calendar date a transaction belongs to.
    day_bucket:       "(t.transaction_time AT TIME ZONE 'Asia/Manila')::date"

  # ---------------------------------------------------------------------------
  # GROUPING BUCKETS. The Manila calendar day/week/month a transaction belongs
  # to. Convert to Manila wall-clock FIRST, then truncate — the same ordering
  # the primitive above depends on. Postgres date_trunc('week') is Monday-based,
  # which matches week_start.
  # ---------------------------------------------------------------------------
  buckets:
    day:   "date_trunc('day',   (t.transaction_time AT TIME ZONE 'Asia/Manila'))::date"
    week:  "date_trunc('week',  (t.transaction_time AT TIME ZONE 'Asia/Manila'))::date"
    month: "date_trunc('month', (t.transaction_time AT TIME ZONE 'Asia/Manila'))::date"
    # HOUR OF THE DAY, 0-23 Manila, summed across every day in the window.
    # Added 2026-09-12 for "when does the day sell": it is not a time series
    # — thirty days grouped by hour is one set of twenty-four figures — so it
    # is never compared (comparisons.retail.valid_group_by leaves it out with
    # the other buckets) and it orders by the hour, not by the value.
    hour:  "extract(hour from (t.transaction_time AT TIME ZONE 'Asia/Manila'))::int"

  # ---------------------------------------------------------------------------
  # NAMED DATE RANGES. Half-open [start, end) timestamptz, all derived from the
  # Manila primitive. "What last_month means" is a business definition, so it
  # lives here rather than in a tool.
  #
  # source: business_rules.yaml:278-286 (date_interpretation), re-expressed
  #   without CURRENT_DATE.
  #
  # DECISION — the rolling windows exclude today. last_7_days is the seven
  # COMPLETE days ending yesterday, not six days plus a partial today. A partial
  # day silently drags every average and every period-over-period comparison
  # downward, and the drag changes size depending on the hour the question is
  # asked. Use `today` explicitly to include the day in progress.
  # resolves: business_rules.yaml used `>= CURRENT_DATE - INTERVAL '7 days'`
  #   with no upper bound, which included the partial current day, while
  #   declaring at line 418 that ranges are inclusive. Neither was stated.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # `relative` — THE SAME WINDOW, ANCHORED ON A DAY THAT IS NOT TODAY
  #
  # The SQL above is anchored on now(), which is what a preset means when the
  # caller is asking today. A saved workflow BACKTEST asks what a rule would
  # have said on a past morning, and "last_30_days" evaluated against now()
  # would answer with the last thirty days from this afternoon instead.
  #
  # So each preset also states itself arithmetically, against an anchor date D
  # (the Manila day the run is written on):
  #     unit    day | week | month | year — what D is truncated to
  #     offset  units to shift the truncated anchor
  #     length  units the half-open window spans
  # giving [trunc(D, unit) + offset, trunc(D, unit) + offset + length).
  #
  # This is a SECOND EXPRESSION OF ONE DEFINITION, which is exactly the thing
  # this file exists to prevent — so it lives here, beside the SQL it must agree
  # with, rather than in the backtest code where it would become a private copy.
  # test_workflows_contract checks that every preset has one.
  #
  # Week truncation is Monday-based, matching week_start above and Postgres
  # date_trunc('week'). Weeks and days are exact; months and years are calendar
  # arithmetic, the same as INTERVAL '1 month'.
  # ---------------------------------------------------------------------------
  presets:
    # `closed_alternative` — the closed preset a tool names when it refuses a
    # period-over-period comparison on a window still in progress
    # (comparisons.previous_period.partial_window_policy). Null where no
    # closed preset covers the same unit; the tool then suggests an explicit
    # window instead.
    today:
      start: "date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      end:   "(date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) + INTERVAL '1 day') AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: true
      relative: {unit: day, offset: 0, length: 1}
      closed_alternative: yesterday
    yesterday:
      start: "(date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) - INTERVAL '1 day') AT TIME ZONE 'Asia/Manila'"
      end:   "date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: false
      relative: {unit: day, offset: -1, length: 1}
    this_week:
      start: "date_trunc('week', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      end:   "(date_trunc('week', (now() AT TIME ZONE 'Asia/Manila')) + INTERVAL '1 week') AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: true
      relative: {unit: week, offset: 0, length: 1}
      closed_alternative: last_week
    last_week:
      start: "(date_trunc('week', (now() AT TIME ZONE 'Asia/Manila')) - INTERVAL '1 week') AT TIME ZONE 'Asia/Manila'"
      end:   "date_trunc('week', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: false
      relative: {unit: week, offset: -1, length: 1}
    this_month:
      start: "date_trunc('month', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      end:   "(date_trunc('month', (now() AT TIME ZONE 'Asia/Manila')) + INTERVAL '1 month') AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: true
      relative: {unit: month, offset: 0, length: 1}
      closed_alternative: last_month
    last_month:
      start: "(date_trunc('month', (now() AT TIME ZONE 'Asia/Manila')) - INTERVAL '1 month') AT TIME ZONE 'Asia/Manila'"
      end:   "date_trunc('month', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: false
      relative: {unit: month, offset: -1, length: 1}
    last_7_days:
      start: "(date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) - INTERVAL '7 days') AT TIME ZONE 'Asia/Manila'"
      end:   "date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: false
      relative: {unit: day, offset: -7, length: 7}
    last_30_days:
      start: "(date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) - INTERVAL '30 days') AT TIME ZONE 'Asia/Manila'"
      end:   "date_trunc('day', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: false
      relative: {unit: day, offset: -30, length: 30}
    this_year:
      start: "date_trunc('year', (now() AT TIME ZONE 'Asia/Manila')) AT TIME ZONE 'Asia/Manila'"
      end:   "(date_trunc('year', (now() AT TIME ZONE 'Asia/Manila')) + INTERVAL '1 year') AT TIME ZONE 'Asia/Manila'"
      includes_partial_day: true
      relative: {unit: year, offset: 0, length: 1}
      closed_alternative: null

  # All ranges are half-open: lower bound inclusive, upper bound exclusive.
  # resolves: business_rules.yaml:418 instructed "Always use inclusive date
  #   ranges", but most of its own examples used an open-ended `>=` with no
  #   upper bound (so they silently included today's partial day) while
  #   examples 1, 20, 29 and 30 used half-open bounds. Both were presented as
  #   correct. Half-open is now the only permitted form.
  range_convention: half_open   # transaction_time >= start AND transaction_time < end


# =============================================================================
# STORES — the 7 active retail stores, keyed on the ACTUAL stores.name value
# =============================================================================
# source: live production `stores` table + distinct store_id in new_transactions,
#   read 2026-09-01. `stores.name` was renamed at some point to the "(N) ..."
#   form and the friendly label moved to `stores.display_name`.
#
# resolves: THREE separate contradictions.
#   1. backend/business_rules.yaml:7-13 listed 6 stores by friendly name
#      ("Rockwell", "Greenhills", ...). Those strings no longer match any
#      stores.name value, so every example doing `s.name = 'Rockwell'`
#      (business_rules.yaml:592, 702, 751, 830, 897) matches ZERO rows.
#   2. The live `store_filters` table omitted Greenhills from the sales scope
#      while including it in inventory — dropping the second-busiest store
#      (65,063 transactions) from sales reporting. Greenhills is included here.
#   3. Shang (12,085 transactions since 2026-04-05) existed in the data but in
#      no config file. It is included here.
#
# Match on `id`, never on a name. The names below are recorded so a rename is
# detectable; `display_name` is what George shows the user.
# NOTE: "(6) Aji Ichiban  OPUS" contains a DOUBLE SPACE. Preserved verbatim.
stores:
  # ---------------------------------------------------------------------------
  # ALL 22 ROWS OF `stores` ARE CLASSIFIED BELOW, counted 2026-09-10:
  #   7 active_retail · 1 warehouse · 2 pending_retail · 2 closed
  #   1 vending_stock_location · 9 non_trading
  # A row that appears in none of these is a place George cannot name, and a row
  # in two of them is a place he would count twice. test_store_scope_contract
  # holds both properties.
  # ---------------------------------------------------------------------------
  total_rows_in_stores_table: 22

  active_retail:
    - id: "6639efd54694700008d7ccc6"
      name: "(1) Aji Ichiban Food Products"
      display_name: "Rockwell"
    - id: "668023c94721460006092609"
      name: "(2) Aji Ichiban food products SM Fairview"
      display_name: "Fairview"
    - id: "668a43f60fa9990007cfa158"
      name: "(3) Ajiichiban Food Products Greenhills"
      display_name: "Greenhills"
    - id: "66cfff31aa7adf0007c9de41"
      name: "(4) Ajiichiban Food Products SM North Edsa"
      display_name: "North Edsa"
    - id: "67612230a740d90007464e26"
      name: "(5) Ajiichiban food products Magnolia"
      display_name: "Magnolia"
    - id: "68c5bb269da1d500073690c2"
      name: "(6) Aji Ichiban  OPUS"
      display_name: "OPUS"
    - id: "69c73fcb277aa600076dfaaa"
      name: "Ajiichiban SHANG"
      # The store record's own display_name is "Shangri-La"; this file said
      # "Shang" and George therefore called it something the business does not.
      # Corrected 2026-09-10.
      display_name: "Shangri-La"

  # The warehouse. NOT a retail store — excluded from every sales metric (see
  # filters.excluded_from_sales) but in scope for inventory, because stock genuinely sits
  # here. Recorded with a display_name so tools can label its rows from this
  # file instead of reading stores.name at query time.
  # source: live stores table, 2026-09-01 (stores.display_name is NULL there).
  warehouse:
    - id: "667bde393126e50006c8058c"
      name: "AJI BARN"
      display_name: "AJI BARN"

  # ---------------------------------------------------------------------------
  # CLOSED LOCATIONS. Real places that no longer operate.
  #
  # They are NOT deleted and NOT merged into anything. Their history is real:
  # AJI MACOPA alone accounts for 1,006 document references across the StoreHub
  # exports. A closed location must resolve for a HISTORICAL question and must
  # disappear from a CURRENT-STATE one, and those are different questions — which
  # is exactly why this is its own group rather than an absence.
  #
  # Deliberately NOT in stores.warehouse: agent/loop.py builds the store enum
  # offered to the model from the live scopes, and a closed warehouse must not be
  # offered as somewhere to ask about today's stock.
  # ---------------------------------------------------------------------------
  closed:
    - id: "local-aji-macopa-wh-0001"
      name: "AJI MACOPA"
      display_name: "AJI MACOPA"
      kind: warehouse
      closed_at: "2026-06-24"
      # THE ID IS NOT A STOREHUB ObjectID AND THAT IS DELIBERATE. Every other
      # stores.id is a 24-character hex ObjectID. MACOPA was never synced from
      # StoreHub, so a plausible-looking hex id would risk a duplicate row if the
      # real one ever arrives, with a thousand documents bound to the wrong one.
      # An obviously-local id cannot collide and makes the reconciliation a
      # search for one known string. See migration i3j4k5l6m7n8.
      id_source: local
      id_is_storehub_objectid: false
      #
      # closed_at IS DERIVED FROM THE DATA, not supplied. It is the last date on
      # which goods actually MOVED to or from MACOPA:
      #   ST2721, MACOPA -> Magnolia, PHP 4,040, status Completed, shipped and
      #   received 2026-06-24 23:27.
      # A later document exists and is deliberately not used:
      #   ST2735, 2026-06-28, MACOPA -> OPUS, status Created, ZERO lines,
      #   total 0.00 — raised and never shipped.
      # That is the same document-versus-movement distinction as
      # storehub.stock_transfers.moved_statuses, applied so the closing date
      # means "when goods last moved" and not "when someone last opened a form".
      closed_at_derivation: "last movement (moved_statuses) touching the location"
      closed_at_source_document: "ST2721"
      closed_at_rejected_candidate: "ST2735 (2026-06-28) — status Created, zero lines, never shipped"
      #
      # Activity while it operated, measured 2026-09-02 across all five exports:
      #   1,006 document references — 666 as transfer source, 340 as target
      #   76 of 227 purchase orders (33.5%) were destined here
      # Note the per-file split: Purchase_Orders_09-02-2026.csv is 140 BARN / 3
      # MACOPA while Purchase_Orders_09-02-2026 (1).csv is 73 MACOPA / 1 BARN.
      # One export is a BARN book and the other a MACOPA book, so a destination
      # figure must state the window it covers.
      transfer_references: 1006
      po_destination_count: 76
      po_total_measured: 227

    # -------------------------------------------------------------------------
    # AJI PINA. Added 2026-09-10, and it had been missing from every group.
    #
    # A real shop that traded and stopped: 92 transactions between 2025-06-03
    # and 2025-08-08, then nothing. It holds no inventory rows and appears in no
    # snapshot, so it is not a current place at all.
    #
    # WHAT ITS ABSENCE ACTUALLY COST, stated precisely rather than dramatically.
    # Current figures were never wrong: active_retail is bound by id and PINA
    # was not in it, which is correct for a shop that shut. The cost was on
    # HISTORICAL questions — a 2025 sales figure silently omitted 92
    # transactions, and asking about "AJI PINA" by name resolved to nothing
    # instead of "that closed in August 2025", which is the same failure
    # stores.closed exists to prevent for MACOPA.
    # -------------------------------------------------------------------------
    - id: "6639efd64694700008d7cd17"
      name: "AJI PINA"
      display_name: "AJI PINA"
      kind: retail
      closed_at: "2025-08-08"
      id_source: storehub
      id_is_storehub_objectid: true
      closed_at_derivation: "last recorded transaction; this location has no movement records"
      transactions: 92
      first_transaction: "2025-06-03"

  # Two more storefronts exist in `stores` with ZERO transactions to date and are
  # presumed to be the 8th and 9th candy stores. They are deliberately NOT in
  # active_retail until they transact. Move them up when they do.
  # source: live stores table, 2026-09-01.
  pending_retail:
    - id: "694785f3c9a90d0007fc9232"
      name: "Ajiichiban ROBINSONS super market lucky Chinatown"
    - id: "6982c9a9aa1210000783594d"
      name: "AJI ROBINSONS supermarket robinsons galleria"

  # The AJI CMG row in `stores`. Listed so all 22 rows are accounted for, and
  # deliberately in a group of its own: it is NOT retail, NOT the warehouse, and
  # NOT the vending business. It holds store-side stock (3,534 inventory rows,
  # 512,043 snapshots) and takes no transactions. The vending DOMAIN is Weimi
  # and is read by tools/vending.py; see the note above `vending:` — the two
  # must never be conflated, which is exactly why this row needs a name here
  # rather than being left unclassified.
  vending_stock_location:
    - id: "667bde0cd749a000079f4650"
      name: "AJI CMG"
      display_name: "AJI CMG"
      holds_stock: true
      takes_transactions: false
      is_the_weimi_vending_domain: false

  # ---------------------------------------------------------------------------
  # EVERYTHING ELSE IN `stores`. Added 2026-09-10 after counting all 22 rows.
  #
  # These are StoreHub locations that have never taken a transaction and hold no
  # stock. They are recorded so that a question naming one gets "that has never
  # traded" instead of "no such place", and so nobody mistakes the count of rows
  # in `stores` for a count of shops.
  #
  # TWO OF THEM ARE TEST DATA IN THE PRODUCTION TABLE — `Test stoee` (sic) and
  # `test store 2`. They are named here rather than quietly skipped: a filter
  # that silently drops rows matching "test" would one day drop a real shop.
  #
  # A NOTE WORTH ACTING ON SEPARATELY: the replenishment engine has historically
  # written shipment plans for most of these, including both test rows — around
  # 2,990 lines each. Recent runs cover only the seven trading shops, so this is
  # historical rather than live, but it means a plan figure taken across all
  # runs includes locations that cannot receive stock.
  non_trading:
    - {id: "6680e5a3a8fc2d00071d07a9", name: "AJI ONLINE",                kind: channel}
    - {id: "6639efd64694700008d7cd59", name: "Digital Store",             kind: channel}
    - {id: "68a40bd8b79152000619e7d7", name: "Aji Packing",               kind: operations}
    - {id: "6699c88bd38fa400074ba3da", name: "AJI Disposal",              kind: operations}
    - {id: "693646be0abea30007b77334", name: "Hello AJI vending",         kind: vending}
    - {id: "69b6fb6d185092000783c8a4", name: "AJI VENDO",                 kind: vending}
    - {id: "668263b71c04d30007dbd150", name: "Aji Ichiban Food Products", kind: duplicate_looking}
    - {id: "68db56270374e300079eaf4e", name: "Test stoee",                kind: test_data}
    - {id: "69ba1a9b6f1eab000717a4c5", name: "test store 2",              kind: test_data}

  sql:
    # The canonical sales scope. Tools bind this list; they never inline names.
    # resolves: sql_generator.py:179 resolved names -> ids via stores.name and
    #   silently produced an EMPTY id list, which rendered the literal SQL
    #   `t.store_id IN ()` into the prompt — a syntax error. Keying on ids
    #   removes the resolution step entirely.
    active_retail_filter: "t.store_id IN :active_retail_store_ids"


# =============================================================================
# ROW-LEVEL FILTERS — what counts as a sale at all
# =============================================================================
filters:

  # ---------------------------------------------------------------------------
  cancelled:
    rule: "Cancelled transactions are excluded from every metric, without exception."
    sql: "t.is_cancelled = false"
    # source: business_rules.yaml:260-266 (default_filters, always_apply: true),
    #   restated at sql_generator.py:427 (safety rule 2) and as negative
    #   example 1 (business_rules.yaml:1207).
    # resolves: nothing — this is the one rule both files already stated
    #   identically. Recorded here so tools read it from one place.
    # Live count: 1,753 cancelled rows across the 9 transacting stores.
    always_apply: true

  # ---------------------------------------------------------------------------
  returns:
    rule: >
      A row with transaction_type = 'Return' is NOT a sale and is excluded from
      all sales metrics. Returns are reported separately, never netted silently.
    sale_sql:   "t.transaction_type = 'Sale'"
    return_sql: "t.transaction_type = 'Return'"
    # source: live data, 2026-09-01. Distinct values of transaction_type are
    #   exactly 'Sale' (365,370 rows) and 'Return' (54 rows, ₱35,407.40 total).
    #
    # resolves: TWO problems.
    #   1. NO rule for returns existed anywhere. No training example, negative
    #      example, default filter or prompt line referenced transaction_type.
    #      Because Return rows carry POSITIVE totals (verified: zero rows in
    #      new_transactions have total < 0), every sales figure the old chatbot
    #      produced silently counted ₱35,407.40 of returns as revenue.
    #   2. business_rules.yaml:52 documented the values as "SALE, REFUND".
    #      The actual values are 'Sale' and 'Return' — different words AND
    #      different case. A filter written from that doc matches zero rows and
    #      looks like it worked.
    always_apply: true

    # OPEN QUESTION — do not resolve by guessing.
    # Return rows store a positive `total`. Whether that figure is the refunded
    # amount (so net-of-returns = sales - returns) or something else has not been
    # confirmed with the business. Until it is, George reports returns as their
    # own figure and must NOT publish a "net of returns" number.
    net_of_returns_supported: false

  # ---------------------------------------------------------------------------
  # RENAMED from `aji_barn` on 2026-09-02. The key never held only AJI BARN —
  # AJI PINA has been in it from the start — and it is about to describe two
  # warehouses rather than one. A key whose name misdescribes its contents is
  # how the wrong list gets used.
  excluded_from_sales:
    rule: >
      Locations that are not retail storefronts. Their rows in new_transactions
      are stock movements or dead history, not retail sales, and are excluded
      from every sales metric. Warehouses remain in scope for INVENTORY
      questions — stock genuinely lives there.
    excluded_store_ids:
      - "667bde393126e50006c8058c"   # AJI BARN     — warehouse, 1,703 'Sale' + 2 'Return' rows
      - "6639efd64694700008d7cd17"   # AJI PINA     — 92 rows, 2025-07-18 → 2025-08-08 only
      - "local-aji-macopa-wh-0001"   # AJI MACOPA   — closed warehouse, 2026-06-24

    # Labels for the ids above, in the same order. Tools cite the exclusion in
    # meta.filters_applied and must not carry their own copy of these names — an
    # earlier version of tools/sales.py hardcoded the string
    # "excluded: AJI BARN, AJI PINA", which would have gone stale and quietly
    # lied the moment a third id was added here.
    excluded_labels:
      "667bde393126e50006c8058c": "AJI BARN"
      "6639efd64694700008d7cd17": "AJI PINA"
      "local-aji-macopa-wh-0001": "AJI MACOPA"

    # -------------------------------------------------------------------------
    # THERE ARE TWO WAREHOUSES. ONE IS CLOSED.
    #
    # AJI BARN is the main warehouse and is operating. AJI MACOPA was a second,
    # smaller warehouse and CLOSED on 2026-06-24 (stores.closed carries the id,
    # the date and how the date was derived).
    #
    # MACOPA is NOT a rename of BARN and NOT an alias for it. Transfers between
    # the two are real inter-warehouse movement of real goods and must be counted
    # as movement, not netted away as a bookkeeping artefact — 1,006 documents
    # reference MACOPA, 666 of them with MACOPA as the source.
    #
    # Both are warehouses and both are excluded from retail sales on the same
    # grounds: neither is a storefront. MACOPA is additionally excluded from
    # current-state questions because it is shut — see filters.closed_locations,
    # which is a DIFFERENT exclusion with a different scope. Being closed removes
    # it from "now"; being a warehouse removes it from retail sales; its history
    # stays fully answerable under both.
    #
    # CORRECTION, 2026-09-02. An earlier version of this block said MACOPA was
    # "still in use" and "the destination of most purchase orders", and left it
    # out of the id lists because it had no stores row. All three are now
    # settled: it is closed, it has a row (a deliberately non-StoreHub id, see
    # stores.closed), and the destination share is measured at 76 of 227 POs
    # (33.5%) rather than most.
    #
    # source: the business, 2026-09-02, plus the five StoreHub exports.
    # -------------------------------------------------------------------------
    warehouse_store_ids:
      - "667bde393126e50006c8058c"   # AJI BARN — the main warehouse, operating
      - "local-aji-macopa-wh-0001"   # AJI MACOPA — warehouse, CLOSED 2026-06-24

    inventory_scope_store_ids:
      - "667bde393126e50006c8058c"   # AJI BARN is IN scope for inventory
    # AJI MACOPA is deliberately absent from inventory scope: it is closed, so
    # it holds no current stock and has no inventory rows. Including it would
    # return an empty result that reads as "nothing in stock here" rather than
    # "this place shut in June" — the same trap as the unset low-stock
    # thresholds and the non-existent vending failure status.
    # source: live data, 2026-09-01. AJI BARN carries 1,703 rows typed 'Sale'
    #   spanning 2025-08-15 → 2026-09-01; AJI PINA carries 92 rows in a
    #   three-week window in 2025.
    #
    # resolves: no concept of a transfer existed in either file. Warehouse
    #   movements carry the SAME transaction_type ('Sale') as a customer
    #   purchase, so nothing distinguished them. The only mechanism that would
    #   have excluded them was the store_filters sales list — which was broken
    #   (see stores.sql.active_retail_filter above), so BARN movements were
    #   landing in company-wide totals.
    #
    # ASSUMPTION FLAGGED FOR THE BUSINESS: that a BARN row is an internal
    # transfer rather than a wholesale sale. If some BARN rows are genuine
    # third-party sales, this exclusion understates revenue and this entry must
    # change. Excluding is the safer default — a transfer counted as revenue
    # inflates every store-comparison and company total.
    assumption_confirmed: false

  # ---------------------------------------------------------------------------
  # CLOSED LOCATIONS — EXCLUDED FROM CURRENT STATE, KEPT IN HISTORY.
  #
  # A closed location is excluded from any question about how things stand NOW,
  # on the same footing as AJI BARN and AJI PINA in excluded_from_sales above:
  # a named list, applied by construction, and cited in meta.filters_applied so
  # the exclusion appears on the receipt rather than happening invisibly.
  #
  # THE DISTINCTION THIS ENCODES. "How much stock is at MACOPA" and "how much
  # did MACOPA ship in May" are different questions, and a closed location
  # answers only the second. The first must not come back empty as though the
  # shelves were bare — it must say the place is shut.
  #
  # So the rule is asymmetric, and deliberately so:
  #   CURRENT STATE  (inventory, dead stock, "right now")  -> EXCLUDED
  #   HISTORY        (transfers, purchase orders, a past window) -> INCLUDED
  #
  # Excluding closed locations from history would silently delete real activity:
  # MACOPA alone is 1,006 document references and 76 purchase orders. The point
  # of creating its store row was to make that history resolve.
  #
  # source: the business, 2026-09-02 (MACOPA is closed). Ids and dates from
  #   stores.closed, which is the single place they are written down.
  # ---------------------------------------------------------------------------
  closed_locations:
    rule: >
      A closed location is excluded from current-state questions and included in
      historical ones. A current-state tool asked about one must say it is
      closed and give its closing date, never return an empty result.
    excluded_store_ids:
      - "local-aji-macopa-wh-0001"   # AJI MACOPA — closed 2026-06-24
    excluded_labels:
      "local-aji-macopa-wh-0001": "AJI MACOPA"
    applies_to_current_state: true
    applies_to_history: false
    # A tool must not answer "no stock" for a closed location. It says so.
    empty_result_is_forbidden: true
    notice_kind: location_closed
    notice_template: >
      {label} closed on {closed_at} and is excluded from current-state figures.
      Its history is intact and remains answerable — it appears in
      {transfer_references} transfer and purchase-order documents up to that
      date.

  # ---------------------------------------------------------------------------
  # The full guard every sales metric applies. Tools compose from this, and the
  # meta.filters_applied they return must name each clause included.
  standard_sales_guard:
    - "t.is_cancelled = false"
    - "t.transaction_type = 'Sale'"
    - "t.store_id IN :active_retail_store_ids"


# =============================================================================
# THE METRIC MODEL — what every trusted figure declares about itself
#
# Added 2026-09-07. Until then a metric was a SQL fragment with a unit, and
# what it WAS — base or derived, which business it measured, what it depended
# on — lived in prose comments a tool could not read and a test could not
# hold. The fields below are declared on every metric in every domain so that
# George, the tools and the tests can inspect a figure's identity without
# reading a comment. Additive by construction: see version_policy.
#
# EXECUTION STAYS DOMAIN-SPECIFIC. `metrics` (retail sales), `vending.metrics`
# and `purchasing.measures` keep their own sections, their own SQL aliases and
# their own group vocabularies, because the tables genuinely differ. This
# model describes applicability the same way everywhere; it does not force one
# execution schema on three businesses.
#
# THE SQL IS THE EXECUTABLE SOURCE OF TRUTH. A derived metric declares its
# `formula` — named dependencies and an operation — beside a vetted `sql`.
# Nothing composes the SQL from the formula at run time, and nothing accepts a
# formula from the model. The two are held together by a contract test
# (tests/test_metric_model_contract.py) that proves the SQL is literally the
# dependencies' SQL in the declared structure, that the dependencies exist in
# the same domain, that their grains agree, and that the derived metric's
# valid_group_by is no broader than their intersection. A formula and a SQL
# that drift apart fail that test rather than answer differently.
# =============================================================================
metric_model:
  # Required on every entry of every metric registry named in `registries`.
  required_fields: [kind, domain, display_name, sql, unit]
  kinds:
    base:    "one aggregate over one table — nothing computed from another metric"
    derived: "a deterministic combination of named base metrics; declares `formula`"
  # Where the registries live, and which domain each belongs to. A domain is
  # a business with its own tables; a metric applies to exactly one.
  registries:
    metrics:             {domain: retail_sales, tool: get_sales}
    vending.metrics:     {domain: vending,      tool: get_vending}
    purchasing.measures: {domain: purchasing,   tool: get_purchasing}
  derived:
    required_fields: [formula]
    operations:
      # numerator / denominator, guarded against a zero denominator in SQL and
      # reported as NULL — never as zero — when the denominator is zero.
      ratio:
        sql_template: "ROUND({numerator} / NULLIF({denominator}, 0), {decimal_places})"
        undefined_value: null
        undefined_notice_kind: ratio_undefined
    formula_source: definitions_only     # the model never submits a formula
  # Vending revenue per order is the vending-domain analogue of ATP and is NOT
  # defined here: its denominator is orders (COUNT(DISTINCT order_trade_no_in),
  # 1,481 against 1,909 lines in August 2026), its table is a different
  # business, and nobody has asked for it. Recorded so it is added as a
  # scoped vending metric when wanted, not by pointing ATP at the wrong table.
  candidates_not_defined:
    vending.revenue_per_order: "vending revenue / vending orders; a separate scoped metric, not ATP"


# =============================================================================
# METRICS
# =============================================================================
#
# THERE IS DELIBERATELY NO STORE-SIDE PROFIT METRIC. No cost is captured per
# line, so the documented formula would value historical sales at today's cost.
# Before adding one, read suppliers.store_profit_supported (false) and
# suppliers.store_profit_reason. Vending profit IS computable and lives in
# vending.metrics.profit, with a mandatory overstatement flag.
# =============================================================================
metrics:

  # ---------------------------------------------------------------------------
  net_sales:
    kind: base
    domain: retail_sales
    display_name: "Net sales"
    description: >
      Company or store level sales value. The transaction-level measure: the
      final amount of each completed, non-cancelled, non-return transaction at
      an active retail store.
    grain: transaction
    source_table: new_transactions
    sql: "SUM(t.total)"
    unit: PHP
    filters:
      - "t.is_cancelled = false"
      - "t.transaction_type = 'Sale'"
      - "t.store_id IN :active_retail_store_ids"
    date_column: "t.transaction_time"
    # A transaction total cannot be attributed to a line, so this metric may NOT
    # be grouped by product or category. Splitting t.total across the products
    # in a basket would invent a definition nobody agreed. Tools must REFUSE the
    # combination rather than answer it — see metrics.product_revenue for the
    # measure that is valid at that grain.
    valid_group_by: [store, hour, day, week, month]
    # DRIVERS — what a change in net_sales is explained by FIRST. Added
    # 2026-09-08 (Investigation V1). The relationship is not asserted here; it
    # is the trusted ATP definition rearranged: average_transaction_value is
    # net_sales / transaction_count, so net_sales is transaction_count x
    # average_transaction_value, and tests/test_investigation_contract.py holds
    # this list to that formula — one driver must be the derived metric whose
    # numerator is this metric, the other must be its denominator.
    #
    # READING IS QUALITATIVE. George reads change_pct off each driver's
    # compared row and names the one that moved more; he may NOT say what
    # share of the change each accounts for. Splitting a change in a product
    # between its factors has no unique answer (log, sequential and Shapley
    # decompositions all disagree), so a percentage attribution would be a
    # convention nobody agreed — a definition. Until one is chosen here and
    # computed in a tool, it is not a trusted figure. See `investigation`.
    drivers:
      introduced: "2026-09-08"
      components: [transaction_count, average_transaction_value]
      relation: product
      identity: "net_sales = transaction_count x average_transaction_value"
      derived_via: average_transaction_value
      reading: qualitative
      attribution_math: not_supported
      attribution_reason: >
        Splitting a change in a product of two factors between them has no
        unique answer; the split is a convention, which makes it a definition,
        and no definition has been chosen. George names the driver with the
        larger measured change_pct and never a share.
    # source: t.total is the measure used by every store-level example in
    #   business_rules.yaml (examples 2, 7, 8, 11, 12, 13, 15, 18, 20, 21, 23,
    #   25, 28, 31) and by the MANDATORY year-over-year template at
    #   sql_generator.py:494.
    #
    # resolves: business_rules.yaml:309 DECLARED revenue as SUM(ti.item_total)
    #   while essentially all of its own store-level SQL used SUM(t.total).
    #   Nothing said which was authoritative or when to use which.
    #   DECIDED: t.total is net_sales; ti.item_total is product_revenue, valid
    #   only at line grain. See metrics.product_revenue for the measured
    #   reconciliation — the two currently tie EXACTLY, because t.discount is
    #   zero on every row. The ambiguity was therefore latent rather than
    #   actively wrong, but it is still resolved here so that a future header
    #   discount does not silently split the two numbers.
    #   t.total = t.sub_total + t.tax (verified, August 2026).

  # ---------------------------------------------------------------------------
  product_revenue:
    kind: base
    domain: retail_sales
    display_name: "Product revenue"
    description: >
      Revenue attributed to a specific product, category or tag. The line-level
      measure — the only one that can be broken down below the transaction.
    grain: transaction_item
    source_table: new_transaction_items
    sql: "SUM(ti.item_total)"
    unit: PHP
    join: "INNER JOIN new_transactions t ON ti.transaction_ref_id = t.ref_id"
    filters:
      - "t.is_cancelled = false"
      - "t.transaction_type = 'Sale'"
      - "t.store_id IN :active_retail_store_ids"
    date_column: "t.transaction_time"
    # Line grain, so every grouping is valid.
    valid_group_by: [store, hour, day, week, month, product, category]
    # source: business_rules.yaml:309 (revenue_calculation) and :197
    #   (column_synonyms.revenue marks item_total "the correct column for
    #   revenue in transaction_items").
    #
    # resolves: the same net_sales/product_revenue split above, by naming both
    #   measures and scoping each to the grain it is valid at. It also enforces
    #   negative example 4 (business_rules.yaml:1228): new_transaction_items
    #   carries no date and no is_cancelled, so it MUST be joined to
    #   new_transactions before any filtering — the join is part of this
    #   definition, not left to the caller.
    #
    # RECONCILIATION — MEASURED ACROSS HISTORY. The two measures agree on recent
    # data and DISAGREE on 2024 data. Verified, 7 active stores, Manila windows:
    #
    #   window     net_sales       product_revenue   gap            discount
    #   Jun 2024   2,483,286.24    2,501,609.05      -18,322.81     29,188.87
    #   Jul 2024   4,256,511.81    4,209,769.48      +46,742.33      7,274.54
    #   Jun 2026   8,467,689.89    8,467,689.89            0.00          0.00
    #   Aug 2026   7,926,172.16    7,926,172.16            0.00          0.00
    #
    # CORRECTION TO AN EARLIER VERSION OF THIS FILE. It previously asserted
    #   ties_to_net_sales: true, ties_only_while: "SUM(t.discount) = 0"
    # on the strength of August 2026 alone. That is WRONG. The gap does not
    # equal the discount, and in June 2024 the gap is NEGATIVE — product_revenue
    # exceeds net_sales, which a header discount cannot cause. The true cause of
    # the 2024 divergence is not yet established (most likely line items whose
    # header is absent, or the reverse).
    #
    # SUM(t.discount) = 0 is therefore NECESSARY BUT NOT SUFFICIENT. A tool that
    # asserted only the discount would pass while the two measures sat ₱46,742
    # apart. Do not use it as the test.
    #
    # THE TEST is to compute both measures over the same window and filters and
    # compare them directly. tools/sales.py does this and reports the outcome in
    # meta.reconciliation. Note that 742 transactions across all history carry a
    # nonzero discount, concentrated in 2024-06..2024-08 plus one row in 2026-04.
    ties_to_net_sales: varies_by_window
    reconciliation_method: "compute both measures over the same window and filters; compare directly"
    discount_is_sufficient_test: false
    # Retained as a DIAGNOSTIC reported alongside the real comparison, never as
    # the test itself.
    discount_diagnostic_sql: "SUM(t.discount)"
    # Windows known to diverge, for regression testing.
    known_divergent_windows:
      - {start: "2024-06-01", end: "2024-07-01", gap: -18322.81}
      - {start: "2024-07-01", end: "2024-08-01", gap: 46742.33}

  # ---------------------------------------------------------------------------
  returns_value:
    kind: base
    domain: retail_sales
    display_name: "Returns value"
    description: >
      Value of returned transactions, reported on its own. NEVER subtracted
      from net_sales — see filters.returns.net_of_returns_supported.
    grain: transaction
    source_table: new_transactions
    sql: "SUM(t.total)"
    unit: PHP
    filters:
      - "t.is_cancelled = false"
      - "t.transaction_type = 'Return'"
      - "t.store_id IN :active_retail_store_ids"
    date_column: "t.transaction_time"
    # Transaction grain, same restriction as net_sales.
    valid_group_by: [store, hour, day, week, month]
    # source: live data — 54 Return rows, ₱35,407.40, all with positive totals.
    # resolves: makes returns visible as a figure instead of leaving them
    #   silently folded into revenue, without asserting a netting convention
    #   nobody has confirmed.

  # ---------------------------------------------------------------------------
  units_sold:
    kind: base
    domain: retail_sales
    display_name: "Units sold"
    description: "Number of units sold. Line grain."
    grain: transaction_item
    source_table: new_transaction_items
    sql: "SUM(ti.quantity)"
    unit: units
    join: "INNER JOIN new_transactions t ON ti.transaction_ref_id = t.ref_id"
    filters:
      - "t.is_cancelled = false"
      - "t.transaction_type = 'Sale'"
      - "t.store_id IN :active_retail_store_ids"
    date_column: "t.transaction_time"
    valid_group_by: [store, hour, day, week, month, product, category]
    # source: business_rules.yaml:312 (business_logic.units_sold) and :206-212
    #   (column_synonyms.units names `quantity` as the actual column).
    # ti.quantity is NUMERIC, not integer — weighted items sell in fractions
    # (observed range 1.000 to 96,320.000 across 891,714 line items, no NULLs).
    # Do not cast it to int.
    integral: false

  # ---------------------------------------------------------------------------
  transaction_count:
    kind: base
    domain: retail_sales
    display_name: "Transactions"
    description: >
      Number of distinct transactions. Transaction grain. When grouped by
      product or category the meaning CHANGES to "transactions containing this
      product/category" — a different question, and baskets spanning several
      groups are counted once in each.
    grain: transaction
    source_table: new_transactions
    sql: "COUNT(DISTINCT t.ref_id)"
    unit: transactions
    filters:
      - "t.is_cancelled = false"
      - "t.transaction_type = 'Sale'"
      - "t.store_id IN :active_retail_store_ids"
    date_column: "t.transaction_time"
    valid_group_by: [store, hour, day, week, month, product, category]
    # Grouping by product/category is permitted but redefines the metric, so a
    # tool MUST attach a notice saying so. Silently answering a different
    # question is the failure mode this entry exists to prevent.
    redefined_when_grouped_by: [product, category]
    redefinition_note: >
      Counting transactions that CONTAIN this product, not transactions OF this
      product. A basket holding three different products contributes 1 to each
      of the three rows, so these counts do not sum to the overall
      transaction count.
    # source: business_rules.yaml:313 (business_logic.transaction_count).
    #   COUNT(DISTINCT t.ref_id), not COUNT(*): ref_id is the transaction PK and
    #   a line-grain join multiplies header rows.
    #
    # MEASURED 2026-09-07: on the header table, rows and distinct ref_ids are
    # the same number (18,268 of each in August 2026), so this count is a
    # count of transactions and not of lines.
    #
    # ZERO-TOTAL SALES ARE TRANSACTIONS. 1,194 Sale rows across history carry
    # total = 0 (0.16%–1.05% of a month's transactions in 2026). Every line in
    # them is ₱0 with no discount and a zero sub_total — free seasonal items,
    # "Store supplies" and a few beverages rung through the till — not
    # discounted baskets. They satisfy this definition and are counted. That
    # decision is made HERE, once, and average_transaction_value inherits it:
    # excluding them would be a change to what a transaction is, not to ATP.
    zero_total_transactions_counted: true
    zero_total_diagnostic_sql: "COUNT(DISTINCT t.ref_id) FILTER (WHERE t.total = 0)"

  # ---------------------------------------------------------------------------
  # AVERAGE TRANSACTION VALUE — the first DERIVED metric. Added 2026-09-07.
  #
  # net_sales / transaction_count, over EXACTLY the guards both components
  # use: not cancelled, type Sale, active retail, half-open Manila window. It
  # is the trusted answer to "is the problem transactions or basket size?" —
  # a question George could previously only answer by dividing two figures in
  # prose, which is the one calculation this file exists to keep out of prose.
  #
  # WHAT WAS INSPECTED BEFORE WRITING THIS DOWN (live, 2026-09-07):
  #   - transaction_count is distinct transactions (see above), so the
  #     denominator is baskets, not lines.
  #   - Returns are outside both terms already (filters.returns), and no
  #     Return row links to the sale it reverses (sale_invoice_number is empty
  #     on all 52), so ATP is average SALE value and says so.
  #   - Zero-total Sale transactions stay in the denominator — decided on
  #     transaction_count, inherited here. Their count in the window is
  #     reported in meta.zero_total_transactions on every ATP result so the
  #     figure is inspectable, and NOT as a notice: a diagnostic is not a
  #     caveat.
  #   - The only channel value in 2026 retail data is OFFLINE_PAYMENTS, so
  #     there is no delivery channel to include or exclude.
  #   - Empty buckets are absent rows (gap_filled: false) so a grouped ATP
  #     never divides by zero. A whole window with no transactions returns
  #     NULL with a ratio_undefined notice — never zero. The legacy analytics
  #     code returned 0 there; that behaviour is rejected, not inherited.
  #   - Vending is a different business with a different denominator
  #     (orders, not transactions) and is NOT covered — see
  #     metric_model.candidates_not_defined.
  #   - FFR (restaurant) ATP cannot be assessed: see data_availability.ffr.
  #
  # Transaction grain, like both components, so product and category grouping
  # is refused exactly as net_sales refuses it — "ATP of baskets containing X"
  # would be a different definition nobody agreed.
  #
  # The SQL below is the executable definition. `formula` names what it is
  # made of; tests/test_metric_model_contract.py proves the two agree.
  # ---------------------------------------------------------------------------
  average_transaction_value:
    kind: derived
    domain: retail_sales
    display_name: "Average transaction value"
    introduced: "2026-09-07"
    description: >
      Average value of a sale transaction: net_sales divided by
      transaction_count over the same window, stores and guards. Transaction
      grain. Undefined (NULL, with a notice) when there are no qualifying
      transactions; never zero.
    grain: transaction
    source_table: new_transactions
    formula:
      operation: ratio
      numerator: net_sales
      denominator: transaction_count
      decimal_places_ref: currency.decimal_places
    sql: "ROUND(SUM(t.total) / NULLIF(COUNT(DISTINCT t.ref_id), 0), 2)"
    unit: PHP
    unit_per: transaction
    filters:
      - "t.is_cancelled = false"
      - "t.transaction_type = 'Sale'"
      - "t.store_id IN :active_retail_store_ids"
    date_column: "t.transaction_time"
    valid_group_by: [store, hour, day, week, month]
    # Not one of the two money measures the net_sales/product_revenue
    # reconciliation governs; a ratio has nothing to reconcile against.
    reconcilable: false
    undefined_when: "COUNT(DISTINCT t.ref_id) = 0"
    undefined_notice_kind: ratio_undefined
    diagnostics:
      zero_total_transactions: metrics.transaction_count.zero_total_diagnostic_sql


# =============================================================================
# METRIC SETS — guidance, not execution. Added 2026-09-07.
#
# Names the group of metrics a question like "how did Rockwell do last week?"
# is asking for, so George reads it here rather than guessing, and so the
# frontend can show the three figures under one heading when their calls
# agree on scope. NOTHING EXECUTES A SET: get_sales runs one metric per call,
# the loop runs the calls together, and the composition on screen is
# adjacency (resultShape.ts). A set that ran as one query would be a second
# calculation path, which is what this block must never become.
# =============================================================================
metric_sets:
  sales_headline:
    domain: retail_sales
    metrics: [net_sales, transaction_count, average_transaction_value]
    purpose: >
      What "how did <store> do <window>?" asks. Run each with the same
      date_range, filters and compare_to so the three figures share one scope.
    executes_nothing: true


# =============================================================================
# COMPARISONS — "vs what?", as a definition. Added 2026-09-07.
#
# A period-over-period figure has a baseline, and WHICH baseline is a business
# definition: brief.sales_vs_same_weekday rejected `previous_day` in favour of
# `same_weekday_last_week` after measuring both. Until this section existed the
# only comparison George could make outside the brief was arithmetic in prose,
# with no receipt for the baseline. Now a tool computes it, both windows go on
# the receipt, and the model reads change_pct rather than deriving it.
#
# ONE COMPARISON IN V1, deliberately. previous_period is the primitive every
# other period comparison is a variant of; the variants are listed below as
# NOT supported, with the reason, so they are added as decisions and not as
# synonyms. "previous week" and "previous month" are not separate kinds: they
# are previous_period applied to a week or a month window.
# =============================================================================
comparisons:
  previous_period:
    display_name: "vs previous period"
    introduced: "2026-09-07"
    applies_to: [get_sales]

    # THE TWO WINDOWS ARE THE SAME SHAPE. Same metric, same grouping, same
    # store filter, same guards; only the window moves. A comparison that
    # changed anything else would be comparing unlike populations, and the
    # tool refuses rather than does that (same_population_required).
    same_population_required: true

    # Explicit [start, end): the baseline is the equal-length half-open window
    # ending where the current one starts. 2026-08-24..2026-08-31 compares to
    # 2026-08-17..2026-08-24.
    explicit_window: shift_back_by_window_length
    # A closed preset: BOTH windows resolve through the preset's `relative`
    # block against the Manila date read in the same transaction, and the
    # baseline shifts back by the preset's own length in its own unit — so
    # last_month compares to the calendar month before it, whatever the day
    # counts, and last_7_days to the seven days before those.
    preset_window: shift_back_by_relative_length

    # A window still in progress (sales_day.presets.*.includes_partial_day)
    # is REFUSED: a partial week against a whole week is a drop by
    # construction, and the drag changes size with the hour the question is
    # asked. The refusal names the preset's closed_alternative. "Same elapsed
    # portion of last week" is a different comparison mode and is not built.
    partial_window_policy: refuse

    # Row fields the tool computes. change_pct is measured against the
    # ABSOLUTE baseline so its sign always agrees with change; a negative
    # baseline (none exists in retail sales today — no row has total < 0)
    # neither crashes nor becomes zero.
    row_fields: [value, baseline, change, change_pct, direction, unit, baseline_status]
    change_decimal_places: 2
    change_pct_decimal_places: 1
    change_pct_formula: "change / abs(baseline) * 100"
    directions: [up, down, flat]
    # Every row says what could and could not be compared. Precedence when
    # several apply: no_current, then no_baseline, then zero_baseline.
    baseline_statuses:
      ok:            "both periods have a figure and the baseline is nonzero"
      no_baseline:   "the baseline window returned no figure (NULL) — nothing to compare against"
      zero_baseline: "the baseline is exactly zero, so a percentage is undefined"
      no_current:    "the current window returned no figure; the baseline is reported alone"
    change_pct_null_when: [no_baseline, zero_baseline, no_current]
    change_null_when: [no_baseline, no_current]
    # A count of nothing is 0; a sum of nothing is NULL. So transaction_count
    # over an empty baseline is zero_baseline and net_sales over the same
    # window is no_baseline. Both are true and both are reported as such;
    # nothing coerces one into the other.
    empty_window_note: "SUM over no rows is NULL (no_baseline); COUNT over no rows is 0 (zero_baseline)"
    # Any row not `ok` raises this notice naming the subjects and why.
    incomplete_notice_kind: comparison_incomplete
    # When more subjects than this could not be compared, the notice names
    # this many per status and counts the rest: a product comparison can have
    # dozens of new or vanished products, and a notice that lists every one
    # buries the figures it qualifies.
    incomplete_notice_max_named: 5
    # Grouping allowed beside a comparison: none, or by SUBJECT — store,
    # product, category. Rows are matched on the subject's key. A time bucket
    # beside a comparison would mean each bucket against its own predecessor
    # — a lag series, which is the per_bucket_lag mode below and is not built,
    # and this list is what keeps it refused.
    #
    # product and category ADDED 2026-09-08 (Investigation V1). They are not
    # a lag series: the same two windows are read once each and matched per
    # subject, exactly as stores are. Whether a METRIC may be grouped that way
    # is still the metric's own valid_group_by — net_sales and
    # average_transaction_value are transaction grain and stay refused by
    # product; product_revenue and units_sold are line grain and are the
    # measures a product-level change is read from. "Which products are
    # driving it?" was unanswerable before this: the only route was two
    # rankings and a subtraction in prose, which is the one calculation this
    # file exists to keep out of prose.
    valid_group_by: [store, product, category]

    # RANKING A COMPARED RESULT. Added 2026-09-08. With top_n, `rank_by`
    # says which end of what is returned, and the ranking happens INSIDE the
    # tool AFTER current and baseline subjects have been matched — never by
    # the model over two lists.
    #
    # NOT BY change_pct. A tiny baseline makes a percentage enormous while
    # the money is trivial: PHP 40 to PHP 400 is +900% and irrelevant.
    # Ranking is by absolute change in the metric's own unit.
    #
    # NULL HANDLING IS EXPLICIT because it is where a ranking lies. A row
    # whose change is null (no_baseline, no_current) has nothing to rank by,
    # and letting a null sort first or last by accident would put a product
    # that simply did not trade at the top of "biggest drop". So under the two
    # change modes only rows with a NUMERIC change are ranked (ok, and
    # zero_baseline — whose change is the whole current value, a real gain
    # from nothing); the unranked subjects are counted by status in
    # meta.comparison.not_ranked, the largest of them named there by baseline
    # or by value, and the comparison_incomplete notice still fires over the
    # WHOLE matched set, not over the rows that survived the cut.
    rank_by:
      introduced: "2026-09-08"
      default: value
      requires_compare_to: true
      modes:
        value:
          order: "current value DESC (ranking.sales.ordering_with_top_n), in SQL, before matching"
          participates: "every subject in the current window; a subject absent from it is not ranked (meta.comparison.ranked_by_current)"
        biggest_drop:
          order: "change ASC — most negative first; ties by baseline DESC; nulls never ranked"
          participates: "rows with a numeric change: ok, zero_baseline"
          not_ranked: "no_current (traded in the baseline, not now — named in meta.comparison.not_ranked by baseline), no_baseline (new this window — counted there)"
        biggest_gain:
          order: "change DESC — most positive first; ties by value DESC; nulls never ranked"
          participates: "rows with a numeric change: ok, zero_baseline"
          not_ranked: "no_baseline (new this window — named in meta.comparison.not_ranked by value), no_current (counted there)"
      # How many unranked subjects are NAMED per status in meta.comparison.
      # The rest are counted. Deterministic order: by baseline for
      # no_current, by value for no_baseline, largest first.
      not_ranked_max_named: 10
      # Both windows are read whole for a change ranking, so a window with
      # more subjects than the tool's row cap cannot be ranked honestly and
      # is refused rather than ranked over a prefix.
      whole_set_required: true

  # ---------------------------------------------------------------------------
  # TWO MORE MODES, added 2026-09-12 (projection as definition). Each one
  # INHERITS previous_period — row fields, statuses, the change arithmetic,
  # the ranking, the grouping it allows — and changes ONLY where the two
  # windows sit. A comparison mode is a window rule and nothing else; the
  # tool merges the parent under the child, so a field typed here twice
  # would be a definition meaning two things.
  # ---------------------------------------------------------------------------
  to_date_same_elapsed:
    display_name: "vs the same point last period"
    introduced: "2026-09-12"
    applies_to: [get_sales]
    inherits: previous_period
    # THE PACE READ. "How is this week going?" used to be refused: a partial
    # week against a whole week is a fall by construction. The honest figure
    # is the same ELAPSED portion of the period before — Monday 00:00 to now
    # against last Monday 00:00 to the same weekday and hour — so the
    # comparison is like against like at any hour of the week. Both bounds
    # are Manila timestamps read in the same transaction, and the elapsed
    # share of the period goes on the receipt so a reader knows how much of
    # the week a figure covers.
    window_rule: same_elapsed_portion_of_the_period_before
    partial_window_policy: require     # a closed window has previous_period
    bounds: manila_timestamps
    # A DAY'S PERIOD BEFORE IS THE SAME WEEKDAY LAST WEEK, not yesterday.
    # brief.sales_vs_same_weekday measured why: day-over-day swings a median
    # 21.3%, the same weekday a week earlier 12.5%, and Sunday averages three
    # times Monday. Read from there, never typed here.
    day_baseline_offset: brief.sales_vs_same_weekday.baseline_offset_days
    # When the elapsed portion is longer than the whole of the period before
    # (the 30th of a 31-day month against a 28-day February), the baseline
    # is the whole of that period, and meta.comparison.elapsed says so.
    baseline_clamped_to_its_period: true
    # A figure for the period so far is not a figure for the whole period.
    # Extrapolating it is recorded below as not supported.
    reports: [of, elapsed_fraction, elapsed_seconds, baseline_clamped]
  same_weekday_last_week:
    display_name: "vs the same weekday last week"
    introduced: "2026-09-12"
    applies_to: [get_sales]
    inherits: previous_period
    # THE EXPECTATION READ for a day. What the brief judges every morning —
    # yesterday against the same weekday a week earlier — promoted to a read
    # George can make for any closed day or explicit window: the whole window
    # shifted back by the offset the brief measured. For a seven-day window it
    # is previous_period by another route; for one day it is the brief's own
    # comparison WITHOUT the brief's noise floor, because the floor belongs to
    # the judgement (attention, brief) and not to the figure.
    window_rule: shift_back_by_days
    offset_days: brief.sales_vs_same_weekday.baseline_offset_days
    partial_window_policy: refuse      # to_date_same_elapsed is the partial read

  not_supported:
    same_period_last_year:
      supported: false
      reason: >
        The estate is not the same shape a year apart — 5 stores traded in
        August 2025 against 7 in August 2026 — so a company-wide year-over-year
        figure compares different populations unless a same-store rule exists.
        Define that rule first, then add the comparison.
    # to_date_same_elapsed was listed here until 2026-09-12; it is now a mode.
    full_period_extrapolation:
      supported: false
      reason: >
        "on pace for PHP X this week" divides the figure so far by the share
        of the period elapsed, which assumes the rest of the week sells like
        the part that has — a convention nobody chose, and the afternoon does
        not sell like the morning. to_date_same_elapsed says where the period
        stands against the same point in the period before, which is a fact.
    per_bucket_lag:
      supported: false
      reason: "each bucket against its predecessor is a lag series; the chart of the series already shows it"
    custom_baseline:
      supported: false
      reason: "an arbitrary baseline window is a definition supplied by the caller, which this file forbids"


# =============================================================================
# INVESTIGATION — how George reasons about "why", as a definition. Added
# 2026-09-08 (Investigation V1).
#
# NOTHING HERE EXECUTES. An investigation is reasoning behaviour inside an
# ordinary conversation: no planner, no table, no workflow, no page type, no
# composite tool. The loop stays model -> tool call -> answer (CLAUDE.md rule
# 5). What this section holds is the VOCABULARY George is given — the ladder,
# where each rung reads from, when to stop, and what he may and may not say —
# so that the prompt is built from definitions rather than typed, and so a
# change of mind here is one edit.
#
# The ladder is conceptual. "Is it transactions or ATP?" is verify and
# decompose, and stops. "Why is Rockwell down?" may reach localize. Nothing
# runs every rung for every question.
# =============================================================================
investigation:
  introduced: "2026-09-08"
  executes_nothing: true

  # The five rungs, in order. Each names what it establishes and which
  # trusted read establishes it. `reads` are get_sales argument shapes; the
  # window, filters and compare_to are the primary fact's, unchanged.
  ladder:
    verify:
      establishes: "whether the claimed change is real, in the asked metric, over a closed window, against previous_period"
      read: "the asked metric with compare_to='previous_period', scoped to the store named"
      on_false_premise: stop
    decompose:
      establishes: "which declared driver moved more"
      read: "each metric in metrics.<metric>.drivers.components with the SAME date_range, filters and compare_to, in one batch"
      reading: "the driver whose change_pct is larger in magnitude is the stronger MEASURED driver; similar magnitudes mean both moved and no single driver is named"
    localize:
      establishes: "where the change is concentrated"
      reads:
        store:    "the same metric, group_by='store', same compare_to"
        product:  "product_revenue (or units_sold) group_by='product', same window and compare_to, top_n with rank_by='biggest_drop' or 'biggest_gain'"
        category: "product_revenue (or units_sold) group_by='category', same window and compare_to, rank_by as above"
        time:     "the same metric group_by='day' WITHOUT compare_to — a series to characterise, never to difference"
      rule: "one grouped or ranked call per dimension, never one call per subject"
    explain:
      establishes: "what the reads establish, said as what they are"
      registers:
        fact:           "a figure on a row — 'down 12.1%'"
        derived_fact:   "a figure a tool computed from others — ATP, change_pct"
        inference:      "a reading of measured figures — 'so basket value is the stronger measured driver'"
        recommendation: "the next check — 'product-level comparison would be the next useful check'"
      causality: >
        Localization is not cause. "The largest measured revenue declines
        were A and B" is a fact; "customers switched away from premium
        products" and "A caused the ATP decline" are causes, and a cause
        may be stated only when the evidence that supports it is in the
        conversation.
    next:
      establishes: "what would need to be read to go further, when the reads cannot"
      one_line: true

  # Driver reading in V1 is qualitative and there is NO numeric threshold for
  # "similar". A threshold would make George subtract two percentages, and a
  # tool that compared metrics across calls would execute a metric set, which
  # metric_sets forbids. Clear cases are held by behavioural evals; if they
  # show he cannot tell dominant from mixed movement, that is reported, not
  # patched with a number invented on a branch.
  driver_reading: qualitative

  # HOW WIDE TO INVESTIGATE, AND WHO DECIDES (2026-09-09, UNDERSTAND).
  #
  # Until now one rule governed every question: the smallest surface that
  # completely answers it. That is right for "how did OPUS do last week?"
  # and wrong for "how are we doing?" — a broad intent answered narrowly
  # reads as an assistant waiting to be told where to look, and the person
  # then has to name the store, the metric and the dimension themselves.
  # Having to name them is the product failing, not the person helping.
  #
  # So SCOPE is declared, and it decides the read POLICY. It does not decide
  # what is presented: a broad investigation still resolves to a few
  # findings, never a dashboard. Investigate broadly, present narrowly.
  #
  # EXECUTES NOTHING. This is prompt vocabulary, exactly like `ladder` above.
  # There is no classifier, no planner and no branch in the loop — the model
  # reads its own intent against these descriptions, the same way it already
  # decides whether a question is an investigation at all.
  scope:
    executes_nothing: true
    kinds:
      broad:
        means: >
          the message names no subject, no metric and no dimension, or names
          the business as a whole
        reads: >
          the sales_headline metric set grouped by store over a closed window
          with compare_to='previous_period' — one grouped call per metric,
          never one per store — and then ONE localization on whichever driver
          moved more
        grouped_not_fanned_out: true
        max_reads: 5
        never: >
          a read per subject; a second window; a metric no finding rests on
        # A GROUP TOTAL IS A READ, NOT A SUM (2026-09-09, from the live
        # dogfood). A store-grouped read returns one row per shop and NO
        # total: `meta` carries the window, the comparison and the row count,
        # and nothing that adds the rows up. The first live broad answer said
        # "across the group" with a figure, which is a calculation in prose —
        # and a calculation in prose has no receipt (architecture rule 9).
        # `group_by: []` is how the estate's own total is read, and it is the
        # only way that figure may be stated.
        estate_total_read_with: 'group_by: []'
        never_summed_in_prose: true
      focused:
        means: the message names a subject, a metric, a dimension or a window
        reads: the smallest set that completely answers it
        max_reads: 4
      ambiguous:
        means: >
          the message is short or referential and could be either — "why?",
          "products", "show me", "is that bad?"
        resolve_from:
          - the selection on the desk
          - the subjects the workspace is drawing
          - the window the work is on
          - the reads already in this conversation
        ask_only_when: >
          the workspace cannot settle it AND the two readings would send
          different reads to the database
        clarification_is_not_the_default: true
    presentation:
      findings_min: 2
      findings_max: 4
      # A finding is a reading of rows a tool returned about ONE subject. It
      # is not a second primary fact: a broad read produces several findings
      # from the SAME grouped call, which is why the one-primary rule in
      # agent/findings.py is untouched.
      from_the_same_primary: true
      never_manufactured_to_fill_the_range: true
      no_synthetic_score: true

  # A MESSAGE IS NOT ALWAYS A QUESTION (2026-09-09, UNDERSTAND).
  #
  # The prompt described questions and answers and nothing else, so an
  # observation had no defined behaviour and was answered as though it had
  # been asked. These are the five things a person actually sends, and what
  # each one means for the next read. Prompt vocabulary; executes nothing.
  message_kinds:
    executes_nothing: true
    kinds:
      question: answer it
      intent: >
        a goal rather than a question — investigate what it implies and
        report what the data establishes about it
      instruction: >
        do the thing, using the workspace as its scope; do not restate it
        back as a question
      observation: >
        a claim about the business — VERIFY it first, exactly as the ladder
        verifies a premise, and say plainly when it does not hold
      correction: >
        the previous reading was wrong or misread — accept it, re-read what
        it changes, and do not defend the earlier answer
      steering: >
        a narrowing or widening of the work on screen — apply it to the
        current investigation rather than starting a new one
      morning: >
        "what should I look at", "what changed", "anything I should know",
        the day's opening — read get_attention ONCE and answer one line per
        thing that changed, ranked as it ranks them; when it is silent, say
        so in one line and stop, and name a blind sense rather than letting
        its silence read as calm
  attribution_math: not_supported
  dominance_threshold: none
  dominance_threshold_reason: >
    A percentage-point threshold is a business definition nobody has set,
    and applying one would be arithmetic in prose. George names the driver
    that moved more and says "both moved" when they are close.

  # When George stops. Any one of these is enough.
  stop_when:
    - "the premise is false — the figure is up, flat, or the comparison is missing"
    - "one driver clearly dominates and nothing further was asked"
    - "the next decomposition is unsupported by any tool, or a tool refused it"
    - "the evidence is mixed"
    - "a further read would repeat one already made this turn"
    - "the available reads cannot establish cause"

  # A statement of what the evidence establishes, what it does not, and the
  # next check is PART OF THE ANSWER. It is not a volunteered fact and the
  # volunteering cap does not count it (volunteering.not_counted).
  limitation_statement_is_answer: true

  # A page read is evidence. A pin that already carries a comparison — metric,
  # window, baseline, receipts, freshness — is a verified primary fact, and a
  # compared pin is not re-read merely because an investigation is under way.
  # Fresh reads are for dimensions the page does not show.
  page_evidence:
    compared_pin_is_verified: true
    reread_compared_pin: never_merely_to_investigate


# =============================================================================
# DATA AVAILABILITY — what George cannot measure because the data is not here
# =============================================================================
data_availability:
  # Recorded 2026-09-07 after probing the production database as george_ro.
  # The FFR (restaurant) business — its stores, transactions, line items,
  # drink/side/rice roles and the rules about free and paid beverages — does
  # not exist in this database in any form: no store rows, no tables, no
  # products, no categories. "FFR Overview" appears only as a placeholder page
  # name in test fixtures. Nothing FFR-specific is defined, stubbed or
  # exampled anywhere in George until an authoritative FFR source arrives.
  ffr:
    available: false
    verified: "2026-09-07"
    blocked_metrics: [ffr_atp, drink_attachment, side_attachment, rice_mix]
    requires:
      - "FFR stores, listed here with ids the way stores.active_retail lists candy stores"
      - "FFR transactions and line items in tables George's role can read"
      - "product/category ROLES (drink, side, rice, main) as data, not prose"
      - "the business-rule mappings (free vs paid beverages, water, siomai, side exclusions) as entries in this file, sourced from the business"
      - "a decided attachment denominator (transactions containing X vs all transactions)"
    milestone: "separate future data-source milestone; not this branch"


# =============================================================================
# INVENTORY STATE — one stockout definition
# =============================================================================
inventory:
  source_table: inventory          # current state only; no history
  history_table: inventory_snapshots
  # inventory_snapshots columns are EXACTLY: store_id, product_id, snapshot_date,
  # quantity_on_hand, created_at. There is no prev_quantity or delta column;
  # prior-day values come from LAG(quantity_on_hand) OVER (PARTITION BY
  # store_id, product_id ORDER BY snapshot_date) inside a CTE.
  # source: sql_generator.py:444.

  # ---------------------------------------------------------------------------
  # ONE definition. The three states are mutually exclusive and evaluated in the
  # order listed, so exactly one applies to any row.
  #
  # NEGATIVE ON-HAND IS DECIDED: quantity_on_hand < 0 counts as OUT OF STOCK.
  # A negative balance is a data error, but the shelf is empty either way.
  # Treating it as anything else hides a real outage behind a bookkeeping fault,
  # which is the more expensive mistake.
  #
  # source: sql_generator.py:440-442 (the prompt's `<= 0` / `> 0` / low-stock
  #   rules) — the prompt's boundary is adopted, the yaml example's is not.
  #
  # resolves: THREE contradictions in and around business_rules.yaml example 5.
  #   1. sql_generator.py:441 defined out-of-stock as `quantity_on_hand <= 0`
  #      while business_rules.yaml:436 used `quantity_on_hand = 0`. Negative
  #      stock was a stockout under one rule and invisible under the other.
  #      DECIDED: <= 0.
  #   2. business_rules.yaml:433-437 ordered its CASE with the LOW STOCK branch
  #      FIRST, so any row with quantity_on_hand = 0 and a non-null
  #      warning_stock >= 0 was labelled 'LOW STOCK' and never reached the
  #      'OUT OF STOCK' branch — that branch was unreachable, and every real
  #      stockout was mislabelled. Ordering out_of_stock first fixes it.
  #   3. business_rules.yaml:441 defaulted a missing warning_stock to 10 via
  #      COALESCE; sql_generator.py:442 applied no default. Products with a null
  #      threshold appeared in one result set and not the other. See below.
  states:
    - name: out_of_stock
      sql: "i.quantity_on_hand <= 0"
      order: 1
    - name: low_stock
      sql: "i.quantity_on_hand > 0 AND i.warning_stock IS NOT NULL AND i.quantity_on_hand <= i.warning_stock"
      order: 2
    - name: in_stock
      sql: "i.quantity_on_hand > 0 AND (i.warning_stock IS NULL OR i.quantity_on_hand > i.warning_stock)"
      order: 3

  # DELIBERATELY NULL. A product with no warning_stock has no low-stock
  # threshold and is therefore never "low stock" — it is in_stock, and the
  # missing_threshold flag surfaces it so the gap is visible rather than papered
  # over. The old COALESCE(warning_stock, 10) invented a business rule that
  # nobody set; if the business wants a floor, it is changed HERE, once.
  low_stock_threshold_default: null
  missing_threshold_flag_sql: "i.warning_stock IS NULL"

  # ---------------------------------------------------------------------------
  # MEASURED STATE OF THIS TABLE — 2026-09-01, all 31,617 inventory rows:
  #   warning_stock IS NULL on 31,617 rows (100%). Zero rows have a threshold.
  #   ideal_stock  > 0 on 0 rows.
  #   out_of_stock = 27,648 (87.4%), of which 2,413 are NEGATIVE on-hand.
  #   low_stock    = 0        in_stock = 3,969
  #   States verified mutually exclusive and total (27,648 + 0 + 3,969 = 31,617).
  #
  # CONSEQUENCE, STATED PLAINLY: low_stock currently matches ZERO rows and will
  # keep doing so until warning_stock is populated. This is not a bug in the
  # definition — it is the honest result of the thresholds never being set.
  #
  # It also explains business_rules.yaml:441's COALESCE(warning_stock, 10):
  # that default was the ONLY reason the old low-stock report ever returned
  # anything. Every "low stock" answer the old chatbot gave was driven by an
  # invented constant of 10, not by a threshold anyone configured.
  #
  # A tool answering a low-stock question MUST say the thresholds are unset
  # rather than return an empty list as though nothing were low. Do not restore
  # a default to make the report non-empty — populate warning_stock, or agree a
  # real floor with the business and set it here.
  #
  # ---------------------------------------------------------------------------
  # CORRECTED 2026-09-09. Everything above is true of the COLUMN and was being
  # read as true of the BUSINESS, which it is not.
  #
  # `inventory.warning_stock` is indeed NULL on all 31,716 rows. Meanwhile
  # `shipment_plans` holds 125,283 rows across 59 run dates, most recently
  # 2026-09-06, covering 18 stores and 3,257 SKUs — and min_level, max_level,
  # safety_stock and days_of_stock are populated on every single one of them.
  # There is a replenishment engine computing stock levels per SKU per store,
  # and it ran three days before this note was written.
  #
  # So "nobody has ever set a threshold" was a sentence George said many times
  # while a system next door was setting them daily. The lesson is not about
  # low stock: a limitation measured on one column was recorded as a fact about
  # the company, and every design decision downstream inherited it.
  #
  # What is NOT being changed here, deliberately: `low_stock` still means
  # inventory.warning_stock, and it is still not operational. shipment_plans
  # min_level is a REPLENISHMENT level computed by an algorithm, not a
  # threshold the business agreed as "low", and quietly redefining low_stock to
  # mean it would be inventing a business rule in exactly the way this file
  # exists to prevent. The pointer below is a fact, not a definition.
  # ---------------------------------------------------------------------------
  low_stock_thresholds_elsewhere:
    table: shipment_plans
    columns: [min_level, max_level, safety_stock, days_of_stock]
    populated_rows: 125283
    run_dates: 59
    latest_run: "2026-09-06"
    stores: 18
    skus: 3257
    is_a_low_stock_definition: false
    note: >
      Say this when refusing a low-stock question: the thresholds on the
      inventory table were never set, AND a replenishment plan with its own
      levels exists and can be read instead. Refusing without mentioning it
      leaves the user believing the business has no stock levels at all.

  low_stock_operational: false
  # TWO AUDIENCES, AND UNTIL 2026-09-13 THERE WAS ONE. `reason` is interpolated
  # into the low_stock_not_operational notice's `message`, which UI rule 4 puts
  # above the figures a person reads — and which the loop appends VERBATIM when
  # the caveat has to be forced into an answer. Its value that morning was
  # "inventory.warning_stock is NULL on 100% of rows", and it reached an answer
  # in exactly that way: a column name, in the reader's own caveat, for a
  # person who has never heard of the table. So `reason` is the reader's
  # sentence and names nothing internal; `detail` is the same fact in the
  # schema's words and reaches the model as the notice's `guidance`, which is
  # never rendered (notices.contract).
  low_stock_blocked_reason: "the low-stock level has never been set on any product"
  low_stock_blocked_detail: "inventory.warning_stock is NULL on 100% of rows"

  # Inventory questions use their own store scope — the warehouse holds stock.
  # source: the live store_filters table's inventory scope, plus filters.excluded_from_sales.
  #
  # resolves: this was previously the prose string
  #   "active_retail + filters.excluded_from_sales.inventory_scope_store_ids"
  # which no tool could read without parsing an ad-hoc expression — a violation
  # of the rule this file exists to enforce (tools READ definitions, they do not
  # interpret them). It is now a literal list. Keep it literal.
  scope_store_ids:
    - "6639efd54694700008d7ccc6"   # Rockwell
    - "668023c94721460006092609"   # Fairview
    - "668a43f60fa9990007cfa158"   # Greenhills
    - "66cfff31aa7adf0007c9de41"   # North Edsa
    - "67612230a740d90007464e26"   # Magnolia
    - "68c5bb269da1d500073690c2"   # OPUS
    - "69c73fcb277aa600076dfaaa"   # Shang
    - "667bde393126e50006c8058c"   # AJI BARN — warehouse, inventory scope only

  # ---------------------------------------------------------------------------
  # STOCK HISTORY. Added 2026-09-09.
  #
  # This section exists because the note that stood here said a stockout EVENT
  # or DURATION needs a definition built on inventory_snapshots and must not be
  # improvised in a tool. It is that definition.
  #
  # MEASURED STATE OF inventory_snapshots — 2026-09-09, all 5,133,521 rows:
  #   188 distinct snapshot_date values, 2026-02-13 -> 2026-09-08, across 208
  #     calendar days: FIVE gaps, the longest 14 days (resumed 2026-04-07).
  #   9 locations, and they do not all start together — six shops from
  #     2026-02-13, AJI BARN and AJI CMG from 2026-03-23, Shangri-La from
  #     2026-04-07. An early "gap" for a shop is often the shop not existing
  #     in the file yet, which is not the same fact as a missing day.
  #   31,767 (store, product) pairs. Only 2,170 appear on all 188 days; the
  #     average pair appears on 162 of them.
  #   quantity_on_hand: 4,122,054 rows are zero, and 370,703 are NEGATIVE
  #     (7.2%), the lowest being -24,734,969 at AJI BARN. Negatives are NOT a
  #     historic artifact — they grow every month, from 18,271 in February to
  #     72,132 in August.
  #   The most recent 60 observed days (2026-07-11 -> 2026-09-08) cover 60
  #     calendar days with no gap at all. Recent history is clean; the early
  #     months are not, and a result must say which it drew on.
  # ---------------------------------------------------------------------------
  history:
    table: inventory_snapshots
    grain: [store_id, product_id, snapshot_date]

    # A DAY WITH NO ROW IS UNOBSERVED, NEVER ZERO. The average pair is absent
    # on 26 of 188 days. A tool reading absence as "no stock" would invent a
    # stockout on every one of them, and the invented ones would outnumber the
    # real ones. Absence and zero are different facts and are counted
    # separately on every result.
    absent_day_means: unobserved

    # A RUN COUNTS CONSECUTIVE OBSERVED DAYS ONLY. A missing day ends a run; it
    # is never bridged and never interpolated. `observed_days` and
    # `calendar_days` both travel on every result, so a run is always read
    # against the coverage that produced it.
    run_spans_gaps: false
    # Applied where the day columns are already projected, so the columns are
    # bare rather than aliased to the snapshot table.
    run_break_sql: "prev_day IS NULL OR prev_day <> snapshot_date - 1"

    # NEGATIVE ON HAND IS A FAULT, NOT A LEVEL. Minus 24.7 million is not a
    # stock position, and one such row destroys any total it enters. A negative
    # row counts as not-in-stock for state purposes — it is certainly not
    # sellable — is never summed into a quantity, and is always named.
    negative_on_hand:
      is_a_fault: true
      counts_as: out_of_stock
      exclude_from_sums: true
      notice_kind: negative_on_hand
      notice_mandatory: true

    # What "out of stock" means for a HISTORY row. inventory.states cannot be
    # reused unchanged, because its low_stock branch keys off warning_stock and
    # inventory_snapshots has no such column.
    out_of_stock_sql: "s.quantity_on_hand <= 0"

    # Coverage is mandatory. "Out of stock for 9 days" means nothing without
    # the number of days actually observed behind it.
    coverage_mandatory: true
    coverage_notice_kind: history_coverage

    # The default window, in observed days back from the latest one in the
    # file. Chosen because the most recent 60 observed days are continuous.
    default_window_days: 30
    max_window_days: 400

    # THE BOUND IS ON WORK, NOT ON CALENDAR. A run has to be computed over
    # every row in the window, so the cost is days x locations. 30 days across
    # all 8 locations is 240 store-days and returns comfortably; 200 days
    # across 8 is 1,600 and is killed by the statement timeout, which reaches
    # the caller as a crash instead of an answer. A long window over ONE shop
    # is cheap and stays allowed, which is why the bound is not a day count.
    max_store_days: 400

    # How the stockout view may be ranked. Name -> the ORDER BY the database
    # applies over the WHOLE set before the limit, so the model never sorts
    # rows itself. Ranked by day counts, never by a percentage: a product
    # observed twice would otherwise outrank one observed every day.
    rank_modes:
      longest_out: "longest_stockout_run DESC, days_out_of_stock DESC"
      still_out: "current_stockout_run DESC, days_out_of_stock DESC"
      most_days_out: "days_out_of_stock DESC, longest_stockout_run DESC"

    views:
      stockouts: "one row per store and product: observed days, days out, longest and current run"
      series:    "one row per observed day for a single product at a single store"
      coverage:  "one row per store: which days exist in the window and which do not"

  # SUPERSEDED 2026-09-09 by inventory.history above, which defines a stockout
  # run over observed days. The key is kept so nothing reading it breaks.
  stockout_duration_supported: true


# =============================================================================
# REPLENISHMENT — the plan the business already runs on
#
# Added 2026-09-09. shipment_plans is written by
# backend/app/services/replenishment_service.py, so every meaning below is read
# out of that generator rather than inferred from the column names.
#
# WHY THIS SECTION MATTERS BEYOND ITS FIGURES. Until today this file recorded
# "no low-stock threshold has ever been set" as a fact about the business. That
# is true of inventory.warning_stock and false about the company: the table
# below has held computed min and max levels per SKU per store since January.
# A limitation measured on one column had been recorded as a limitation of the
# business, and every design decision downstream inherited it.
#
# MEASURED STATE — 2026-09-09, all 125,283 rows:
#   59 run dates, 2026-01-29 -> 2026-09-06. Runs are IRREGULAR, roughly weekly,
#     and some cover a single store (2026-08-06 and 2026-08-26 each covered one).
#   The latest run, 2026-09-06, is 3,076 lines across all 7 retail shops and
#     780 SKUs; 1,623 lines ask for stock. Every line resolves to a real
#     product and a real store.
#   Two algorithms: `legacy` on 113,054 rows and `percentile` on 12,229. Only
#     the percentile rows carry abc_class, segment, service_quantile and
#     needs_count; on every legacy row those four are NULL.
#   calculation_mode: fallback 75,361, snapshot 36,589, percentile 12,229,
#     unified 977, auto 127.
#   days_of_stock in the latest run: median 13.9, p90 420, maximum 419,916, and
#     1,128 of 3,076 lines are zero. The tail is not a real cover figure.
# =============================================================================
replenishment:
  source_table: shipment_plans
  generated_by: backend/app/services/replenishment_service.py
  review_period_days: 7          # REVIEW_PERIOD_DAYS in the service
  warehouse_store_id: "667bde393126e50006c8058c"   # AJI BARN ships the stores
  # Why asking for a plan FOR the warehouse is refused. A plan is written
  # for a destination, and BARN is where the stock ships from.
  warehouse_excluded_reason: >-
    AJI BARN is the warehouse a replenishment plan ships FROM, never a
    destination it is written for.

  # HOW A LINE IS SIZED, transcribed from the service so a tool never restates
  # it differently. season_adj_sales is the seasonality-adjusted daily rate and
  # the tier parameters come from store_tiers.
  formulas:
    safety_stock: "season_adjusted_daily_sales * tier.safety_days"
    min_level: "(season_adjusted_daily_sales * tier.target_cover_days) + safety_stock"
    max_level: "season_adjusted_daily_sales * tier.max_cover_days"
    final_max: "min(max_level, expiry_cap) when expiry_cap > 0, else max_level"
    requested_ship_qty: "max(0, ceil(min_level - on_hand))"

  # A RUN IS AN EVENT, NOT A DAY. Runs are irregular and some cover one store.
  # A tool must name the run it read and say how much of the estate it covered,
  # or a single-store plan reads as the whole company's.
  runs_are_regular: false
  partial_run_notice_kind: replenishment_partial_run
  stale_run_notice_kind: replenishment_run_stale
  stale_after_days: 10

  # ALLOCATION IS NOT INDEPENDENT EVIDENCE. The service sets
  # allocated_ship_qty = requested_ship_qty as its default ("Default: full
  # allocation", replenishment_service.py). The two being equal therefore means
  # nothing was allocated away — it does NOT mean a shipment was confirmed, and
  # allocated must never be reported as what actually shipped. What actually
  # moved is stock_transfers, which is a different question and a different tool.
  allocation:
    defaults_to_requested: true
    is_evidence_of_shipment: false
    notice_kind: replenishment_allocation_not_binding

  # THE TWO ALGORITHMS ARE NOT INTERCHANGEABLE. `percentile` carries an ABC
  # class, a segment and a service quantile; `legacy` carries none of them, and
  # on a legacy row those columns are NULL rather than unknown-but-existing. A
  # result mixing both must say so rather than showing four mostly-empty
  # columns as though the data were missing.
  algorithms:
    known: [legacy, percentile]
    percentile_only_columns: [abc_class, segment, service_quantile, needs_count]
    mixed_notice_kind: replenishment_mixed_algorithms

  # CALCULATION MODE CHANGES WHAT THE VELOCITY MEANS. The service computes a
  # daily rate over ACTIVE days — days the product had stock, or sold — so a
  # product is not marked slow merely for having been unavailable
  # (_get_daily_sales, "Active day = snapshot shows stock > 0 OR a sale occurred
  # that day"). `fallback` is the path taken when snapshot history is too thin
  # for that, and it is the majority of rows. A plan read without knowing which
  # mode produced it can understate demand for exactly the products that were
  # out of stock, which is the failure this whole domain is about.
  calculation_modes:
    known: [snapshot, fallback, percentile, unified, auto]
    uses_active_days: [snapshot, unified, auto, percentile]
    understates_stockouts: [fallback]
    notice_kind: replenishment_fallback_velocity

  # ON HAND CAN BE NEGATIVE, AND THE SIZING USES IT DIRECTLY.
  #
  # requested_ship_qty = max(0, ceil(min_level - on_hand)). A negative on_hand
  # therefore INFLATES the request by its own magnitude: a line whose shop
  # records -174,877 on hand asks for the min level PLUS 174,877, and the
  # engine has no way to tell a broken record from a real deficit.
  #
  # MEASURED on the 2026-09-06 run: 662 of 3,076 lines carry a negative on
  # hand, 640 of them are ordering, and those lines account for 59,715 of the
  # 95,799 units requested — 62% of the plan. Across all 59 runs, 25,086 of
  # 125,283 lines. This is the same corruption inventory_snapshots carries
  # (inventory.history.negative_on_hand), arriving in the plan that is acted on.
  #
  # A result must say so. This is not a footnote about data quality: it is the
  # reason the biggest lines in the plan are the biggest.
  negative_on_hand:
    inflates_request: true
    formula_note: "requested_ship_qty = max(0, ceil(min_level - on_hand))"
    notice_kind: replenishment_negative_on_hand
    notice_mandatory: true

  # days_of_stock IS NOT A TRUSTWORTHY COVER FIGURE AT THE TAIL. Median 13.9 in
  # the latest run, p90 420, maximum 419,916 — a product with a trickle of
  # sales and any stock at all produces an enormous number. It is reported as
  # the engine computed it and is never ranked on, never averaged, and never
  # summed.
  days_of_stock:
    trustworthy_at_tail: false
    absurd_above: 3650
    rankable: false
    notice_kind: replenishment_days_of_stock_tail

  # How the plan may be ranked. Name -> the ORDER BY applied over the whole set
  # before any limit, so the model never sorts rows itself. Ranked on units and
  # on the engine's own priority score, never on days_of_stock.
  rank_modes:
    most_requested: "p.requested_ship_qty DESC NULLS LAST"
    highest_priority: "p.priority_score DESC NULLS LAST"
    biggest_shortfall: "(p.min_level - p.on_hand) DESC NULLS LAST"

  views:
    plan: "one row per store and SKU in the run: what the engine wants shipped and the levels behind it"
    summary: "one row per store: lines, lines wanting stock, and units requested"
    runs: "one row per run: when it ran, how many stores it covered, how many lines"

  max_rows: 500


# =============================================================================
# PRODUCT CATALOG
# =============================================================================
products:
  source_table: products
  # 3,678 rows as of 2026-09-01. `embedding` is a pgvector column and is
  # entirely NULL — never select it, and never SELECT *.

  # ---------------------------------------------------------------------------
  # CATEGORY NORMALIZATION. Blank and NULL both mean "not categorised" and must
  # collapse to one visible bucket, never be dropped.
  #
  # source: business_rules.yaml:451 and :799 used COALESCE(p.category,
  #   'Uncategorized'); the NULLIF is added because the column holds BOTH NULL
  #   and empty string, and a bare COALESCE leaves '' as its own silent group.
  #   83 of 3,678 products are uncategorised.
  #
  # resolves: this expression was HARDCODED in tools/sales.py
  #   (_group_expressions), which is precisely what this file exists to prevent
  #   — a definition living in a tool drifts from every other tool that needs
  #   it. tools/sales.py and tools/products.py now both read it from here.
  # ---------------------------------------------------------------------------
  category_normalization:
    sql: "COALESCE(NULLIF(p.category, ''), 'Uncategorized')"
    uncategorized_label: "Uncategorized"

  # ---------------------------------------------------------------------------
  # SKU IS NOT UNIQUE. 3,678 products share 3,610 distinct case-insensitive
  # SKUs — 68 collide. The colliding rows are UNRELATED products, not variants:
  #
  #   Tky105  hokka Gudetama biscuits              indi      PHP 133.04
  #   tky105  Pikachu figure limited edition candy  seasonal  PHP 891.96
  #   TKY105  Dars Dark chocolate 42g               choco     PHP  88.39
  #
  # source: live products table, 2026-09-01.
  #
  # POLICY — a SKU that resolves to more than one product MUST NOT be summed
  # into a single figure. A tool either returns the matches separately (one row
  # per product, so the caller can see all three) or REFUSES and names the
  # collision. It must never silently aggregate them.
  #
  # resolves: tools/sales.py and tools/inventory.py both filtered with
  #   `lower(p.sku) = lower(:sku)`. In sales.py, a SKU filter without a product
  #   grouping summed all three of the above into one number that belongs to no
  #   product. Callers disambiguate with the product_id filter.
  # ---------------------------------------------------------------------------
  sku:
    unique: false
    match: case_insensitive
    ambiguity_policy: separate_or_refuse
    disambiguate_with: product_id

    # -------------------------------------------------------------------------
    # TWO MATCHING RULES, ONE FOR EACH DIRECTION. They are not in conflict; they
    # serve different callers.
    #
    #   match (case_insensitive)  — a HUMAN typing a SKU at George. A person who
    #     types "tky105" should not get an empty result because the catalog
    #     stores "TKY105". The ambiguity_policy above is what keeps this safe:
    #     a case-insensitive hit on more than one product is separated or
    #     refused, never summed.
    #
    #   import_match (case_sensitive) — a MACHINE joining an exported SKU string
    #     to products.sku. There is no user to disambiguate for and no prompt to
    #     return to; the join either lands on the right product row or silently
    #     attributes a purchase cost to the wrong one.
    #
    # SKU CASE IS LOAD-BEARING IN THE CATALOG. TKY28 and Tky28 are different
    # products, as are TKY107 and Tky107 — the same pattern metrics.yaml already
    # records at products.sku (Tky105 / tky105 / TKY105 are three unrelated
    # items in three categories at three prices). Case-folding an import join
    # would merge unrelated products' cost histories into one series.
    #
    # source: verified against the live products table (user-confirmed, carried
    #   into this file 2026-09-02).
    # resolves: nothing yet — this is additive. tools/movement.py:206 and the
    #   other user-facing lookups keep using `match`. Only the StoreHub importer
    #   and get_cost_history use import_match.
    #
    # An import_match that hits MORE THAN ONE row is NOT resolved by picking
    # one. The line imports with a null product_id and sku_match='ambiguous',
    # exactly like a miss, and the count is reported on the import.
    # -------------------------------------------------------------------------
    import_match: case_sensitive
    import_match_sql: "p.sku = %(sku)s"
    import_ambiguity_policy: leave_unresolved_and_flag

  # ---------------------------------------------------------------------------
  # BARCODES COME FROM TWO PLACES AND products.barcode IS A LIST.
  #
  #   products.barcode holds a COMMA-SEPARATED list, not one value, e.g.
  #     '4902888269042,4902888269035,4902888269653,4902888270819,...'
  #   An `= ` match misses those rows; a LIKE '%code%' match wrongly hits a
  #   barcode that merely CONTAINS the search string. Split and match an exact
  #   element.
  #
  #   product_barcodes is a second, generated source (89 rows), 22 of which do
  #   NOT appear anywhere in products.barcode. A barcode lookup that reads only
  #   one of the two sources misses real products.
  #
  # source: live data, 2026-09-01. 409 products have no barcode at all; 20
  #   barcode values are shared by more than one product.
  # ---------------------------------------------------------------------------
  barcode:
    products_column_is_list: true
    list_separator: ","
    match_sql: "%(barcode)s = ANY(string_to_array(replace(p.barcode, ' ', ''), ','))"
    secondary_table: product_barcodes
    secondary_match_sql: "pb.barcode = %(barcode)s"
    unique: false

  # Free-text name search also covers `nickname` (115 products carry one).
  # Substring only — never fuzzy. Fuzzy matching invents a relevance ranking,
  # and with genuine near-duplicate names ("golden plum 1kg" appears 3 times) a
  # fuzzy hit looks authoritative while being a guess.
  name:
    search_columns: [name, nickname]
    match: case_insensitive_substring
    fuzzy: false


# =============================================================================
# STOCK MOVEMENT (AJI BARN <-> stores)
#
# THERE IS NO MOVEMENT LEDGER IN THIS DATABASE. Nothing records a transfer as
# an event. Everything below is what a survey on 2026-09-01 actually found, and
# it is the reason tools/movement.py reports BALANCE CHANGES and refuses to
# report transfers.
# =============================================================================
movement:
  # ---------------------------------------------------------------------------
  # THIS CHANGED ON 2026-09-02. A RECORDED LEDGER NOW EXISTS.
  #
  # Everything below this block was written when nothing in the database recorded
  # a transfer as an event. The StoreHub stock-transfer import changed that:
  # 2,034 transfer documents and 40,141 lines, each naming a source, a
  # destination, a product, a quantity, a cost and a status.
  #
  # The old survey is NOT deleted. It still describes the snapshot-differencing
  # path exactly, that path still exists, and its limits still apply to it. What
  # changed is that it is no longer the ONLY path.
  #
  # TWO BASES, AND THEY ARE NEVER BLENDED INTO ONE FIGURE:
  #
  #   transfer_records  RECORDED movement. A document says goods moved from A to
  #                     B. Answers destination questions. Covers only the window
  #                     that has been imported, and only what staff recorded.
  #
  #   balance_delta     INFERRED movement. Differenced daily snapshots. Says a
  #                     number changed, never that goods moved or where. Covers
  #                     every product with snapshots, recorded or not.
  #
  # A number that added a recorded transfer to an inferred balance change would
  # be double-counting the same movement under two names, and would carry no
  # single provenance. Tools return them as separate labelled blocks with no
  # summed field spanning both. Rows carry their own `basis`.
  # ---------------------------------------------------------------------------
  recorded_ledger_exists: true
  recorded_ledger_since: "2026-09-02 (StoreHub stock-transfer import)"
  bases:
    transfer_records:
      source_table: stock_transfers
      lines_table: stock_transfer_lines
      derived: false
      is_recorded_movement: true
      names_destination: true
      # Coverage is the imported window, not all of history. Every record-backed
      # answer must state the window it can see.
      coverage_is_imported_window: true
      coverage_notice_mandatory: true
    balance_delta:
      derived: true
      is_recorded_movement: false
      names_destination: false
  never_blend_bases: true
  default_basis: both

  # ---------------------------------------------------------------------------
  # STATUS DECIDES WHETHER GOODS MOVED, on the record-backed basis.
  # Reuses storehub.stock_transfers.moved_statuses rather than restating it.
  # A quantity or value question defaults to moved documents only; a
  # document-count question legitimately counts all statuses and says so.
  # ---------------------------------------------------------------------------
  moved_statuses_ref: storehub.stock_transfers.moved_statuses
  unmoved_value_notice_mandatory: true

  # Quantities mix units across products (grams vs packs) — see
  # storehub.quantity_unit. A record-backed quantity is only meaningful within
  # one product; value (PHP) is the additive measure across products.
  record_quantity_additive_across_products: false

  # What was surveyed and what it held.
  # source: live database, 2026-09-01, all 38 base tables enumerated.
  sources_surveyed:
    warehouse_inventory:    {rows: 0,      verdict: "empty; schema is a balance snapshot, not a ledger"}
    packing_lists:          {rows: 2,      verdict: "both status=pending, created 2026-08-27/28; never used"}
    packing_items:          {rows: 3,      verdict: "three lines total, actual_packed all NULL"}
    store_pipeline:         {rows: 0,      verdict: "empty"}
    candy_sku_by_store:     {rows: 0,      verdict: "empty"}
    shipment_plans:         {rows: 122207, verdict: "planning only; allocated_ship_qty sums to -17,705,649"}
    candy_inventory_counts: {rows: 1742,   verdict: "physical counts, 9 stores, 13 products, from 2026-06-14; AJI BARN NOT among them"}
    candy_warehouse_dispatches_clean: {rows: 13735, verdict: "inferred view, not a ledger; see destination_attribution"}
    inventory_snapshots:    {rows: 4881566, verdict: "daily BALANCES; movement only inferable by differencing"}

  # ---------------------------------------------------------------------------
  # THE ONLY USABLE SOURCE, AND WHAT IT IS NOT.
  # inventory_snapshots holds a daily balance per (store, product). Differencing
  # consecutive days yields a BALANCE CHANGE. That is not a movement: it says
  # the number moved, never that goods moved, where they went, or why.
  # ---------------------------------------------------------------------------
  balance_delta:
    source_table: inventory_snapshots
    derived: true
    is_recorded_movement: false
    method: "difference consecutive daily balance snapshots per (store, product)"
    # Snapshot coverage is NOT continuous. AJI BARN has 148 distinct snapshot
    # days across a 162-day span (2026-03-23..2026-08-31) — 14 days missing.
    # A delta spanning a gap silently merges several days of movement into one
    # number, so tools MUST NOT difference across a gap; report the gap instead.
    difference_across_gaps: false
    barn_snapshot_days: 148
    barn_snapshot_span_days: 162
    barn_missing_days: 14

  # ---------------------------------------------------------------------------
  # DESTINATION ATTRIBUTION IS NOT SUPPORTED. "How much went from BARN to
  # Rockwell" is unanswerable from this data and tools MUST refuse it.
  #
  # candy_warehouse_dispatches_clean is the only thing naming a destination. It
  # is a VIEW that infers dispatches from transactions at BARN with total = 0,
  # parsing the destination out of a free-text `notes` column with
  # normalize_store_note(). Measured against actual balance movement for
  # August 2026:
  # ---------------------------------------------------------------------------
  destination_attribution:
    # -------------------------------------------------------------------------
    # NOW SCOPED BY BASIS. It was a flat `false`; that answer was right for the
    # only basis that existed then and is wrong as a blanket statement now.
    #
    #   transfer_records  SUPPORTED. Every transfer names Source Store and
    #                     Target Store, both resolved to store ids through the
    #                     alias map. "How much went from BARN to Rockwell" is a
    #                     direct question against recorded documents.
    #
    #   balance_delta     STILL NOT SUPPORTED, for exactly the reasons measured
    #                     below. Differencing snapshots cannot say where goods
    #                     went, and the inference view that tries reconciles for
    #                     24 of 196 products.
    #
    # The refusal message below still applies, but ONLY to the balance_delta
    # basis. A tool must not refuse a destination question it can now answer from
    # records, and must not answer one from snapshots that it cannot.
    # -------------------------------------------------------------------------
    supported_by_basis:
      transfer_records: true
      balance_delta: false
    supported: false            # legacy key: refers to balance_delta only
    supported_key_means: balance_delta
    measured_window: "2026-08-01..2026-09-01"
    dispatch_view_grams: 1422047
    barn_negative_delta_grams: -4338299
    coverage_pct: 32.8                  # view explains a third of outflow
    null_destination_rows: 3601
    total_view_rows: 13735
    null_destination_pct: 26.2
    products_in_view: 450
    products_with_barn_snapshots: 3518
    products_dispatched_in_window: 196
    products_with_no_barn_snapshot: 69   # 35.2% of those dispatched
    products_reconciling_exactly: 24     # 12.2% — residual exactly 0
    # Worked counterexamples: G4 shows 80,982 g dispatched while its balance
    # ROSE 241,518 g; G2 shows 51,600 g dispatched while its balance rose
    # 209,400 g. SH1 "Aji Mix" has ZERO rows in the view across all time despite
    # 4,817,082 g of balance movement in 90 days.
    refusal_message: >
      Destination-scoped movement is not answerable from this data. The only
      source naming a destination is candy_warehouse_dispatches_clean, a view
      that infers dispatches from zero-total BARN transactions and parses the
      destination from a free-text notes field. It accounts for 32.8% of BARN's
      outflow, has no destination on 26.2% of its rows, covers 450 of 3,518
      products, and reconciles exactly for only 24 of the 196 products it shows
      as dispatched. There is no movement ledger to fall back on.

  # Attached to every answer as a corroborating source so each result states how
  # much of the observed balance change any recorded dispatch can explain.
  corroborating_source:
    table: candy_warehouse_dispatches_clean
    quantity_column: weight_grams
    time_column: transaction_time
    authoritative: false

  # BARN quantities are grams. 24,401,719 = 24.4 tonnes.
  unit: grams


# =============================================================================
# VENDING (AJI CMG / Weimi machines, brand "Hello Aji")
#
# A SEPARATE DATA SOURCE from the StoreHub store tables. goods_id has nothing to
# do with products.id and machines are not rows in `stores`. NEVER join, union
# or compare the two domains.
#
# NOTE ON THE NAME: "AJI CMG" exists in BOTH domains — as a `stores` row
# (667bde0cd749a000079f4650) carrying store-side inventory, and as this vending
# business. tools/vending.py covers ONLY the Weimi side. The store row is out of
# scope here and must not be conflated with it.
# =============================================================================
vending:
  domain: weimi
  currency: PHP
  never_join_to_store_domain: true

  # ---------------------------------------------------------------------------
  # READ THE _php VIEWS, NOT THE RAW TABLES.
  # Every money column in the raw vending tables is an INTEGER NUMBER OF CENTS
  # (2000 = PHP 20.00). The _php views are already divided by 100 and must never
  # be divided again. Verified 2026-09-01: raw real_price 2000 -> 20.00 php.
  #
  # Reading the views removes the cents trap at the source instead of relying on
  # every query remembering to divide — the single most repeated warning in
  # business_rules.yaml (schema notes, prompt rules AND negative examples).
  #
  # v_vending_order_lines_php also pre-joins device_name and category_name, so
  # the tool needs no join for either.
  # ---------------------------------------------------------------------------
  source_view: v_vending_order_lines_php
  orders_view: v_vending_orders_php
  catalog_view: v_vending_goods_php
  raw_money_is_cents: true
  views_already_pesos: true

  # ---------------------------------------------------------------------------
  # THE currency COLUMN LIES. vending_orders.currency = 'CNY' on all 9,219 rows.
  # That is a Weimi hardcoding bug; the real currency is PHP. The raw column is
  # NEVER passed through to a caller. The _php views already relabel it 'PHP'.
  # source: business_rules.yaml:89, confirmed against live data 2026-09-01.
  # ---------------------------------------------------------------------------
  currency_column_is_wrong: true
  currency_column_says: CNY

  # ---------------------------------------------------------------------------
  # SHIPMENT STATUS — THE DOCUMENTED VALUE 3 DOES NOT EXIST.
  #
  # business_rules.yaml:167 and app/services/schema_context.py:66 both state
  # "3 = vend FAILED". Measured distribution over all 11,907 lines, 2026-09-01:
  #     status 1  -> 11,900 lines   (success)
  #     status 2  ->      5 lines   (undocumented; shipment_time is NULL)
  #     status 64 ->      2 lines   (undocumented)
  #     status 3  ->      0 lines   <-- the documented failure code
  #
  # A "failed vends" report written to the documented spec returns an empty list
  # FOREVER and reads as "no failures" — the same trap as the unset low-stock
  # thresholds. So non-success is defined as `shipment_status <> 1` and the raw
  # code is reported rather than given a meaning nobody can confirm.
  #
  # The five status-2 lines have NULL shipment_time, so ANY time-bounded query
  # drops them whatever the status filter says.
  # ---------------------------------------------------------------------------
  success_status: 1
  success_sql: "l.shipment_status = 1"
  non_success_sql: "l.shipment_status <> 1"
  documented_failure_status_exists: false
  status_distribution: {1: 11900, 2: 5, 64: 2}
  status_2_has_null_shipment_time: true

  # ---------------------------------------------------------------------------
  # PROFIT IS OVERSTATED ON 72.7% OF LINES.
  # goods_purchase_cost = 0 on 8,659 of 11,907 lines. Zero means the cost was
  # never entered in Weimi, NOT that the item is free — so profit_php equals
  # revenue on those rows. At that prevalence the flag is MANDATORY: a tool must
  # not return a profit figure without also returning how much of it is
  # uncosted. source: live data 2026-09-01; business_rules.yaml:163.
  # ---------------------------------------------------------------------------
  profit_overstated_lines: 8659
  profit_total_lines: 11907
  profit_overstated_pct: 72.7
  missing_cost_flag_column: missing_cost
  profit_flag_mandatory: true

  # ---------------------------------------------------------------------------
  # CATEGORY COVERAGE IS POOR. Two independent gaps:
  #   - 38 goods_ids appear in sales with NO row in vending_goods at all,
  #     covering 3,533 of 11,907 lines (29.7% of volume).
  #   - 98 of 151 catalog products (64.9%) have no category_name.
  # Both surface as NULL category_name in the view, so they are indistinguishable
  # there; the orphan count is measured separately against vending_goods.
  # Group with COALESCE so neither is silently dropped, and report the coverage
  # or a category chart speaks for a minority of sales.
  # ---------------------------------------------------------------------------
  category_normalization:
    sql: "COALESCE(NULLIF(l.category_name, ''), 'Uncategorized')"
    uncategorized_label: "Uncategorized"
  orphan_goods_ids: 38
  orphan_lines: 3533
  orphan_lines_pct: 29.7
  catalog_missing_category: 98
  catalog_total: 151

  # One machine (62162500) has no device_name. "Never show a bare device_code"
  # still holds, so fall back to a labelled code rather than a blank.
  machine_label_sql: "COALESCE(NULLIF(l.device_name, ''), 'Unnamed machine ' || l.device_code)"
  devices_total: 10
  devices_with_sales: 9
  devices_unnamed: 1

  # kind / domain / display_name: the metric model (metric_model above),
  # declared here so vending figures carry the same identity as retail ones.
  # No derived vending metric exists; see metric_model.candidates_not_defined.
  metrics:
    revenue:
      kind: base
      domain: vending
      display_name: "Vending revenue"
      sql: "SUM(l.real_price_php)"
      unit: PHP
      success_only: true
      valid_group_by: [machine, day, week, month, product, category, payment_method]
    units:
      kind: base
      domain: vending
      display_name: "Vending units"
      sql: "SUM(l.goods_amount)"
      unit: units
      success_only: true
      valid_group_by: [machine, day, week, month, product, category, payment_method]
    orders:
      kind: base
      domain: vending
      display_name: "Vending orders"
      sql: "COUNT(DISTINCT l.order_trade_no_in)"
      unit: orders
      success_only: true
      valid_group_by: [machine, day, week, month, product, category, payment_method]
    profit:
      kind: base
      domain: vending
      display_name: "Vending profit"
      sql: "SUM(l.profit_php)"
      unit: PHP
      success_only: true
      requires_missing_cost_flag: true
      valid_group_by: [machine, day, week, month, product, category, payment_method]
    non_success_vends:
      kind: base
      domain: vending
      display_name: "Non-success vends"
      sql: "COUNT(*)"
      unit: lines
      success_only: false
      non_success_only: true
      valid_group_by: [machine, day, week, month, product, category]

  buckets:
    day:   "date_trunc('day',   (l.shipment_time AT TIME ZONE 'Asia/Manila'))::date"
    week:  "date_trunc('week',  (l.shipment_time AT TIME ZONE 'Asia/Manila'))::date"
    month: "date_trunc('month', (l.shipment_time AT TIME ZONE 'Asia/Manila'))::date"
  time_column: "l.shipment_time"

  # ---------------------------------------------------------------------------
  # PAYMENT METHOD — `ext` IS TEXT, NOT JSON.
  # business_rules.yaml:151 and schema_context.py:58 both describe
  # vending_orders.ext as "JSON" and give `ext->>'payWay'`. The column's actual
  # type is `text` in both the table and the _php view, so `->>` raises
  # "operator does not exist: text ->> unknown". An explicit ::jsonb cast is
  # required. NULLIF guards the empty string, which would fail the cast.
  # Observed values, 9,219 orders: gcashpay 8,123 / NULL 1,084 / alipayaps 12.
  # source: live data 2026-09-01.
  # ---------------------------------------------------------------------------
  payment_method_sql: "COALESCE(NULLIF(o.ext, '')::jsonb ->> 'payWay', 'unknown')"
  payment_method_ext_is_text: true

  # ---------------------------------------------------------------------------
  # LIVE MACHINE STOCK — a different shape, hence its own function.
  # vending_aisles is the current planogram: one row per slot, no history, no
  # sales. It cannot be date-filtered at all.
  #
  # IT IS STALE. Both vending_aisles.updated_at and
  # vending_devices.last_synced_at last moved 2026-08-05, while sales lines run
  # to 2026-08-31 — sales are current, stock is roughly four weeks behind, with
  # no history to fall back on. Any stock answer must carry its age.
  # ---------------------------------------------------------------------------
  stock:
    source_table: vending_aisles
    has_history: false
    date_filterable: false
    price_is_cents: true          # vending_aisles.price is NOT covered by a _php view
    last_synced: "2026-08-05"
    staleness_mandatory: true
    slots_total: 540
    slots_empty: 133


# =============================================================================
# STOREHUB CSV EXPORTS — purchase orders and stock transfers
#
# StoreHub exports these two documents as CSV. They are the FIRST recorded
# procurement and movement data this database has ever held: until they were
# imported, movement.recorded_ledger_exists was false and every supplier subject
# below was unsupported.
#
# Everything in this section is read at runtime by
# backend/app/services/storehub_import.py and by the tools built on the imported
# tables. The importer holds NO definition of its own — not a status meaning,
# not a location mapping, not a date format.
#
# BOTH EXPORTS ARE HEADER-PLUS-LINE. One summary row per document followed by N
# line rows. See line_discriminator: the obvious tests do not work.
#
# source: the two exports dated 2026-09-02, plus the live stores table.
# =============================================================================
storehub:

  # ---------------------------------------------------------------------------
  # THE "(RM)" COLUMN HEADERS ARE WRONG. The values are PHP.
  #
  # Every money column in both exports is labelled "(RM)" — Malaysian ringgit.
  # StoreHub is a Malaysian product and the export template was never localised.
  # Confirmed by joining PO unit costs to products.cost on SKU: 19 of 20 matched
  # to the centavo. Aji Ichiban trades in the Philippines and holds no ringgit.
  #
  # The importer therefore stores these values as PHP and NEVER converts. No
  # column in the imported tables carries "rm" in its name — a column named for
  # a currency it does not hold is how the mistake would be re-made.
  #
  # source: user-verified against products.cost, carried in 2026-09-02.
  # ---------------------------------------------------------------------------
  currency:
    code: PHP
    header_label_says: "RM"
    header_label_is_wrong: true
    convert: false
    # The one PO cost that did NOT match to the centavo is unexplained. A
    # candidate — NOT asserted, and not acted on anywhere — is that products.cost
    # is Numeric(10, 2) (backend/app/models/product.py:23) while the export
    # carries six decimals (PCON03 = 1.018028), so a 6dp source cost cannot
    # round-trip through the catalog column. Recorded so the next person does
    # not re-derive it; see numeric.unit_cost_decimal_places.
    unmatched_cost_hypothesis: "products.cost is Numeric(10,2); export carries 6dp"
    unmatched_cost_confirmed: false

  # ---------------------------------------------------------------------------
  # HEADER VS LINE. `No.` IS THE ONLY SAFE DISCRIMINATOR.
  #
  # The intuitive tests both fail on real rows:
  #   "Total is populated"    -> header PO0709 and PO0708 both carry Total
  #                              "0.00". Populated, and zero.
  #   "SubTotal is populated" -> line 1 of PO0709 carries SubTotal "0.00".
  #
  # Testing either for non-emptiness misclassifies a zero-valued document as a
  # line or a zero-valued line as a header, and a misclassified header row
  # becomes a phantom line with no product.
  #
  # `No.` is blank on every header row and 1..N on every line row, and it has no
  # zero-valued form. It is the discriminator.
  # source: measured on the 2026-09-02 exports.
  # ---------------------------------------------------------------------------
  line_discriminator:
    column: "No."
    header_when: blank
    line_when: integer
    rejected_alternatives:
      total_populated: "PO0709/PO0708 headers carry Total 0.00"
      subtotal_populated: "PO0709 line 1 carries SubTotal 0.00"

  # ---------------------------------------------------------------------------
  # DATES. Manila wall-clock, no zone in the file.
  #
  # The exports carry local wall-clock times with no offset. Asia/Manila
  # observes no DST (see timezone.observes_dst), so interpreting them as Manila
  # is unambiguous and never skips or repeats an hour.
  #
  # "Estimated Date of Arrival" is DATE-ONLY. It is stored as a date, not as a
  # midnight timestamp — a midnight timestamp implies a precision the file does
  # not have and would make a same-day ETA look like it preceded its own PO.
  # ---------------------------------------------------------------------------
  datetime_format: "%m/%d/%Y %H:%M"
  date_format: "%m/%d/%Y"
  timezone: "Asia/Manila"
  empty_is_null: true

  # ---------------------------------------------------------------------------
  # NUMERIC PRECISION.
  #
  # Unit costs carry SIX decimals in the file (PCON03 "Slurp & chew strawberry
  # flavor" = 1.018028). Storing them at 2dp silently rounds the source. Line
  # subtotals are stored to 4dp and header totals to 4dp.
  #
  # Quantities are NUMERIC, not integer. They are integral in the exports seen
  # so far, but per-gram products move in quantities that are counts of grams
  # (SH1 "Aji Mix" at 31,500) and the store domain already sells fractional
  # quantities (metrics.units_sold.integral: false). An integer column would
  # reject a fractional line rather than record it.
  # ---------------------------------------------------------------------------
  numeric:
    unit_cost_decimal_places: 6
    money_decimal_places: 4
    quantity_decimal_places: 4
    quantity_is_integral: false
    # Values are unquoted-decimal in both exports. A comma reaching a numeric
    # field can only be a thousands separator (the CSV is quoted, so a comma
    # inside a field is never a delimiter), so it is stripped before parsing.
    # Anything else still fails loudly rather than silently becoming a number.
    strip_thousands_separator: true

  # ---------------------------------------------------------------------------
  # FIELD TYPES. Applied by column ROLE, not by column header, so both exports
  # share one set of rules. Roles not listed here are text.
  # ---------------------------------------------------------------------------
  field_types:
    datetime: [created_at_source, completion_date, cancelled_date, shipped_date, received_date]
    date:     [estimated_arrival_date]
    decimal:  [ordered_qty, received_qty, unit_cost, subtotal, header_total]
    integer:  [line_no]

  # ---------------------------------------------------------------------------
  # UNITS ARE PER PRODUCT AND ARE NOT RECORDED IN THE FILE.
  #
  # movement.unit says `grams`, which is true of AJI BARN's inventory balances
  # and NOT true of these documents. In one transfer (ST2999) SH1 "Aji Mix"
  # moves 834 at PHP 0.80 — grams — while SH610 "Fuan Haw Flakes" moves 1 at
  # PHP 70.00 — a pack. Both are "Ordered Qty" in the same column of the same
  # document.
  #
  # CONSEQUENCE: a transfer quantity MUST NOT be labelled with a unit, and
  # quantities MUST NOT be summed across products. Summing 834 grams of Aji Mix
  # with 40 packs of Haw Flakes produces 874 of nothing. Tools group by product
  # or report value (PHP), which IS additive.
  # ---------------------------------------------------------------------------
  quantity_unit:
    recorded_in_export: false
    varies_by_product: true
    additive_across_products: false
    additive_measure: "subtotal (PHP)"

  # ---------------------------------------------------------------------------
  # INTEGRITY CHECKS. One raises, one flags.
  #
  # header_total_equals_line_subtotals RAISES. Verified exactly on ST2997: the
  # 32 line subtotals sum to 61,447.74, the header Total, INCLUDING the line
  # where 30 x 1.018028 = 30.54084 was written as 30.54. The header total is
  # built from ROUNDED line subtotals, so this holds to the centavo and a
  # failure means the file is malformed or a line was lost in parsing.
  #
  # subtotal_equals_qty_times_cost only FLAGS, with a tolerance. It fails
  # legitimately on that same rounding, so treating it as an error would reject
  # a correct file. It catches a genuinely inconsistent line without pretending
  # a rounded one is wrong.
  #
  # NEITHER CHECK REPAIRS ANYTHING. Both stored values are imported exactly as
  # exported; a check that rewrote a value would make the import a source of
  # numbers rather than a record of them.
  # ---------------------------------------------------------------------------
  integrity:
    # -------------------------------------------------------------------------
    # HEADER TOTAL vs SUM OF LINE SUBTOTALS.
    #
    # MEASURED 2026-09-02 over every export available:
    #   stock transfers  2,034 documents / 40,141 lines -> ZERO mismatches
    #   purchase orders    151 documents               -> 2 mismatches
    #
    # So it is an invariant of stock transfers and NOT of purchase orders. The
    # two failures are both genuine source inconsistencies, not parse errors:
    #
    #   PO0604  header 90,000.00, lines sum 0.00. Every one of its 13 lines has
    #           cost 0.00 — the costs were never entered — while the header
    #           carries a real total. Same shape as the vending zero-cost trap:
    #           0.00 means "not entered", not "free".
    #   PO0285  header 114,912.00, lines sum 114,890.00. Off by exactly 22.00.
    #
    # AN EARLIER VERSION OF THIS ENTRY SAID on_failure: raise, FULL STOP. That
    # was wrong, and wrong in the expensive direction: it rejected both PO
    # exports outright, so two bad documents out of 151 meant no procurement
    # data at all. A file-level refusal has to be reserved for a file that
    # cannot be TRUSTED, not one that contains a document somebody fat-fingered.
    #
    # THE DISCRIMINATOR IS LINE-NUMBER CONTIGUITY. The original fear was that a
    # mismatch means the parser lost a line. That is checkable: if the document's
    # line numbers run 1..N with no gap, nothing was lost and the disagreement is
    # in the source, so the document imports with header_total_reconciles = false
    # and a notice. If a line number is MISSING, a line really is unaccounted for
    # and the file is refused.
    #
    # Residual limitation, stated rather than hidden: a lost LAST line leaves
    # 1..N-1 contiguous and would be flagged rather than raised. Nothing in the
    # parser can drop a row silently (a real CSV reader either yields a row or
    # fails, and header/line classification is on `No.`), so this is a gap in the
    # guard, not a known failure.
    # -------------------------------------------------------------------------
    header_total_equals_line_subtotals:
      tolerance: 0.01
      on_failure_when_lines_contiguous: flag
      on_failure_when_lines_missing: raise
      flag_column: header_total_reconciles
      verified_on: "ST2997 (32 lines, 61447.74)"
      measured:
        stock_transfers: {documents: 2034, lines: 40141, mismatches: 0}
        purchase_orders: {documents: 151, mismatches: 2}
      known_mismatches:
        PO0604: "header 90000.00 vs lines 0.00 — all 13 line costs are 0.00, never entered"
        PO0285: "header 114912.00 vs lines 114890.00 — out by 22.00"
    subtotal_equals_qty_times_cost:
      on_failure: flag
      tolerance: 0.005
      flag_column: subtotal_consistent
      known_benign_cause: "line subtotals are rounded to 2dp from a 6dp unit cost"

  # ---------------------------------------------------------------------------
  # TEXT. Some product names are UTF-8 mis-decoded at export (mojibake), and
  # Notes fields contain embedded newlines and commas.
  #
  # NAMES ARE NEVER REPAIRED. A cp1252/UTF-8 round-trip would usually restore
  # the intended characters, but "usually" is a guess applied to a name that is
  # then indistinguishable from one that was correct. The raw string is stored
  # verbatim and the row is flagged, so a human can decide. The flag is a
  # detector, not a fixer.
  #
  # Notes must be read with a real CSV parser. A line-splitting reader breaks a
  # document in half at an embedded newline.
  # ---------------------------------------------------------------------------
  text:
    repair_mojibake: false
    mojibake_markers: ["Ã", "â€", "Â", "ï¿½", "�"]
    flag_column: name_mojibake
    decode: "utf-8"
    decode_errors: "surrogateescape"
    requires_real_csv_parser: true
    embedded_newlines_in: ["Notes"]

    # -------------------------------------------------------------------------
    # MEASURED 2026-09-02, all five exports (227 POs + 2,034 transfers,
    # 41,188 lines): NO mojibake is present. Every file decodes as clean UTF-8 —
    # zero bytes needed surrogateescape — and product names contain exactly two
    # non-ASCII characters, both intended:
    #     U+00E9 é  (25 occurrences)
    #     U+2019 '  (14 occurrences, right single quotation mark)
    #
    # The detector is KEPT even though it currently fires zero times. It costs
    # one substring scan per line, a future export may differ, and an unfired
    # detector is the cheapest thing in this file. What is recorded here is the
    # measurement, so that "product names are mis-decoded at export" is not
    # carried forward as a belief about data that does not show it.
    # -------------------------------------------------------------------------
    mojibake_found: 0
    mojibake_measured: "2026-09-02, all five exports, 41,188 lines"
    surrogateescape_bytes_found: 0

  # ---------------------------------------------------------------------------
  # NOTES ARE NOT PARSED INTO DATES. DECIDED 2026-09-02.
  #
  # 4 of the 6 POs in the sample carry a note of the form "Received August 26,
  # 2026" — and three of those four are still status Open. The note is very
  # often the only record of when goods actually arrived (see
  # purchase_orders.statuses and lead_time below).
  #
  # It is still free text written by staff, and turning it into a date is an
  # interpretation. The rule this file applies to store names — never fuzzy
  # match — applies with more force to a date that would then be used to compute
  # a lead time and reported as measured.
  #
  # The note is stored verbatim and surfaced as text. A row whose note LOOKS
  # like a received date is flagged so the volume is visible, but no date is
  # extracted. Flip this only on an explicit decision, and record the decision
  # here.
  # ---------------------------------------------------------------------------
  notes:
    parse_received_date: false
    detect_received_date_shape: true
    detection_regex: "(?i)\\breceived\\b"
    flag_column: notes_mentions_received
    decided: "2026-09-02"

  # ---------------------------------------------------------------------------
  # LOCATION ALIASES — THE CSV STRING IS THE KEY, AND stores.name IS NEVER READ.
  #
  # WHY AN EXPLICIT MAP RATHER THAN A NAME JOIN. The live stores table holds two
  # rows whose names differ ONLY by a "(1) " prefix:
  #
  #   6639efd54694700008d7ccc6   "(1) Aji Ichiban Food Products"   Rockwell, 65k txns
  #   668263b71c04d30007dbd150   "Aji Ichiban Food Products"       no trading history
  #
  # Any prefix-strip, LIKE, trim-and-compare or fuzzy match sends Rockwell's
  # transfers (ST2994 at PHP 45,913; ST2995 at PHP 21,730) to a store that has
  # never traded. An exact-string map is the only form that cannot do this.
  #
  # MATCHING IS EXACT AND LITERAL. No trimming, no case folding, no whitespace
  # normalisation. "(6) Aji Ichiban  OPUS" contains a DOUBLE SPACE and is
  # written here with it. A location string not present below is UNRESOLVED —
  # it never falls back to a looser match.
  #
  # source: ids from the live stores table via stores.json (ids are stable; that
  #   dump's NAMES predate the "(N) " rename and are not used here), plus
  #   stores.active_retail above for Shang, which postdates the dump.
  # resolves: the importer needs a location -> id mapping and the obvious one
  #   (join on stores.name) is the failure documented above.
  # ---------------------------------------------------------------------------
  locations:
    match: exact_string
    strip_whitespace: false
    case_fold: false
    fuzzy: false
    # HARD RULE: an unknown location NEVER creates a stores row and is NEVER
    # guessed at. It imports with a null FK, the raw string retained, and a
    # notice. A missing store is visible; a wrong one is not.
    on_unresolved: keep_raw_null_fk_and_notice
    create_store_row: false

    alias:
      "AJI BARN":                                    "667bde393126e50006c8058c"
      "(1) Aji Ichiban Food Products":               "6639efd54694700008d7ccc6"
      "(2) Aji Ichiban food products SM Fairview":   "668023c94721460006092609"
      "(3) Ajiichiban Food Products Greenhills":     "668a43f60fa9990007cfa158"
      "(4) Ajiichiban Food Products SM North Edsa":  "66cfff31aa7adf0007c9de41"
      "(5) Ajiichiban food products Magnolia":       "67612230a740d90007464e26"
      "(6) Aji Ichiban  OPUS":                       "68c5bb269da1d500073690c2"
      "(7) Ajiichiban SHANG":                        "69c73fcb277aa600076dfaaa"
      "Aji Packing":                                 "68a40bd8b79152000619e7d7"
      "AJI Disposal":                                "6699c88bd38fa400074ba3da"
      "AJI ONLINE":                                  "6680e5a3a8fc2d00071d07a9"
      # The two storefronts in stores.pending_retail. They have zero
      # transactions but they DO receive stock — 27 transfers across the
      # exports — so they resolve here even though they are not yet in
      # active_retail. Names matched exactly against stores.pending_retail.
      "Ajiichiban ROBINSONS super market lucky Chinatown": "694785f3c9a90d0007fc9232"
      "AJI ROBINSONS supermarket robinsons galleria":      "6982c9a9aa1210000783594d"
      # AJI CMG as a LOCATION receiving stock — the `stores` row. Note the
      # warning in the vending section: "AJI CMG" names two different things,
      # this store row and the Weimi vending business. A transfer or PO landing
      # here is stock arriving at the location, and must never be joined to the
      # vending domain.
      "AJI CMG":                                     "667bde0cd749a000079f4650"
      "Hello AJI vending":                           "693646be0abea30007b77334"
      # Read from the live stores table 2026-09-02. It is a real StoreHub
      # ObjectID and a location distinct from the two above — all three names
      # appear in the same export, so none is a rename of another.
      "AJI VENDO":                                   "69b6fb6d185092000783c8a4"
      # A CLOSED warehouse, and the one id here that is not a StoreHub
      # ObjectID — see stores.closed and migration i3j4k5l6m7n8 for why it is
      # deliberately not hex. Aliased so its 1,006 historical references resolve
      # instead of importing as a null FK. If StoreHub's real id for MACOPA ever
      # arrives, this line and the stores row change together.
      "AJI MACOPA":                                  "local-aji-macopa-wh-0001"

    # DELIBERATELY ABSENT FROM THE MAP. "Aji Ichiban Food Products" — the
    # unprefixed twin, 668263b71c04d30007dbd150 — is NOT aliased. It has no
    # trading history and nothing establishes what it is. If that exact string
    # ever appears in an export it must surface as unresolved rather than be
    # mapped to a store nobody can characterise.
    deliberately_unmapped:
      "Aji Ichiban Food Products": "668263b71c04d30007dbd150 — unprefixed twin of Rockwell; identity unestablished"

    # ---------------------------------------------------------------------------
    # PENDING — known locations with no id yet. These import UNRESOLVED, exactly
    # like any unknown string. They are listed so the notice can say what the
    # location is rather than only that it is unknown.
    # ---------------------------------------------------------------------------
    # ---------------------------------------------------------------------------
    # PENDING is now EMPTY, and that is the finished state.
    #
    # Every location appearing in any export resolves to a store id. AJI MACOPA
    # (closed, local id) and AJI VENDO (real ObjectID, read from the live table
    # 2026-09-02) were the last two. The key is kept because the mechanism is
    # still needed: a location StoreHub adds tomorrow lands here with an
    # explanation rather than as a bare unknown string.
    #
    # Verified 2026-09-02 against all five exports: 0 unresolved locations.
    # ---------------------------------------------------------------------------
    pending: {}

  # ---------------------------------------------------------------------------
  # PURCHASE ORDERS
  # ---------------------------------------------------------------------------
  purchase_orders:
    document_key_column: "P.O ID"
    document_key_example: "PO0710"
    source_table: purchase_orders
    lines_table: purchase_order_lines
    column_count: 22
    columns:
      - "P.O ID"
      - "Created Date"
      - "Estimated Date of Arrival"
      - "Completion Date"
      - "Supplier"
      - "Target Store"
      - "No."
      - "Product Name"
      - "SKU"
      - "Serial No."
      - "Category"
      - "Ordered Quantity"
      - "Received Quantity"
      - "Cost (RM)"
      - "SubTotal (RM)"
      - "Total (RM)"
      - "Status"
      - "Notes"
      - "Requested By"
      - "Cancelled By"
      - "Cancelled Date"
      - "Completed By"

    # -------------------------------------------------------------------------
    # ROLE -> COLUMN HEADER. The parser addresses columns by ROLE and never by a
    # literal header string, so a renamed export column is a one-line edit here
    # rather than a code change (and an unrecognised header fails loudly against
    # the `columns` list above rather than silently reading blanks).
    #
    # line_fields are read from LINE rows. Every other role is read from the
    # document's HEADER row. Line rows repeat most header columns; reading them
    # from the header keeps one value per document rather than N identical ones
    # that could disagree.
    # -------------------------------------------------------------------------
    field_map:
      external_id:             "P.O ID"
      created_at_source:       "Created Date"
      estimated_arrival_date:  "Estimated Date of Arrival"
      completion_date:         "Completion Date"
      supplier_name:           "Supplier"
      target_location_raw:     "Target Store"
      status:                  "Status"
      notes:                   "Notes"
      header_total:            "Total (RM)"
      requested_by:            "Requested By"
      cancelled_by:            "Cancelled By"
      cancelled_date:          "Cancelled Date"
      completed_by:            "Completed By"
      line_no:                 "No."
      product_name_raw:        "Product Name"
      sku_raw:                 "SKU"
      serial_no:               "Serial No."
      category_raw:            "Category"
      ordered_qty:             "Ordered Quantity"
      received_qty:            "Received Quantity"
      unit_cost:               "Cost (RM)"
      subtotal:                "SubTotal (RM)"
    line_fields:
      [line_no, product_name_raw, sku_raw, serial_no, category_raw,
       ordered_qty, received_qty, unit_cost, subtotal]

    # SUPPLIER IS FREE TEXT AND THERE IS NO SUPPLIER MASTER. Observed values
    # include "Dried Fruits DF001", "Supplies" and "Do rei me" — a product line,
    # a category and a company. The raw string is stored and never deduplicated,
    # normalised or fuzzy-grouped: merging "Supplies" with "Store supplies"
    # would invent a supplier that placed neither order.
    supplier_is_free_text: true
    supplier_master_exists: false
    deduplicate_suppliers: false

    # -------------------------------------------------------------------------
    # STATUS. "Open" DOES NOT MEAN "NOT RECEIVED".
    #
    # Measured on the sample: PO0706 (PHP 327,320), PO0708 and PO0709 are all
    # status Open with notes reading "Received August 26, 2026" / "Received
    # September 1, 2026". The goods arrived; nobody completed the PO.
    #
    # CONSEQUENCE: an "on order" or "outstanding" figure built on
    # status = 'Open' is wrong by at least PHP 327,320 in a six-document sample.
    # Tools must report Open as "not completed in StoreHub", never as
    # "not yet received", and must surface the note count alongside it.
    # -------------------------------------------------------------------------
    statuses:
      Completed: "marked complete in StoreHub"
      Open:      "not marked complete in StoreHub. NOT a statement about receipt."
      Cancelled: "cancelled"
    cancelled_statuses: ["Cancelled"]
    open_means_not_received: false
    open_but_received_observed: true

    # -------------------------------------------------------------------------
    # RECEIVED QUANTITY IS SPARSE AND IS NEVER RECONCILED TO ORDERED.
    #
    # It is blank on Open POs and 0 on every line of Completed POs PO0707 and
    # PO0705 — both of which carry notes saying the goods were received. It can
    # also EXCEED ordered (12 ordered, 120 received, user-verified).
    #
    # Both numbers import exactly as exported. The importer never adjusts one to
    # the other, never infers received from status, and never treats blank as
    # zero — blank means "not recorded", zero means "recorded as zero", and
    # collapsing them would erase the difference. Lines where the two differ are
    # flagged so the divergence is countable.
    # -------------------------------------------------------------------------
    received_quantity:
      reconcile_to_ordered: false
      blank_is_zero: false
      may_exceed_ordered: true
      flag_column: received_differs_from_ordered

    # -------------------------------------------------------------------------
    # LEAD TIME. WHAT IS AND IS NOT MEASURABLE.
    #
    # Three intervals are computable from the columns; only one is honest, and
    # it does not mean what "lead time" usually means.
    #
    #   created -> estimated_arrival   A PLANNED date, not an observation.
    #   created -> completion_date     SYSTEM COMPLETION LATENCY. When someone
    #                                  clicked Complete. PO0710 was created
    #                                  16:34 and completed 16:36 — two minutes —
    #                                  with the note "Fixing inventory. Late POS
    #                                  for samploc", i.e. a backdated
    #                                  administrative correction, not a delivery.
    #                                  PO0707 shows 2d21h while its own note says
    #                                  the goods arrived on the creation day.
    #   created -> actual receipt      NOT COMPUTABLE. The receipt date exists
    #                                  only in free-text Notes, which are not
    #                                  parsed (see notes.parse_received_date).
    #
    # So DELIVERY lead time is not answerable and tools must refuse it. What is
    # answerable is completion latency, and it must be labelled as such wherever
    # it is reported. Reporting it as "supplier lead time" would put a number on
    # a supplier's performance that actually measures a staff member's data
    # entry.
    # -------------------------------------------------------------------------
    lead_time:
      completion_latency:
        supported: true
        from: created_at
        to: completion_date
        unit: days
        means: "time until the PO was marked complete in StoreHub"
        does_not_mean: "time until goods arrived"
        label_mandatory: true
      delivery_lead_time:
        supported: false
        reason: >
          The actual receipt date is recorded only in a free-text Notes field,
          which is deliberately not parsed. Nothing else in the export observes
          arrival: Completion Date is a system event and Estimated Date of
          Arrival is a plan.

  # ---------------------------------------------------------------------------
  # STOCK TRANSFERS
  # ---------------------------------------------------------------------------
  stock_transfers:
    document_key_column: "S.T ID"
    document_key_example: "ST3001"
    source_table: stock_transfers
    lines_table: stock_transfer_lines
    column_count: 20
    columns:
      - "S.T ID"
      - "Created Date"
      - "Shipped Date"
      - "Received Date"
      - "Source Store"
      - "Target Store"
      - "No."
      - "Product Name"
      - "SKU"
      - "Serial No."
      - "Category"
      - "Ordered Qty"
      - "Cost (RM)"
      - "SubTotal (RM)"
      - "Total (RM)"
      - "Status"
      - "Sent By"
      - "Cancelled By"
      - "Cancelled Date"
      - "Received By"

    # See purchase_orders.field_map for how this is used.
    field_map:
      external_id:           "S.T ID"
      created_at_source:     "Created Date"
      shipped_date:          "Shipped Date"
      received_date:         "Received Date"
      source_location_raw:   "Source Store"
      target_location_raw:   "Target Store"
      status:                "Status"
      header_total:          "Total (RM)"
      sent_by:               "Sent By"
      cancelled_by:          "Cancelled By"
      cancelled_date:        "Cancelled Date"
      received_by:           "Received By"
      line_no:               "No."
      product_name_raw:      "Product Name"
      sku_raw:               "SKU"
      serial_no:             "Serial No."
      category_raw:          "Category"
      ordered_qty:           "Ordered Qty"
      unit_cost:             "Cost (RM)"
      subtotal:              "SubTotal (RM)"
    line_fields:
      [line_no, product_name_raw, sku_raw, serial_no, category_raw,
       ordered_qty, unit_cost, subtotal]

    # -------------------------------------------------------------------------
    # STATUS DECIDES WHETHER GOODS MOVED. MOST OF THEM DID NOT.
    #
    # A transfer with status Created has no Shipped Date and no Received Date:
    # it is a document, not a movement. In the sample window the MAJORITY of
    # transfers are Created, including ST2989 at PHP 159,184.70 — the single
    # largest document in the file, and nothing left the warehouse.
    #
    # CONSEQUENCE: summing transfer quantities without a status filter reports
    # goods that are still sitting where they started. moved_statuses is the
    # default scope for any quantity-grain or value-grain movement question, and
    # a tool answering one MUST report how much value sits in the excluded
    # statuses rather than silently dropping it.
    #
    # Document-grain questions ("how many transfers were raised") legitimately
    # count all statuses — that is a different grain and says so.
    # -------------------------------------------------------------------------
    statuses:
      Created:   "raised, not shipped. Goods have NOT moved."
      Shipped:   "shipped, not yet received. Goods have left the source."
      Completed: "shipped and received."
      Cancelled: "cancelled."
    cancelled_statuses: ["Cancelled"]
    moved_statuses: ["Shipped", "Completed"]
    received_statuses: ["Completed"]
    default_scope_for_quantity_questions: moved_statuses
    unmoved_value_notice_mandatory: true

    # Both ends are named, so destination attribution IS answerable from these
    # records — unlike the snapshot-differencing path, where it is not. See
    # movement.destination_attribution, which is scoped by basis.
    names_source_and_destination: true

  # ---------------------------------------------------------------------------
  # IDEMPOTENCY. A RE-IMPORT CONVERGES TO THE FILE; IT DOES NOT ACCUMULATE.
  #
  # Upsert each document on external_id, upsert its lines on (document, line_no),
  # then delete lines of THOSE documents whose line_no is absent from this file.
  # A document that shrinks from 40 lines to 38 ends up with 38.
  #
  # DOCUMENTS ABSENT FROM THE FILE ARE NEVER TOUCHED. These exports are
  # date-windowed, so a document's absence means "outside this window", not
  # "deleted". Deleting on absence would empty the table on the first narrow
  # export.
  #
  # line_no, not SKU, is the line identity: a document may legitimately list the
  # same SKU twice, and a SKU-keyed upsert would silently merge two real lines.
  #
  # The whole file imports in ONE transaction. A file that fails halfway leaves
  # nothing behind.
  # ---------------------------------------------------------------------------
  idempotency:
    document_key: external_id
    line_key: [document_id, line_no]
    delete_missing_lines: true
    delete_scope: documents_present_in_this_file
    delete_absent_documents: false
    single_transaction: true

  # ---------------------------------------------------------------------------
  # IMPORT LEDGER. Every import records what it read and what it could not
  # resolve, so a number's provenance reaches back to a file and an uploader.
  # ---------------------------------------------------------------------------
  imports:
    source_table: storehub_imports
    records:
      - filename
      - sha256
      - byte_size
      - uploaded_by
      - kind
      - parser_version
      - document/line counts seen, inserted, updated
      - lines deleted
      - unresolved location count
      - unmatched and ambiguous SKU counts
      - notices
    # A byte-identical re-import is ALLOWED and converges. It is recorded as its
    # own row rather than rejected: "someone re-ran this import" is itself a
    # fact worth holding, and a rejection would hide it.
    reject_duplicate_hash: false


# =============================================================================
# SUPPLIERS, PURCHASE ORDERS, LEAD TIMES, COST HISTORY
#
# REWRITTEN 2026-09-02. All three subjects were `supported: false` because none
# of the data existed. The StoreHub CSV import supplied it: 227 purchase orders
# with 1,047 lines, each carrying a supplier, a target location, a product, a
# quantity, a unit cost and three dates.
#
# THE ORIGINAL SURVEY IS PRESERVED BELOW under `survey_2026_09_01`, not deleted.
# It records what the database held before the import and is the reason these
# subjects were refused for so long; deleting it would make those refusals look
# arbitrary in hindsight. Everything above it is the current state.
#
# WHAT DID NOT CHANGE. Two things are still unsupported and are NOT quietly
# upgraded by the arrival of purchase orders:
#   - DELIVERY lead time. Nothing records when goods actually arrived.
#   - STORE-SIDE PROFIT. Still no cost captured per sales line.
# Both are stated below with their reasons.
# =============================================================================
suppliers:
  surveyed: "2026-09-01"
  resurveyed: "2026-09-02, after the StoreHub import"
  any_supplier_data: true

  # ---------------------------------------------------------------------------
  purchase_orders:
    supported: true
    since: "2026-09-02"
    source_table: purchase_orders
    lines_table: purchase_order_lines
    tool: "tools/purchasing.py get_purchasing()"
    definitions: purchasing
    measured:
      documents: 284
      lines: 1311
      exports: 3
      window: "the two disjoint 2026-09-02 exports (to 2026-07-01) plus the 2026-09-03 export (2026-07-01 to 2026-09-03)"
      measured_on: "2026-09-03"
      # A record of what was loaded, not a definition. Tools never read these
      # counts; the live figures are in get_purchasing meta.coverage.

    # There is NO supplier master. `supplier` is a free-text string on the PO.
    # Observed values include "Dried Fruits DF001", "Supplies" and "Do rei me" —
    # a product line, a category and a company. Suppliers are grouped by that raw
    # string and NEVER deduplicated or normalised: merging "Supplies" into
    # "Store supplies" would invent a supplier that placed neither order.
    supplier_master_exists: false
    supplier_is_free_text: true

    caveats:
      - "some POs have a header total disagreeing with their own lines (13 of 284 at the 2026-09-03 import; the live count is get_purchasing meta.coverage.documents_with_header_mismatch); value is summed from lines (purchasing.value_basis)"
      - "'Open' does not mean 'not received' - 8 Open POs carry notes saying the goods arrived"
      - "received quantity is sparse, sometimes exceeds ordered, and is never reconciled to it"

  # ---------------------------------------------------------------------------
  lead_times:
    # PARTIAL, and the distinction is the whole point.
    supported: partial
    completion_latency:
      supported: true
      measure: purchasing.measures.completion_lead_days
      means: "days from PO creation to being marked complete in StoreHub"
      does_not_mean: "days until goods arrived"
      label_mandatory: true
      # Why the label is mandatory rather than advisory: PO0710 was created
      # 16:34 and completed 16:36 - two minutes - under a note reading "Fixing
      # inventory. Late POS for samploc". Reported as "supplier lead time", that
      # is a claim about a supplier which actually measures data entry.
    delivery:
      supported: false
      reason: >
        Nothing observes arrival. Completion Date is a system event, Estimated
        Date of Arrival is a plan, and the real receipt date exists only as
        prose inside a free-text Notes field which is deliberately not parsed
        (storehub.notes.parse_received_date: false).
      would_require: "a receipt timestamp captured against the PO line"
    # The old global config value is still there and still meaningless.
    algorithm_settings_lead_time_days: 0
    algorithm_settings_note: "single global integer, still 0; not per-supplier, per-product or per-store"

  # ---------------------------------------------------------------------------
  last_cost:
    supported: true
    since: "2026-09-02"
    tool: "tools/cost_history.py get_cost_history(sku)"
    definitions: cost_history
    reason: >
      PO lines carry a dated unit cost per SKU, so cost genuinely has a history
      now rather than only a current scalar. It is a SERIES, not a single number,
      and it comes from three sources that mean different things - see
      cost_history.bases. products.cost remains available from
      tools/products.py get_product() as the current catalog value.
    # The old objection - that a second accessor would create a second definition
    # of cost - is answered by labelling the basis on every row rather than by
    # refusing the question.
    supersedes_reason: >
      Previously false on the grounds that "last cost" could only mean "current
      cost". That was true while products.cost was the only source. It no longer
      is.
    caveats:
      - "zero cost means NOT ENTERED, not free; flagged and excluded from statistics"
      - "transfer valuations are not purchase prices and are never blended with them"
      - "products.updated_at dates the ROW, not the cost - 15 distinct dates across the catalog"

  # ---------------------------------------------------------------------------
  # THE ORIGINAL SURVEY, PRESERVED. What the database held on 2026-09-01, before
  # the import. Kept so the earlier refusals stay legible and nobody re-runs the
  # search.
  #
  # Method: all 38 base tables and 8 views searched by NAME for
  #   supplier|vendor|purchase|po|receipt|receiv|procure|inbound|delivery|lead|order
  # and then EVERY column searched by concept for
  #   supplier|vendor|purchase|lead_time|on_order|receiv|procure|reorder|moq|
  #   incoming|cost
  # ---------------------------------------------------------------------------
  survey_2026_09_01:
    any_supplier_data: false
    purchase_orders:
      supported: false
      reason: >
        No suppliers, vendors, purchase_orders, po_lines, receipts or deliveries
        table exists. The only name matches were the vending order tables, which
        are CUSTOMER purchases from machines, not orders placed on a supplier.
      evidence:
        shipment_plans_on_order: "122,207 rows, every one is 0 (min 0, max 0, sum 0) - never populated"
        store_pipeline_on_order_units: "table has 0 rows"
        warehouse_inventory: "0 rows - the only receiving-shaped table, empty"
    lead_times:
      supported: false
      reason: >
        One global integer existed and it was zero. Not per-supplier, not
        per-product, not per-store. Lead time could not be MEASURED either:
        nothing recorded when an order was placed or when goods arrived.
      evidence:
        algorithm_settings_lead_time_days: 0
        algorithm_settings_rows: 1
        algorithm_settings_updated_at: "2026-05-11"
        observable_from_data: false
    last_cost:
      supported: false
      reason: >
        products.cost is a single current scalar per product with NO history, so
        "last cost" could only mean "current cost".
      evidence:
        products_total: 3678
        products_with_cost: 3306
        products_cost_zero: 264
        products_cost_null: 372
        history_tables: "none - no audit/history/log/version table exists (only alembic_version)"
        products_updated_at: "row-level, not cost-level; only 15 distinct dates across the whole catalog"
        new_transaction_items_has_cost_column: false
      vending_cost_is_a_history: false

  # ---------------------------------------------------------------------------
  store_profit_supported: false
  store_profit_reason: >
    No cost is captured per line. The documented formula applies current
    products.cost to historical quantities, valuing past sales at today's cost,
    and treats the 264 zero-cost and 372 null-cost products as pure margin.
    There is no cost history to correct it with. tools/sales.py has no profit
    metric by design.
  store_profit_do_not_reintroduce: true

  # Vending profit IS computable — cost is captured on the line — but it is
  # overstated on 72.7% of lines where the cost was never entered. See
  # vending.profit_overstated_pct; that metric carries a mandatory flag.
  vending_profit_supported: true
  vending_profit_caveat: "overstated on 72.7% of lines; flag is mandatory"

  # ---------------------------------------------------------------------------
  # What a real procurement integration would have to provide before any of the
  # three subjects above becomes answerable. Kept here so the gap is a
  # specification rather than a rediscovery.
  # ---------------------------------------------------------------------------
  required_to_support:
    - "a supplier/vendor master (id, name, terms)"
    - "purchase orders with a placed timestamp, supplier, product, quantity and unit cost"
    - "goods receipts with a received timestamp and quantity, linked to the PO line"
    - "line-level cost captured on new_transaction_items at time of sale, or a dated product cost history"
  # With PO placed-time and receipt-time, lead time becomes measurable rather
  # than configured, and warehouse receipts stop being invisible — which is also
  # the missing half of the movement problem (see movement.recorded_ledger_exists).


# =============================================================================
# PURCHASING — questions about purchase orders
#
# Built on the imported StoreHub PO export (see storehub.purchase_orders).
# Everything here became answerable only when that import existed; before it,
# suppliers.purchase_orders.supported was false.
# =============================================================================
purchasing:
  source_table: purchase_orders
  lines_table: purchase_order_lines
  currency: PHP

  # ---------------------------------------------------------------------------
  # VALUE COMES FROM THE LINES, NEVER FROM THE HEADER TOTAL.
  #
  # Some purchase orders carry a header total that disagrees with their own
  # lines, sometimes enormously: PO0604 says 90,000.00 over 13 lines that sum to
  # 0.00, PO0575 says 400,000.00 against 200,000.00 of lines. No stock transfer
  # does this in 2,034 documents. The count grows with each import (12 of 227 at
  # the 2026-09-02 load, 13 of 284 after 2026-09-03 — PO0656's third line has a
  # cost that was never entered), so tools compute it from
  # purchase_orders.header_total_reconciles on every call rather than quoting it.
  #
  # The lines are the safer basis: they are itemised, they carry the quantity and
  # unit cost that produced them, and they are what a product- or category-level
  # answer must use anyway. Using the header for a total and the lines for a
  # breakdown would make the two disagree inside one answer.
  #
  # Documents whose header disagrees are still IMPORTED and still COUNTED. The
  # discrepancy is surfaced via purchase_orders.header_total_reconciles and a
  # mandatory notice, never silently preferred away.
  # ---------------------------------------------------------------------------
  value_basis: lines
  value_basis_column: "pol.subtotal"
  header_total_is_authoritative: false
  header_mismatch_notice_mandatory: true

  # kind / domain / display_name: the metric model (metric_model above).
  # completion_lead_days is a mean of one column, not a combination of other
  # measures, so it is `base` under that model's definition of derived.
  measures:
    po_count:
      kind: base
      domain: purchasing
      display_name: "Purchase orders"
      description: "Number of purchase orders. Document grain."
      sql: "COUNT(DISTINCT po.id)"
      unit: purchase_orders
      grain: document
      valid_group_by: [supplier, store, status, day, week, month]
    ordered_value:
      kind: base
      domain: purchasing
      display_name: "Ordered value"
      description: "Value ordered, summed from line subtotals. The default measure."
      sql: "SUM(pol.subtotal)"
      unit: PHP
      grain: line
      valid_group_by: [supplier, store, status, day, week, month, product, category]
    ordered_qty:
      kind: base
      domain: purchasing
      display_name: "Ordered quantity"
      description: "Quantity ordered. NOT additive across products — see additive_across_products."
      sql: "SUM(pol.ordered_qty)"
      unit: mixed
      grain: line
      additive_across_products: false
      valid_group_by: [supplier, store, status, day, week, month, product, category]
    received_qty:
      kind: base
      domain: purchasing
      display_name: "Received quantity"
      description: "Quantity recorded as received. Sparse; never reconciled to ordered."
      sql: "SUM(pol.received_qty)"
      unit: mixed
      grain: line
      additive_across_products: false
      coverage_flag_mandatory: true
      valid_group_by: [supplier, store, status, day, week, month, product, category]
    completion_lead_days:
      kind: base
      domain: purchasing
      display_name: "Completion latency (days)"
      description: >
        Mean days from creation to the PO being marked complete in StoreHub.
        SYSTEM COMPLETION LATENCY, NOT DELIVERY TIME. See
        storehub.purchase_orders.lead_time — PO0710 was created and completed two
        minutes apart as a backdated correction, and PO0707 shows 2d21h while its
        own note says the goods arrived on the creation day.
      sql: "AVG(EXTRACT(EPOCH FROM (po.completion_date - po.created_at_source)) / 86400.0)"
      unit: days
      grain: document
      label_mandatory: "system completion latency, not delivery time"
      requires: "po.completion_date IS NOT NULL"
      valid_group_by: [supplier, store, day, week, month]

  # Quantities mix units across products (grams for per-gram items, packs for
  # others — see storehub.quantity_unit), so a quantity total is only meaningful
  # within one product. Value is the additive measure.
  quantity_additive_across_products: false

  group_expressions:
    supplier: "COALESCE(NULLIF(po.supplier_name, ''), 'Unknown supplier')"
    store:    "po.target_store_id"
    status:   "po.status"
    product:  "pol.product_id"
    category: "COALESCE(NULLIF(pol.category_raw, ''), 'Uncategorized')"
    day:      "date_trunc('day',   (po.created_at_source AT TIME ZONE 'Asia/Manila'))::date"
    week:     "date_trunc('week',  (po.created_at_source AT TIME ZONE 'Asia/Manila'))::date"
    month:    "date_trunc('month', (po.created_at_source AT TIME ZONE 'Asia/Manila'))::date"

  date_column: "po.created_at_source"

  # ---------------------------------------------------------------------------
  # STATUS. 'Open' IS NOT 'NOT RECEIVED'. Measured: 8 of the 151 POs in the main
  # export are Open with notes saying the goods arrived. A tool reporting Open as
  # outstanding value must attach the caveat.
  # ---------------------------------------------------------------------------
  cancelled_statuses: ["Cancelled"]
  exclude_cancelled_by_default: true
  open_is_not_outstanding: true
  open_notice_mandatory: true

  # Not answerable. The receipt date lives only in free-text notes, which are
  # deliberately not parsed (storehub.notes.parse_received_date: false).
  # ---------------------------------------------------------------------------
  # PURCHASE PLANNING. Added 2026-09-09, and it exists to replace a chore done
  # by hand: export sales from StoreHub, look at them per supplier, and order
  # enough of each product to last.
  #
  # Goods land at AJI BARN and are distributed from there, so demand is the
  # whole retail estate's and the stock position is the estate plus the
  # warehouse.
  # ---------------------------------------------------------------------------
  plan:
    # WHO SUPPLIES A PRODUCT IS INFERRED FROM HISTORY, NOT DECLARED. There is
    # no supplier column on products and no supplier master
    # (suppliers.purchase_orders.supplier_master_exists: false), so the only
    # link is what was bought from whom before.
    #
    # MEASURED 2026-09-09: 650 of 3,723 products appear on a purchase order
    # with a supplier — 608 with exactly one, 42 with more than one. Of the
    # 1,130 products that sold in the previous 90 days, only 456 can be traced
    # to a supplier at all. A plan therefore covers roughly two selling
    # products in five, and MUST say so: a supplier's plan that silently omits
    # three fifths of what they supply reads as a complete order.
    supplier_link:
      derived_from: "purchase_order_lines.product_id -> purchase_orders.supplier_name"
      is_declared: false
      products_with_a_supplier: 650
      products_with_exactly_one: 608
      products_with_several: 42
      selling_products_90d: 1130
      selling_products_traceable: 456
      ambiguous_notice_kind: supplier_ambiguous
      coverage_notice_kind: supplier_coverage
      coverage_notice_mandatory: true

      # THE MAP, AND THE GATE ON IT. Added 2026-09-10.
      #
      # ops/propose_supplier_map.py reads purchase history and writes
      # definitions/product_suppliers.yaml with `status: proposed`. NOTHING
      # reads it until a person sets `status: approved` and commits — the
      # review is the gate, the diff is the audit trail, and approval is a
      # commit. Until then this tool works from purchase history exactly as it
      # did, and says a mapping is waiting.
      #
      # This is the workflow promotion gate applied to a definition rather than
      # to a rule: proposed by machine, evidenced, made permanent by a person.
      # It is the smallest safe instance of George extending what he knows, and
      # it is deliberately the first, because a wrong entry here costs one
      # wrong line on a draft order that somebody is going to read anyway.
      map_file: definitions/product_suppliers.yaml
      map_authoritative_when: approved
      map_status_values: [proposed, approved]
      # `overrides` beats `confident` for the same product, is never written by
      # the generator, and is where a product with no purchase history gets its
      # real supplier.
      map_override_key: overrides
      map_confident_key: confident
      unapproved_notice_kind: supplier_map_not_approved

    # THE COVER PERIOD IS A JUDGEMENT, NOT A DEFINITION. Confirmed with the
    # business 2026-09-09: there is no rule — it is decided per order, per
    # supplier, each time. So a tool NEVER invents one. Without it the plan
    # reports demand, stock and how long the stock will last; with it, and only
    # then, it reports a quantity to order.
    cover_days:
      is_a_business_rule: false
      supplied_by: caller
      invent_a_default: false

    demand:
      lookback_days: 90
      scope: active_retail          # the warehouse does not sell
      excludes_cancelled: true
      units_column: "ti.quantity"

    # A NEGATIVE ON HAND IS READ AS NONE AT THAT LOCATION, NEVER AS A DEFICIT.
    #
    # This is the most important line in this section. shipment_plans sizes its
    # request as (min_level - on_hand) against the raw figure, and on the
    # 2026-09-06 run 662 lines with a negative on hand accounted for 59,715 of
    # the 95,799 units requested — 62% of that plan — because a reading of
    # -174,877 adds its own magnitude to the order. Purchasing must not repeat
    # it: a broken record means the stock is unknown, not that 174,877 units
    # are owed. The raw sum is reported beside the planning figure so nothing
    # is hidden.
    negative_on_hand:
      read_as: none_at_that_location
      never_as_a_deficit: true
      raw_sum_also_reported: true
      notice_kind: purchase_plan_negative_on_hand
      notice_mandatory: true

    # A RATE MEASURED WHILE A PRODUCT WAS UNAVAILABLE UNDERSTATES DEMAND. Days
    # with no sellable stock anywhere are counted and reported per product, and
    # they NEVER adjust the rate: inflating a measured figure to what it might
    # have been is inventing a sale. The reader decides what to do about it,
    # which is the same judgement the cover period already is.
    availability:
      flag_only: true
      adjusts_the_rate: false
      source: inventory.history
      notice_kind: demand_suppressed_by_stockouts

    # What is already coming. `Open` does not mean `not received`
    # (purchasing.open_is_not_outstanding), so an on-order quantity may already
    # be on the shelf and the notice is mandatory.
    on_order:
      source: open purchase order lines
      may_already_have_arrived: true

    # WHEN THE SHELF EMPTIES, AS A DATE. Added 2026-09-12. days_of_cover is a
    # number the reader had to turn into a day; the tool does it once, in
    # SQL, from the Manila date read in the same transaction. Whole days,
    # floored: 1.9 days of cover empties tomorrow, not the day after. On
    # order is NOT added — Open does not mean not received
    # (purchasing.open_is_not_outstanding), so counting it would move the
    # date out on goods that may already be on the shelf. No sales in the
    # window means no rate and no date, never "never".
    run_out_date:
      introduced: "2026-09-12"
      formula: "today + floor(on_hand / units_per_day) days"
      today: manila_calendar_date_read_in_the_same_transaction
      counts_on_order: false
      null_when: no_sales_in_the_window

    # Nothing records when goods actually arrived, so a plan cannot add cover
    # for the wait. Stated on every result rather than silently omitted.
    lead_time_available: false

    max_rows: 300

  delivery_lead_time_supported: false
  delivery_lead_time_refusal: >
    Delivery lead time is not answerable from this data. Nothing records when
    goods arrived: Completion Date is when the PO was marked complete in
    StoreHub (PO0710's is two minutes after creation, on a backdated
    correction), Estimated Date of Arrival is a plan, and the actual receipt
    date appears only inside a free-text Notes field that is deliberately not
    parsed. What IS available is completion latency — ask for
    completion_lead_days, which measures the paperwork, not the supplier.


# =============================================================================
# COST HISTORY — its own grain, and three sources that must never be blended
# =============================================================================
cost_history:
  description: >
    Unit cost for one SKU over time. The grain is (sku, source document, date,
    unit cost) — one row per document line, not one row per product.

  # ---------------------------------------------------------------------------
  # THREE BASES, THREE MEANINGS. They are returned as separate labelled series
  # and are NEVER averaged, unioned into one trend, or compared as though they
  # were the same number.
  #
  #   purchase_order      what a SUPPLIER charged, on a dated PO line.
  #   transfer_valuation  what a stock transfer VALUED the goods at internally.
  #                       This is not a purchase price and does not become one by
  #                       sitting in the same column.
  #   current_catalog     products.cost — a single current scalar with no
  #                       history, dated only by products.updated_at, which is
  #                       row-level and moves for unrelated edits.
  #
  # Averaging a supplier price with an internal valuation produces a number that
  # is neither, and it would look like a cost trend.
  # ---------------------------------------------------------------------------
  bases:
    purchase_order:
      source_table: purchase_order_lines
      means: "what a supplier charged"
      date_column: "po.created_at_source"
      authoritative_for_cost: true
    transfer_valuation:
      source_table: stock_transfer_lines
      means: "internal valuation on a stock transfer, NOT a purchase price"
      date_column: "st.created_at_source"
      authoritative_for_cost: false
    current_catalog:
      source_table: products
      means: "the single current cost scalar, no history"
      date_column: "p.updated_at"
      date_is_reliable: false
      date_caveat: >
        products.updated_at is row-level, not cost-level, and moves when any
        column on the product changes. Only 15 distinct dates exist across the
        whole catalog, so it dates the ROW, not the cost.
      authoritative_for_cost: false

  never_blend_bases: true
  never_average_across_bases: true

  # ---------------------------------------------------------------------------
  # ZERO COST MEANS "NOT ENTERED", NOT "FREE". KF27 "aji hellboy plum" moves on
  # transfer after transfer at 0.00, and PO0604 carries 13 lines all at 0.00
  # under a 90,000.00 header. A cost series that silently includes zeros reports
  # a collapsing price for an item whose price was simply never typed in.
  # Zero-cost rows are returned, flagged, and excluded from any min/max/mean.
  # ---------------------------------------------------------------------------
  zero_cost_means: not_entered
  zero_cost_excluded_from_statistics: true
  zero_cost_flag: cost_not_entered

  # SKU matching here is the IMPORT rule, not the human rule: case-sensitive,
  # because TKY28 and Tky28 are different products and blending their cost
  # histories would invent a price series for neither.
  sku_match: case_sensitive
  sku_match_ref: products.sku.import_match


# =============================================================================
# THE MORNING BRIEF — what "changed since yesterday" is allowed to mean
#
# A brief is the shape most likely to lie by omission: it is short, it is read
# in a hurry, and every source it touches has a different age. So the rules for
# what counts as a change, what is worth mentioning, and which sources are too
# stale to speak all live here rather than in the tool.
# =============================================================================
brief:

  # ---------------------------------------------------------------------------
  # SALES: COMPARE LIKE WITH LIKE, WHICH IS NOT YESTERDAY vs THE DAY BEFORE.
  #
  # MEASURED 2026-09-03 over 120 closed days, company-wide net sales:
  #     vs previous DAY            median 21.3%   p75 62.2%   p90 77.0%
  #     vs same WEEKDAY last week  median 12.5%   p75 20.0%   p90 34.3%
  #
  # And the weekday cycle is enormous:
  #     Mon 170,492   Tue 183,048   Wed 200,510   Thu 217,803
  #     Fri 258,812   Sat 430,765   Sun 504,300
  #
  # Sunday averages nearly THREE TIMES Monday. A brief built on the previous day
  # would report a catastrophe every Monday (-66% by construction) and a triumph
  # every Saturday, and that cycle would drown every real signal. Do not
  # "simplify" this back to day-over-day.
  # ---------------------------------------------------------------------------
  sales_vs_same_weekday:
    comparison: same_weekday_last_week
    baseline_offset_days: 7
    comparison_rejected: previous_day
    comparison_rejected_reason: >
      Day-over-day swings a median 21.3% against 12.5% for the same weekday a
      week earlier, and Sunday averages 3x Monday, so the sign of a day-over-day
      change is mostly a function of which day it is.

    # BOTH conditions must hold. They nearly coincide when yesterday is normal;
    # the absolute floor only bites when the BASELINE was unusually low, where a
    # large percentage describes a small amount of money. Fairview moving from a
    # PHP 5,000 baseline to PHP 7,000 is +40% and PHP 2,000 — under its floor,
    # so it stays out of the brief. Without the floor the smallest store would
    # dominate every morning.
    pct_threshold: 30.0
    absolute_floor_fraction: 0.25

    # ---------------------------------------------------------------------
    # WHAT THESE THRESHOLDS ACTUALLY PRODUCE. Measured 2026-09-03 by replaying
    # 143 closed days across the 7 active stores:
    #
    #   pct >= 20%, floor 20% of median -> 3.3 stores/day, quiet mornings   0/143
    #   pct >= 30%, floor 25% of median -> 2.2 stores/day, quiet mornings  13/143   <- CONFIGURED
    #   pct >= 35%, floor 30% of median -> 1.7 stores/day, quiet mornings  24/143
    #
    # WHY NOT 20%. The per-store week-over-week median swing is 18.9%-26.2%, so a
    # 20% threshold is roughly ordinary noise BY CONSTRUCTION: it named about half
    # the estate every single day and produced ZERO quiet mornings in 143 days. A
    # brief that always fires teaches people to stop reading it, and the day
    # something genuinely breaks it looks like every other day.
    #
    # 30% clears the per-store noise band and buys roughly one quiet morning a
    # fortnight. Those quiet mornings are the point: they are what makes a
    # non-quiet one mean something. Raising it further is a judgement about how
    # much silence is acceptable, not a technical fix — the numbers above are
    # here so that judgement is made with evidence rather than by feel.
    #
    # Changed from 20/0.20 to 30/0.25 on 2026-09-03 after measuring the above.
    # ---------------------------------------------------------------------
    signal_rate_measured: "2026-09-03, 143 closed days, 7 stores"
    signal_rate_stores_per_day: 2.2
    signal_rate_quiet_mornings: 13
    signal_rate_days_measured: 143

    # The floor is a FRACTION OF THAT STORE'S OWN MEDIAN DAY, computed at run
    # time from a trailing window — never a frozen number per store. A hardcoded
    # median decays silently as the business changes; a rule does not.
    #
    # Reference values measured 2026-09-03 (for regression, NOT inputs):
    #   Rockwell 55,603  OPUS 42,233  Greenhills 34,601  Shang 28,832
    #   Magnolia 27,050  North Edsa 22,431  Fairview 20,102
    # ...which put the floor between roughly PHP 4,000 and PHP 11,100.
    median_lookback_days: 90
    median_is_computed_at_runtime: true

  # ---------------------------------------------------------------------------
  # STOCK: A TRANSITION, NEVER A LEVEL.
  #
  # 87.4% of inventory rows are already out of stock, so "how many are out" is
  # not news and never will be. What changed is the crossing.
  #
  # Negative on-hand counts as out (inventory.states.out_of_stock is <= 0), so
  # the transition is positive -> non-positive.
  #
  # The two dates compared are the two most recent SNAPSHOT DAYS, not literally
  # yesterday and the day before: coverage has gaps (AJI BARN has 148 snapshot
  # days across a 162-day span). The brief reports which two dates it actually
  # used, and says so when they are not consecutive.
  # ---------------------------------------------------------------------------
  stock_crossed_out:
    transition: positive_to_nonpositive
    compare: two_most_recent_snapshot_days
    gap_notice_mandatory: true
    # low_stock is not available as a brief item and will not become one until
    # warning_stock is populated: it matches zero rows on 100% of inventory.
    low_stock_available: false

  # ---------------------------------------------------------------------------
  # DEAD STOCK: "CROSSED 30 DAYS WITH NO SALE" — an event, not an artefact.
  #
  # A product does not become dead because something happened; it becomes dead
  # because time passed. Comparing yesterday's dead list to today's would report
  # the window sliding. So the item is the CROSSING: still held, no sale in the
  # window, and the last sale fell out of the window overnight.
  #
  # 53.3% of held products are already dead, so the standing list is not news
  # either. Retail scope only — AJI BARN quantities are dispatch counters, not
  # stock (dead_stock.barn_excluded_reason).
  # ---------------------------------------------------------------------------
  newly_dead:
    window_days: 30
    framing: crossed_30_days_without_a_sale
    held_predicate_ref: dead_stock.stock_predicate
    scope_ref: dead_stock.scope

  # A brief nobody finishes reading is a brief that failed.
  max_items_per_section: 8

  # ---------------------------------------------------------------------------
  # FRESHNESS. THE BRIEF NAMES EVERY SOURCE, INCLUDING THE ONES IT CANNOT USE.
  #
  # Measured 2026-09-03, and the spread is the whole problem: the sources a
  # brief would naturally mix are between 0 and 64 days old.
  #
  #   transactions          0 d    current
  #   inventory_snapshots   1 d    current
  #   vending lines         1 d    current
  #   vending_aisles       29 d    stale; cannot be date-filtered at all
  #   stock_transfers      64 d    FROZEN — a static CSV import
  #   purchase_orders      64 d    FROZEN — a static CSV import
  #
  # A brief that silently omits purchasing reads as "nothing happened in
  # purchasing". Omission is the lie a brief tells most easily, so a stale or
  # frozen source is reported AS AN ITEM, with its age and why it is silent.
  # ---------------------------------------------------------------------------
  freshness:
    max_age_days:
      transactions: 2
      inventory_snapshots: 2
      vending_lines: 2
      vending_aisles: 7
      stock_transfers: 2
      purchase_orders: 2
    stale_policy: state_explicitly
    frozen_sources: [stock_transfers, purchase_orders]
    frozen_reason: >
      Loaded once from a StoreHub CSV export. They cannot change until someone
      imports again, so "since yesterday" is not a question they can answer.

  # ---------------------------------------------------------------------------
  # EMPTY IS NOT QUIET. A section with nothing in it must say WHICH it is:
  # nothing crossed the threshold, or the data never arrived. Those look
  # identical on a phone at 6am and mean opposite things.
  # ---------------------------------------------------------------------------
  empty_section_must_distinguish: true

  # At 06:00 Manila yesterday closed six hours ago. Sync lag is 0-1 days
  # (tests/golden.py MAX_SYNC_LAG_DAYS = 2), so yesterday is normally complete
  # but can still be settling. The brief reports the newest transaction it saw
  # so the reader can judge for themselves.
  report_newest_transaction: true

  # ---------------------------------------------------------------------------
  # NOTABILITY — WHICH ONE ITEM SPEAKS FIRST.
  #
  # The brief is a LIST and stays one: nothing here drops an item or reorders
  # the brief itself. This ranks the same rows for the one place that can show
  # exactly one of them — George's opening line on a new chat, which has a
  # sentence and not a screen. Everything below it is still the whole brief.
  #
  # WHY SALES LEADS. It is money, it is estate-wide, and it is the only section
  # whose threshold was measured against a noise floor (see
  # sales_vs_same_weekday.signal_rate_measured: 2.2 stores/day over 143 days).
  # A stock crossing is one SKU at one store, and a newly-dead product is one
  # SKU that stopped selling a month ago and only became reportable overnight.
  # Both matter; neither outranks a store taking a third less money than it
  # took the same weekday last week.
  #
  # WHY ABSOLUTE CHANGE AND NOT PERCENTAGE. Ranking on change_pct hands the
  # opening line to the smallest store nearly every morning — Fairview's median
  # day is PHP 20,102 against Rockwell's PHP 55,603, so the same peso swing is
  # almost three times the percentage there. That is the exact failure
  # absolute_floor_fraction exists to prevent, and ranking on percentage would
  # reintroduce it one layer up. The floor already decided the item is worth
  # reporting; notability only decides which of the survivors speaks.
  #
  # TIE-BREAK IS THE SUBJECT NAME, not row order. Row order depends on the
  # order store ids come back in, so two items on the same figure would
  # otherwise swap places between two runs of the same morning.
  # ---------------------------------------------------------------------------
  notability:
    section_order:
      - sales_vs_same_weekday
      - stock_crossed_out
      - newly_dead
    # The field ranked WITHIN a section, largest first, absolute value.
    measure:
      sales_vs_same_weekday: change
      stock_crossed_out: was
      newly_dead: quantity_on_hand
    tie_break: subject
    ranks_the_opening_line_only: true


# =============================================================================
# ATTENTION — what deserves attention today, as one read. Added 2026-09-12.
#
# THE JUDGEMENT LAYER. The brief is a fixed read at a fixed time; this is the
# judgement over it: which sources can NOTICE (carry a definition of normal),
# how their survivors rank against one another, and which senses are blind and
# why. tools/attention.py composes it; George reads it for "what should I look
# at", "what changed" and the morning.
#
# NO NEW THRESHOLD. Every `floor` below is a REFERENCE to a definition that
# already exists — the same floors the brief applies — held by
# tests/test_attention_contract.py. A source with no definition of normal is
# listed under cannot_notice with the reason, so the morning says "I cannot
# see deliveries" rather than letting silence read as calm.
#
# SILENCE IS THE NORMAL STATE. When nothing crossed, the read says so and the
# room does not open on the morning (standing_runner records the outcome as
# silent, and latest_answer offers only answers). Management by exception.
# =============================================================================
attention:
  introduced: "2026-09-12"
  sources:
    sales_vs_same_weekday:
      via: get_brief
      section: sales_vs_same_weekday
      floor: brief.sales_vs_same_weekday
      measure: change            # absolute money, for brief.notability's reason
    stock_crossed_out:
      via: get_brief
      section: stock_crossed_out
      floor: brief.stock_crossed_out
      measure: was
    newly_dead:
      via: get_brief
      section: newly_dead
      floor: brief.newly_dead
      measure: quantity_on_hand
  # Money first, then a shelf that just emptied, then what stopped selling —
  # the same order and reasons as brief.notability.section_order.
  order: [sales_vs_same_weekday, stock_crossed_out, newly_dead]
  tie_break: subject
  silent_when_nothing_crossed: true
  senses_dated: true
  # What cannot be noticed today and why. Each names the definition that
  # records the gap; when the gap closes, the entry moves up into sources.
  cannot_notice:
    low_stock:
      why: inventory.low_stock_operational
      says: "low-stock thresholds have never been set, so nothing can be low — only the crossing to zero is seen"
    deliveries:
      why: brief.freshness.frozen_reason
      says: "purchase orders and transfers were loaded once from an export and cannot change until someone imports again"
    vending:
      why: brief.freshness.max_age_days
      says: "the vending sources are past their freshness limit, so a change there cannot be told from a stale feed"
    cover:
      why: purchasing.plan
      says: "days of cover is measured per supplier plan, not estate-wide; a supplier's plan is watched as a standing question of its own"

  # ---------------------------------------------------------------------------
  # LEARNING FROM WHAT YOU DO. Added 2026-09-12. The one place George's
  # ranking changes because of a person, and every change is a RECORDED
  # GESTURE — kept, set aside, opened, asked about, or left when the morning
  # was put away — written to george.decisions by the room and read back
  # through an injected reader, because george_ro cannot see that schema.
  # Nothing is inferred from silence: a row nobody touched is a row nobody
  # touched. Every adjustment is written on the row (`learning.reason`) so a
  # reader can see why the order is what it is, and the rules are
  # definitions, so changing what George learns from is one edit here.
  # ---------------------------------------------------------------------------
  learning:
    introduced: "2026-09-12"
    outcomes: [kept, dismissed, opened, asked, left]
    only_recorded_gestures: true
    window_days: 30
    rules:
      dismissed_ranks_last:
        when: "set aside `times` or more times in the window"
        times: 3
        effect: below_everything_not_so_dismissed
        reason: "ranked lower: set aside {n} times"
      attended_ranks_first:
        when: "kept, opened or asked about within `days` days"
        days: 7
        effect: first_within_its_source
        reason: "ranked higher: {outcome} {ago}"
      kept_is_marked:
        when: "kept, ever in the window"
        effect: row_carries_kept
        reason: "kept"
    # Each row carries its recent decisions, newest first, this many at most —
    # so "raised Tuesday, left" is read off the row and never remembered.
    decisions_on_row: 5


# =============================================================================
# NOTICE FINGERPRINTS
#
# Every tool can attach meta.notice when a result is not what it appears — an
# empty list that means "not configured", a figure that is overstated, a SKU
# that is three products. agent/loop.py refuses to finish an answer while an
# unsurfaced notice is pending.
#
# Verifying "surfaced" needs a check. These fingerprints are that check, and
# they live here rather than in the loop so they can be tuned without touching
# code — the same reason every other definition is in this file.
#
# SEMANTICS: must_convey is a list of GROUPS. Every group must match (AND);
# within a group any one alternative matching is enough (OR). Matching is
# case-insensitive substring over the model's final answer.
#
# THIS IS A HEURISTIC AND IT CAN BE WRONG. It is a gate, not a guarantee: when
# it fails twice the loop appends the notice verbatim under a "Caveats" heading
# and records notice_forced in the log, so the reader always sees the caveat
# even when the fingerprint misjudged the wording.
# =============================================================================
notices:
  # ---------------------------------------------------------------------------
  # THE NOTICE CONTRACT. Added 2026-09-08, UI System V2 Stage 2.
  #
  # A notice has TWO audiences and used to be written for one of them. The
  # reader needs the caveat; the model needs the caveat AND an instruction about
  # what to do with it — "Say which, and why, rather than reporting the
  # comparison as whole; change_pct is null on those rows and must not be filled
  # in." That sentence was inside `message`, and `message` is what NoticeBanner
  # renders above the figure. So a person asking how a store did was shown a
  # paragraph of instructions addressed to somebody else, naming a column they
  # have never heard of.
  #
  # THE FIELDS, AND WHO EACH IS FOR.
  #
  #   message   the caveat, in business language, for the READER. Complete on
  #             its own: it must still say what is wrong and what it means for
  #             the figure, because this is the only part that is surfaced
  #             (UI rule 4) and nothing may weaken that.
  #   guidance  OPTIONAL, and for the MODEL only. What to do about the caveat —
  #             what to say, what not to compute, what not to add up. It reaches
  #             the model inside the tool result like every other field and is
  #             NEVER sent in the `notice` frame or rendered anywhere.
  #   source    the citation, for AUDIT. A metrics.yaml key or a tool name. It
  #             is provenance rather than caveat, so it sits at the disclosure
  #             level with the receipts and not on the always-visible line.
  #
  # WHAT DID NOT CHANGE. `must_convey` is checked against the ANSWER, never
  # against the message, so moving text between these fields cannot weaken the
  # fingerprint enforcement in agent/loop.py `_unsurfaced` — and does not. Every
  # kind below keeps exactly the fingerprint it had.
  #
  # Held by tests/test_prose_contract.py, which fails if a notice `message`
  # acquires model-directed vocabulary again.
  # ---------------------------------------------------------------------------
  contract:
    message_audience: reader
    guidance_audience: model
    guidance_optional: true
    guidance_never_rendered: true
    source_is_provenance_not_caveat: true
    must_convey_checks_the_answer_not_the_message: true

  # THE VOCABULARY IS THE READER'S, and on 2026-09-13 it was the column's.
  # George wrote "the shop's low-stock warning level has never been set on a
  # single product, so nothing can ever be flagged as low", which is the caveat
  # said better than the notice says it — and group 1 did not contain the word
  # he used. Two corrective turns, then the caveat was forced, and the forced
  # text was the notice message with a column name in it. Both halves fixed:
  # the group now holds the words a person uses, and `warning_stock` came OUT
  # of it, because a fingerprint an answer can satisfy by naming an internal
  # column rewards the leak the notice contract exists to prevent.
  low_stock_not_operational:
    must_convey:
      # Kept specific on purpose. Group 2 is already loose ("no " matches most
      # answers), so this group carries all of the fingerprint's precision: a
      # bare "stock level" would let an answer that dropped the caveat pass,
      # which the notice mechanism exists to prevent.
      - [threshold, thresholds, "warning level", "low-stock level", "low stock level",
         "reorder level", "reorder point", "alert level", "minimum stock level"]
      - [not set, unset, never, "no ", not configured]
  snapshot_coverage_gap:
    must_convey:
      - [snapshot, coverage, no data]
      - [gap, not covered, outside, no snapshot, unavailable]
  snapshot_gaps:
    must_convey:
      - [gap, missing]
      - [day, days]
  sku_not_found:
    must_convey:
      - [sku, product]
      # "no" MUST stay quoted. Unquoted, YAML reads it as the boolean false, and
      # _unsurfaced then calls .lower() on it and takes the whole answer down
      # with an AttributeError — verified 2026-09-03, this exact line. Same for
      # yes/on/off/null/~ anywhere in a fingerprint.
      - ["no", not exist, unknown, not found]
  # ---- stock history (2026-09-09) -----------------------------------------
  negative_on_hand:
    must_convey:
      - [negative]
      - [record, records, stock, reading, readings, "on hand"]
  replenishment_days_of_stock_tail:
    must_convey:
      - [cover, "days of stock", "days of cover"]
      - ["not", trickle, unreliable, "real", huge, misleading]
  history_coverage:
    must_convey:
      - [day, days]
      - ["no record", "no stock record", "not read", missing, gap, "without"]
  # ---- replenishment (2026-09-09) -----------------------------------------
  replenishment_partial_run:
    must_convey:
      - [shop, shops, store, stores]
      - ["not", only, some, fewer, partial, "did not"]
  replenishment_run_stale:
    must_convey:
      - [calculated, planned, "worked out", ran, run]
      - ["days ago", since, old, "not today", earlier]
  replenishment_allocation_not_binding:
    must_convey:
      - [ship, shipped, sent, shipment, confirmed, moved]
      - ["not", "does not", "no", "may not"]
  replenishment_fallback_velocity:
    must_convey:
      - [demand, "sales rate", "how fast", "how much"]
      - [understate, low, unavailable, "out of stock", starved, slow]
  replenishment_mixed_algorithms:
    must_convey:
      - [method, methods, way, ways, calculation]
      - ["more than one", two, both, mixed, different]
  replenishment_negative_on_hand:
    must_convey:
      - [negative]
      - [record, records, stock, reading, readings]
  # ---- purchase planning (2026-09-09) --------------------------------------
  supplier_coverage:
    must_convey:
      - [supplier, suppliers]
      - ["not", cannot, "no record", unknown, "part of", missing, "some"]
  supplier_map_not_approved:
    must_convey:
      - [supplier, suppliers, mapping, map]
      - [proposed, waiting, "not approved", approve, review]
  supplier_ambiguous:
    must_convey:
      - [supplier, suppliers]
      - [also, another, "more than one", different, other]
  purchase_plan_negative_on_hand:
    must_convey:
      - [negative]
      - [record, records, stock, reading, readings]
  demand_suppressed_by_stockouts:
    must_convey:
      - ["out of stock", "nothing on the shelf", unavailable, "no stock", "not on the shelf"]
      - [understate, "would have sold", "more than", low, suppressed]
  purchasing_open_not_outstanding:
    must_convey:
      - [open]
      - ["not", "may already", "already arrived", received, "may have"]
  delivery_lead_time_unsupported:
    must_convey:
      - [arrive, arrived, arrival, delivery, wait, "lead time"]
      - ["not", nothing, "no record", "does not", "cannot"]
  cover_period_not_chosen:
    must_convey:
      - ["how long", cover, last, period]
      - ["no", "not", say, choose, "tell me", "give"]

  ambiguous_sku:
    must_convey:
      - [different products, three products, more than one product, several products, multiple products]
  duplicate_skus_in_result:
    must_convey:
      - [sku]
      - [duplicate, more than one, not unique, not a key]
  metric_redefined:
    must_convey:
      - [contain, containing, different question, not transactions of]
  reconciliation_failed:
    must_convey:
      - [disagree, differ, do not tie, does not tie, discrepanc, not comparable]
  orphan_line_items:
    must_convey:
      - [line item, product]
      - [not exist, missing, no matching, orphan, not in]
  profit_overstated:
    must_convey:
      - [profit]
      - [overstated, no cost, missing cost, never entered, uncosted]
  low_category_coverage:
    must_convey:
      - [categor]
      - [coverage, minority, incomplete, only, uncategorized]
  stale_stock:
    must_convey:
      - [stale, days old, last sync, out of date, not current]
  no_recorded_dispatch:
    must_convey:
      - [dispatch, record, movement]
      - ["no", none, not explain, unrecorded, does not exist]

  # A closed location asked about in the present tense. The answer must say the
  # place is shut rather than report nothing and let it read as "no stock".
  location_closed:
    must_convey:
      - [closed, shut, no longer, ceased]
      - [location, warehouse, store, macopa]
  # The other half of the same notice — movement.py picks between the two with
  # `"location_closed" if closed else "no_snapshot_coverage"`, and only the
  # closed case had ever been fingerprinted. A location merely outside the
  # snapshot scope produced a caveat no answer could satisfy.
  no_snapshot_coverage:
    must_convey:
      - [snapshot, balance history, inventory scope]
      - [not in, "no ", outside, cannot, unavailable, does not exist]

  # ---------------------------------------------------------------------------
  # Added 2026-09-03. These twelve kinds were EMITTED BY TOOLS WITH NO FINGERPRINT
  # HERE, and _unsurfaced treats an unknown kind as unsurfaced by design ("safer
  # to over-report"). That default is right for a kind nobody has thought about,
  # but it made these twelve UNSATISFIABLE: no wording could ever clear them, so
  # every answer carrying one spent a corrective turn rewriting itself and then
  # had the notice appended verbatim anyway — beneath prose that had just said
  # the same thing.
  #
  # The morning brief showed it worst, emitting several at once: the answer was
  # written twice and then caveated with what it already said. See the contract
  # test that now fails if a tool adds a notice kind without a fingerprint.
  # ---------------------------------------------------------------------------
  stale_sources:
    must_convey:
      - [too old, stale, out of date, not fresh, frozen, days old]
      - [source, sources, transfer, purchase order, vending, covers nothing]
  empty_section:
    must_convey:
      - [nothing to report, nothing crossed, no items, none, quiet, empty,
         nothing changed, nothing to flag]
  cost_not_entered:
    must_convey:
      - [zero, never entered, not entered, blank]
      - [cost, price]
  dead_stock_share:
    must_convey:
      - [window, longer window, shorter window, no sale, not sold]
  two_bases_not_summed:
    must_convey:
      - [transfer, document, snapshot]
      - [not added, never added, not summed, double-count, separate, must not]
  unmoved_transfer_value:
    must_convey:
      - [not moved, never moved, has not moved, raised, not yet shipped, unmoved]
      - [excluded, exclude, separate, document, not a movement]
  open_is_not_unreceived:
    must_convey:
      - ["open"]
      - [not mean, does not mean, not outstanding, arrived, delivered,
         never marked complete]
  header_total_mismatch:
    must_convey:
      - [line, lines, itemised, itemized]
      - [header, document total, disagree, mismatch, not used]
  quantity_not_additive:
    must_convey:
      - [not additive, differ, gram, pack, unit]
      - [quantity, quantities, total]
  received_quantity_coverage:
    must_convey:
      - [blank, "null", no received, missing, sparse, not recorded]
      - [received, coverage, only the lines]
  completion_not_delivery:
    must_convey:
      - [completion, marked complete, system]
      - [not delivery, not lead time, not the time the goods, not answerable]
  bases_not_comparable:
    must_convey:
      - [transfer valuation, valuation, internal transfer]
      - [different, separate, do not compare, not comparable, not a price]

  # ---- The metric model and comparisons (tools/sales.py) --------------------
  # A derived ratio whose denominator was zero. The value is NULL and the
  # answer must say the figure is undefined because nothing qualified — not
  # that it was zero, and not that sales were zero.
  ratio_undefined:
    must_convey:
      - [undefined, cannot be computed, not defined, no figure, "n/a", not available]
      - [transaction, transactions, sale, sales, denominator, nothing qualified, no qualifying]
  # A period-over-period comparison where some row could not be compared:
  # no baseline, a zero baseline, or no current figure. The answer must say
  # which subject and why rather than quote the rows that did compare as
  # though the comparison were whole.
  comparison_incomplete:
    must_convey:
      - [baseline, previous period, prior period, earlier period, period before,
         last period, "week before", "month before", "days before", compared, comparison]
      - ["no ", none, zero, nothing, undefined, missing, absent, not comparable,
         cannot compare, could not compare, "no figure", did not trade, "not trading",
         "no sales", "no transactions", "wasn't trading", "was not trading", "not open", "not yet open"]

  # ---- Saved workflows -----------------------------------------------------
  # Emitted by backend/app/services/workflow_runner.py, which builds a run for
  # all three callers — chat, the route and the scheduler — so there is one
  # place these can be written and one place they can be forgotten.

  # The run in front of you is not the one the schedule sends. Divergence is
  # ALLOWED — a manual run uses the newest logic while a schedule keeps the
  # version it was promoted with, which is the gate working. Silent divergence
  # is not: two people comparing a chat answer against Monday's message would
  # be looking at two different rules with no way to tell.
  #
  # The fingerprint demands all three facts the reader needs: which version,
  # that a schedule is involved, and why the two are not the same.
  version_divergence:
    must_convey:
      - [version]
      - [schedule, scheduled]
      - [promot, "approval queue", newer, older, differ, "not the same",
         "pinned to"]

  # The definitions moved under a saved rule's feet. The workflow still runs
  # against the LIVE metrics.yaml, as every tool does; what changed is that the
  # reasoning recorded with the version was written against an older one.
  definitions_drift:
    must_convey:
      # "metrics.yaml" came out on 2026-09-13, with `warning_stock` and for the
      # same reason: an alternative only the repository knows about makes the
      # one wording that breaks UI rule 4 the cheapest way past the gate.
      # "definition"/"definitions" is what a person says, and George saying
      # "the definitions changed" satisfies it.
      - [definition, definitions]
      - [changed, change, differ, drift, since, "no longer", updated, revised]

  # A backtest containing a step that cannot see the past. The figure is real
  # and is TODAY's; presenting it as the past is the failure.
  # ---- Page reads (view_page, agent/composite_tools.py) -------------
  # A page read replays several pins as one tool call. These two are the read's
  # own caveats: something asked for did not come back, and something on the
  # page was not read at all. Both must reach the answer in words; the
  # fingerprints are the minimum that lets the loop tell that they did.
  page_context_partial:
    must_convey:
      - [could not, couldn't, not reproduce, not be reproduced, not read, unavailable,
         not available, failed, refused, declined, did not come back, didn't come back,
         could not run, couldn't run, no longer run, missing, not on this page]
      - [pin, pins, analysis, analyses, tile, tiles, saved, page, figure, figures]
  page_context_truncated:
    must_convey:
      - [pin, pins, analysis, analyses, tile, tiles, saved]
      - [first, newest, "of the", not inspected, not read, remaining, the rest, the other,
         others, only, beyond, did not read, didn't read, haven't read, have not read,
         left out, capped, more on, "of them"]
  backtest_not_reproducible:
    must_convey:
      - [backtest, back-test, past window, "would have"]
      - [current, "today", "now", point-in-time, present, "not reproduc",
         "cannot be reproduced", "as it stands"]

  # A step that refused, rotted or failed. The other steps still ran, and the
  # run must say which one did not rather than showing a shorter list.
  workflow_step_failed:
    must_convey:
      - [step]
      - [fail, refus, "could not", "did not run", unrunnable, error, "no longer"]

  # Slots the scheduler passed over while the process was down. Reported on the
  # run that did happen, because a missing run leaves no row to carry a notice.
  schedule_slots_skipped:
    must_convey:
      - [skipped, missed, "did not run", "not run", passed over]
      - [slot, run, scheduled, schedule]

  # An object that could not be opened, or could not be opened for certain.
  # A view returned for the wrong product under the name somebody typed is
  # worse than no view, so ambiguity is stated rather than resolved.
  object_ambiguous:
    must_convey:
      - [matches, several, ambiguous, "more than one"]
      - [sku, product, exact, which]

  object_not_found:
    must_convey:
      - ["no product", "not found", "does not exist", unknown]
      - [sku, name, product]

  # A warehouse has a shelf and no till, so it has no week to show. Said once
  # and plainly, rather than as five refusals that look like breakage.
  object_has_no_sales:
    must_convey:
      - [warehouse, "no transactions", "no sales", "does not sell"]
      - [stock, shelf, holds]

  # Supplier and order sit on frozen imports. The view is returned with its age
  # rather than dropped, because an omitted section reads as "nothing happened".
  object_view_thin:
    must_convey:
      - [frozen, stale, record, "as the record"]
      - [order, supplier, purchas, received]

  # A watch that has stopped, and a watch that cannot see. Both exist because
  # silence is a watch's normal state and therefore cannot carry the news that
  # something is wrong — the one failure mode a watch has that a brief does
  # not. Each is said ONCE, when it starts, not every morning after.
  watch_backtest_stale:
    must_convey:
      - [stopped, "no longer", changed, halted]
      - [backtest, definitions, measured, version]

  watch_could_not_look:
    must_convey:
      - ["could not", cannot, unable, blind]
      - [check, look, read, source]

  # Notices whose kind is "multiple" carry an `items` list; the loop checks each
  # item's own kind against the fingerprints above rather than the container.
  container_kind: multiple

  # How many corrective turns the loop spends asking the model to surface a
  # notice before falling back to appending it verbatim.
  max_corrective_turns: 1

# =============================================================================
# PINS — the vocabulary for one integrity check
#
# A pin is a WRITE, and the only claim George can make that changes something
# outside the conversation. Observed live on 2026-09-03, answering "pin that but
# weekly": George re-ran the weekly query, then wrote "Ran the weekly version
# first, then pinned it. **Pinned:** ... → Replenishment page" — having never
# called pin_answer. No tile existed. Nothing had been written. The answer was
# the only evidence of a pin, and it was wrong.
#
# So the loop checks the claim against what actually happened (see
# _claims_pin in agent/loop.py). These are the words that count as a claim, and
# the words that mean it is being DENIED rather than asserted — "I couldn't pin
# that" must not be mistaken for "pinned".
#
# Kept here rather than in the loop for the same reason notices.must_convey is:
# the phrasing of an answer is not a constant of the code.
# =============================================================================
pins:
  claim_check:
    # A completion claim: the answer asserts a pin exists.
    claims:
      - pinned
      - pin is now
      - tile is now
      - added to the page

    # A stated INTENTION to pin. Observed live 2026-09-03, the same question one
    # run later: "I'll run the weekly version first, then pin that exact call" —
    # followed by the weekly table and no pin_answer call at all. A promise the
    # user will believe is as misleading as a false claim, so it gets the same
    # check, with a gentler correction: George may legitimately be waiting on
    # them ("I'll pin it once you tell me which page"), and is asked to say so
    # rather than to pin regardless.
    intents:
      - i'll pin
      - i will pin
      - then pin
      - let me pin
      - going to pin
      - about to pin
      - i'll add it to
      - will pin it

    # Within this many characters BEFORE a claim, any of these turns it into a
    # denial. 60 covers "I could not pin that to the Replenishment page" without
    # reaching back into an unrelated sentence.
    negation_window: 60
    negations:
      - "not "
      - "n't"
      - cannot
      - "no "
      - nothing
      - none
      - never
      - unable
      - fail
      - refus
      - without
      - "instead of"
      - "rather than"
      - "haven't"
      - "won't"

    # One corrective turn: either call the tool or withdraw the claim.
    max_corrective_turns: 1


# =============================================================================
# PAGES — Page Workshop V1 (2026-09-08)
#
# A page is a person's ordered collection of pins, with a title and a one-line
# purpose. George can build one and change one in conversation through two
# injected write tools, create_page and edit_page (agent/write_tools.py), which
# call the same service a person's buttons call (app/services/page_writer.py).
#
# WHAT LIVES HERE AND WHAT DOES NOT. The bounds on one conversational act are
# here because the prompt states them and the tool refuses past them, and a
# number the model is told must be the number the tool holds. The service's
# own caps (pages per owner, pins per page) are operational constants in
# app/services/page_writer.py, the way MAX_TOOL_CALLS_PER_PIN is, and a
# contract test holds the two sets equal. Nothing here is a business
# definition, and a page's PURPOSE is descriptive text a person wrote — it is
# read back to George labelled as theirs and never as an instruction.
# =============================================================================
pages:
  workshop:
    # How many analyses one create_page may carry. The prompt prefers fewer;
    # the user adds more in conversation.
    max_analyses_per_build: 6
    preferred_analyses_per_build: "three or four"
    # How many operations one edit_page may carry, and how many of them may
    # add an analysis.
    max_operations_per_edit: 10
    max_adds_per_edit: 6
    # What George's `remove` means. Recorded so it cannot be re-decided in a
    # prompt: a removed analysis leaves the page and is KEPT in Ungrouped.
    remove_means: kept_in_ungrouped
    # The words for the confirmation. Structured operations produce them in
    # the UI; the prompt asks George for the same distinction.
    remove_wording: "Removed {analysis} from {page} · kept in Ungrouped"

  # ---- The claim check, exactly as for pins and workflows ---------------------
  # A page write is the third kind of thing George can say that changes
  # something outside the conversation. Same failure, same remedy: if the
  # answer says a page was created, renamed, added to, moved, removed from or
  # reordered and no page tool returned this turn, the user goes looking for
  # a workspace that does not exist.
  #
  # THE PHRASES ARE PAGE-SPECIFIC ON PURPOSE. "moved" and "removed" alone would
  # match ordinary prose — INVESTIGATING asks George to say "both drivers
  # moved" — so a claim here names the page act: moved IT, removed it FROM,
  # renamed THE PAGE. A looser list would correct him for describing a sales
  # figure.
  claim_check:
    claims:
      - created the page
      - created a page
      - created a new page
      - the page is now called
      - page now has
      - renamed the page
      - renamed it to
      - renamed to
      - moved it to
      - moved it above
      - moved it below
      - moved it up
      - moved it down
      - moved it to the top
      - moved it to the bottom
      - moved the analysis
      - removed it from
      - removed from the page
      - taken it off the page
      - took it off the page
      - reordered the page
      - reordered the analyses
      - added it to the page
      - added them to the page
      - now on the page
      - set the purpose
      - purpose is now
    # A successful rename does not license a claim that an analysis moved.
    # Keep this bounded phrase check operation-specific, retaining negations.
    operation_phrases:
      create: [created the page, created a page, created a new page, "i'll create the page", i will create the page, let me create the page, "i'll build the page", let me build the page]
      rename: [the page is now called, renamed the page, renamed it to, renamed to, "i'll rename", let me rename]
      add: [page now has, added it to the page, added them to the page, now on the page, "i'll add it to the page"]
      move_to_page: [moved it to, moved the analysis, "i'll move it", let me move it]
      remove: [removed it from, removed from the page, taken it off the page, took it off the page, "i'll remove it", let me remove it]
      place: [moved it to, moved it above, moved it below, moved it up, moved it down, moved it to the top, moved it to the bottom, moved the analysis, reordered the page, reordered the analyses, "i'll move it", let me move it, "i'll reorder"]
      set_purpose: [set the purpose, purpose is now]
    intents:
      - i'll create the page
      - i will create the page
      - let me create the page
      - i'll build the page
      - let me build the page
      - i'll rename
      - let me rename
      - i'll move it
      - let me move it
      - i'll remove it
      - let me remove it
      - i'll add it to the page
      - i'll reorder
    negation_window: 60
    negations:
      - "not "
      - "n't"
      - cannot
      - "no "
      - nothing
      - none
      - never
      - unable
      - fail
      - refus
      - without
      - "instead of"
      - "rather than"
      - "haven't"
      - "won't"
    max_corrective_turns: 1


# =============================================================================
# SAVED WORKFLOWS
#
# A workflow is logic George and a user agreed on in conversation, saved as a
# versioned rule: named steps over existing READ tools, parameters, and the
# reasoning behind each choice. It runs on demand or on a schedule.
#
# WHAT LIVES HERE AND WHAT DOES NOT. Structural caps (how many steps a workflow
# may hold, how many workflows exist) are operational and live in the service,
# the way MAX_TOOL_CALLS_PER_PIN lives in pin_writer.py. What lives here is what
# is definitional: which tools can answer about the past, which arguments carry
# a window, who may promote a version, and the words that count as a claim.
#
# THE RULE MOST LIKELY TO BE BROKEN QUIETLY: a workflow parameter is SCOPE, never
# a DEFINITION. "Which store", "which window", "how many rows" are parameters.
# "What counts as low stock" is not — it is a business definition, it belongs in
# this file, and a workflow asking to tune it is asking for the wrong thing.
# =============================================================================
workflows:
  # ---- Ownership: org-level, deliberately not the pins model ---------------
  # A pin is one person's tile. A workflow that fires every Monday at 06:00 and
  # sends the result to a group chat is the company's rule, and giving it a
  # single owner means it dies with that person's account. So the three verbs
  # are separated: running is for anyone who can use George at all, editing is
  # for whoever wrote it or an admin, and promoting a version past the backtest
  # gate is for an admin only. Nobody can schedule their own unreviewed logic.
  permissions:
    # Checked against app_users.role. The route gate is require_page("george")
    # first; these narrow it further.
    run: any_george_user
    edit: creator_or_admin
    promote: admin_only
    delete: creator_or_admin
    # decision: 2026-09-03, with the saved-workflows design. resolves: the pins
    # model (created_by owns everything), which does not survive an org rule.

  # ---- The promotion gate -------------------------------------------------
  # A version may not fire on a schedule until it has been run against a PAST
  # window and the output looked at. Backtesting is the only way to see what a
  # rule would have said before it starts saying it unattended.
  promotion:
    requires_backtest: true
    # The backtest must be against a window that has closed, not today. A
    # backtest of "today" reproduces nothing and proves nothing.
    backtest_must_be_past: true
    promoted_by: admin_only
    # An edit produces a new version, which starts ungated. The schedule keeps
    # running the OLD version until someone promotes the new one — a scheduled
    # job that silently changes behaviour when somebody edits the logic is the
    # same lie as a tile that stores a number instead of re-running.
    edit_resets_gate: true

    # The consequence, stated so it is a rule rather than an accident: a manual
    # run uses the NEWEST version while a schedule fires the PROMOTED one, so
    # the same workflow can legitimately show different figures in chat and on
    # Monday morning.
    #
    # That divergence is allowed. Silent divergence is not. Any run whose
    # version differs from one an enabled schedule pins carries a
    # version_divergence notice naming both versions and the reason, and the
    # notice is stored on the run record as well as surfaced in the answer —
    # so a figure quoted from chat can always be traced to the rule that
    # produced it rather than to the one somebody assumed.
    divergence_must_be_stated: true

    # UI rule 5 reserves one colour for "needs you". This is what it means.
    # Nothing else may use that colour — a failed run is not an approval.
    queue_name: "Approval queue"
    queue_item: "a workflow version waiting to be promoted past the backtest gate"

  # ---- What a backtest can and cannot reproduce ---------------------------
  # A backtest is not time travel. It moves each step's time arguments to a past
  # as_of; it cannot rewind a tool that only knows the present.
  #
  # Every tool in agent.loop.TOOL_FUNCTIONS must appear in exactly one of the
  # four groups below, and test_workflows_contract asserts it. A tool added
  # without being classified would silently be treated as fully reproducible,
  # and a backtest would present today's figure as the past — the one failure
  # this whole section exists to prevent.
  backtest:
    # Tools that take the as_of date DIRECTLY. get_stock switches from
    # `inventory` to `inventory_snapshots` for that Manila date and reports a
    # snapshot_coverage_gap notice when the day is not covered, so a backtest of
    # stock is genuinely a backtest.
    # source: tools/inventory.py:127,142 and tools/brief.py:173.
    as_of_arguments:
      get_stock: as_of
      get_brief: as_of
      get_attention: as_of
      # `end` is the as-of date: move it and the whole window moves with it,
      # since `start` is derived backwards from `end`. More reproducible than
      # get_stock, not less — this tool has no live fallback at all, and
      # inventory_snapshots rows for a past date do not change afterwards.
      # source: tools/stock_history.py get_stock_history(end=...).
      get_stock_history: end
      # `run_date` selects the latest run ON OR BEFORE it — the plan that was
      # actually in force that day. Runs are irregular, so an exact-match
      # argument would refuse almost every as_of a backtest could pass.
      # source: tools/replenishment.py get_replenishment(run_date=...).
      get_replenishment: run_date

    # Arguments carrying a [start, end) window. A preset there is resolved
    # against now(), so a backtest rewrites it to the explicit Manila dates the
    # preset WOULD have covered on as_of — see sales_day.presets.*.relative.
    # The receipts then show real dates instead of a preset name, which is the
    # honest thing for a window that is not the caller's "today".
    window_arguments:
      get_sales: date_range
      get_movement: date_range
      get_vending: date_range
      get_purchasing: date_range
      get_dead_stock: window
      get_purchase_plan: lookback_days
      # An object view's sales sections take the window; see
      # partially_reproducible below for the half that does not.
      get_object: date_range

    # The window rebinds, but one side of the answer is still read live. Real
    # and useful, and it must say so — reporting it as fully reproduced would
    # attribute a present-day fact to a past morning.
    partially_reproducible:
      get_purchase_plan: >
        The sales window rebinds, but stock on hand and what is on order are
        read LIVE: a backtest reports today's shelf against a past period's
        demand. Useful for checking how a rule would have sized an order, and
        never a reconstruction of the shelf as it was that morning.
      get_dead_stock: >
        The sales window rebinds, but the stock side is read live: a backtest
        shows which products are held TODAY and had no sale during the past
        window, not which products were held then.
      # source: tools/dead_stock.py:102-104, which already states that stock is
      # live and sales are a window and that the two are read at different times.
      get_object: >
        An object mixes reproducible and live sections BY CONSTRUCTION, which
        is why it carries no snapshot_timestamp of its own. A shop's week and
        its movers rebind with date_range; its shelf is get_stock read live,
        and a product's identity and cost history have no time axis at all
        (tools/objects.py). So a backtested object view shows a past week's
        sales beside today's shelf, and each section's own receipts say which
        is which — one timestamp over the view would be exactly the lie this
        classification exists to prevent.

    # No time axis of any kind. In a backtest these return TODAY's figure,
    # labelled as today's, with a notice. Never silently omitted and never
    # presented as the past — a section quietly left out reads as "nothing
    # happened there" (brief.empty_section_must_distinguish, same reasoning).
    # source: tools/products.py:62, tools/vending.py:412, tools/cost_history.py:163
    # — none takes a date argument.
    point_in_time_tools:
      - get_product
      - get_vending_stock
      - get_cost_history

  # ---- The claim check, exactly as for pins --------------------------------
  # Saving a workflow is a write, and the second thing George can say that
  # changes something outside the conversation. Same failure mode, same remedy:
  # if the answer says a workflow was saved and save_workflow never returned,
  # the user goes looking for a rule that does not exist.
  claim_check:
    claims:
      - saved it as a workflow
      - saved as a workflow
      - workflow is now
      - workflow now exists
      - is now saved
      - now saved as
    intents:
      - i'll save
      - i will save
      - then save
      - let me save
      - going to save
      - about to save
      - will save it
    negation_window: 60
    negations:
      - "not "
      - "n't"
      - cannot
      - "no "
      - nothing
      - none
      - never
      - unable
      - fail
      - refus
      - without
      - "instead of"
      - "rather than"
      - "haven't"
      - "won't"
    max_corrective_turns: 1

  # ---- Scheduling ----------------------------------------------------------
  schedule:
    kinds: [daily, weekly, monthly]
    # Every slot is a Manila wall clock time. The Philippines observes no DST
    # (timezone.observes_dst), so a slot never repeats and never disappears.
    timezone: "Asia/Manila"

    # If the process was down for three days, run the most recent due slot ONLY
    # and report the ones that were missed. Three Monday briefs arriving on
    # Thursday is three numbers wearing the wrong timestamp — precisely what
    # every receipts rule in this file exists to prevent.
    catch_up: latest_slot_only

    # Delivery in v1 is Telegram, rendered on the backend. Rendering in the
    # delivery layer is how "notices always surface" (UI rule 4) stops being a
    # guarantee: the first person to tidy the layout deletes the caveats.
    # Same argument as ops/n8n/README.md.
    delivery: [telegram]


# =============================================================================
# RANKING (top_n)
#
# Ranking happens in SQL, not by shipping rows to the model and letting it sort.
#
# WHY THIS EXISTS: a 40-question coverage run found 6 of 11 refusals were caused
# by the 200-row cap between the tools and the model, not by missing data. On
# "what's out of stock across all stores" George correctly said: "the list is
# 24,180 lines long, and I only have visibility into a small, quantity-sorted
# slice of it. I must not total or characterise the rest." 19 of 40 answers
# mentioned truncation. top_n moves the ranking server-side so the model gets a
# complete, correct answer to "the top N"; full_row_count tells it how big the
# whole set was so it can describe what it did not see.
# =============================================================================
ranking:
  max_top_n: 1000          # the tools' own LIMIT; top_n may not exceed it
  min_top_n: 1

  # full_row_count is the size of the FULL result set before top_n / LIMIT.
  # It is only queried when the result was actually limited — when it was not,
  # it equals the row count and costs nothing.
  full_row_count_note: >
    Size of the complete result set before top_n or the row cap. When it exceeds
    row_count, the rows shown are the top slice by the ordering in
    meta.ordering — never a sample, and never something to total.

  sales:
    # "Top N" means the N largest by the metric. When top_n is set this
    # ORDERING OVERRIDES the chronological order normally used for day/week/
    # month buckets, so "top 5 days" means the five biggest days, not the first
    # five. meta.ordering always states which applied.
    ordering_with_top_n: "value DESC"
    ordering_default_time: "bucket ASC"
    ordering_default_other: "value DESC"

  stock:
    # get_stock's natural order is emptiest-first, which suits out-of-stock
    # questions but is wrong for "largest holdings". direction makes the caller
    # say which end they want rather than inheriting a default that silently
    # answers the opposite question.
    direction_default: lowest
    directions:
      lowest:  "i.quantity_on_hand ASC"    # emptiest first — stockouts
      highest: "i.quantity_on_hand DESC"   # largest holdings first

  # ---------------------------------------------------------------------------
  # GROUPING FOR get_stock
  #
  # A 40-question coverage run showed "which store has the most out-of-stock
  # items" costing 9 tool calls — one per store plus a probe — because get_stock
  # could only return product rows. top_n ranks WITHIN a result; it cannot
  # produce a per-store count. Grouping can.
  #
  # Grouped results are aggregate rows (product_count, total_quantity), not
  # product rows. That is a different shape and meta.grain says which was
  # returned, so a caller can never mistake a count of products for a quantity.
  # ---------------------------------------------------------------------------
  stock_grouping:
    valid_group_by: [store, state, category]
    expressions:
      store:    "i.store_id"
      category: "COALESCE(NULLIF(p.category, ''), 'Uncategorized')"
      # state reuses inventory.states, evaluated in order — the same CASE the
      # ungrouped path labels rows with, so the two can never disagree.
      state:    "__state_case__"
    measures:
      product_count:  "COUNT(*)"
      total_quantity: "SUM(i.quantity_on_hand)"
    ordering: "product_count DESC"

# =============================================================================
# DEAD STOCK — held but not selling
#
# The anti-join the tool surface was missing. The coverage run showed George
# attempting this shape three times and being unable to complete it: "dead
# products at Fairview", "in stock everywhere but selling nowhere", and
# "products never sold anywhere" (which timed out at 32.2s because the only
# route available was a full product GROUP BY over all history).
# =============================================================================
dead_stock:
  description: >
    Products a store is holding that recorded no sale in the window. Stock and
    sales are read at different times — stock is live, sales are a window — and
    that difference is reported rather than hidden.

  # Deliberately NOT inventory.states.in_stock: that predicate also tests
  # warning_stock, which is NULL on every row, so it would silently include
  # nothing useful. Dead stock only asks whether the shelf holds units.
  stock_predicate: "i.quantity_on_hand > 0"

  # The window side reuses the standard sales guard, so "no sales" means the
  # same thing here as everywhere else: not cancelled, type Sale, retail scope.
  sales_guard_ref: filters.standard_sales_guard

  # Scanning the window ONCE into a CTE and hash-anti-joining is what makes this
  # affordable. A correlated NOT EXISTS per inventory row would re-scan 891,714
  # line items 31,617 times.
  strategy: cte_anti_join

  # Default scope is retail. AJI BARN is excluded: its quantities are corrupt
  # (89% of rows non-positive, some at -24 million) so "held but not selling"
  # is meaningless there. See movement.balance_delta and filters.excluded_from_sales.
  scope: stores.active_retail
  barn_excluded_reason: >
    AJI BARN quantities are accumulated dispatch counters, not stock. A dead
    stock list from them would be noise.


# =============================================================================
# VOICE — how George says it
#
# Everything above this point governs what is TRUE. This section governs the
# register it is said in, and it exists here rather than only in the prompt for
# the reason every other definition does: so it can be tuned without touching
# code, and so a test can assert against the definitions rather than against a
# copy of them.
#
# THE ONE RULE THAT IS NOT STYLE. Wit never softens a caveat. The notice
# fingerprints above are matched against the model's final answer, so a jokier
# register is precisely the thing that starts failing them — a caveat delivered
# as an aside reads as an aside. A caveat is stated flatly; the wit goes
# somewhere else in the paragraph, or nowhere.
# =============================================================================
voice:
  person: first
  # The register, as adjectives a person could disagree with. Held by
  # tests/test_voice_contract.py so the prompt and this file cannot drift.
  register:
    - warm
    - precise
    - occasionally dry
  # What George is not. "Sycophantic" is first because it is the failure a
  # chat model reaches for by default.
  never:
    - sycophantic
    - corporate
    - breathless
    - apologetic
  # Openers that are pure throat-clearing. The LENGTH section already forbids
  # restating the question; these are the phrases that do it while sounding
  # like manners.
  banned_openers:
    - "Great question"
    - "I'd be happy to"
    - "Certainly"
    - "Absolutely"
    - "Let me help you with that"
  caveat_is_never_softened: true
  # THE BUDGET. Added 2026-09-12, from the voice plan and the research it
  # rests on: AgentIF's 707 real agent prompts average 1,723 words and 11.9
  # constraints, and models "generally perform poorly" at that length; the
  # 37th rule does not add to the first 36, it competes with them. The
  # prompt was 8,623 words, then 4,137 — twice the target — because the
  # generated sections were hard to move and the shortfall went unsaid.
  # Held by tests/test_voice_contract.py so it cannot go unsaid again: what
  # the prompt teaches past this budget belongs on the tool it describes.
  budget:
    max_words: 1800
    max_numbered_rules: 10
    # "never", "do not", "don't" — the register is traits, not prohibitions.
    max_prohibitions: 20
  # RESTATING A DRAWN FIGURE. Added 2026-09-12. Every result a turn reads is
  # drawn beside the answer, whole; a sentence carrying a figure a drawn row
  # holds says what the screen already shows. The long prompt asked for none
  # in three places and got 22% of sentences; the short one asked once and
  # got 19.5%. Words do not move it, so the loop enforces it as it enforces
  # the volunteering cap: one corrective turn, then the answer stands. The
  # check is agent/prose.restated_sentences — the same function the evals
  # measure with — matched on digits, dates and small counts excused.
  # Enforced ONLY when something is drawn: an answer over no charted result
  # has nothing on screen to restate.
  #
  # 0 → 1, DECIDED 2026-09-14 (P1.c), because 0 and `grounded_numerals` asked
  # for opposite things and George could satisfy only one. Everything a turn
  # reads is drawn, so every figure he could cite IS a drawn figure; at 0 the
  # gate rewrote each one out, and the P1.g gate run found all four scenarios
  # passing every trust check with not one figure between them. An answer that
  # cites nothing is a shrug, and the suite was right to call it one.
  #
  # What needed forbidding was RECITING THE BOARD, and 0 forbids more than
  # that. A reading may carry the figure its claim is about — "OPUS added
  # ₱130,016, more than the next two together" is the claim — and a second
  # sentence walking the rows is the recitation this still catches.
  restatement:
    introduced: "2026-09-12"
    max_restated_sentences: 1
    max_corrective_turns: 1
    matched_on: digits
    warning_reason: restated_figure

  # THE SAME FIGURE, SAID WRONG — and until 2026-09-13 it was the way past the
  # gate above. Quoting a drawn figure exactly tripped `restatement` and was
  # corrected; writing it rounded off tripped nothing and shipped, so the
  # further off George was, the safer he was from the guard. Found by the
  # twelve, on "nothing sells 800 grams-worth" over a row drawn as 801.
  #
  # Never tolerated, so there is no max_sentences here: one wrong figure on
  # screen is the defect, where a restated figure is a matter of style. Shares
  # the restatement gate's corrective turn rather than adding a round trip.
  misstatement:
    introduced: "2026-09-13"
    max_corrective_turns: 1
    matched_on: digits
    #: A prose numeral is the drawn figure said wrong when rounding the drawn
    #: one at the tens, hundreds or thousands lands exactly on it, and at least
    #: this many of the drawn figure's own digits survive. 801 written as 800
    #: keeps two and is this defect; written as 1000 it keeps none of them and
    #: is a different number, left to the eval.
    min_significant_digits: 2
    warning_reason: misstated_figure

  # A REMAINDER GEORGE WORKED OUT HIMSELF — the third way a figure with no
  # receipt reaches the screen, and the third found by the twelve on
  # 2026-09-13:
  #
  #   "48 sold last week with nothing in the week before (Aji Cuttlefish
  #    Japanese, Aji Golden Plum, Aji Squid Hokkaido Slices and 45 others)"
  #
  # 48 came from a read. 45 is 48 minus the three he chose to name, so the
  # subtraction is his and nothing holds a receipt for it. Neither gate above
  # could see it — 45 restates nothing and is a rounding of nothing — which is
  # the pattern of both earlier defects: arithmetic in prose is the way past a
  # gate that checks quoting.
  #
  # WHAT FIRES IS THE SHAPE. A count sitting beside one of these words is by
  # construction what is LEFT once the writer decided how many members to
  # name, so no tool can ever have returned it. Rows are consulted only to
  # EXCUSE — a drawn delta reading as "45 more" is the board's own figure —
  # exactly as `misstatement` excuses an exact match. An ordinary ungrounded
  # numeral still sails past: that is ungrounded_numerals, it is an eval, and
  # CLAUDE.md rule 9 keeps it one.
  #
  # Never tolerated, so there is no max_sentences: one count with no receipt
  # is the defect. Shares the restatement gate's corrective turn rather than
  # adding a round trip.
  enumerated_remainder:
    introduced: "2026-09-13"
    max_corrective_turns: 1
    matched_on: digits
    warning_reason: enumerated_remainder
    #: A count immediately BEFORE one of these states a remainder.
    trailing_words: [others, other, more, further, remaining, unnamed]
    #: ...and a count immediately AFTER one of these does the same.
    leading_phrases: ["the other", "another"]


# =============================================================================
# VOLUNTEERING — the second-order fact nobody asked for
#
# The thing that separates a colleague from a query tool: having read the
# result, George says the one further thing a person would want to know. Not a
# summary of what he just said, and not a suggestion — a FACT, from a result
# already in this turn.
#
# CAPPED AT ONE, AND THE CAP IS ENFORCED. Two volunteered lines is a briefing
# nobody asked for, and the LENGTH section's whole argument is that short is the
# default. The loop detects more than one and spends one corrective turn, the
# same machinery pins.claim_check uses.
#
# WHAT THIS SECTION DOES NOT DO. It does not verify that a volunteered figure
# came from a tool result — nothing in this system checks numerals in prose
# against rows, and pretending the cap does that would be worse than not having
# it. The guarantee here is the COUNT and the SHAPE (a volunteered figure
# carries its window, like every other figure). Provable numeric sourcing is a
# separate and much larger piece of work.
# =============================================================================
volunteering:
  max_per_answer: 1
  # It must be a fact from this turn's results, carrying its window like any
  # other figure — not advice, not a next step, not a question back.
  must_be_a_fact: true
  must_carry_window: true
  # Openers that mark a line as volunteered. Used to COUNT them, which is the
  # only thing the loop can honestly check.
  markers:
    - "Worth knowing"
    - "Worth noting"
    - "One thing you did not ask"
    - "One thing you didn't ask"
    - "While I was in there"
    - "Separately"
    - "Also worth"
  max_corrective_turns: 1
  # WHAT THE CAP DOES NOT COUNT. Added 2026-09-08 (Investigation V1). Two
  # things look like "more than was asked" and are not the same thing:
  #   A) an unsolicited extra business fact — "14 POs are open against that
  #      SKU" — which is what the cap bounds, and which announces itself with
  #      a marker above;
  #   B) a statement of what the reads establish, what they do not, and the
  #      next evidence that would be needed — "these reads establish that ATP
  #      is the stronger measured driver, but not why it fell; a product-level
  #      comparison would be the next check" — which is part of answering an
  #      investigation honestly (investigation.next).
  # B carries no marker, states no new figure, and is never counted. No
  # phrasing is reserved for it: the distinction is what the sentence DOES,
  # and the test holds that a limitation statement without a marker is not
  # counted while a marked fact still is.
  not_counted:
    analytical_limitation: "what the evidence establishes, what it does not, and the next check that would be needed"
    is_part_of_answer: true


# =============================================================================
# PUSHBACK — disagreeing, which is not refusing
#
# Two different acts that a chat model habitually collapses into one:
#
#   REFUSAL   "I can't"    the tool declines to produce a misleading number,
#                          or no tool can answer. A fact about the system.
#   PUSHBACK  "I wouldn't"  George thinks the question is the wrong one, and
#                          says why and what he would do instead. An opinion.
#
# The distinction is the whole point. Dressing an opinion as an impossibility
# takes the decision away from the person whose decision it is; dressing an
# impossibility as a preference invites them to insist on something that cannot
# happen. So the vocabularies are kept apart here, and tested apart.
#
# AN OPINION YIELDS. Having said his piece once, George does what he is asked
# on the second attempt. Pushback that repeats itself is not an opinion, it is
# an obstacle — and the person asking has more context than he does.
# =============================================================================
pushback:
  # An opinion. Never used for something that genuinely cannot be done.
  disagreement:
    - "I wouldn't"
    - "I would not"
    - "I'd push back"
    - "I don't think"
    - "I doubt"
  # An impossibility. Never used for something George merely dislikes.
  refusal:
    - "I can't"
    - "I cannot"
    - "no tool"
    - "there is no"
  # Disagreeing without saying what to do instead is just an objection.
  must_offer_alternative: true
  # Said once. The second time the user asks, George does it.
  complies_when_insisted: true
  max_restatements: 1


# =============================================================================
# SURFACE — the work in front of the user, as a definition. Added 2026-09-09,
# Generative Workspace V3.
#
# George decides WHAT matters; deterministic code decides how trusted data
# becomes pixels (frontend/src/components/george/surfaceCompose.ts). This block
# records the vocabulary both sides read, so neither can drift from the other:
# the closed set of refinements a surface may offer, the words that must never
# reach a reader, and the wording rule for transactions.
#
# EXECUTES NOTHING. Nothing here is a threshold, a score or a formula. The
# composer ranks by role and folds by scope; attention is the tool's own
# direction and ranking, or absent (surface.attention below says so in as many
# words, because a future "importance score" is the obvious thing to add here
# and it must not be).
# =============================================================================
# =============================================================================
# JUDGMENT — what George may think, as opposed to what he may compute.
#
# Added 2026-09-10. The rule is: DETERMINISTIC FACTS, INTELLIGENT JUDGMENT.
#
# WHY THIS EXISTS. Preventing invented figures worked, and it went one step too
# far: the same rules that stop George inventing a number were being read as
# stopping him forming a view. He would report that seven shops moved and leave
# the reader to work out which one mattered — which is the reader doing the job
# George is for. "Rockwell is what I'd look at first" is a reading of figures
# the tools returned, exactly as "basket value fell more than transactions" is,
# and neither needs a score to be sayable.
#
# WHAT THIS DOES NOT CHANGE, and the boundary is the whole point.
# `surface.attention` below still refuses a score, a threshold and a severity,
# and that is untouched: the COMPOSER is a pure function over rows and must not
# invent an ordering the data does not carry. This section is about GEORGE's
# prose, where a view is allowed and has always been — it is the same warrant
# investigation.driver_reading already grants for saying which driver moved
# more. The composer computes nothing; George thinks.
# =============================================================================
# =============================================================================
# WATCHES — a condition George checks on a schedule, which posts when it fires.
#
# THE ONE PROPERTY THAT MAKES A WATCH DIFFERENT FROM EVERYTHING ELSE HERE:
# SILENCE IS ITS NORMAL STATE. A pin that finds nothing still renders. A
# standing question that finds nothing still answers. A watch that finds
# nothing says nothing at all — which is what makes the times it speaks worth
# reading, and which is also why every quiet check is RECORDED. "It has been
# quiet for eleven days" has to be a fact somebody can check, not a hope.
#
# A WATCH CARRIES NO NUMBERS. It names one of the conditions below, and each of
# those is a reference to a threshold that already exists in `brief:` — measured
# against a noise floor on real data, with the measurement written down beside
# it. So a watch can never disagree with the briefing about what "down" means,
# and George can never invent a threshold, because there is no field for one.
# "Alert me when Rockwell drops 10% instead of 30%" is a request to change a
# DEFINITION, and the answer is to change it in `brief:` — where the evidence
# for the current number is — or to say why it should not change.
#
# Added 2026-09-11. Additive, so `version` does not move (version_policy).
# =============================================================================
# =============================================================================
# OBJECTS — a shop, a product, a supplier, an order, opened up.
#
# WHY THIS IS ONE TOOL AND NOT NEW SQL. Everything an object read returns is
# already defined and already vetted: a shop's week is get_sales, its shelf is
# get_stock, a product's history is get_cost_history. So `get_object` WRITES NO
# SQL AT ALL — it calls the existing tools and keeps each result whole, with
# its own receipts, exactly as `brief:` returns three sections at once.
#
# The consequence is the point: there is ONE definition of what a shop's week
# is, shared by the object view, the morning brief, a watch and anything George
# reasons with. A second implementation would be a second definition, and the
# two would disagree on a Tuesday.
#
# NOTHING IS JOINED ACROSS SECTIONS, for the same reason a workflow may not
# join its steps (architecture rule 6): the moment two results are combined the
# combination is a definition, and definitions live in this file behind vetted
# SQL. Sections sit beside each other; the reader does the joining.
#
# WHY TAPPING MUST NOT COST A MODEL TURN. Opening a shop by asking George takes
# roughly forty seconds and a model call. The same figures through this tool
# take about a second and no model call at all, because nothing here is a
# judgement — it is the same four reads every time. George uses the identical
# tool when he is reasoning, so what a person sees when they tap and what he
# sees when he thinks cannot drift apart.
#
# Added 2026-09-11. Additive, so `version` does not move (version_policy).
# =============================================================================
objects:

  # An object read is several reads kept apart. This is the bound on how many,
  # so an object cannot quietly become a page. Seven for a shop since
  # 2026-09-12 (days and hours joined); a page would be a different thing.
  max_sections: 8
  # Rows kept per section. An object view is a way in, not a report: the
  # section names the handful that matter and the full read is one question
  # away.
  top_n: 5

  kinds:

    shop:
      # Resolved against the store list and nothing else, so a shop that does
      # not exist is refused by name rather than returning an empty view that
      # reads as "this shop sold nothing".
      identified_by: store_name
      sections:
        week:
          says: "what it took last week, against the week before"
          reads: get_sales
        drivers:
          # `says` is shown to a PERSON, above the figures, so it is written
          # for one. The reasoning behind the choice — that these two are the
          # factors net sales is the product of, which is what makes "and why"
          # answerable rather than asserted — belongs in this comment and in
          # metrics.net_sales.drivers, not on their screen.
          says: "how many bought, and how much each spent"
          reads: get_sales
        moving:
          says: "the products that added the most revenue"
          reads: get_sales
        slipping:
          says: "the products that lost the most"
          reads: get_sales
        shelf:
          says: "what is out of stock here"
          reads: get_stock
        # THE INSTRUMENTS' SECTIONS — added 2026-09-12. A shop's thirty full
        # days are a range (where the latest sits on its own history) and a
        # calendar (which weekday carries it); its hours are dots (when the
        # day sells). Thirty rows, not top_n: a series cut to five is not a
        # series. Always last_30_days, whatever window the object was asked
        # for — a rhythm needs the days.
        days:
          says: "every full day of the last thirty — where the latest sits, and the rhythm of the weeks"
          reads: get_sales
        hours:
          says: "when the day sells, over the last thirty"
          reads: get_sales

    product:
      identified_by: sku_or_name
      sections:
        identity:
          says: "what it is, in the catalogue"
          reads: get_product
        week:
          says: "what it sold last week, against the week before, by shop"
          reads: get_sales
        shelf:
          says: "where it is held and where it has run out"
          reads: get_stock
        cost:
          says: "what it has cost over time"
          reads: get_cost_history

    supplier:
      identified_by: supplier_name
      # THIN, AND HONESTLY SO. Everything a supplier view could show sits on
      # purchase_orders, which is a frozen CSV import ~64 days old
      # (brief.freshness). The section is returned with its staleness rather
      # than dropped, because an omitted section reads as "nothing happened
      # with this supplier".
      sections:
        orders:
          says: "what has been ordered from them"
          reads: get_purchasing
      thin_because: purchasing_sources_frozen

    order:
      identified_by: external_id
      sections:
        lines:
          says: "what was ordered, and what the record says arrived"
          reads: get_purchasing
      thin_because: purchasing_sources_frozen

  # WHY TWO KINDS ARE THIN, recorded rather than left to look like an oversight.
  thin_reasons:
    # READER TEXT. It is interpolated into the object_view_thin notice's
    # `message`, which is drawn above the figures and can be forced into an
    # answer whole, so it names no table and no column — it said
    # "purchase_orders and stock_transfers ... received_qty is sparse" until
    # 2026-09-13, alongside the low-stock leak it shares a cause with.
    purchasing_sources_frozen: >
      Purchase orders and stock transfers were loaded once from a spreadsheet
      and are ~64 days stale, the received quantity is sparse and was never
      reconciled against what was ordered, and "Open" does not mean "not
      received" — 8 of 151 orders are Open with notes saying the goods
      arrived. So a supplier or an order can be shown as the record HAS it,
      with its age, and nothing more should be inferred from it. A scheduled
      export with a per-line received quantity and a date is what would make
      these as deep as a shop.

  # WHAT GEORGE THINKS ABOUT THIS OBJECT is deliberately NOT a section here.
  # Beliefs live in the `george` schema, which the read-only role cannot see at
  # all, so this tool physically cannot reach them — and that is the right
  # boundary rather than a limitation to work around. The view is composed on
  # top, on the application role, by the endpoint the client calls
  # (backend/app/api/v1/routes/george.py), carrying its own receipts. A
  # backtest of a past day therefore cannot accidentally show today's opinion.
  belief_is_composed_on_top: true

watches:

  # What a watch may be about. A closed set: three, because three is what the
  # data supports, and each one is a section the brief already computes.
  #
  # EVALUATION IS THE BRIEF TOOL, not new SQL. A check calls get_brief for the
  # day, keeps the rows of the named section, and applies the scope. That is
  # deliberate and it is the whole reason a watch cannot drift: there is one
  # implementation of "Rockwell is down", and both the morning brief and the
  # watch are reading it.
  conditions:

    sales_moved:
      section: sales_vs_same_weekday
      thresholds_ref: brief.sales_vs_same_weekday
      subject: store
      # Which way, chosen when the watch is made. `either` is the honest
      # default for a business: a shop up 80% overnight is as much a thing to
      # look at as one down 80%, and usually a data problem.
      directions: [down, up, either]
      says: "a shop's sales moved against the same weekday last week"

    stock_crossed_out:
      section: stock_crossed_out
      thresholds_ref: brief.stock_crossed_out
      subject: product
      directions: [either]
      says: "a product crossed into out of stock"

    newly_dead:
      section: newly_dead
      thresholds_ref: brief.newly_dead
      subject: product
      directions: [either]
      says: "a product crossed 30 days without a sale"

  # WHAT IS NOT AVAILABLE, AND WHAT WOULD MAKE IT AVAILABLE. Recorded here
  # rather than left as an absence, because an absence reads as George being
  # bad at something.
  not_available:
    deliveries:
      reason: >
        Both delivery sources are frozen — purchase_orders and stock_transfers
        were loaded once from CSV and are ~64 days stale (brief.freshness) — so
        a watch over them would evaluate identical rows every morning forever
        and could never fire. Beyond staleness the data cannot express the
        question: received_qty is sparse, is never reconciled to what was
        ordered, and may legitimately exceed it; transfers carry no received
        quantity per line at all; and "Open" does not mean "not received" —
        8 of 151 orders are Open with notes saying the goods arrived.
      needs: >
        A scheduled export rather than a one-off import, and a per-line
        received quantity with a date. Then "did it arrive as ordered" becomes
        a definition that can be measured against a noise floor, like the three
        conditions above, and a watch can name it.
    low_stock:
      reason: >
        warning_stock is NULL on 100% of inventory rows, so there is no
        threshold to cross (brief.stock_crossed_out.low_stock_available).
      needs: >
        A populated per-product-per-location reorder level.

  # HOW A CHECK DECIDES WHETHER TO SPEAK.
  #
  # The state of a watch is the SET OF SUBJECTS currently firing, with each
  # subject's direction for a condition that has one. A check posts when that
  # set differs from the last one it recorded — never merely because it is
  # non-empty.
  #
  # This is the rule that keeps a watch worth reading: a shop down five
  # mornings running is ONE alert, not five, because five identical alerts is
  # how a signal stops meaning anything. When a subject stops firing that is
  # also a change and is also worth a line — "Rockwell is back to normal" is
  # the half people otherwise never get told.
  firing:
    state: subjects_and_direction
    posts_when: state_changed
    # A first check has no previous state. It posts only if something is
    # firing — otherwise a watch switched on during a quiet week would announce
    # its own silence.
    first_check_posts_only_if_firing: true
    quiet_checks_recorded: true

  # WHAT A PERSON SEES BEFORE IT RUNS.
  #
  # A watch computes, so architecture rule 7 applies — but there is no authored
  # LOGIC to promote: the condition is one of the three above and its numbers
  # are `brief:`'s, which were measured and reviewed when they were set. What a
  # person needs before switching one on is not approval of a rule, it is
  # knowing what the rule WOULD have done, and that is the backtest.
  #
  # So: a watch cannot be switched on without a stored backtest over a window
  # that has closed, and the backtest names the days it would have fired and
  # for whom. That is also the number worth having on its own — "this would
  # have fired on 4 of the last 60 days" tells you whether to want it.
  backtest:
    required_before_enabled: true
    window_days: 60
    # Replaying a closed morning is get_brief(as_of=that day), which is the
    # same code path the real check takes. A backtest that ran different code
    # would be measuring the wrong thing.
    method: replay_get_brief_per_day
    # The backtest is recorded with the definitions version it was measured
    # under. Change a threshold in `brief:` and every backtest is describing a
    # rule that no longer exists — so the watch STOPS and says so, once,
    # rather than going quiet. A watch that goes silent for a reason must say
    # the reason, because silence is its normal state and therefore carries no
    # information on its own.
    invalidated_by_definitions_change: true

  # The river, and only the river, in V1. A watch that also messaged Telegram
  # would be a second delivery path to keep in step with the first, and the
  # river is the one surface (CLAUDE.md, "The river"). Watch posts are org —
  # what George initiates is a company-level fact.
  channel: river
  post_kind: watch

  # Bounds. Each exists so a misunderstanding cannot fill a table, not because
  # the next number would be wrong.
  max_per_owner: 12
  max_subjects_named_in_a_post: 8
  # A check is one get_brief call, so a watch cannot usefully run more often
  # than the sources behind it move — transactions land daily.
  kinds: [daily, weekly]

judgment:
  introduced: "2026-09-10"
  executes_nothing: true
  principle: "Deterministic facts. Intelligent judgment."

  # THE GROUNDING RULE, and it is the only thing standing between a view and an
  # invention. A judgment names the FACT that produced it — a figure a tool
  # returned, a comparison it made, a read that came back empty, a caveat it
  # attached. Not a number George worked out, and not a feeling.
  grounding:
    required: true
    rests_on: [a figure a tool returned, a comparison a tool made,
               a read that established nothing, a notice a tool attached]
    never_rests_on: [a score, a computed ranking, a threshold, an impression]
    ungrounded_judgment_is: an invention

  # What George MAY assert. Each is a reading of facts already established, and
  # each is something a colleague says and a reporting system cannot.
  may:
    rank_importance: >
      Say which of several true things matters most, and say it first. Ordering
      by importance is a reading, not arithmetic; it needs no score.
    declare_unimportance: >
      Say that something is not worth attention. "I looked at OPUS and there is
      nothing there" is an answer, not a failure to find one — and it is more
      useful than a figure the reader has to judge for themselves.
    declare_uncertainty: >
      Say that something moved and the reads do not establish why. Naming the
      limit is part of the answer.
    declare_ignorance: >
      Say "I don't know", and say what would settle it.
    disagree_with_the_framing: >
      Say when the question points at the wrong thing, give the reason, and
      then answer what was asked as well.
    change_his_mind: >
      Revise a view when new evidence contradicts it, keeping what it used to
      say and why it changed. A view that cannot be wrong is not a view.

  # What remains forbidden. NONE of this is softened by the above.
  may_not:
    invent_a_figure: "every number comes from a tool result in this conversation"
    invent_a_score: "no health score, no rating, no severity, no index"
    invent_a_threshold: "no line between good and bad that nobody set"
    attribute_a_share: "splitting a change between factors has no unique answer"
    assert_an_unevidenced_cause: "localization is not cause"
    rank_by_something_uncomputed: "a ranking is the tool's, over the whole set"

  # The stances a view can take. A CLOSED SET, and the vocabulary the persistent
  # understanding will store when it arrives — defined here first so the words
  # are settled before anything keeps them.
  stances:
    needs_attention: "this matters, and here is the fact that makes it matter"
    unremarkable: "measured, and nothing here concerns me"
    unexplained: "it moved and I cannot establish why"
    not_visible: "I cannot see this at all"
    waiting: "nothing to say until something arrives"

  # A view is held about a SUBJECT — the thing it is about — so that it can
  # later be attached to that thing rather than to a conversation.
  subject_kinds: [store, warehouse, supplier, product, category, estate]

# =============================================================================
# COMPOSITION — George composes the workspace; the system draws it.
#
# Added 2026-09-10. Until now the screen was a pure function of rows: a
# composer derived a layout and the model had one integer-and-a-word channel
# into it. That produced a document — chart, findings, prose, in a fixed order
# — and a document with its paragraphs reordered is still a document.
#
# Now George says what you see: which of the results he read, as which kind of
# object, at what weight. He does this through `compose`, a label tool like
# record_findings — it reads nothing, it is validated here before any of it
# reaches a client, and what is refused is named as a warning.
#
# WHAT HE MAY NOT DO, and this is the whole safety property: emit a figure, a
# colour, a size, a pixel, or any text beyond a key and a closed label. Every
# number on screen comes from a result by seq; every subject he names must be
# a row in that result. The composition is a CHOICE, never a value.
# =============================================================================
composition:
  introduced: "2026-09-10"
  executes_nothing: true

  # THE VOCABULARY. Closed. `needs` says what a block must carry to be drawn;
  # `about` is the one-line meaning George is taught.
  #
  # THERE IS NO `text` WIDGET, AND THAT IS THE POINT (P1.c, 2026-09-14). The
  # reading used to be one of these — a block George composed like any other,
  # which meant he could forget it (four widgets and not one word, the dogfood
  # log's top report) and that when he did compose it, his words were drawn as
  # a peer of the things they interpret. The owner, on seeing it: "putting the
  # text in a widget it just doesnt work." A tile is something you look at; a
  # reading is something you read, and it is ABOUT everything else on the
  # board. So it is not in this vocabulary at all: the surface draws the
  # turn's own words as a permanent region above the objects, which means it
  # cannot be forgotten, cannot be evicted and cannot be boxed. The grammar's
  # `prose` mark went the same way and for the same reason.
  widgets:
    figure:
      about: "one number from one row, large, on its own"
      needs: [seq, subject]
    hero:
      about: "the ONE thing that matters most: a subject's figure, its change and its scale, on an expressive field — at most one, and it must lead"
      needs: [seq, subject]
    subject:
      about: "a business object — a shop, product or supplier — with its headline figure and drivers where the read has them"
      needs: [seq, subject]
    comparison:
      about: "two to four subjects from one read, side by side across a seam"
      needs: [seq, subjects]
    table:
      about: "the rows of a read, when precision beats shape"
      needs: [seq]
    chart:
      about: "a conventional line or bar chart of one read, when a shape says it faster than rows"
      needs: [seq, form]
    distribution:
      about: "a series or ranked set as dots along an axis — eight weeks, seven shops"
      needs: [seq]
    draft:
      about: "an order or document you have produced, with editable rows and a total — the purchase plan"
      needs: [seq]
    state:
      about: "where a process stands: pending, running, waiting, and what happens next"
      needs: [label]
    timeline:
      about: "events or a measure in time order — a stock line over eight weeks, an order history, when things crossed. Use it when WHEN is the point; a chart is for the shape of a series and a table for precision"
      needs: [seq]
    recommendation:
      about: "ONE thing you think should be done about a subject, over the read that makes the case. You choose the subject and the action from the list; the figures are the read's and you supply none of them"
      needs: [seq, subject, action]
    control:
      about: "a handle on a read already on the board: the person changes the window and every object drawn from that read re-runs, with no model turn and nothing read they did not ask for"
      needs: [seq, argument]
    system:
      about: "something that RUNS — a saved rule, a standing question, a watch — with where it stands and what it did last. Drawn over a read that returned it, which is view_automations"
      needs: [seq, subject]
  chart_forms: [line, bar]
  state_labels: [pending, running, waiting, done, blocked]


  # ===========================================================================
  # THE GRAMMAR — how George composes a shape nobody listed in advance.
  #
  # WHY THIS EXISTS. The widgets above are a MENU: fourteen forms, decided
  # ahead of time, for questions nobody had asked yet. That was a deliberate
  # trade — a block has no field for a figure, so George cannot invent one —
  # but the owner's feature 1 asks for an interface that becomes whatever the
  # work needs, and a menu cannot do that however long it gets.
  #
  # THE TRADE IS SEPARABLE FROM THE MENU, and that is the whole insight. What
  # makes the screen trustworthy is not the fixed list of shapes; it is that a
  # figure is BOUND, never authored. A mark below names a read and a FIELD.
  # The renderer resolves the value. There is nowhere in this grammar to type
  # a number, a label, a colour or a size — so an infinite space of shapes
  # costs nothing in trust.
  #
  # THE FOURTEEN ARE NOT REPLACED. They stay as shorthand, because they work
  # and because most answers want an ordinary shape. A block carries EITHER a
  # `kind` (a named widget) or a `spec` (a tree of the nodes below), never
  # both. Reach for the grammar when nothing named fits.
  #
  # Added 2026-09-11. Additive, so `version` does not move (version_policy).
  # ===========================================================================
  grammar:

    # What a node may be. Exactly one of `layout` or `mark` — a node either
    # arranges other nodes or draws something, and one that did both would be
    # two nodes with a shared name.
    layouts:
      stack:
        about: "children one under another — the default reading order"
        takes: [children, gap]
      row:
        about: "children side by side, wrapping when there is no room"
        takes: [children, gap]
      grid:
        about: "children in even columns — a set of like things"
        takes: [children, cols, gap]
      panel:
        about: "a bordered area with its own heading, holding one arrangement"
        takes: [children, heading, hue]

    # What a mark may DRAW. Each names a read and a field; none takes a value.
    marks:
      value:
        about: "one field of one row, as a number or a word, at the size its weight implies"
        needs: [seq, field]
      delta:
        about: "a signed change from a compared read — the pill, with its direction"
        needs: [seq, field]
      bar:
        about: "length encodes a field, one bar per row — a ranking, a split, a driver"
        needs: [seq, field]
      line:
        about: "a field over an ordered field — a series, connected"
        needs: [seq, field, by]
      point:
        about: "one dot per row along an ordered field — a distribution, a timeline"
        needs: [seq, field, by]
      cell:
        about: "a grid of cells whose colour encodes a field — a heatmap, a matrix"
        needs: [seq, field, by]
      rows:
        about: "the read as a table, when precision beats shape"
        needs: [seq]
      label:
        about: "a field of a row as a caption — a name, a state, a date"
        needs: [seq, field]
      # THE INSTRUMENTS — added 2026-09-12, from the design board. Each is a
      # second reading of a figure, not a decoration of it: a range says WHERE
      # on its own history, a bullet says HOW MUCH OF a whole, a ring says how
      # each of a set stands, dots say WHEN, a calendar says the rhythm of the
      # weeks. None takes a value; none says good or bad. The words that would
      # ("healthy", "danger") are thresholds, and a threshold is a definition
      # or it is nothing (CLAUDE.md, "Two visuals declined").
      range:
        about: >
          one row on the range of all the rows — a track from the lowest to
          the highest value of the field, every row a dot on it, and the
          emphasised row (or the last, in `by` order) marked with its figure.
          "Yesterday against every day this month": where, never good or bad.
        needs: [seq, field]
      bullet:
        about: >
          part of a whole, one per row — the field fills a track whose length
          is `against`, both columns of the SAME row, so the tool supplied both.
          A compared read's value against its baseline; stock against a
          suggested order. Never two reads: a bar measured against another
          read's row would be a ratio nobody computed.
        needs: [seq, field, against]
      ring:
        about: >
          one tick per row around a circle, its length the field — a set of
          things and how each stands, read as a pattern. Forty products' days
          of cover at a glance: many short ticks is the picture. A zero is
          drawn short and dim, not coloured, because zero is a fact and red
          would be a judgement.
        needs: [seq, field]
      dots:
        about: >
          one dot per row along an ordered field, its SIZE the value — when
          things happen and how much. Sales by hour of the day, orders by
          week. Use `by: hour` with a read grouped by hour.
        needs: [seq, field, by]
      calendar:
        about: >
          the rows as weeks, Monday to Sunday, each day a cell whose brightness
          is the field — the rhythm of a shop: which weekday carries it, which
          week broke. `by` names the date column. Brightness only; a day is
          never lit for beating another day, because that comparison is not a
          read the tools make (comparisons.not_supported.per_bucket_lag).
        needs: [seq, field, by]

    # How a field reaches a channel. Every one of these names a FIELD, never a
    # value — which is what makes the grammar safe at any size.
    channels:
      field: "the column this mark draws"
      by: "the column that positions or groups it — a shop, a week, a product"
      colour:
        about: >
          the column whose VALUE chooses a hue. Identity where the value names
          a thing the palette knows (a shop), direction where the column is a
          direction. Never a colour George picked: a hue that meant whatever
          he felt would be a figure by another route.
        from_field_only: true
      order: "the column to sort by"
      label: "the column that names each row"
      against: "the column that is the WHOLE a bullet's field is part of — the same row's baseline, target or total"
      emphasise:
        about: >
          WHICH ROW MATTERS, among rows that are all drawn. Unlike `subject`
          it hides nothing: every row stays, and the named one is lit while
          the rest cool. It is how a picture says "this is the one" without a
          sentence saying it — and it is the same rule the board already uses
          at the object level, where a lead is lit and the rest are quiet.
          Names a VALUE, checked against the rows like a subject.
        names_a_value_not_a_column: true

      note:
        about: >
          A few words ON the mark, characterising what is drawn: "carries the
          whole order", "off the shelf all window". CLAUDE.md already permits
          exactly this and bounds it exactly this way — an annotation may
          point at rows and characterise them, and may NEVER introduce a
          number. So a note carries no digits at all, which is checked, and
          it is short by construction.

          It exists because a third of George's sentences restate a figure the
          board is already drawing. A word on the bar deletes the sentence
          under it.
        no_digits: true
        max_length: 60
        max_per_spec: 4

      subject:
        about: >
          WHICH ROW this node and everything under it draws. Unlike every
          other channel it names a VALUE rather than a column — "OPUS",
          "Aji Mix" — and it is the one place a value may appear, because a
          selector is not a figure: it is checked against the rows and refused
          if no row carries it, exactly as a named widget's `subject` is.
          Without it a panel per shop draws the first row seven times, which
          is the worst kind of wrong — plausible and identical.
        names_a_value_not_a_column: true
        inherited_by_children: true

    # A workspace is not a document. Bounds exist so a composition stays a
    # thing you can take in, and so a runaway tree cannot become the answer.
    max_nodes: 40
    max_depth: 4
    max_cols: 6
    max_rows_drawn: 40

    # WHAT A NODE MAY CARRY, and nothing else. The closed set is the guarantee:
    # add `value` or `text` or `colour: "#ff0000"` here and the grammar starts
    # being able to say things no tool returned.
    allowed_fields: [layout, mark, children, cols, gap, heading, hue,
                     seq, field, by, colour, order, label, against, weight, limit,
                     subject, emphasise, note]

    # Said once, here, because it is the rule the whole grammar rests on.
    no_literals_because: >
      Every value on screen is resolved by the renderer from the rows of the
      read a mark names. A grammar that accepted a literal anywhere would let a
      figure onto the screen that no tool produced, and no amount of prompting
      undoes a shape that can lie. The validator refuses any node carrying a
      number or a free string in a value position, and the fields above are the
      only ones a node may carry at all.

  # WHAT A RECOMMENDATION MAY RECOMMEND. Closed, like every other vocabulary
  # here, and for the same reason: George chooses WHICH action, never invents
  # one, and never supplies the figure that justifies it — that comes off the
  # read the block names. "Order 806 units" is the tool's number and George's
  # verb; "order about 800" would be George's number and is impossible here,
  # because a block has no field to put one in.
  #
  # "leave_it" is deliberately in the list. A recommendation vocabulary with no
  # way to say "nothing" only ever recommends action.
  recommendation_actions: [order, investigate, check, hold, switch_on, leave_it]

  # WHAT A CONTROL MAY CHANGE. A control re-runs a read that is already on the
  # board with ONE scope argument changed — the same path the desk replay takes
  # (surface.desk.replay), so no model is consulted and nothing is read that
  # the person did not ask for.
  #
  # SCOPE ONLY, never a threshold. Which window, how many rows. A business
  # threshold is a definition and lives in this file where it was measured, so
  # there is no control that could change one — the same rule a workflow
  # parameter obeys.
  control_arguments: [date_range, top_n]

  # DOCUMENTS ARE NOT A WIDGET, AND THE REASON IS NOT AN OVERSIGHT. The owner's
  # feature 1 names documents among the things the workspace composes, and
  # nothing in this system has one: there is no ingestion, no store, no read.
  # A document widget now would be a shape with nothing behind it, which is the
  # failure the two declined visuals record (CLAUDE.md, "Two visuals declined").
  # It arrives with feature 24, not before.
  documents_not_a_widget_because: no_document_source_exists

  # WEIGHT IS JUDGMENT MADE VISIBLE. One lead, which the eye goes to first; what
  # supports it; and what is on screen because it is true, not because it
  # matters. A composition where everything is the same weight has not been
  # composed.
  weights: [lead, supporting, quiet]
  one_lead: true
  hero_must_lead: true
  max_blocks: 8

  # KEYS ARE HOW THE WORKSPACE TRANSFORMS INSTEAD OF STACKING. Every block has
  # a short key George chooses — "rockwell", "seikyo-order". A follow-up that
  # is about the same thing composes the SAME key, and the object on screen
  # changes rather than being drawn again beneath itself.
  key_pattern: "^[a-z0-9][a-z0-9-]{0,30}$"

  # ---------------------------------------------------------------------------
  # THE BOARD. Added 2026-09-10, and it is the difference between a screen and
  # a place.
  #
  # Until now a composition WAS the screen: whatever George composed this turn
  # was drawn, and everything from the turn before disappeared. That made the
  # workspace a function of the last question — ask about Seikyo, then ask
  # about North Edsa, and the draft order is gone. A workspace holds things.
  #
  # So a composition is now a set of EDITS to a board that persists. An object
  # George does not mention stays exactly as it was, with its own receipts and
  # its own read time. He adds, changes, pushes aside and removes; he never
  # redraws what he has not touched.
  # ---------------------------------------------------------------------------
  ops:
    put:
      about: "put an object on the board, or replace the one under this key"
      needs_full_block: true
    change:
      about: "change an object already on the board — what it shows, or how much it matters"
      needs_full_block: false
    quiet:
      about: "push an object aside without removing it: still true, no longer the point"
      needs_full_block: false
    drop:
      about: "take an object off the board — it is finished, or it was wrong"
      needs_full_block: false
  default_op: put

  # A board is bounded, and the bound is the person's attention rather than a
  # technical limit. When it is exceeded the OLDEST QUIET object leaves first:
  # what was pushed aside longest ago is what nobody is coming back to.
  max_objects: 12
  # A QUIET OBJECT NOBODY HAS TOUCHED FOR THIS MANY TURNS LEAVES ON ITS OWN —
  # unless the person kept it. Added 2026-09-12 with read identity: the board
  # maintains a picture, it does not accumulate answers. Mirrored in
  # frontend/src/room/board.ts EXPIRE_AFTER_TURNS.
  expire_after_turns: 6

  # A CHANGE THAT NAMES A SUBJECT MUST NAME ITS READ. Without this, George
  # could rename what an object is about while it still draws an older read's
  # rows — a subject the data behind it never carried. Weight may change on its
  # own, because a weight is not a figure.
  change_subject_requires_seq: true

  # Anything not in this list on a block is refused with the block. This is
  # the list that keeps a choice from becoming a value.
  # `emphasise` and `note` are ANNOTATIONS, not shapes, so a named widget
  # takes them as readily as a composed one. Without that, pointing at the
  # row that matters was only possible by abandoning the widget that was
  # right for the job — and George kept writing the sentence instead.
  allowed_fields: [op, kind, key, weight, seq, subject, subjects, form, label,
                   action, argument, spec, emphasise, note]

surface:
  introduced: "2026-09-09"
  executes_nothing: true

  # What a piece of work IS ABOUT versus how it is being LOOKED AT. Identity
  # ends a surface when it changes; shape never does. Subjects are handled by
  # relation (same, expanded, narrowed keep the work; disjoint starts new
  # work) — see surfaceAnchor.ts, which is the code this describes.
  identity: [business, window, population_filters]
  shape: [comparison, grouping, metric, subjects]

  # The one question the composer asks: the smallest surface that completely
  # answers this. Ranks are by role; context is folded — never dropped — when
  # it reaches outside the anchor's subjects.
  ranks: [primary, supporting, context]
  minimum_sufficient: true

  # The refinements a surface may offer, and the seam a click or a spoken
  # phrase crosses to become one. Each is an op plus a value taken from trusted
  # state, never from the DOM and never from prose (surfaceEvents.ts). Offered
  # only where the metric's own `valid_group_by` and `drivers` permit.
  refinements: [explain, break_down, compare_subject, focus_subject, compare_selection, explain_selection]
  # The two selection-aware ops arrived with the Experience Reset (2026-09-09).
  # Each takes its subjects from the desk's selection — ids and labels off rows
  # the tools returned — and becomes one business-language question naming
  # them, so "Compare these" needs nobody to restate three store names.

  # Attention is what the DATA singles out. Two sources, both the tool's:
  attention:
    reasons: [against_the_majority, ranked_first]
    score: not_supported
    threshold: not_supported
    severity: not_supported
    reason_not_supported: >
      A score, a threshold or a severity would be a business definition nobody
      has set, applied as arithmetic in the presentation layer. Attention is
      communicated by ordering, emphasis, annotation and grouping from facts
      the tools already established.

  # Prose is INTERPRETATION once the figures are drawn.
  prose:
    # Sentences of prose when the drawn figures already carry the answer. Not
    # a hard cap — a caveat or an uncertainty that needs explaining may take
    # more — but the default the prompt asks for.
    sentences_when_drawn: 3
    # Words that must never reach a reader. The loop scans the answer for
    # these and records a gap; the prompt (rule 17 and SURFACE) forbids them.
    # Whole-word, case-insensitive. Not a licence to be vague: the caveat is
    # rewritten in business words, never dropped.
    leaks:
      - get_sales
      - get_stock
      - get_product
      - get_movement
      - get_vending
      - get_vending_stock
      - get_dead_stock
      - get_purchasing
      - get_cost_history
      - get_brief
      - view_page
      - record_findings
      - group_by
      - rank_by
      - compare_to
      - top_n
      - date_range
      - change_pct
      - baseline_status
      - call_seq
      - metrics.yaml
      - biggest_drop
      - biggest_gain
      - previous_period
      - "unchanged from a moment ago"
      - "regardless of capitalisation"
      - "regardless of capitalization"
    # A transaction is a transaction. None of these is established as its
    # meaning by any definition in this file; the loop records a gap when one
    # appears beside transaction figures, and the prompt says not to.
    transaction_synonyms_not_established:
      - customers
      - people
      - visits
      - visitors
      - traffic
      - footfall
      - shoppers
    # Saying a word is not the same as using it as a translation.
    #
    # The scan above exists so George cannot quietly call transactions
    # "customers" — a transaction is a sale, and dressing it as a person
    # overstates what was counted. But the answer that DISCLAIMS the
    # substitution has to say the word too: "that's sales made, not people who
    # walked in" is the sentence the trust rules most want, and until
    # 2026-09-13 it tripped exactly the same wire as the leak did.
    #
    # What separates them is the CLAUSE the negator sits in. In a disclaimer it
    # shares a clause with the word — "can't see foot traffic", "nobody counts
    # people", "not people who walked in". In a real leak it does not: "this
    # was footfall through the till, not bigger purchases" has a "not" in the
    # sentence, and it negates the purchases. Distance alone is not enough to
    # tell them apart — "Rockwell didn't grow, but customers were up" puts the
    # negator exactly as close as "nobody counts people" does, and the comma
    # and the "but" are the whole difference.
    negation_markers:
      - not
      - "no"
      - nobody
      - none
      - never
      - cannot
      - can't
      - isn't
      - aren't
      - wasn't
      - weren't
      - don't
      - doesn't
      - didn't
      - without
      - rather
      - instead
      - unlike
      - nor
    # A bound on the clause lookback, not the mechanism — the clause boundary
    # above does the separating. This only stops a very long clause from being
    # cleared by a negator at the far end of it.
    negation_window_words: 6
    causal_words_to_avoid:
      - caused
      - because of

  # ---------------------------------------------------------------------------
  # THE DESK — the one workspace, and what may change on it without George.
  # Added 2026-09-09, George Experience Reset (Phases 1 and 2).
  #
  # "Desk" is the INTERNAL name of the workspace model. It is not a word a
  # person is asked to learn: the product is George, and the screen is the
  # business laid out in front of them. Recorded here so the client, the loop
  # and the prompt read one vocabulary for it.
  #
  # EXECUTES NOTHING. Nothing below is a threshold, a score or a formula. Every
  # figure on the desk is a row a tool returned; every position and size on a
  # field is a ratio of two such rows, which is geometry; every selection is a
  # set of ids the rows carried. The model sees the selection as names on the
  # question and never as a figure.
  # ---------------------------------------------------------------------------
  desk:
    introduced: "2026-09-09"
    executes_nothing: true

    # The business the desk lays out. One at a time; FFR arrives only with an
    # authoritative source (data_availability.ffr) and is not placeholdered.
    business:
      name: "Aji Ichiban"
      short: "AJI"

    # The interaction grammars the workspace may be in. A CLOSED set, derived
    # from the state of the work and never chosen by the model. Only the first
    # exists in Phase 2; the rest are named so they cannot arrive under other
    # names: prepare (an editable draft), build (a System under construction),
    # decide (one approval), operate (a running System).
    grammars: [investigate]
    grammars_deferred: [prepare, build, decide, operate]

    # What a person may do on the desk WITHOUT a model turn. Each is either a
    # change of view over rows already on screen, or a deterministic replay of
    # calls already recorded. George is consulted for interpretation and for
    # evidence the desk does not hold — never as a substitute for a click.
    direct_manipulation:
      - select          # a set of subjects, by id, from the rows drawn
      - focus           # one subject to the centre; the rest recede, never leave
      - clear           # nothing selected, nothing focused
      - back            # one level out: product to store, store to business
      - change_window   # the same calls replayed over another closed window
      - sort            # reorder the rows of a loaded set
      - show_as_list    # the same rows as the conventional instrument
      - inspect         # receipts and details for one figure or subject
      - trail           # restore an earlier step of the same work
    model_consulted_for: [interpretation, evidence_the_desk_does_not_hold]

    # Selection is semantic context. It travels on the question as
    # `desk.selection` — ids and labels the rows carried, never labels the
    # model inferred — and the loop names the subjects to George on the
    # question, beside the work sentence. The question post keeps it in its
    # payload so a reload restores the same focus from the same record.
    selection:
      dimensions: [store, product, category]
      identity:
        store: store_id
        product: product_id
        category: category
      max_subjects: 12
      ids_from_rows: true
      stored_on: question_post_payload

    # WHAT THE WORKSPACE TELLS GEORGE ABOUT ITSELF (2026-09-09, UNDERSTAND).
    #
    # A selection used to be the only thing on this channel, so a question
    # asked with nothing clicked told George nothing about what was on
    # screen. "Show me", "is that actually bad?" and "what would you do?"
    # refer to the WORKSPACE, not to the transcript, and they had no
    # referent at all.
    #
    # Every field below is a name, a count or a word from a closed
    # vocabulary declared here. NOTHING IN IT IS A FIGURE, and nothing in it
    # is the model's own account of anything: `drawn` comes from the layout
    # the composer produced, `attention` from marks the tools' own rows
    # established, and `standing_recommendation` from a ground in
    # `initiative.recommend.grounded_in`. George is told what he is looking
    # at; he still reads every figure from a tool result.
    context:
      sends: [drawn, attention, standing_recommendation]
      max_drawn_subjects: 12
      max_attention: 6
      attention_reasons: [against_the_majority, ranked_first]
      never_a_figure: true
      stored_on: question_post_payload

    # A replay re-runs calls already recorded, with one scope argument changed
    # (the window), through the same validation a pin passes and the same
    # runner a tile uses. No model. Its figures carry their own receipts and
    # read time. It is TRANSIENT: the record of a window change is the next
    # thing George is asked about it, which carries the window in `desk.window`
    # and is stored like any other turn. A comparison needs a closed window,
    # so the ribbon offers a partial preset only where the work is uncompared.
    replay:
      model_consulted: false
      max_calls: 8
      validated_as: pin
      compared_windows_must_be_closed: true
      recorded: transient_until_next_turn

    # What the business looks like BEFORE anything is asked: one grouped read
    # per resting field, replayed deterministically when the desk opens. A
    # closed window against the period before it, so every store has a
    # measured position and the composer's own attention rule applies.
    rest:
      reads:
        - tool: get_sales
          arguments:
            group_by: [store]
            date_range: last_7_days
            compare_to: previous_period
            metric: net_sales

    # George's presence on the desk is where he is READING: a soft light under
    # the objects a running call names, from tool_call frames and nothing
    # else. No hue of its own — the approvals colour stays the mark's and the
    # count's — and nothing lights when no frame is in flight.
    presence:
      source: tool_call_frames
      hue: none

    # A field encodes ONLY what rows carry. Position is a change the tool
    # computed or a value it returned; size is a value; fill is the tool's
    # own direction; a halo is the composer's attention (against the
    # majority, or ranked first) or the person's selection. Colour is never
    # the only carrier: every object prints its figure and every field has
    # the same rows as a list one control away.
    field:
      position_from: [change_pct, change, value]
      size_from: value
      fill_from: direction
      halo_from: [attention, selection]
      colour_is_never_the_only_signal: true
      list_equivalent_required: true

    # -------------------------------------------------------------------------
    # REPRESENTATION — which drawing, and when a novel one has earned itself.
    # Added 2026-09-09, the workspace refinement.
    #
    # GENERATIVE UI IS NOT A LICENCE FOR NOVELTY. The composer chooses the
    # representation that communicates fastest, and the conventional one wins
    # by default: a ranked comparison of seven stores is read in seconds, and
    # a plane costs the reader two axes and a size legend before it says
    # anything. Order of optimisation: comprehension, relevance, continuity,
    # interaction, expression — in that order, and novelty is not on the list.
    # -------------------------------------------------------------------------
    representation:
      kinds: [ranked, plane, anatomy, compare, figures, statement]
      default: ranked

      # WHEN A PLANE EARNS ITS SECOND AXIS. Only when the two driver changes
      # DISAGREE across subjects — when the subjects fall in more than one
      # quadrant of (driver one, driver two). If every subject sits in one
      # quadrant, both drivers moved the same way for everyone and a ranked
      # list says exactly that in one dimension, with its labels intact.
      #
      # This is a STRUCTURAL test on rows the tools returned, not a score:
      # counting the quadrants subjects fall into involves no threshold and
      # no arithmetic on business figures beyond reading the sign of a change
      # the tool already computed.
      plane_requires:
        two_declared_drivers: true
        subjects_in_more_than_one_quadrant: true
        min_subjects: 3
        max_subjects: 24
      plane_not_used_reason: >
        Every store moved the same way on both drivers, so position on a
        second axis separates nothing a ranked list does not already show.

      # A representation a reader has to be taught needs the teaching ATTACHED
      # to it, in one line, always visible. If it needs more than a line every
      # time, it is the wrong representation.
      guidance_required_for: [plane]
      guidance_max_sentences: 2

    # -------------------------------------------------------------------------
    # INITIATIVE — what George says without being asked, and what grounds it.
    #
    # THREE THINGS, AND EACH HAS A DIFFERENT WARRANT. Explain and recommend are
    # DERIVED from rows the tools returned and the definitions' own ladder, so
    # they are as trustworthy as the figures beside them and cannot be a
    # generic suggestion dressed as intelligence. Ask is the model's, because
    # only the model can notice that the business intent is missing — and it is
    # held by the prompt, not mechanically, which this file records rather than
    # pretends otherwise.
    # -------------------------------------------------------------------------
    initiative:
      explain:
        # A CHARACTERISATION OF ROWS, CARRYING NO NUMERAL. The figures are
        # drawn beside the sentence; repeating them in it is the "prose
        # restates the figures" failure the surface rules already forbid.
        characterisation_only: true
        max_sentences: 1
        derived_from: [direction, stronger_driver]
      recommend:
        # The only things that may PRODUCE a recommendation. Each is a fact a
        # tool established; a recommendation with no entry here is not made.
        grounded_in:
          - drivers_diverge          # the two declared drivers moved opposite ways
          - against_the_majority     # a subject moved against the direction the rest did
          - ranked_first             # the tool's own change ranking put this first
          - no_breakdown_yet         # the metric permits a breakdown nobody has read
        max: 1
        must_name_its_evidence: true
        must_carry_an_action: true
      ask:
        # NOT MECHANICALLY ENFORCED, and this file will not claim it is. The
        # prompt tells George when a question is worth more than a guess; no
        # scan checks that he obeyed.
        enforced_by: prompt
        when: >
          the business intent materially changes which read comes next, and
          the data cannot settle it
        never_when: the reads already answer the question

    # -------------------------------------------------------------------------
    # CAVEATS BY CONSEQUENCE — what a caveat COSTS the reader, not what kind of
    # thing it is.
    #
    # THE FAILURE THIS ANSWERS. "105 of 256 compare rows could not be compared;
    # 56 no_baseline; NULL" was drawn at full size above the answer. Every word
    # of it is true and none of it is a sentence: it is a diagnostic, in tool
    # vocabulary, competing with the finding for the most prominent place on
    # the screen. UI rule 4 requires a caveat to be SURFACED, which it already
    # distinguishes from SPELLED OUT.
    # -------------------------------------------------------------------------
    caveats:
      levels: [non_material, relevant, answer_limiting]
      # Nothing at all could be compared: there is no finding to qualify, only
      # the caveat. This is the one level that may take the reader's attention.
      answer_limiting_when: nothing_comparable
      # Some subjects were excluded and the finding still stands: said in
      # business words, beside the thing it qualifies, never as counts of
      # internal statuses.
      relevant_when: some_subjects_excluded
      # Raw statuses, row counts, NULLs, fingerprints and tool structures.
      raw_diagnostics_in: inspector_only
      # "NULL" is quoted because YAML reads a bare NULL as the null literal —
      # which would silently drop the very word this list exists to forbid.
      never_in_the_answer: [baseline_status, no_baseline, no_current, zero_baseline, "NULL", row_count]


# =============================================================================
# SYSTEMS — the user-facing word for something built with George
#
# Approved 2026-09-09, George Experience Reset. A System is the persistent
# object a person and George construct together: its executable logic is a
# WORKFLOW (versions, backtest, promotion — everything the `workflows` section
# above defines, unchanged), and around that logic it gathers the settings it
# was bound with, its schedule, its runs, its outputs and the approvals it is
# waiting on. "Workflow" stays the name of the rule inside; "System" is the
# thing a person opens, runs, pauses and asks about.
#
# NOTHING HERE EXECUTES. The workflow engine is unchanged; this block records
# the vocabulary so the build grammar (a later phase) cannot arrive calling the
# same object a job, an automation or a playbook.
# =============================================================================
systems:
  introduced: "2026-09-09"
  executes_nothing: true
  user_facing_word: System
  contains: [workflow, settings, versions, schedules, runs, outputs, approvals]
  workflow_is: "the executable logic inside a System; its versions, backtest and promotion are the workflows section's, unchanged"
  not_called: [job, automation, playbook, recipe, template]
  # The build grammar (surface.desk.grammars_deferred) is where a System is
  # constructed. Until it exists, a System is saved as it always was — through
  # save_workflow in conversation — and read on the desk's Running rail.
  built_in: build_grammar_deferred


# =============================================================================
# SETTINGS — declared, bounded, user-adjustable values inside a definition
#
# Approved 2026-09-09 as an amendment to architecture rule 6. A vetted
# definition MAY expose a setting a person adjusts. Each declaration must
# state what the setting MEANS, its TYPE, its BOUNDS or allowed values, its
# DEFAULT, and WHERE it participates in the deterministic calculation. The
# formula stays in the definition; the person binds a value inside the bounds;
# the value is versioned with the System that used it and recorded on every
# run's receipts.
#
# WHAT THE MODEL MAY AND MAY NOT DO is stated here so the prompt and the
# tools read one rule. George may explain a setting and, when asked, bind a
# value within its bounds through the same service a control uses. He may not
# invent a setting the definition does not declare, escape its bounds, supply a
# formula, replace a calculation with reasoning, or change a value without
# saying so.
#
# NOTHING IS DECLARED YET. `declared` is empty in this phase: the first
# declarations arrive with the purchasing definitions (a later phase). A
# contract test holds the contract keys and refuses any declaration that
# omits one of the five required fields.
# =============================================================================
settings:
  introduced: "2026-09-09"
  executes_nothing: true
  amends: "architecture rule 6"
  declaration_requires: [meaning, type, bounds, default, participates_in]
  bound_by: person
  model_may: [explain, bind_within_bounds_when_asked]
  model_may_not:
    - invent_undeclared_settings
    - escape_declared_bounds
    - invent_formulas
    - replace_deterministic_definitions_with_reasoning
    - change_a_setting_silently
  versioned: true
  provenance: "the bound value is recorded on the version that used it and on every run's receipts"
  declared: {}
