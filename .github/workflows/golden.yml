name: George golden tests

# Runs pytest directly against George's tools — no agent, no LLM, no API key.
# Read-only: the suite connects as george_ro, which holds SELECT and nothing
# else (tools/george_ro_role.sql), and tools/_common.connect additionally opens
# every session read-only and refuses superuser or admin roles.
#
# Deliberately NOT wired into the Railway start command. A failing assertion
# there would block the app from booting, and the suite would re-run on every
# restart against production. Deploy gating belongs here, before the merge.

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "definitions/**"
      - "tests/**"
      # agent/ is in scope because the retry tests import agent.loop, and
      # backend/requirements.txt because CI now installs from it.
      - "agent/**"
      - "backend/requirements.txt"
      - ".github/workflows/golden.yml"
  pull_request:
    paths:
      - "tools/**"
      - "definitions/**"
      - "tests/**"
      - "agent/**"
      - "backend/requirements.txt"
  workflow_dispatch:

concurrency:
  group: golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Install what the CODE declares, plus a test-only extra — never a
        # hand-maintained list here. A separate list drifts silently and fails
        # only in CI: it happened when the tools moved psycopg2 -> psycopg, and
        # again when the retry tests started importing the anthropic SDK.
        # Sourcing backend/requirements.txt makes that class of failure
        # impossible, at the cost of a slower install.
        run: |
          pip install --no-cache-dir -r backend/requirements.txt
          pip install --no-cache-dir -r tests/requirements.txt

      - name: Assert the test environment matches the code
        # Cheap tripwire: if a tool grows an import that no requirements file
        # provides, fail here with a clear message rather than a wall of
        # collection errors further down. A plain import is the check — an
        # ImportError names the missing module itself.
        run: >
          python -c "import anthropic, psycopg, yaml, pytest;
          print(f'anthropic {anthropic.__version__} | psycopg {psycopg.__version__}')"

      - name: Check definitions parse
        run: python -c "import yaml; yaml.safe_load(open('definitions/metrics.yaml', encoding='utf-8')); print('metrics.yaml OK')"

      - name: Run golden tests
        env:
          GEORGE_DATABASE_URL: ${{ secrets.GEORGE_DATABASE_URL }}
        run: python -m pytest tests/golden.py -v --tb=short

      # The suite skips itself when the secret is missing, which would otherwise
      # look like a green run. Fail loudly instead.
      - name: Fail if the suite skipped
        if: always()
        env:
          GEORGE_DATABASE_URL: ${{ secrets.GEORGE_DATABASE_URL }}
        run: |
          if [ -z "$GEORGE_DATABASE_URL" ]; then
            echo "::error::GEORGE_DATABASE_URL secret is not set — the golden suite skipped every test and proved nothing."
            echo "Apply tools/george_ro_role.sql, then add the connection string as a repository secret."
            exit 1
          fi
