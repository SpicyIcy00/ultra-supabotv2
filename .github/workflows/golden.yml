name: George foundation checks

# Contracts run without database credentials; frontend tests and build run in
# their own job. Golden tests run directly against the tools, with no model call.
# Read-only: the golden suite connects as george_ro, which holds SELECT and nothing
# else (tools/george_ro_role.sql), and tools/_common.connect additionally opens
# every session read-only and refuses superuser or admin roles.
#
# Deliberately NOT wired into the Railway start command. A failing assertion
# there would block the app from booting, and the suite would re-run on every
# restart against production. Deploy gating belongs here, before the merge.

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "definitions/**"
      - "tests/**"
      # agent/ is in scope because the retry tests import agent.loop, and
      # backend/requirements.txt because CI now installs from it.
      - "agent/**"
      - "backend/requirements.txt"
      # backend/app/ is in scope because test_undefined_names.py scans it. A
      # NameError in a route ships silently otherwise — that is exactly how
      # POST /george/pins/{id}/run stayed broken.
      - "backend/app/**"
      - "frontend/**"
      - ".github/workflows/golden.yml"
  pull_request:
    paths:
      - "tools/**"
      - "definitions/**"
      - "tests/**"
      - "agent/**"
      - "backend/requirements.txt"
      - "backend/app/**"
      - "frontend/**"
      - ".github/workflows/golden.yml"
  workflow_dispatch:

concurrency:
  group: golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend and test dependencies
        run: |
          pip install -r backend/requirements.txt -r tests/requirements.txt
      - name: Run backend contracts without production credentials
        env:
          GEORGE_DATABASE_URL: ""
          GEORGE_LOG_DATABASE_URL: ""
        run: >-
          python -m pytest tests -q --tb=short
          --ignore=tests/test_brief_live.py
          --ignore=tests/test_pins_live.py
          --ignore=tests/test_storehub_tools_live.py
          --junitxml=contracts-results.xml
      - name: Require contract tests to run without skips
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("contracts-results.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases, "No contract tests ran"
          assert not list(root.iter("skipped")), "Contract tests unexpectedly skipped"
          PY

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run George and foundation frontend tests
        run: npm test
      - name: Typecheck and build the complete application
        run: npm run build

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Install what the CODE declares, plus a test-only extra — never a
        # hand-maintained list here. A separate list drifts silently and fails
        # only in CI: it happened when the tools moved psycopg2 -> psycopg, and
        # again when the retry tests started importing the anthropic SDK.
        # Sourcing backend/requirements.txt makes that class of failure
        # impossible, at the cost of a slower install.
        run: |
          pip install --no-cache-dir -r backend/requirements.txt
          pip install --no-cache-dir -r tests/requirements.txt

      - name: Assert the test environment matches the code
        # Cheap tripwire: if a tool grows an import that no requirements file
        # provides, fail here with a clear message rather than a wall of
        # collection errors further down. A plain import is the check — an
        # ImportError names the missing module itself.
        run: >
          python -c "import anthropic, psycopg, yaml, pytest;
          print(f'anthropic {anthropic.__version__} | psycopg {psycopg.__version__}')"

      - name: Check definitions parse
        run: python -c "import yaml; yaml.safe_load(open('definitions/metrics.yaml', encoding='utf-8')); print('metrics.yaml OK')"

      - name: Run golden tests
        env:
          GEORGE_DATABASE_URL: ${{ secrets.GEORGE_DATABASE_URL }}
        run: python -m pytest tests/golden.py -v --tb=short --junitxml=golden-results.xml

      # The suite skips itself when the secret is missing, which would otherwise
      # look like a green run. Fail loudly instead.
      - name: Fail if the suite skipped
        if: always()
        env:
          GEORGE_DATABASE_URL: ${{ secrets.GEORGE_DATABASE_URL }}
        run: |
          if [ -z "$GEORGE_DATABASE_URL" ]; then
            echo "::error::GEORGE_DATABASE_URL secret is not set — the golden suite skipped every test and proved nothing."
            echo "Apply tools/george_ro_role.sql, then add the connection string as a repository secret."
            exit 1
          fi

      - name: Require golden tests to execute
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("golden-results.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases, "No golden tests ran"
          assert not list(root.iter("skipped")), "Golden tests skipped; check the read-only database connection"
          PY
