name: Bob integration checks

on:
  push:
    branches: [main, integration/bob-v1]
  pull_request:
  workflow_dispatch:
    inputs:
      live_db:
        description: Run DB suites against the verified staging environment
        type: boolean
        default: false
      model_evals:
        description: Explicit approval to send staging business evidence to Anthropic
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bob-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt -r tests/requirements.txt
      - run: python ops/verify_integration.py pure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pure-results
          path: verification/pure.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc -b --noEmit
      - run: npm run build

  live-db:
    if: github.event_name == 'workflow_dispatch' && inputs.live_db
    environment: bob-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Environment-scoped secrets only; do not reuse repository production secrets.
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      GEORGE_DATABASE_URL: ${{ secrets.STAGING_BOB_DATABASE_URL }}
      STAGING_DATABASE_VERIFIED: ${{ vars.STAGING_DATABASE_VERIFIED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt -r tests/requirements.txt
      - run: python ops/verify_integration.py read-db
      - run: python ops/verify_integration.py app-db

  model-evals:
    if: github.event_name == 'workflow_dispatch' && inputs.model_evals
    environment: bob-model-evals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEORGE_DATABASE_URL: ${{ secrets.STAGING_BOB_DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.STAGING_ANTHROPIC_API_KEY }}
      STAGING_DATABASE_VERIFIED: ${{ vars.STAGING_DATABASE_VERIFIED }}
      GEORGE_EVALS: '1'
      GEORGE_EVAL_JUDGE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt -r tests/requirements.txt
      - run: python ops/verify_integration.py model
